<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0d"/>
<meta name="color-scheme" content="dark"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GRIDLOCK"/>
<meta name="format-detection" content="telephone=no"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<title>GRIDLOCK System · Coach Edition</title>
<style>
:root{
  /* ---- surface: five steps, so depth means something ---- */
  --bg:#0b0c0d;        /* the page */
  --sunk:#0f1011;      /* inputs, wells */
  --panel:#161818;     /* raised object */
  --panel-2:#1e2121;   /* raised object, one step up */
  --line:#26292a;      /* hairline */
  --line-lit:#3a3f40;  /* hairline on a raised object */

  /* ---- one accent, three weights ---- */
  --accent:#ad1515; --accent-deep:#8f1010; --accent-lit:#e5252a;

  /* ---- type ---- */
  --ink:#efedeb; --mute:#9b9d9e; --dim:#6d7173;

  /* ---- semantic, never decorative ---- */
  --red:#e5342f; --blue:#3d8bff; --ok:#3ecf8e; --warn:#e0a33a;

  /* ---- type scale: real steps, so a heading reads as one ---- */
  --t-hero:30px; --t-xl:21px; --t-lg:17px; --t-md:15px; --t-sm:13px; --t-xs:11px;

  /* ---- spacing scale ---- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;

  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{
  margin:0;height:100%;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font:400 var(--t-md)/1.45 var(--sans);
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
body{-webkit-touch-callout:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent-lit);outline-offset:2px;border-radius:var(--r-sm)}
h1,h2,h3,p{margin:0}
.grow{flex:1}

/* Every control a coach taps is at least 44 px in its short axis. Apple asks
   for 44 pt and Android for 48 dp, but the real reason is the promise on the
   box: this gets used on a sideline, in a hurry, with a glove on.
   test/devices.js fails the build if anything drops under it. */

/* ============================================================
   SHELL — header and tab bar pinned, only .main scrolls
   ============================================================ */
#root{height:100%;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.main{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:var(--s4) calc(var(--s4) + env(safe-area-inset-left)) var(--s6) calc(var(--s4) + env(safe-area-inset-right));
  display:flex;flex-direction:column;gap:var(--s5);
}
/* A scrolling flex column shrinks its children to fit. Without this every
   block is squashed — and anything with overflow:hidden gets clipped. */
.main > *{flex:0 0 auto}

/* Tablets. A phone layout stretched to 1366 px is not a tablet layout: the
   call button becomes a metre wide and a line of notes runs past 200
   characters, which nobody reads. So the whole screen holds one centred column
   — every heading on the same left edge, the way it reads on a phone — and the
   field gets 860 px, which is two and a half times what it has on a phone. */
@media (min-width:680px){
  .main{align-items:center}
  .main > *{width:100%;max-width:860px}
  .main .note{max-width:74ch}          /* a caption, not a wall of text */
}

.hdr{
  background:#000;border-bottom:1px solid var(--line);
  padding:var(--s3) calc(var(--s4) + env(safe-area-inset-right)) 0 calc(var(--s4) + env(safe-area-inset-left));
  padding-top:calc(var(--s3) + env(safe-area-inset-top));
}
.hdr__top{display:flex;align-items:center;gap:var(--s3)}
.brand{font-size:var(--t-md);font-weight:800;letter-spacing:.14em;line-height:1}
.brand small{
  display:block;margin-top:3px;font-size:9px;font-weight:700;
  letter-spacing:.3em;color:var(--accent-lit);
}
.who-chip{
  font-size:var(--t-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);border:1px solid var(--line-lit);border-radius:var(--r-pill);padding:4px 10px;
}
.who-chip.staff{color:var(--ink);border-color:var(--accent);background:rgba(173,21,21,.18)}

/* live context: what field and what call, always on screen */
.ctx{
  display:flex;align-items:center;gap:var(--s2);width:100%;min-height:44px;
  padding:var(--s2) 0 var(--s3);margin-top:var(--s2);
  color:var(--mute);font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;font-weight:700;
}
.ctx__line{
  min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ctx b{color:var(--ink);font-weight:700}
.ctx__sep{color:var(--dim)}
.ctx__caret{color:var(--dim);font-size:10px}

.tabs{
  display:flex;background:#000;border-top:1px solid var(--line);
  padding:var(--s1) calc(var(--s2) + env(safe-area-inset-left)) calc(var(--s2) + env(safe-area-inset-bottom)) calc(var(--s2) + env(safe-area-inset-right));
}
.tabs button{
  flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
}
.tabs button i{display:block;width:16px;height:2px;border-radius:2px;background:transparent}
.tabs button.on{color:var(--ink)}
.tabs button.on i{background:var(--accent-lit)}

/* ============================================================
   SECTION — an eyebrow and a rule, not another card.
   Cards are reserved for things that are actually objects.
   ============================================================ */
.sec{display:flex;flex-direction:column;gap:var(--s3)}
.sec__head{display:flex;align-items:baseline;gap:var(--s3);border-bottom:1px solid var(--line);padding-bottom:var(--s2)}
.sec__eyebrow{font-size:var(--t-xs);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.sec__note{margin-left:auto;font-size:var(--t-xs);color:var(--dim);letter-spacing:.04em}
.sec__body{display:flex;flex-direction:column;gap:var(--s3)}

.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);
}
.panel--flush{padding:0;overflow:hidden}
.panel__title{font-size:var(--t-lg);font-weight:700;letter-spacing:.01em}

.lede{color:var(--mute);font-size:var(--t-sm);line-height:1.5}
.note{color:var(--dim);font-size:var(--t-xs);line-height:1.5}
.warn{color:var(--warn);font-size:var(--t-sm)}

/* ============================================================
   THE CALL — the one thing a coach needs in forty seconds
   ============================================================ */
.call{
  background:linear-gradient(150deg,#1a1010,#0f1011 60%);
  border:1px solid var(--line-lit);border-radius:var(--r-lg);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);
  position:relative;overflow:hidden;
}
.call::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
}
.call__label{font-size:var(--t-xs);font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-lit)}
.call__name{font-size:var(--t-hero);font-weight:800;letter-spacing:-.01em;line-height:1.02}
.call__read{color:var(--mute);font-size:var(--t-sm);line-height:1.45}
.call__meta{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;padding-top:var(--s1)}

/* aggression as five pips, not a number nobody can feel */
.aggr{display:flex;align-items:center;gap:var(--s2)}
.aggr__pips{display:flex;gap:3px}
.aggr__pips i{width:14px;height:4px;border-radius:2px;background:var(--line-lit)}
.aggr__pips i.on{background:var(--accent-lit)}
.aggr__label{font-size:var(--t-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

.vs{font-size:var(--t-xs);color:var(--dim);letter-spacing:.06em}
.vs b{color:var(--ink)}

/* ============================================================
   CONTROLS — three shapes, so you can tell them apart:
   segmented = pick one, toggle = on/off, button = do something
   ============================================================ */
.seg{
  display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);
  border-radius:var(--r-md);padding:3px;overflow-x:auto;scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none}
.seg{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);
     mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent)}
.seg:not(:has(button:nth-child(4))){-webkit-mask-image:none;mask-image:none}
.seg button{
  flex:1 0 auto;min-height:44px;padding:0 var(--s3);border-radius:var(--r-sm);
  color:var(--mute);font-size:var(--t-sm);font-weight:600;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;
}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}

.toggles{display:flex;gap:var(--s2);flex-wrap:wrap}
.tgl{
  display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s3);
  border:1px solid var(--line-lit);border-radius:var(--r-pill);background:var(--panel);
  font-size:var(--t-sm);font-weight:600;color:var(--mute);
}
.tgl i{width:7px;height:7px;border-radius:50%;background:var(--line-lit);flex:none}
.tgl.on{color:var(--ink);border-color:var(--accent)}
.tgl.on i{background:var(--accent-lit);box-shadow:0 0 0 3px rgba(229,37,42,.2)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:44px;padding:0 var(--s4);border-radius:var(--r-md);
  background:var(--accent);color:#fff;font-size:var(--t-md);font-weight:700;
  transition:background .12s;
}
.btn:active{background:var(--accent-deep)}
.btn--block{width:100%}
.btn--lg{min-height:52px;font-size:var(--t-lg);letter-spacing:.02em}
.btn--ghost{background:transparent;color:var(--ink);border:1px solid var(--line-lit)}
.btn--ghost:active{background:var(--panel-2)}
.btn--quiet{background:transparent;color:var(--mute);border:1px solid var(--line);min-height:44px;font-size:var(--t-sm)}
.btn--danger{background:transparent;color:var(--red);border:1px solid var(--line);min-height:44px;font-size:var(--t-xs);padding:0 var(--s3)}
.btnrow{display:flex;gap:var(--s2);flex-wrap:wrap}

/* ============================================================
   FORM
   ============================================================ */
.fld{display:flex;flex-direction:column;gap:6px}
.fld > label{font-size:var(--t-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
input,select,textarea{
  /* 46, not 44: inside a flex row these get shrunk half a pixel, and a control
     that measures 43.5 is a control that fails the 44 px rule. */
  width:100%;min-height:46px;flex:0 0 auto;background:var(--sunk);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r-md);padding:11px var(--s3);
}
input::placeholder,textarea::placeholder{color:var(--dim)}
textarea{min-height:78px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--line-lit);outline:none}
select{appearance:none;-webkit-appearance:none;padding-right:var(--s5);
  background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.checkrow{display:flex;align-items:center;gap:var(--s3);font-size:var(--t-sm);color:var(--mute)}
.checkrow input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}

/* ============================================================
   FIELD
   ============================================================ */
/* Editing handles. Big enough to find under a thumb, quiet enough not to
   fight the field when you are only looking at it. */
.hnd{fill:#0b0c0d;stroke:#fff;stroke-width:1.6;cursor:grab}
.hnd:active{cursor:grabbing}
.aim{cursor:grab}
svg.field [data-leg]{cursor:copy}
.field-wrap{background:#0b0c0d;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
svg.field{width:100%;height:auto;display:block}

/* ============================================================
   ASSIGNMENTS — the five, as a roster not a paragraph
   ============================================================ */
.assigns{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.assign{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);background:var(--panel);min-height:56px}
.assign + .assign{border-top:1px solid var(--line)}
.assign__n{
  flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:var(--red);color:#fff;font-size:var(--t-sm);font-weight:800;
  font-variant-numeric:tabular-nums;
}
.assign__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.assign__job{font-size:var(--t-md);font-weight:600;line-height:1.25}
.assign__who{font-size:var(--t-xs);color:var(--dim);letter-spacing:.04em}
/* The job is the thing being read; the controls act on it. On a phone there is
   not room for both on one line once every control is 44 px, so the controls
   take their own row rather than breaking the label into three. */
.assign__ctl{flex:1 0 100%;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
@media (min-width:520px){
  .assign__ctl{flex:0 0 auto;justify-content:flex-end}
}
.ps{display:flex;gap:4px;flex:none}
/* 44 px square. Apple asks for 44 pt and Android for 48 dp, but the real
   reason is the promise on the box: this gets tapped on a sideline, in a
   hurry, with a glove on. */
.ps button{
  width:44px;height:44px;border-radius:8px;display:grid;place-items:center;
  font-size:13px;font-weight:800;letter-spacing:.04em;
  border:1px solid var(--line-lit);color:var(--dim);background:transparent;
}
.ps button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* the 8-way face pad the spec asks for */
.pad{
  flex-basis:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  margin-top:8px;padding:8px;background:var(--sunk);
  border:1px solid var(--line);border-radius:var(--r-md);
}
.pad button{
  min-height:46px;border-radius:var(--r-sm);border:1px solid var(--line-lit);
  background:var(--panel);color:var(--ink);font-size:18px;font-weight:700;
  display:grid;place-items:center;
}
.pad button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ============================================================
   LIST — the More menu, and anything else that is a list of places
   ============================================================ */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.list__row{
  display:flex;align-items:center;gap:var(--s3);width:100%;
  padding:var(--s3) var(--s4);background:var(--panel);min-height:58px;
}
.list__row + .list__row{border-top:1px solid var(--line)}
.list__row:active{background:var(--panel-2)}
.list__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.list__name{font-size:var(--t-md);font-weight:600}
.list__desc{font-size:var(--t-xs);color:var(--dim);line-height:1.35}
.list__go{color:var(--dim);font-size:var(--t-lg);flex:none}
.list__count{
  flex:none;font-size:var(--t-xs);font-weight:700;color:var(--mute);
  background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 9px;
  font-variant-numeric:tabular-nums;
}

/* ============================================================
   PITS — the two opponents. A wire stripe, not a coloured border
   on an otherwise identical card.
   ============================================================ */
.pits{display:grid;gap:var(--s3)}
@media(min-width:720px){.pits{grid-template-columns:1fr 1fr}}
.pit{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);
  border-top:3px solid var(--wire);
}
.pit--l{--wire:var(--red)}
.pit--r{--wire:var(--blue)}
.pit__side{font-size:var(--t-xs);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--wire)}
.pit__name{font-size:var(--t-xl);font-weight:800;line-height:1.1}
.pit__pts{font-size:var(--t-xs);color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.stars{display:flex;gap:2px;margin:-6px}   /* the pad is bleed, not spacing */
.star{
  width:44px;height:44px;display:grid;place-items:center;font-size:19px;line-height:1;
  color:var(--dim);
}
.star.on{color:var(--accent-lit)}

/* ============================================================
   DATA
   ============================================================ */
.bar{height:8px;border-radius:var(--r-pill);overflow:hidden;display:flex;background:var(--sunk)}
.bar i{display:block;height:100%}
.barends{display:flex;font-size:var(--t-sm);font-weight:700;font-variant-numeric:tabular-nums}
.barends span:last-child{margin-left:auto}

.facts{display:flex;flex-wrap:wrap;gap:var(--s2)}
.fact{
  display:flex;flex-direction:column;gap:1px;flex:1 0 auto;min-width:76px;
  background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s2) var(--s3);
}
.fact b{font-size:var(--t-lg);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.fact span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

.rank{display:flex;flex-direction:column}
.rank__row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;min-height:48px;width:100%}
.rank__row:active{background:var(--panel)}
.rank__row + .rank__row{border-top:1px solid var(--line)}
.rank__n{width:18px;color:var(--dim);font-size:var(--t-sm);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.rank__name{flex:1;font-size:var(--t-md);font-weight:600}
.rank__pct{font-size:var(--t-md);font-weight:800;font-variant-numeric:tabular-nums}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.tbl{width:100%;border-collapse:collapse;font-size:var(--t-sm);min-width:340px}
.tbl th{
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  text-align:left;padding:var(--s2) var(--s3);background:var(--sunk);white-space:nowrap;
}
.tbl td{padding:var(--s3);border-top:1px solid var(--line);white-space:nowrap}
.tbl tbody tr{background:var(--panel)}
.tbl tbody tr:active{background:var(--panel-2)}
.tbl .num{font-variant-numeric:tabular-nums;color:var(--dim)}
.tag{
  font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:var(--r-pill);
  border:1px solid var(--line-lit);color:var(--mute);
}
.tag--paid{color:var(--ok);border-color:rgba(62,207,142,.4)}
.tag--pend{color:var(--warn);border-color:rgba(224,163,58,.4)}

/* The roster editor. Every field is editable in place, because a coach fixing
   a squad number should not have to delete a player and type him again. */
.rost{display:flex;flex-direction:column;gap:var(--s3)}
.rost__p{
  display:grid;grid-template-columns:66px 1fr auto;gap:var(--s2);align-items:center;
  padding:var(--s3);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);
}
.rost__p input{min-width:0}
.rost__ps{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.rost__ps label{display:flex;flex-direction:column;gap:4px}
.rost__num{text-align:center;font-weight:700}
.rost__add{display:grid;grid-template-columns:66px 1fr;gap:var(--s2)}
.rost__add .rost__ps{grid-column:1/-1}

.who2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.who2 h4{margin:0 0 var(--s2);font-size:var(--t-xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.who2 ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.who2 li{font-size:var(--t-sm);color:var(--ink);display:flex;gap:var(--s2)}
.who2 li b{color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums;flex:none;width:14px}

.kv{display:flex;flex-direction:column;gap:var(--s3)}
.kv__row{display:flex;flex-direction:column;gap:3px}
.kv__k{font-size:var(--t-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-lit)}
.kv__v{font-size:var(--t-sm);color:var(--ink);line-height:1.5}

.code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--t-sm);
  letter-spacing:.08em;background:var(--sunk);border:1px solid var(--line);
  border-radius:6px;padding:3px 8px;
}
.joinrow{display:flex;gap:var(--s4);align-items:center;flex-wrap:wrap}
.joinrow > div{flex:1 1 180px}

<script>
const STORE_KEY = "gridlock.coach.v2";
const BANNED = /gunz\s*up/ig;
function clean(s){return String(s||"").replace(BANNED,"Shot lanes")}

// What each break is, in a coach's words, and how hot it runs (1–5).
// Aggression drives the counter-picker ranking and the pips on the call.
const BREAK_META = {
  hold:  {aggr:1, read:"Give up nothing early. Read their bodies, then trade on your terms.",
          vs:{Snake:2, Balanced:1, Dorito:4}},
  base:  {aggr:2, read:"Wire to wire, five jobs, no gaps. The call you make when you are level.",
          vs:{Snake:3, Balanced:3, Dorito:3}},
  snake: {aggr:3, read:"Overload the bottom. Runner goes on the buzzer, support fills behind.",
          vs:{Snake:-2, Balanced:5, Dorito:6}},
  flood: {aggr:4, read:"Weight the D-wire and take the corner before they set.",
          vs:{Snake:6, Balanced:2, Dorito:-2}},
  blitz: {aggr:5, read:"Both wires at once. You are down and the point has to end early.",
          vs:{Snake:1, Balanced:4, Dorito:1}}
};
function breakMeta(k){ return BREAK_META[k] || BREAK_META.base; }

// A break on a digitized layout is written as the bunker each player plants
// on, never as a typed coordinate — the position comes from the layout, so
// the call stays true to the field even if the map is re-digitized.
// The snake is one continuous beam a player crawls down, not nine bunkers to
// share out — the official 3D makes that plain. So exactly one player takes it
// on any break; the rest support off it.
const BREAK_PLANTS = {
  mwo: {
    hold:  ["Ck#1","T#3","Br#2","T#1","MT#4"],
    base:  ["SB#4","MW#3","MT#1","MD#3","C#4"],
    snake: ["SB#6","MW#3","GP#1","MT#1","C#4"],
    flood: ["MD#1","MD#3","Tr#1","C#4","SB#3"],
    blitz: ["SB#6","GP#1","Tr#4","MD#1","MT#1"]
  }
};

// Which wire a bunker sits on, for the job label a coach reads off.
function wireOf(y){
  return y > 88 ? "snake wire" : y > 66 ? "snake side"
       : y > 44 ? "centre"     : y > 24 ? "dorito side" : "dorito wire";
}

// Nobody runs through a bunker, and nobody runs through the snake.
//
// The snake is one continuous structure printed as nine sections, so for
// routing they are merged back into a single obstacle — otherwise stepping
// around one section just lands you in the next. Any bunkers of the same code
// whose footprints touch are merged the same way.
function routeObstacles(list, pad){
  pad = pad === undefined ? 0.9 : pad;   // players run within a foot of a bunker
  let boxes = list.map(b => ({ids:[b.id], n:b.n,
    x0:b.x-(b.w||4)/2-pad, x1:b.x+(b.w||4)/2+pad,
    y0:b.y-(b.h||4)/2-pad, y1:b.y+(b.h||4)/2+pad}));
  for(let pass = 0; pass < 6; pass++){
    let merged = false;
    outer:
    for(let i = 0; i < boxes.length; i++){
      for(let j = i + 1; j < boxes.length; j++){
        const a = boxes[i], b = boxes[j];
        if(a.n !== b.n) continue;
        if(a.x0 > b.x1 + 1.5 || b.x0 > a.x1 + 1.5) continue;
        if(a.y0 > b.y1 + 1.5 || b.y0 > a.y1 + 1.5) continue;
        boxes[i] = {ids:a.ids.concat(b.ids), n:a.n,
          x0:Math.min(a.x0,b.x0), x1:Math.max(a.x1,b.x1),
          y0:Math.min(a.y0,b.y0), y1:Math.max(a.y1,b.y1)};
        boxes.splice(j, 1);
        merged = true;
        break outer;
      }
    }
    if(!merged) break;
  }
  return boxes.map(o => ({ids:new Set(o.ids), n:o.n,
    x:(o.x0+o.x1)/2, y:(o.y0+o.y1)/2, hw:(o.x1-o.x0)/2, hh:(o.y1-o.y0)/2}));
}

// Route around whatever is in the way, the way a player does: run to a corner,
// then on. A player never trades a clear lane for a shorter one they cannot
// take, so this picks the shortest route that is actually clear rather than
// nudging at the blockage until it gives up.
//
// Every corner of every obstacle is a place you can plant a foot. Join the
// start, the target and all those corners wherever the leg between them is
// clear, and take the shortest chain. If no chain exists the player is walled
// in and the straight line stands.
function routeClear(from, to, targetId, obstacles){
  // You cannot collide with the bunker you are standing behind: the five start
  // with a hand on the back-centre bunker, so whatever contains the start is
  // not an obstacle for that player. Nor is the bunker they are running to.
  const holds = o => Math.abs(from[0]-o.x) <= o.hw && Math.abs(from[1]-o.y) <= o.hh;
  const live = obstacles.filter(o => !o.ids.has(targetId) && !holds(o));
  const clear = (a, b) => !live.some(o => segHitsBox(a[0],a[1],b[0],b[1],o.x,o.y,o.hw,o.hh));
  const inField = c => c[0] > 1 && c[0] < 149 && c[1] > 1 && c[1] < 119;

  if(clear(from, to)) return [];

  const m = 1.4;                       // a shoulder's clearance off the corner
  const nodes = [from, to];
  live.forEach(o => {
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy]) => {
      const c = [o.x + sx*(o.hw+m), o.y + sy*(o.hh+m)];
      if(inField(c) && !live.some(k => Math.abs(c[0]-k.x) < k.hw && Math.abs(c[1]-k.y) < k.hh)) nodes.push(c);
    });
  });

  const N = nodes.length;
  const dist = nodes.map(() => Infinity), prev = nodes.map(() => -1), done = nodes.map(() => false);
  dist[0] = 0;
  for(;;){
    let u = -1;
    for(let i = 0; i < N; i++) if(!done[i] && dist[i] < (u < 0 ? Infinity : dist[u])) u = i;
    if(u < 0 || u === 1) break;
    done[u] = true;
    for(let v = 0; v < N; v++){
      if(done[v] || v === u) continue;
      const d = dist[u] + Math.hypot(nodes[v][0]-nodes[u][0], nodes[v][1]-nodes[u][1]);
      if(d >= dist[v] || !clear(nodes[u], nodes[v])) continue;
      dist[v] = d; prev[v] = u;
    }
  }
  if(prev[1] < 0) return [];           // walled in — draw it straight and honest

  const via = [];
  for(let k = prev[1]; k > 1; k = prev[k]) via.unshift(nodes[k]);
  return via;
}

function breakPaths(layoutKey, scriptKey){
  const fallback = (BREAKS[scriptKey] || BREAKS.base).paths;
  const plants = (BREAK_PLANTS[layoutKey] || {})[scriptKey];
  const layout = LAYOUTS[layoutKey];
  if(!plants || !layout) return fallback;
  const targets = plants.map(id => layout.bunkers.find(b => b.id === id));
  if(targets.some(t => !t)) return fallback;   // layout changed under us

  // All five break from the station at the centre of their own back line —
  // that is where an Xball point starts, not spread across the whole width.
  // The home back-centre bunker anchors it.
  const back = layout.bunkers
    .filter(b => b.x < 20)
    .sort((a, b) => Math.abs(a.y - 60) - Math.abs(b.y - 60))[0];
  const cy = back ? back.y : 60;
  const obstacles = routeObstacles(layout.bunkers);
  const order = targets.map((_, i) => i).sort((p, q) => targets[p].y - targets[q].y);
  const slot = {};
  order.forEach((idx, k) => { slot[idx] = cy - 8 + k * 4; });   // a 16 ft station

  return targets.map((b, i) => {
    const from = [3, slot[i]];
    const to = [b.x, b.y];
    return {id: i + 1, from, to, via: routeClear(from, to, b.id, obstacles),
            label: `${b.n} · ${wireOf(b.y)}`, bunker: b.id};
  });
}
// A coach who disagrees with the route drags it. Edits are stored per layout
// per break per player, over the top of the computed route, and any leg without
// one keeps the route the router worked out.
function pathKey(id){ return `${S.layoutKey}|${S.script}|${id}`; }
function pathEdit(id){ return (S.pathEdits || {})[pathKey(id)] || null; }

let _pathCache = {};
function dropPathCache(){ _pathCache = {}; }
function currentPaths(){
  const k = S.layoutKey + "|" + S.script;
  const routed = _pathCache[k] || (_pathCache[k] = breakPaths(S.layoutKey, S.script));
  return routed.map(p => { const e = pathEdit(p.id); return e ? {...p, via:e, edited:true} : p; });
}

// A path is a run, not a set of corners: round every turn so it reads like a
// player moving. The radius is capped at a third of the shorter leg, which
// keeps the curve inside the corridor the router already proved clear —
// test/functions.js samples the drawn curve and checks it against every bunker.
function smoothD(pts, sx, sy){
  const P = pts.map(q => [q[0] * sx, q[1] * sy]);
  if(P.length < 3) return `M${P.map(q => q[0].toFixed(1) + " " + q[1].toFixed(1)).join("L")}`;
  const R = 9;
  let d = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
  for(let i = 1; i < P.length - 1; i++){
    const a = P[i - 1], b = P[i], c = P[i + 1];
    const la = Math.hypot(b[0]-a[0], b[1]-a[1]), lc = Math.hypot(c[0]-b[0], c[1]-b[1]);
    const r = Math.min(R, la / 3, lc / 3);
    const p1 = [b[0] + (a[0]-b[0]) * r / la, b[1] + (a[1]-b[1]) * r / la];
    const p2 = [b[0] + (c[0]-b[0]) * r / lc, b[1] + (c[1]-b[1]) * r / lc];
    d += `L${p1[0].toFixed(1)} ${p1[1].toFixed(1)}Q${b[0].toFixed(1)} ${b[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  const e = P[P.length - 1];
  return d + `L${e[0].toFixed(1)} ${e[1].toFixed(1)}`;
}

// Heuristic rank, not a prediction. Two inputs a coach actually has: what the
// other pit reads as, and whether you can afford to be patient. Safer calls
// rise when you are ahead; aggressive ones rise when you have to score.
const STATE_BIAS = {Ahead:-1, Even:0, "Must-score":1};
function counterRank(theirTendency, matchState){
  const bias = STATE_BIAS[matchState] || 0;
  return Object.entries(BREAKS).map(([k,v])=>{
    const m = breakMeta(k);
    const fit = (m.vs && m.vs[theirTendency]) || 0;
    return {key:k, name:v.name, aggr:m.aggr, pct:Math.round(45 + fit + bias*(m.aggr-3)*2.5)};
  }).sort((a,b)=>b.pct-a.pct || a.aggr-b.aggr);
}

function ease(t){return 1-Math.pow(1-t,3)}
function lerp(a,b,t){return a+(b-a)*t}
function posAt(path, t){
  const pts = [path.from, ...(path.via||[]), path.to];
  if(pts.length===1) return pts[0];
  const u = ease(Math.max(0,Math.min(1,t)));
  const seg = (pts.length-1)*u;
  const i = Math.min(pts.length-2, Math.floor(seg));
  const f = seg-i;
  return [lerp(pts[i][0],pts[i+1][0],f), lerp(pts[i][1],pts[i+1][1],f)];
}

/* QR, byte mode, error correction level M, versions 1 to 3.
 *
 * The app ships as one file with no network, so a join code cannot be handed to
 * a library. Three versions is not a limitation in practice: version 3 holds 42
 * bytes and the thing being encoded is gridlock://class/GL-7K2M, which is 24.
 * Anything longer is refused rather than silently mangled.
 *
 * Versions 1 to 3 at level M are single block, so there is no interleaving. */
const QR_CAP  = {1:16, 2:28, 3:44};      // data codewords at level M
const QR_EC   = {1:10, 2:16, 3:26};      // error-correction codewords at level M
const QR_ALIGN= {1:null, 2:18, 3:22};    // centre of the one alignment pattern

// GF(256), the field QR error correction is computed in. 0x11d is its polynomial.
const GF_EXP = new Uint8Array(512), GF_LOG = new Uint8Array(256);
(() => {
  let x = 1;
  for(let i = 0; i < 255; i++){
    GF_EXP[i] = x; GF_LOG[x] = i;
    x <<= 1; if(x & 0x100) x ^= 0x11d;
  }
  for(let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
})();
const gfMul = (a, b) => (a && b) ? GF_EXP[GF_LOG[a] + GF_LOG[b]] : 0;

function rsGenerator(n){
  let g = [1];
  for(let i = 0; i < n; i++){
    const next = new Array(g.length + 1).fill(0);
    for(let j = 0; j < g.length; j++){
      next[j] ^= g[j];
      next[j + 1] ^= gfMul(g[j], GF_EXP[i]);
    }
    g = next;
  }
  return g;
}
function rsRemainder(data, n){
  const gen = rsGenerator(n), rem = new Array(n).fill(0);
  for(const d of data){
    const factor = d ^ rem[0];
    rem.shift(); rem.push(0);
    for(let i = 0; i < n; i++) rem[i] ^= gfMul(gen[i + 1], factor);
  }
  return rem;
}

function qrCodewords(text, version){
  const bytes = [];
  for(const ch of unescape(encodeURIComponent(text))) bytes.push(ch.charCodeAt(0));
  const cap = QR_CAP[version];
  if(bytes.length + 2 > cap) return null;              // mode + length + payload

  const bits = [];
  const push = (v, n) => { for(let i = n - 1; i >= 0; i--) bits.push((v >> i) & 1); };
  push(0b0100, 4);                                      // byte mode
  push(bytes.length, 8);                                // length, 8 bits for v1-9
  bytes.forEach(b => push(b, 8));
  push(0, Math.min(4, cap * 8 - bits.length));          // terminator
  while(bits.length % 8) bits.push(0);

  const data = [];
  for(let i = 0; i < bits.length; i += 8)
    data.push(bits.slice(i, i + 8).reduce((v, b) => (v << 1) | b, 0));
  for(let i = 0; data.length < cap; i++) data.push(i % 2 ? 0x11 : 0xec);   // pad bytes

  return data.concat(rsRemainder(data, QR_EC[version]));
}

// ---- the matrix -----------------------------------------------------------
function qrMatrix(text){
  let version = null, code = null;
  for(const v of [1, 2, 3]){ code = qrCodewords(text, v); if(code){ version = v; break; } }
  if(!code) return null;

  const n = version * 4 + 17;
  const m = Array.from({length:n}, () => new Array(n).fill(null));   // null = free
  const put = (r, c, v) => { if(r >= 0 && r < n && c >= 0 && c < n) m[r][c] = v; };

  const finder = (r0, c0) => {
    for(let r = -1; r <= 7; r++) for(let c = -1; c <= 7; c++){
      const inRing = (r >= 0 && r <= 6 && (c === 0 || c === 6)) || (c >= 0 && c <= 6 && (r === 0 || r === 6));
      const inCore = r >= 2 && r <= 4 && c >= 2 && c <= 4;
      put(r0 + r, c0 + c, inRing || inCore ? 1 : 0);
    }
  };
  finder(0, 0); finder(0, n - 7); finder(n - 7, 0);

  for(let i = 8; i < n - 8; i++){                       // timing
    m[6][i] = i % 2 ? 0 : 1;
    m[i][6] = i % 2 ? 0 : 1;
  }
  const a = QR_ALIGN[version];
  if(a != null) for(let r = -2; r <= 2; r++) for(let c = -2; c <= 2; c++)
    m[a + r][a + c] = (Math.abs(r) === 2 || Math.abs(c) === 2 || (r === 0 && c === 0)) ? 1 : 0;

  // The thirty format-information modules, in exactly the places the standard
  // puts them: a copy around the top-left finder and a copy split between the
  // bottom-left and top-right. Getting this set wrong shifts every data module.
  const fmtCells = [];
  for(let i = 0; i <= 5; i++) fmtCells.push([i, 8], [8, i]);
  fmtCells.push([7, 8], [8, 8], [8, 7]);
  for(let i = 0; i <= 6; i++) fmtCells.push([n - 1 - i, 8]);   // seven up the bottom-left
  for(let i = 7; i <= 14; i++) fmtCells.push([8, n - 15 + i]);  // eight along the top-right
  fmtCells.push([n - 8, 8]);                                    // and the dark module, its own
  fmtCells.forEach(([r, c]) => { m[r][c] = 0; });
  m[n - 8][8] = 1;
  const reserved = m.map(row => row.map(v => v !== null));

  // data, zigzag up-down in two-column strips, skipping the timing column
  let bit = 0;
  const bitAt = i => (code[i >> 3] >> (7 - (i & 7))) & 1;
  const total = code.length * 8;
  for(let col = n - 1; col > 0; col -= 2){
    if(col === 6) col--;
    for(let step = 0; step < n; step++){
      const up = ((n - 1 - col) >> 1) % 2 === 0;
      const row = up ? n - 1 - step : step;
      for(const c of [col, col - 1])
        if(!reserved[row][c]) m[row][c] = bit < total ? bitAt(bit++) : 0;
    }
  }

  const MASK = [
    (r, c) => (r + c) % 2 === 0,
    (r) => r % 2 === 0,
    (r, c) => c % 3 === 0,
    (r, c) => (r + c) % 3 === 0,
    (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
    (r, c) => (r * c) % 2 + (r * c) % 3 === 0,
    (r, c) => ((r * c) % 2 + (r * c) % 3) % 2 === 0,
    (r, c) => ((r + c) % 2 + (r * c) % 3) % 2 === 0,
  ];
  const FORMAT_M = [0b101010000010010, 0b101000100100101, 0b101111001111100, 0b101101101001011,
                    0b100010111111001, 0b100000011001110, 0b100111110010111, 0b100101010100000];

  const penalty = g => {
    let p = 0;
    const run = line => {
      let c = 1;
      for(let i = 1; i < n; i++){
        if(line[i] === line[i - 1]) c++;
        else { if(c >= 5) p += c - 2; c = 1; }
      }
      if(c >= 5) p += c - 2;
    };
    for(let r = 0; r < n; r++) run(g[r]);
    for(let c = 0; c < n; c++) run(g.map(row => row[c]));
    for(let r = 0; r < n - 1; r++) for(let c = 0; c < n - 1; c++)
      if(g[r][c] === g[r][c+1] && g[r][c] === g[r+1][c] && g[r][c] === g[r+1][c+1]) p += 3;
    const PAT = [1,0,1,1,1,0,1,0,0,0,0];
    const hasAt = (arr, i) => PAT.every((v, k) => arr[i + k] === v);
    const scan = arr => {
      for(let i = 0; i + 11 <= n; i++){
        if(hasAt(arr, i)) p += 40;
        if(PAT.every((v, k) => arr[i + 10 - k] === v)) p += 40;
      }
    };
    for(let r = 0; r < n; r++) scan(g[r]);
    for(let c = 0; c < n; c++) scan(g.map(row => row[c]));
    const dark = g.flat().filter(v => v === 1).length;
    p += Math.floor(Math.abs(dark * 100 / (n * n) - 50) / 5) * 10;
    return p;
  };

  let best = null, bestScore = Infinity;
  for(let mask = 0; mask < 8; mask++){
    const g = m.map((row, r) => row.map((v, c) => reserved[r][c] ? v : (MASK[mask](r, c) ? v ^ 1 : v)));
    const f = FORMAT_M[mask];
    const bitOf = i => (f >> i) & 1;
    // Copy one, wrapped around the top-left finder.
    for(let i = 0; i <= 5; i++) g[i][8] = bitOf(i);
    g[7][8] = bitOf(6); g[8][8] = bitOf(7); g[8][7] = bitOf(8);
    for(let i = 9; i <= 14; i++) g[8][14 - i] = bitOf(i);
    // Copy two runs the other way round: the high bits go up the bottom-left,
    // the low bits along the top-right.
    for(let i = 0; i <= 6; i++) g[n - 1 - i][8] = bitOf(14 - i);
    for(let j = 0; j <= 7; j++) g[8][n - 8 + j] = bitOf(7 - j);
    g[n - 8][8] = 1;                                    // dark module wins
    const sc = penalty(g);
    if(sc < bestScore){ bestScore = sc; best = g; }
  }
  return best;
}

// Draw it. A QR is only useful if a phone camera can read it off a screen held
// up on a sideline, so it goes out as crisp SVG rects with the quiet zone the
// standard asks for — four modules, or scanners fail on a busy background.
function qrSVG(text, px){
  const m = qrMatrix(text);
  if(!m) return "";
  const n = m.length, q = 4, side = n + q * 2;
  let d = "";
  for(let r = 0; r < n; r++){
    let c = 0;
    while(c < n){
      if(!m[r][c]){ c++; continue; }
      let w = 1;
      while(c + w < n && m[r][c + w]) w++;          // run of dark modules, one rect
      d += `M${c + q} ${r + q}h${w}v1h-${w}z`;
      c += w;
    }
  }
  return `<svg class="qr" viewBox="0 0 ${side} ${side}" width="${px}" height="${px}" role="img"
    aria-label="QR code for the join link"><rect width="${side}" height="${side}" fill="#fff"/>
    <path d="${d}" fill="#0b0c0d"/></svg>`;
}
// What the QR carries: the deep link both platforms already register, so a
// scan opens Classes with the code filled in. A phone without the app installed
// still shows the URI, and the code is legible inside it.
function joinLink(code){ return "gridlock://class/" + code; }

// ---- editing the break on the field ----------------------------------------
//
// Pointer events, not mouse: the same code has to work under a thumb. The SVG
// is scaled by its viewBox, so every position is converted through the screen
// matrix rather than assumed.
function fieldFeet(svg, ev){
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [Math.max(1, Math.min(149, p.x / 2)), Math.max(1, Math.min(119, p.y / 2))];
}
function setVia(id, via){
  S.pathEdits = {...(S.pathEdits || {}), [pathKey(id)]: via};
  save(S);
}
window.resetPath = id => {

// One delegated listener on the app, so it survives every repaint.
(function pathEditing(){
  let drag = null;
  const svgOf = el => el.closest("svg.field");
  document.addEventListener("pointerdown", ev => {
    if(!S.editPath || S.tab !== "playbook") return;
    const h = ev.target.closest("[data-h],[data-aim],[data-leg]");
    if(!h) return;
    const svg = svgOf(h);
    if(!svg) return;
    ev.preventDefault();
    const at = fieldFeet(svg, ev);
    if(h.hasAttribute("data-aim")){
      drag = {kind:"aim", id:Number(h.dataset.aim), moved:false};
    } else if(h.hasAttribute("data-h")){
      drag = {kind:"via", id:Number(h.dataset.h), i:Number(h.dataset.i), moved:false, at};
    } else {
      // Tapping the line itself adds a corner where you tapped, on the nearest leg.
      const id = Number(h.dataset.leg);   // dataset is text; path ids are numbers
      const p = currentPaths().find(x => x.id === id);
      if(!p) return;
      const pts = [p.from, ...(p.via || []), p.to];
      let best = 0, bestD = Infinity;
      for(let i = 0; i < pts.length - 1; i++){
        const m = [(pts[i][0]+pts[i+1][0])/2, (pts[i][1]+pts[i+1][1])/2];
        const d = Math.hypot(m[0]-at[0], m[1]-at[1]);
        if(d < bestD){ bestD = d; best = i; }
      }
      const via = [...(p.via || [])];
      via.splice(best, 0, at);
      setVia(id, via);
      drag = {kind:"via", id, i:best, moved:true, at};
      paintField();
    }
    if(h.setPointerCapture) h.setPointerCapture(ev.pointerId);
  });
  document.addEventListener("pointermove", ev => {
    if(!drag) return;
    const svg = document.querySelector(".field-wrap[data-live] svg.field");
    if(!svg) return;
    const at = fieldFeet(svg, ev);
    if(drag.kind === "via"){
      const p = currentPaths().find(x => x.id === drag.id);
      if(!p) return;
      if(Math.hypot(at[0]-drag.at[0], at[1]-drag.at[1]) > 1.2) drag.moved = true;
      const via = [...(p.via || [])];
      via[drag.i] = at;
      setVia(drag.id, via);
    } else {
      const p = currentPaths().find(x => x.id === drag.id);
      if(!p) return;
      const now = posAt(p, S.t);
      const deg = Math.round(Math.atan2(at[1]-now[1], at[0]-now[0]) * 180 / Math.PI);
      if(Math.abs(deg - (directOf(drag.id).face ?? 999)) < 1) return;
      const all = {...(S.direct || {})};
      all[directKey(drag.id)] = {...(all[directKey(drag.id)] || {}), face: deg};
      S.direct = all; save(S); drag.moved = true;
    }
    paintField();
  });
  document.addEventListener("pointerup", () => {
    if(!drag) return;
    // A tap on a corner, with no drag, takes that corner out.
    if(drag.kind === "via" && !drag.moved){
      const p = currentPaths().find(x => x.id === drag.id);
      if(p){
        const via = [...(p.via || [])];
        via.splice(drag.i, 1);
        setVia(drag.id, via);
      }
    }
    drag = null;
    render();
  });
})();

function bunkerTraffic(){
  // Bunker ids belong to a layout, so traffic logged on one field must not
  // leak onto another. Anything the current layout does not have is dropped.
  const here = new Set(curLayout().bunkers.map(b => b.id));
  const t = {};
  const bump = (id, key) => {
    if(!id || !here.has(id)) return;
    t[id] = t[id] || {outs:0, visits:0};
    t[id][key]++;
  };
  (S.tally || []).forEach(o => {
    if(typeof o !== 'object') return;
    bump(o.shotAt, 'outs');
    bump(o.movedTo, 'visits');
  });
  (S.moves || []).forEach(m => bump(m.to, 'visits'));
  return t;
}

function bunkerSize(b, sx=2, sy=2){
  if(b.w && b.h) return {h:(b.w*sx)/2, v:(b.h*sy)/2};
  return BUNKER[b.t] || BUNKER.can;
}

// One material for every bunker so the silhouette carries the type, and the
// red and blue break paths stay the loudest thing on the field.
function bunkerShape(b, sx, sy){
  const x = b.x*sx, y = b.y*sy, s = bunkerSize(b, sx, sy);
  // b.c is the body colour sampled off the official map, b.d the contrasting
  // cap, band or inset it prints. Neither is chosen here.
  const blue = b.c === 'b', red = b.c === 'r';
  const fill = blue ? 'url(#bnkBlue)' : red ? 'url(#bnkRed)' : 'url(#bnkFace)';
  const edge = blue ? '#1b1a55' : red ? '#5c0f0d' : '#63676a';
  const sw = 'stroke-width=".7"';
  // The official map picks each bunker out with a contrasting cap, band or
  // inset. Those are drawn here in a darker tone of the same material, so the
  // silhouettes match the map without a second hue fighting the wires.
  const detail = b.d === 'b' ? '#3f3eb0' : b.d === 'r' ? '#b8332c'
               : blue ? '#2f2e8a' : red ? '#9a231e' : '#70767a';
  const box = (w,h,r) => `<rect x="${(x-w).toFixed(1)}" y="${(y-h).toFixed(1)}" width="${(w*2).toFixed(1)}" height="${(h*2).toFixed(1)}" rx="${r}" fill="${fill}" stroke="${edge}" ${sw}/>`;
  const band = (hw,hh,cy2,r) => `<rect x="${(x-hw).toFixed(1)}" y="${(cy2-hh).toFixed(1)}" width="${(hw*2).toFixed(1)}" height="${(hh*2).toFixed(1)}" rx="${r}" fill="${detail}"/>`;

  switch(b.t){
    case "dorito":
      return `<polygon points="${x},${(y-s.v).toFixed(1)} ${(x-s.h).toFixed(1)},${(y+s.v).toFixed(1)} ${(x+s.h).toFixed(1)},${(y+s.v).toFixed(1)}" fill="${fill}" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
    case "wing": {
      // Wings point away from the 50, toward their own end line.
      const dir = b.x < 75 ? -1 : 1;
      return `<polygon points="${(x+s.h*dir).toFixed(1)},${y} ${(x-s.h*dir).toFixed(1)},${(y-s.v).toFixed(1)} ${(x-s.h*dir).toFixed(1)},${(y+s.v).toFixed(1)}" fill="${fill}" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
    }
    case "plus":
      return `<path d="M${x-1.9} ${y-s.v}h3.8v${s.v-1.9}h${s.h-1.9}v3.8h-${s.h-1.9}v${s.v-1.9}h-3.8v-${s.v-1.9}h-${s.h-1.9}v-3.8h${s.h-1.9}z" fill="${fill}" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
    case "cake":
      return `<circle cx="${x}" cy="${y}" r="${s.h}" fill="${fill}" stroke="${edge}" ${sw}/>`
           + `<circle cx="${x}" cy="${y}" r="${(s.h*0.45).toFixed(1)}" fill="none" stroke="${edge}" stroke-width=".6" opacity=".7"/>`;
    case "ball":     // an ellipse, so the drawn footprint is exactly the measured one
      return `<ellipse cx="${x}" cy="${y}" rx="${s.h.toFixed(1)}" ry="${s.v.toFixed(1)}" fill="${fill}" stroke="${edge}" ${sw}/>`;
    case "tridown":  // cakes and small doritos point back down the field
      return `<polygon points="${x},${(y+s.v).toFixed(1)} ${(x-s.h).toFixed(1)},${(y-s.v).toFixed(1)} ${(x+s.h).toFixed(1)},${(y-s.v).toFixed(1)}" fill="${fill}" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
    case "gwing":    return box(s.h, s.v, 2.4);            // giant wing
    case "gbrick":   return box(s.h, s.v, 2.4);            // giant brick
    case "temple": {                                       // squared, inset centre
      const i = Math.min(s.h, s.v) * 0.44;
      return box(s.h, s.v, 1.6)
           + `<rect x="${(x-i).toFixed(1)}" y="${(y-i).toFixed(1)}" width="${(i*2).toFixed(1)}" height="${(i*2).toFixed(1)}" rx="${(i*0.34).toFixed(1)}" fill="${detail}"/>`;
    }
    case "tower":
    case "towerbig": return box(s.h, s.v, s.h*0.8);        // tall and narrow
    case "beam": {                                         // long bar, capped ends
      const w = b.w ? b.w*sx/2 : s.h, cap = Math.min(1.3, w*0.09);
      return box(w, s.v, s.v)
           + `<rect x="${(x-w).toFixed(1)}" y="${(y-s.v).toFixed(1)}" width="${(cap*2).toFixed(1)}" height="${(s.v*2).toFixed(1)}" rx="${cap.toFixed(1)}" fill="${detail}"/>`
           + `<rect x="${(x+w-cap*2).toFixed(1)}" y="${(y-s.v).toFixed(1)}" width="${(cap*2).toFixed(1)}" height="${(s.v*2).toFixed(1)}" rx="${cap.toFixed(1)}" fill="${detail}"/>`;
    }
    case "mw":                                             // narrow bar, banded
      return box(s.h, s.v, s.h)
           + band(s.h*0.84, Math.min(0.9, s.v*0.07), y + s.v*0.16, 0.4)
           + band(s.h*0.84, Math.min(0.9, s.v*0.07), y + s.v*0.50, 0.4);
    case "bar":      return box(s.h, s.v, s.h);            // wing — plain upright bar
    default: {                                             // can / brick — capped
      const cap = Math.min(1.1, s.v*0.12);
      return box(s.h, s.v, s.h)
           + band(s.h*0.86, cap, y - s.v + cap, cap.toFixed(1))
           + band(s.h*0.86, cap, y + s.v - cap, cap.toFixed(1));
    }
  }
}

// One structure, one code.
//
// The snake is printed as nine sections but a coach calls it once, so touching
// footprints that share a code get a single label at the middle of the whole
// run. Codes go below the structure and shift above it when the slot below is
// taken, biggest structure first — without this the centre bunkers print
// "MW MW MW" on top of one another.
function bunkerLabels(list, sx, sy){
  const FS = 6, CH = 3.4, PAD = 1.2;

  // Merge touching same-code footprints, so nine snake sections read as one.
  const groups = [];
  list.forEach(b => {
    const s = bunkerSize(b, sx, sy), x = b.x*sx, y = b.y*sy;
    const box = {n: b.n, nm: callOf(b), x0:x-s.h, x1:x+s.h, y0:y-s.v, y1:y+s.v, area:s.h*s.v};
    const near = groups.find(g => g.n === box.n && g.nm === box.nm
      && g.x0 <= box.x1 + 1.5 && box.x0 <= g.x1 + 1.5
      && g.y0 <= box.y1 + 1.5 && box.y0 <= g.y1 + 1.5);
    if(!near){ groups.push(box); return; }
    near.x0 = Math.min(near.x0, box.x0); near.x1 = Math.max(near.x1, box.x1);
    near.y0 = Math.min(near.y0, box.y0); near.y1 = Math.max(near.y1, box.y1);
    near.area += box.area;
  });

  const placed = [];
  const hits = a => placed.some(b =>
    Math.abs(a.cx-b.cx) < (a.w+b.w)/2 + PAD && Math.abs(a.cy-b.cy) < (a.h+b.h)/2 + PAD);

  // Big structures claim their slot first — they are the ones a coach hunts for.
  return groups.slice().sort((a, b) => b.area - a.area).map(g => {
    const x = (g.x0+g.x1)/2, w = g.nm.length*CH + 1, h = FS;
    const below = {cx:x, cy:g.y1 + FS*0.9, w, h};
    const above = {cx:x, cy:g.y0 - FS*0.4, w, h};
    const spot = !hits(below) ? below : (!hits(above) ? above : null);
    if(!spot) return "";                       // no room — the shape still reads
    placed.push(spot);
    return `<text x="${spot.cx.toFixed(1)}" y="${(spot.cy+FS*0.35).toFixed(1)}" text-anchor="middle" font-size="${FS}" font-weight="600" fill="#f2f4f5" stroke="#0b0c0d" stroke-width="2.1" paint-order="stroke" stroke-linejoin="round">${esc(g.nm)}</text>`;
  }).join("");
}

// Segment vs. axis-aligned footprint. Used by Sightlines to decide whether a
// lane from one bunker to another actually clears everything between them.
function segHitsBox(x1,y1,x2,y2,cx,cy,hw,hh){
  // Liang–Barsky against the box, in the segment's own parameter space.
  const dx=x2-x1, dy=y2-y1;
  let t0=0, t1=1;
  const edges=[[-dx, x1-(cx-hw)],[dx,(cx+hw)-x1],[-dy, y1-(cy-hh)],[dy,(cy+hh)-y1]];
  for(const [p,q] of edges){
    if(p===0){ if(q<0) return false; continue; }
    const r=q/p;
    if(p<0){ if(r>t1) return false; if(r>t0) t0=r; }
    else   { if(r<t0) return false; if(r<t1) t1=r; }
  }
  return t0<t1;
}

function sightLines(fromId, sx, sy){
  const list = curLayout().bunkers;
  const src  = list.find(b=>b.id===fromId) || list[0];
  if(!src) return {src:null, lines:[], clear:0};
  const ox=src.x*sx, oy=src.y*sy;
  const lines = list.filter(b=>b!==src).map(b=>{
    const tx=b.x*sx, ty=b.y*sy;
    // Anything that is not the two endpoints can block the lane.
    const blocked = list.some(o=>{
      if(o===src||o===b) return false;
      const g=bunkerSize(o, sx, sy);
      return segHitsBox(ox,oy,tx,ty,o.x*sx,o.y*sy,g.h,g.v);
    });
    return {to:b, x:tx, y:ty, blocked};
  });
  return {src, lines, clear:lines.filter(l=>!l.blocked).length};
}

function fieldSVG(opts={}){
  const layout = curLayout();
  const W=300,H=240,sx=W/150,sy=H/120;
  const M=18;                                  // margin for the side labels
  const br = BREAKS[S.script] || BREAKS.snake;
  const brPaths = currentPaths();
  const t = opts.static?1:S.t;

  // Break paths. A dark casing under each line keeps it readable where it
  // crosses a bunker.
  const runner = (list, colour, offset) => list.map(p=>{
    const legs=[p.from,...(p.via||[]),p.to];
    const run=smoothD(legs, sx, sy);
    const xy=posAt(p,t), cx=xy[0]*sx, cy=xy[1]*sy;
    let out = `<path fill="none" d="${run}" stroke="#000000" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>`
            + `<path fill="none" d="${run}" stroke="${colour}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"${offset===0&&opts.edit?` data-leg="${p.id}"`:""}/>`;
    // In edit mode every corner is a handle: drag it, or tap it to take it out.
    if(offset===0 && opts.edit) out += (p.via||[]).map((v,vi)=>
      `<circle class="hnd" data-h="${p.id}" data-i="${vi}" cx="${(v[0]*sx).toFixed(1)}" cy="${(v[1]*sy).toFixed(1)}" r="5"/>`).join("");
    // Where the player is actually heading right now, so the chevron and the
    // lane travel with him instead of snapping to the plant.
    const a0=posAt(p,Math.max(0,t-0.02)), a1=posAt(p,Math.min(1,t+0.02));
    let travel = Math.atan2(a1[1]-a0[1], a1[0]-a0[0]);
    if(!isFinite(travel) || (a0[0]===a1[0] && a0[1]===a1[1]))
      travel = Math.atan2(p.to[1]-p.from[1], p.to[0]-p.from[0]);
    const d = offset===0 ? directOf(p.id) : {};

    if(S.shotOn){
      let ang = travel, len = 18, mark = "";
      if(d.shot){
        const tb = layout.bunkers.find(x=>x.id===d.shot);
        if(tb){
          const tx=tb.x*sx, ty=tb.y*sy;
          ang = Math.atan2(ty-cy, tx-cx);
          // Capped, because a cone drawn all the way to a far bunker swamps
          // the field. A ring on the target says what he is laning instead.
          len = Math.min(46, Math.max(14, Math.hypot(tx-cx, ty-cy) - 6));
          mark = `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="8" fill="none" stroke="#000" stroke-width="3" opacity=".5"/>`
               + `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="8" fill="none" stroke="#fff" stroke-width="1.4" stroke-dasharray="3 3"/>`;
        }
      }
      const sp=0.11, P=(o,l)=>`${(cx+Math.cos(ang+o)*l).toFixed(1)},${(cy+Math.sin(ang+o)*l).toFixed(1)}`;
      const tip=P(0,len).split(",");
      // The lane is a cone, not a ray, so it reads as a field of fire.
      out += `<polygon points="${cx.toFixed(1)},${cy.toFixed(1)} ${P(-sp,len)} ${P(sp,len)}" fill="#fff" opacity=".16"/>`
           + `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tip[0]}" y2="${tip[1]}" stroke="#000" stroke-width="3.2" stroke-linecap="round" opacity=".5"/>`
           + `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tip[0]}" y2="${tip[1]}" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>`
           + mark;
    }

    if(S.faceOn){
      const fa = (d.face!=null && d.face!==undefined) ? d.face*Math.PI/180 : travel;
      const fx=cx+Math.cos(fa)*10, fy=cy+Math.sin(fa)*10;
      const W=(o)=>`${(fx-Math.cos(fa+o)*6).toFixed(1)},${(fy-Math.sin(fa+o)*6).toFixed(1)}`;
      const pts=`${W(-0.85)} ${fx.toFixed(1)},${fy.toFixed(1)} ${W(0.85)}`;
      out += `<polyline points="${pts}" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>`
           + `<polyline points="${pts}" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    out += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="${colour}" stroke="#fff" stroke-width="1.4"${offset===0&&opts.edit?` class="aim" data-aim="${p.id}"`:""}/>`
         + `<text x="${cx.toFixed(1)}" y="${(cy+2.6).toFixed(1)}" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="700">${p.id+offset}</text>`;
    return out;
  }).join("");

  let paths = runner(brPaths, opts.color||"#e5342f", 0);
  if(opts.both){
    const flip=q=>[150-q[0],q[1]];
    paths += runner(brPaths.map(p=>({...p,from:flip(p.from),to:flip(p.to),via:(p.via||[]).map(flip)})), "#3d8bff", 5);
  }

  // Sightlines replace the break paths when a source bunker is picked.
  let sight = "";
  if(opts.sightFrom){
    const S1 = sightLines(opts.sightFrom, sx, sy);
    paths = "";
    if(S1.src){
      sight = S1.lines.map(l=>
        `<line x1="${(S1.src.x*sx).toFixed(1)}" y1="${(S1.src.y*sy).toFixed(1)}" x2="${l.x.toFixed(1)}" y2="${l.y.toFixed(1)}" stroke="${l.blocked?"#e5342f":"#3ecf8e"}" stroke-width="${l.blocked?1:1.6}" opacity="${l.blocked?.22:.85}" stroke-linecap="round"/>`
      ).join("")
      + `<circle cx="${(S1.src.x*sx).toFixed(1)}" cy="${(S1.src.y*sy).toFixed(1)}" r="7" fill="none" stroke="#fff" stroke-width="1.8"/>`;
    }
  }

  const bunks = layout.bunkers.map(b=>`<g class="bnk" data-b="${b.id}">${bunkerShape(b,sx,sy)}</g>`).join("");

  // Movement draws each logged rotation as an arrow between two footprints.
  let moveArrows = "";
  if(opts.moves){
    const byId = Object.fromEntries(layout.bunkers.map(b=>[b.id,b]));
    moveArrows = layoutMoves().slice(0,40).map(m=>{
      const a=byId[m.from], b=byId[m.to]; if(!a||!b) return "";
      const x1=a.x*sx, y1=a.y*sy, x2=b.x*sx, y2=b.y*sy;
      const ang=Math.atan2(y2-y1,x2-x1), L=Math.hypot(x2-x1,y2-y1);
      if(L<6) return "";
      // stop short of the target so the head sits beside it, not on it
      const tx=x2-Math.cos(ang)*5, ty=y2-Math.sin(ang)*5;
      const head=(o)=>`${(tx-Math.cos(ang-o)*5).toFixed(1)},${(ty-Math.sin(ang-o)*5).toFixed(1)}`;
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="#000" stroke-width="3.4" opacity=".5" stroke-linecap="round"/>`
           + `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="#3ecf8e" stroke-width="1.6" opacity=".95" stroke-linecap="round"/>`
           + `<polygon points="${tx.toFixed(1)},${ty.toFixed(1)} ${head(0.5)} ${head(-0.5)}" fill="#3ecf8e"/>`;
    }).join("");
  }

  // Bunker stats tint each footprint by how much traffic the tally recorded.
  let heat = "";
  if(opts.heat){
    const t = bunkerTraffic();
    const peak = Math.max(1, ...Object.values(t).map(v=>v.outs+v.visits));
    heat = layout.bunkers.map(b=>{
      const v = t[b.id]; if(!v) return "";
      const s2 = bunkerSize(b, sx, sy);
      const k = (v.outs+v.visits)/peak;
      // A ring, not a tint: a red wash would vanish on a red bunker.
      return `<rect x="${(b.x*sx-s2.h-3).toFixed(1)}" y="${(b.y*sy-s2.v-3).toFixed(1)}" width="${(s2.h*2+6).toFixed(1)}" height="${(s2.v*2+6).toFixed(1)}" rx="4" fill="none" stroke="#ffb020" stroke-width="${(1.2+k*3).toFixed(1)}" opacity="${(0.5+k*0.5).toFixed(2)}"/>`;
    }).join("");
  }

  return `<svg class="field" viewBox="-8 ${-M} ${W+16} ${H+M*2}">
    <defs>
      <!-- The official map paints every bunker red or blue; both are sampled
           from it. They sit a step darker than the wires (#e5342f / #3d8bff)
           so the break paths still lead the eye. -->
      <linearGradient id="bnkRed" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c2453d"/>
        <stop offset="1" stop-color="#7d1512"/>
      </linearGradient>
      <linearGradient id="bnkBlue" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a49c4"/>
        <stop offset="1" stop-color="#25246e"/>
      </linearGradient>
      <!-- A layout whose colour was never sampled stays neutral rather than
           being guessed into one of the two. -->
      <linearGradient id="bnkFace" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d4d6d7"/>
        <stop offset="1" stop-color="#8d9092"/>
      </linearGradient>
      <filter id="bnkLift" x="-40%" y="-40%" width="180%" height="200%">
        <feDropShadow dx="0" dy="1.1" stdDeviation="1" flood-color="#000000" flood-opacity=".55"/>
      </filter>
    </defs>

    <rect x="-8" y="${-M}" width="${W+16}" height="${H+M*2}" fill="#0b0c0d"/>
    <rect width="${W}" height="${H}" fill="#101111"/>
    ${[...Array(10)].map((_,i)=>i%2?`<rect x="${i*(W/10)}" y="0" width="${W/10}" height="${H}" fill="#0c0d0e"/>`:"").join("")}
    <rect width="${W}" height="${H}" fill="none" stroke="#33383a" stroke-width="1" opacity=".9"/>
    <line x1="${W/2}" y1="0" x2="${W/2}" y2="${H}" stroke="#e8e8e8" stroke-width=".8" stroke-dasharray="5 7" opacity=".26"/>
    <line x1="4" y1="0" x2="4" y2="${H}" stroke="#e8e8e8" stroke-width=".8" opacity=".22"/>
    <line x1="${W-4}" y1="0" x2="${W-4}" y2="${H}" stroke="#e8e8e8" stroke-width=".8" opacity=".22"/>

    <g filter="url(#bnkLift)">${bunks}</g>
    ${heat}
    ${moveArrows}
    ${sight}
    ${bunkerLabels(layout.bunkers, sx, sy)}
    ${paths}

    <text x="${W/2}" y="${-M+8}" text-anchor="middle" fill="#8d9092" font-size="8" font-weight="700" letter-spacing="1.6">DORITO SIDE</text>
    <text x="${W/2}" y="${H+M-4}" text-anchor="middle" fill="#8d9092" font-size="8" font-weight="700" letter-spacing="1.6">SNAKE SIDE</text>
  </svg>`;
}

/* ============================================================
   Scouting — what you know about a team, kept with the team
   ============================================================

   The two pits used to hold the film read themselves. They are slots, not
   teams, so tapping another team on the division board left your note behind
   and silently reattached it to whoever you tapped. A read on the Rejects
   became a read on Las Vegas Shock. Everything you learn now lives under the
   team's name and follows it in and out of the pit. */
function teamMeta(name){
  return TEAMS.find(t => t.name === name) || {name, pts:0, tend:"Bal", threat:3};
}
function profileOf(name){
  const kept = (S.scout || {})[name];
  if(kept) return {players:[], ...kept};
  const t = teamMeta(name);                       // seeded from the division board
  return {tend: t.tend === "Snake" ? "Snake" : t.tend === "Dorito" ? "Dorito" : "Balanced",
          threat: t.threat, notes: "", players: []};
}
function pitOf(side){
  const name = ((S[side] || {}).name) || TEAMS[0].name;
  return {name, pts: teamMeta(name).pts, ...profileOf(name)};
}
function scouted(name){
  const p = (S.scout || {})[name];
  return !!p && (!!(p.notes || "").trim() || (p.players || []).length > 0);
}
function editProfile(side, patch){
  const name = pitOf(side).name;
  S.scout = {...(S.scout || {}), [name]: {...profileOf(name), ...patch}};
  save(S);
}
window.setPitTeam = (side, name) => { S[side] = {...(S[side] || {}), name}; save(S); render(); };
window.setPitTend = (side, tend) => { editProfile(side, {tend}); render(); };
window.setPitNotes = (side, notes) => editProfile(side, {notes: clean(notes)});   // no redraw mid-type

// ---- the other pit's five, which is the point of scouting at all ----
window.addScoutPlayer = side => {
  const g = id => (document.getElementById(id) || {}).value || "";
  const num = g("sp-num-" + side).trim(), name = clean(g("sp-name-" + side).trim());
  if(!num && !name) return;                       // a number alone is a real entry
  editProfile(side, {players: [...pitOf(side).players, {
    num, name, wire: g("sp-wire-" + side), note: clean(g("sp-note-" + side).trim()), threat: 3,
  }]});
  render();
};
window.editScoutPlayer = (side, i, field, value) => {
  const players = pitOf(side).players.map((p, k) => k === i ? {...p, [field]: clean(String(value).trim())} : p);
  editProfile(side, {players});
};
window.setScoutThreat = (side, i, n) => {
  editProfile(side, {players: pitOf(side).players.map((p, k) => k === i ? {...p, threat:n} : p)});
  render();
};
window.delScoutPlayer = (side, i) => {
  editProfile(side, {players: pitOf(side).players.filter((_, k) => k !== i)});
  render();
};

function authForm(){
  if(S.mode!=="create" && S.mode!=="login") return "";
  return `<div class="panel">
    <h3 class="panel__title">${S.mode==="create"?"Create staff account":"Staff log in"}</h3>
    <div class="fld"><label>Email</label><input id="em" type="email" placeholder="coach@team.com"/></div>
    <div class="fld"><label>Password</label><input id="pw" type="password" placeholder="6 characters or more"/></div>
    <div class="btnrow">
      <button class="btn grow" onclick="doAuth()">${S.mode==="create"?"Create account":"Log in"}</button>
      <button class="btn btn--ghost" onclick="set({mode:null})">Back</button>
    </div>
    <p class="note">Stored on this device only, salted and hashed. Nothing is sent anywhere.</p>
  </div>`;

// The staff password never touches storage in the clear. It is salted and
// hashed with the platform's own crypto, and only the hash is kept — so a
// shared or stolen phone does not hand over the password itself.
const STAFF_KEY = "gridlock.staff.v2";
async function hashPass(pass, saltHex){
  const enc = new TextEncoder().encode(saltHex + "|" + pass);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function newSalt(){
  return [...crypto.getRandomValues(new Uint8Array(16))]
    .map(b => b.toString(16).padStart(2, "0")).join("");
}

window.doAuth = async () => {
  const email = document.getElementById("em").value.trim();
  const pass = document.getElementById("pw").value;
  if(!email || pass.length < 6){ alert("Email and a password of 6 characters or more."); return; }
  if(!(window.crypto && crypto.subtle)){
    alert("This browser cannot hash the password securely, so sign-in is disabled here. Use the app, or a browser on https.");
    return;
  }
  let acc = {};
  try{ acc = JSON.parse(localStorage.getItem(STAFF_KEY) || "{}"); }catch(e){}

  if(S.mode === "create"){
    const salt = newSalt();
    localStorage.setItem(STAFF_KEY, JSON.stringify({email, salt, hash: await hashPass(pass, salt)}));
    localStorage.removeItem("gridlock.staff");   // drop any old clear-text account
    set({entered:true, role:"staff", email, mode:null});
    return;
  }

  if(acc.email === email && acc.salt && acc.hash === await hashPass(pass, acc.salt)){
    set({entered:true, role:"staff", email, mode:null});
    return;
  }

  // An account made before hashing is upgraded on the next correct sign-in
  // rather than locking the coach out of his own phone.
  let old = {};
  try{ old = JSON.parse(localStorage.getItem("gridlock.staff") || "{}"); }catch(e){}
  if(old.email === email && old.pass === pass){
    const salt = newSalt();
    localStorage.setItem(STAFF_KEY, JSON.stringify({email, salt, hash: await hashPass(pass, salt)}));
    localStorage.removeItem("gridlock.staff");
    set({entered:true, role:"staff", email, mode:null});
    return;
  }
  alert("Email or password does not match. Create an account first.");
};

let raf=null;
window.playPath = () => {
  S.playing=!S.playing;
  if(!S.playing){ if(raf) cancelAnimationFrame(raf); render(); return; }
  render();
  const start=performance.now()-(S.t*2200);
  const tick=(now)=>{
    if(!S.playing) return;
    S.t=Math.min(1,(now-start)/2200);
    paintField();                 // only the field, not the whole app
    if(S.t<1) raf=requestAnimationFrame(tick);
    else { S.playing=false; render(); }
  };
  raf=requestAnimationFrame(tick);
};
// Repaint just the field SVGs. A full render() per frame rebuilt the entire
// document — including the division table — sixty times a second.
function paintField(){
  const opts = S.tab==="scout" ? {both:true} : {edit:S.editPath};
  document.querySelectorAll(".field-wrap[data-live]").forEach(el=>{ el.innerHTML = fieldSVG(opts); });
}

/* ============================================================
   Tally — a point sheet, tap a player to mark him out
   ============================================================ */
function tally(){
  const pt=S.point||1;
  const bl=curLayout().bunkers;
  const mine=fiveFor(S.point||1).filter(Boolean);
  const outs=(S.tally||[]);
  const thisPoint=outs.filter(o=>typeof o==="object" && o.pt===pt);
  const isOut=(side,name)=>thisPoint.some(o=>o.side===side && o.name===name);
  const alive=side=>5-thisPoint.filter(o=>o.side===side).length;

  const col=(side,label,colour,names)=>`<div>
    <h4 class="sec__eyebrow" style="color:${colour};margin-bottom:8px">${label} · ${alive(side)} up</h4>
    <div class="assigns">
      ${names.map(n=>`<button class="assign" onclick="markOut('${side}',${JSON.stringify(n).replace(/"/g,'&quot;')})" style="${isOut(side,n)?"opacity:.4":""}">
        <span class="assign__n" style="background:${isOut(side,n)?"var(--line-lit)":colour}">${isOut(side,n)?"✕":"●"}</span>
        <span class="assign__body"><span class="assign__job">${esc(n)}</span>
        ${isOut(side,n)?`<span class="assign__who">out</span>`:""}</span>
      </button>`).join("")}
    </div></div>`;

  return `${tip("tally","Tap a player the moment he goes out. Next point clears the sheet and keeps the log.")}

  ${sec("Point sheet", `<div class="facts">
      <span class="fact"><b>${pt}</b><span>Point</span></span>
      <span class="fact"><b>${alive("us")}</b><span>You up</span></span>
      <span class="fact"><b>${alive("them")}</b><span>Them up</span></span>
      <span class="fact"><b>${outs.length}</b><span>Logged</span></span>
    </div>
    <p class="note">Tap a player the moment he goes out.</p>
    <div class="who2">
      ${col("us","Your five","var(--red)",mine.length?mine.map(p=>p.name):["1","2","3","4","5"])}
      ${col("them",esc(pitOf("right").name),"var(--blue)",["1","2","3","4","5"].map(n=>"#"+n))}
    </div>
    <button class="btn btn--block" onclick="nextPoint()">Next point</button>`, curLayout().name)}

  ${sec("Log", outs.length?`<div class="assigns">
      ${outs.slice(0,40).map((o,i)=>{
        if(typeof o!=="object") return `<div class="assign"><span class="assign__n" style="background:var(--line-lit);font-size:11px">·</span>
          <span class="assign__body"><span class="assign__job">${esc(o)}</span></span>
          <button class="btn btn--danger" onclick="undoOut(${i})">Undo</button></div>`;
        // Only the point you are on gets the pickers. Each one is 58 options,
        // so rendering them for the whole log costs thousands of nodes a
        // repaint — and you should not be editing an old point by accident.
        const live = o.pt === pt;
        const named = id => { const b = bl.find(x=>x.id===id); return b?esc(callOf(b)):esc(id); };
        const where = [o.shotAt?`shot at ${named(o.shotAt)}`:"", o.movedTo?`moved to ${named(o.movedTo)}`:""]
          .filter(Boolean).join(" · ");
        return `<div class="assign" style="flex-wrap:wrap">
        <span class="assign__n" style="background:${o.side==="them"?"var(--blue)":"var(--red)"};font-size:11px">${o.pt}</span>
        <span class="assign__body"><span class="assign__job">${esc(o.name)}</span>
        <span class="assign__who">${o.side==="us"?"your player":esc(pitOf("right").name)}${where?" · "+where:""}</span></span>
        <button class="btn btn--danger" onclick="undoOut(${i})">Undo</button>
        ${live?`<div class="who2" style="flex-basis:100%;margin-top:6px">
          ${bunkerPick("Shot at", i, "shotAt", o.shotAt)}
          ${bunkerPick("Moved to", i, "movedTo", o.movedTo)}
        </div>`:""}

function bunkerPick(label, idx, field, value){
  const list = curLayout().bunkers;
  return `<label style="display:flex;flex-direction:column;gap:4px">

window.setOutBunker = (i, field, val) => {
  const t = [...(S.tally||[])];
  if(!t[i] || typeof t[i] !== "object") return;
  t[i] = {...t[i], [field]: val || undefined};
  S.tally = t; save(S); render();
};

window.markOut = (side,name) => {
  const pt=S.point||1;
  const already=(S.tally||[]).some(o=>typeof o==="object" && o.pt===pt && o.side===side && o.name===name);
  if(already) return;
  S.tally=[{pt,side,name,at:Date.now()},...(S.tally||[])];
  save(S); render();
};
window.undoOut = i => { S.tally=(S.tally||[]).filter((_,k)=>k!==i); save(S); render(); };
window.nextPoint = () => { S.point=(S.point||1)+1; save(S); render(); };

  // the horn is the two or three players he logged himself, hardest first.

    return `<div class="panel">
    <h3 class="panel__title">${esc(T.name)}</h3>

    <div class="facts">

      <span class="fact"><b>${res.lines.length-res.clear}</b><span>Blocked</span></span>

  ${sec("Lanes", `<div class="field-wrap">${fieldSVG({sightFrom:from,static:true})}</div>

}

window.sendBlast = () => {
  const body=clean(S.blastBody||"");

  const rec=[];
  S.groups.forEach(g=>g.members.forEach(m=>{ if(m.phone) rec.push(m.phone); }));
  S.blasts=[{at:new Date().toLocaleString(),n:rec.length,body},...S.blasts];
  save(S);
  if(rec.length && window.gridlockShare) window.gridlockShare(body+"\n"+rec.join(", "),"GRIDLOCK league blast");
  else prompt("Copy this blast", body+"\n"+rec.join(", "));

};
