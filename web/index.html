<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0d"/>
<meta name="color-scheme" content="dark"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GRIDLOCK"/>
<meta name="format-detection" content="telephone=no"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<title>GRIDLOCK System · Coach Edition</title>
<style>
:root{
  --bg:#0b0c0d; --panel:#141616; --panel2:#1c1f1f; --line:#2a2d2d;
  --sunk:#101212;
  /* one accent, three weights: solid fills, pressed, and small type */
  --accent:#ad1515; --accent-deep:#8f1010; --accent-lit:#e5252a;
  --ink:#efedeb; --mute:#9b9d9e;
  /* wires stay semantic — left pit red, right pit blue */
  --red:#e5342f; --blue:#3d8bff; --turf:#101111;
  --ok:#3ecf8e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;min-height:100%}
.top{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:.12em}
.brand small{display:block;font-weight:600;letter-spacing:.28em;font-size:9px;color:var(--accent-lit)}
.grow{flex:1}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:999px;padding:6px 10px;font-size:12px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.main{flex:1;overflow:auto;padding:12px}
.tabs{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);background:#000}
.tabs button{flex:1;background:transparent;border:0;color:var(--mute);padding:8px 4px;font-size:11px}
.tabs button.on{color:var(--accent-lit);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
h1,h2,h3{margin:0 0 8px}
h2{font-size:16px}
label{display:block;font-size:11px;color:var(--mute);margin:8px 0 4px;letter-spacing:.04em}
input,select,textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:70px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.muted{color:var(--mute);font-size:12px}
.field-wrap{background:#0b0c0d;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
svg.field{width:100%;height:auto;display:block}
.pit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:720px){.pit{grid-template-columns:1fr}}
.star{cursor:pointer;font-size:16px}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th,.table td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.promo{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;background:
  radial-gradient(1200px 520px at 50% 0%, rgba(173,21,21,.30) 0%, transparent 58%),
  linear-gradient(#000,#0b0c0d)}
.promo h1{font-size:42px;letter-spacing:.18em;margin:0}
.promo .sys{letter-spacing:.4em;color:var(--accent-lit);font-size:12px;margin:4px 0 18px}
.promo .tag{color:var(--mute);margin-bottom:22px}
.stack{display:flex;flex-direction:column;gap:8px}
.warn{color:#f3c38a;font-size:12px}
.tip{background:#1a1212;border:1px solid var(--accent);border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:10px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px}
.bar{height:10px;border-radius:99px;overflow:hidden;display:flex;background:var(--sunk)}
.bar i{display:block;height:100%}
code{background:var(--sunk);padding:2px 6px;border-radius:6px}

/* --- Native shell: notch/home-indicator insets and app-like touch behaviour --- */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{-webkit-touch-callout:none}

/* App shell: the tab bar and header are pinned and only .main scrolls.
   Without this the whole .app grows past the viewport and the tab bar
   scrolls off the bottom of the phone. */
html,body{overflow:hidden}
#root{height:100%;overflow:hidden}
.app{height:100%;min-height:0}
.main{flex:1;min-height:0;overflow-y:auto}
.promo{height:100%;overflow-y:auto}
button,.chip,.btn,.tabs button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea,select{-webkit-user-select:text;user-select:text}
.top{
  padding-top:calc(10px + env(safe-area-inset-top));
  padding-left:calc(14px + env(safe-area-inset-left));
  padding-right:calc(14px + env(safe-area-inset-right));
}
.main{
  padding-left:calc(12px + env(safe-area-inset-left));
  padding-right:calc(12px + env(safe-area-inset-right));
  -webkit-overflow-scrolling:touch;
}
.tabs{
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
  padding-left:calc(8px + env(safe-area-inset-left));
  padding-right:calc(8px + env(safe-area-inset-right));
}
.tabs button{min-height:44px}
.promo{
  padding-top:calc(24px + env(safe-area-inset-top));
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  padding-left:calc(24px + env(safe-area-inset-left));
  padding-right:calc(24px + env(safe-area-inset-right));
}
/* Gloves: nothing tappable smaller than a fingertip. */
.btn,.chip{min-height:38px}
.star{padding:2px 4px}
</style>

<script>
const STORE_KEY = "gridlock.coach.v2";
const BANNED = /gunz\s*up/ig;
function clean(s){return String(s||"").replace(BANNED,"Shot lanes")}

const CIN = [
  {id:"MW#1",n:"MW",x:75,y:112,t:"mw"},{id:"SB#2",n:"SB",x:75,y:103,t:"beam",w:22},
  {id:"GW#3",n:"GW",x:75,y:65,t:"tower"},{id:"GB#4",n:"GB",x:75,y:55,t:"towerbig"},
  {id:"GW#5",n:"GW",x:75,y:45,t:"tower"},{id:"C#7",n:"C",x:15,y:76,t:"can"},
  {id:"MT#8",n:"MT",x:15,y:35,t:"temple"},{id:"T#10",n:"T",x:25,y:105,t:"temple"},
  {id:"T#11",n:"T",x:25,y:58,t:"temple"},{id:"SD#12",n:"SD",x:25,y:16,t:"dorito"},
  {id:"MD#13",n:"MD",x:35,y:108,t:"dorito"},{id:"Br#14",n:"Br",x:35,y:88,t:"can"},
  {id:"Br#15",n:"Br",x:35,y:9,t:"can"},{id:"C#16",n:"C",x:45,y:74,t:"can"},
  {id:"Ck#17",n:"Ck",x:45,y:31,t:"cake"},{id:"MD#18",n:"MD",x:55,y:112,t:"dorito"},
  {id:"Wg#19",n:"Wg",x:52,y:9,t:"wing"},{id:"Tr#20",n:"Tr",x:57,y:74,t:"can"},
  {id:"MW#21",n:"MW",x:58,y:30,t:"mw"},{id:"GP#22",n:"GP",x:64,y:17,t:"plus"},
  {id:"MT#23",n:"MT",x:63,y:47,t:"temple"},{id:"MD#24",n:"MD",x:68,y:112,t:"dorito"},
  {id:"Tr#25",n:"Tr",x:68,y:74,t:"can"},{id:"MW#26",n:"MW",x:72,y:30,t:"mw"}
];
function mirror(list){
  const out = list.map(b=>({...b}));
  list.forEach(b=>{
    if(Math.abs(b.x-75)<0.5) return;
    out.push({...b,id:b.id+"R",x:150-b.x});
  });
  return out;
}
const LAYOUTS = {
  tbo: {name:"NXL Tampa Bay Open", key:"tbo", bunkers:mirror(CIN)},
  cin: {name:"Cincinnati / TBO footprint", key:"cin", bunkers:mirror(CIN)}
};
const BREAKS = {
  hold:{name:"Hold & Read", paths:[
    {id:1,from:[2,22],to:[45,31],via:[[30,34]],label:"snake primary"},
    {id:2,from:[2,42],to:[40,34],via:[],label:"snake contain"},
    {id:3,from:[2,62],to:[45,74],via:[],label:"center C hold"},
    {id:4,from:[2,82],to:[25,105],via:[],label:"dorito primary"},
    {id:5,from:[2,104],to:[15,76],via:[],label:"read the break"}
  ]},
  base:{name:"Balanced Break", paths:[
    {id:1,from:[2,22],to:[58,30],via:[[30,34]],label:"snake MW"},
    {id:2,from:[2,40],to:[64,17],via:[],label:"GP"},
    {id:3,from:[2,60],to:[63,47],via:[],label:"MT 50"},
    {id:4,from:[2,92],to:[68,112],via:[],label:"fwd MD"},
    {id:5,from:[2,108],to:[45,74],via:[],label:"C lane"}
  ]},
  snake:{name:"Snake Stack", paths:[
    {id:1,from:[2,16],to:[76,35],via:[[30,34]],label:"deep snake run"},
    {id:2,from:[2,30],to:[58,30],via:[],label:"snake MW"},
    {id:3,from:[2,46],to:[64,17],via:[],label:"GP"},
    {id:4,from:[2,66],to:[65,74],via:[],label:"tree"},
    {id:5,from:[2,104],to:[55,112],via:[],label:"MD hold"}
  ]},
  flood:{name:"Dorito Flood", paths:[
    {id:1,from:[2,110],to:[68,112],via:[],label:"fwd MD"},
    {id:2,from:[2,96],to:[55,112],via:[],label:"MD"},
    {id:3,from:[2,80],to:[45,74],via:[],label:"C insert"},
    {id:4,from:[2,58],to:[63,47],via:[],label:"MT 50"},
    {id:5,from:[2,20],to:[40,34],via:[[30,34]],label:"snake contain"}
  ]},
  blitz:{name:"Blitz", paths:[
    {id:1,from:[2,16],to:[76,35],via:[[30,34]],label:"snake sprint"},
    {id:2,from:[2,40],to:[66,30],via:[],label:"MW push"},
    {id:3,from:[2,108],to:[68,112],via:[],label:"MD sprint"},
    {id:4,from:[2,60],to:[63,47],via:[],label:"MT 50"},
    {id:5,from:[2,46],to:[64,17],via:[],label:"GP"}
  ]}
};
const TEAMS = [
  {name:"Beefy Boys",pts:71.74,reg:"PAID",tend:"Bal",threat:3},
  {name:"Blast Camp",pts:200,reg:"PAID",tend:"Bal",threat:5,film:1},
  {name:"Brooklyn Wolfpack",pts:99.13,reg:"PEND",tend:"Bal",threat:3},
  {name:"Clutch City Oilers",pts:86.96,reg:"PAID",tend:"Bal",threat:3},
  {name:"Distortion Immortals",pts:44.35,reg:"PAID",tend:"Bal",threat:3},
  {name:"Hurricanes SP",pts:138.7,reg:"PAID",tend:"Bal",threat:4},
  {name:"KC Missouri Allstars",pts:151.74,reg:"PAID",tend:"Bal",threat:4},
  {name:"Las Vegas Shock",pts:156.96,reg:"PAID",tend:"Bal",threat:4},
  {name:"Legacy Factory",pts:129.57,reg:"PAID",tend:"Bal",threat:4},
  {name:"Louisville Asylum",pts:77.83,reg:"PAID",tend:"Bal",threat:3},
  {name:"Malicious",pts:135.65,reg:"PAID",tend:"Bal",threat:4},
  {name:"Miami Effect",pts:68.7,reg:"PAID",tend:"Bal",threat:3},
  {name:"New Jersey Filthy",pts:65.65,reg:"PAID",tend:"Bal",threat:2},
  {name:"Rejects",pts:186,reg:"PAID",tend:"Snake",threat:4}
];

const defaultState = () => ({
  entered:false, role:"guest", email:"",
  tab:"playbook", more:"classes",
  layoutKey:"tbo", script:"snake", playing:false, t:0,
  faceOn:true, shotOn:true, rolesOn:true,
  left:{name:"Blast Camp",tend:"Balanced",threat:5,notes:"",pts:200},
  right:{name:"Rejects",tend:"Snake",threat:4,notes:"",pts:186},
  matchState:"Even",
  tips:{},
  classes:[], responses:[],
  groups:[
    {id:"ops",name:"Ops",members:[]},
    {id:"refs",name:"Refs",members:[]},
    {id:"reg",name:"Registration",members:[]},
    {id:"vendors",name:"Vendors",members:[]}
  ],
  blasts:[],
  roster:[{name:"Snake",num:1,p:"snake MW",s:"GP"},{name:"Center",num:3,p:"MT 50",s:"tree"}],
  messages:[],
  tally:[],
  showTutorial:false,
  joinCode:"",
  blastBody:"",
  newClassTitle:"Friday clinic"
});

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    return Object.assign(defaultState(), JSON.parse(raw));
  }catch(e){return defaultState()}
}
function save(s){localStorage.setItem(STORE_KEY, JSON.stringify(s))}
let S = load();
window.S = S;   // the bridge in native.js reads this; set() mutates in place
const params = new URLSearchParams(location.search);
if(params.get("c")){ S.joinCode = params.get("c"); S.entered = true; S.tab = "more"; S.more = "classes"; }

function set(patch){ Object.assign(S, patch); save(S); render(); }

function ease(t){return 1-Math.pow(1-t,3)}
function lerp(a,b,t){return a+(b-a)*t}
function posAt(path, t){
  const pts = [path.from, ...(path.via||[]), path.to];
  if(pts.length===1) return pts[0];
  const u = ease(Math.max(0,Math.min(1,t)));
  const seg = (pts.length-1)*u;
  const i = Math.min(pts.length-2, Math.floor(seg));
  const f = seg-i;
  return [lerp(pts[i][0],pts[i+1][0],f), lerp(pts[i][1],pts[i+1][1],f)];
}

// Bunker footprints, in SVG units, as half-extents. Sized against the real
// spacing of the layout: the tightest pair on CIN sits 12 units apart, so the
// widest piece stays under 6 either side and nothing merges into a blob.
const BUNKER = {
  dorito:  {h:5.2, v:4.6},
  temple:  {h:4.6, v:4.2},
  tower:   {h:2.6, v:5.8},
  towerbig:{h:3.6, v:8.2},
  beam:    {h:15,  v:2.6},
  plus:    {h:5.6, v:5.6},
  wing:    {h:6.6, v:4.2},
  mw:      {h:4.6, v:3.2},
  cake:    {h:4.6, v:4.6},
  can:     {h:3.6, v:4.6}
};
function bunkerSize(b){ return BUNKER[b.t] || BUNKER.can; }

// One material for every bunker so the silhouette carries the type, and the
// red and blue break paths stay the loudest thing on the field.
function bunkerShape(b, sx, sy){
  const x = b.x*sx, y = b.y*sy, s = bunkerSize(b);
  const fill = 'url(#bnkFace)', edge = '#63676a', sw = 'stroke-width=".7"';
  const box = (w,h,r) => `<rect x="${(x-w).toFixed(1)}" y="${(y-h).toFixed(1)}" width="${(w*2).toFixed(1)}" height="${(h*2).toFixed(1)}" rx="${r}" fill="${fill}" stroke="${edge}" ${sw}/>`;

  switch(b.t){
    case "dorito":
      return `<polygon points="${x},${(y-s.v).toFixed(1)} ${(x-s.h).toFixed(1)},${(y+s.v).toFixed(1)} ${(x+s.h).toFixed(1)},${(y+s.v).toFixed(1)}" fill="${fill}" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
    case "wing": {
      // Wings point away from the 50, toward their own end line.
      const dir = b.x < 75 ? -1 : 1;
      return `<polygon points="${(x+s.h*dir).toFixed(1)},${y} ${(x-s.h*dir).toFixed(1)},${(y-s.v).toFixed(1)} ${(x-s.h*dir).toFixed(1)},${(y+s.v).toFixed(1)}" fill="${fill}" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
    }
    case "plus":
      return `<path d="M${x-1.9} ${y-s.v}h3.8v${s.v-1.9}h${s.h-1.9}v3.8h-${s.h-1.9}v${s.v-1.9}h-3.8v-${s.v-1.9}h-${s.h-1.9}v-3.8h${s.h-1.9}z" fill="${fill}" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
    case "cake":
      return `<circle cx="${x}" cy="${y}" r="${s.h}" fill="${fill}" stroke="${edge}" ${sw}/>`
           + `<circle cx="${x}" cy="${y}" r="${(s.h*0.45).toFixed(1)}" fill="none" stroke="${edge}" stroke-width=".6" opacity=".7"/>`;
    case "temple":   return box(s.h, s.v, 1.6);            // squared off
    case "tower":
    case "towerbig": return box(s.h, s.v, s.h*0.8);        // tall and narrow
    case "beam":     return box(b.w ? b.w*sx/2 : s.h, s.v, s.v);  // long bar
    case "mw":       return box(s.h, s.v, s.v);            // capsule on its side
    default:         return box(s.h, s.v, s.h);            // can — upright capsule
  }
}

// Codes go below the footprint, and shift above it when the slot below is
// already taken. Without this the centre bunkers print "MW MW MW" on top of
// one another.
function bunkerLabels(list, sx, sy){
  const FS = 6, CH = 3.4, PAD = 1.2;
  const placed = [];
  const hits = (a) => placed.some(b =>
    Math.abs(a.cx-b.cx) < (a.w+b.w)/2 + PAD && Math.abs(a.cy-b.cy) < (a.h+b.h)/2 + PAD);

  return list.map(b => {
    const x = b.x*sx, y = b.y*sy, s = bunkerSize(b);
    const w = b.n.length*CH + 1, h = FS;
    const below = {cx:x, cy:y + s.v + FS*0.9, w, h};
    const above = {cx:x, cy:y - s.v - FS*0.4, w, h};
    const spot = !hits(below) ? below : (!hits(above) ? above : null);
    if(!spot) return "";                       // no room — the shape still reads
    placed.push(spot);
    return `<text x="${spot.cx.toFixed(1)}" y="${(spot.cy+FS*0.35).toFixed(1)}" text-anchor="middle" font-size="${FS}" font-weight="600" fill="#e4e6e7" stroke="#0b0c0d" stroke-width="1.6" paint-order="stroke" stroke-linejoin="round">${b.n}</text>`;
  }).join("");
}

function fieldSVG(opts={}){
  const layout = LAYOUTS[S.layoutKey] || LAYOUTS.tbo;
  const W=300,H=240,sx=W/150,sy=H/120;
  const M=18;                                  // margin for the side labels
  const br = BREAKS[S.script] || BREAKS.snake;
  const t = opts.static?1:S.t;

  // Break paths. A dark casing under each line keeps it readable where it
  // crosses a bunker.
  const runner = (list, colour, offset) => list.map(p=>{
    const pts=[p.from,...(p.via||[]),p.to].map(q=>`${(q[0]*sx).toFixed(1)},${(q[1]*sy).toFixed(1)}`).join(" ");
    const xy=posAt(p,t), cx=xy[0]*sx, cy=xy[1]*sy;
    let out = `<polyline fill="none" stroke="#000000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" opacity=".55" points="${pts}"/>`
            + `<polyline fill="none" stroke="${colour}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/>`;
    if(S.shotOn){
      const ang = Math.atan2(p.to[1]-p.from[1], p.to[0]-p.from[0]);
      const lx=(cx+Math.cos(ang)*18).toFixed(1), ly=(cy+Math.sin(ang)*18).toFixed(1);
      // Cased, because a bare white lane disappears over a light bunker.
      out += `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${lx}" y2="${ly}" stroke="#000" stroke-width="3.2" stroke-linecap="round" opacity=".55"/>`
           + `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${lx}" y2="${ly}" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>`;
    }
    out += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="${colour}" stroke="#fff" stroke-width="1.4"/>`
         + `<text x="${cx.toFixed(1)}" y="${(cy+2.6).toFixed(1)}" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="700">${p.id+offset}</text>`;
    return out;
  }).join("");

  let paths = runner(br.paths, opts.color||"#e5342f", 0);
  if(opts.both){
    const flip=q=>[150-q[0],q[1]];
    paths += runner(br.paths.map(p=>({...p,from:flip(p.from),to:flip(p.to),via:(p.via||[]).map(flip)})), "#3d8bff", 5);
  }

  const bunks = layout.bunkers.map(b=>bunkerShape(b,sx,sy)).join("");

  return `<svg class="field" viewBox="-8 ${-M} ${W+16} ${H+M*2}">
    <defs>
      <linearGradient id="bnkFace" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d4d6d7"/>
        <stop offset="1" stop-color="#8d9092"/>
      </linearGradient>
      <filter id="bnkLift" x="-40%" y="-40%" width="180%" height="200%">
        <feDropShadow dx="0" dy="1.1" stdDeviation="1" flood-color="#000000" flood-opacity=".55"/>
      </filter>
    </defs>

    <rect x="-8" y="${-M}" width="${W+16}" height="${H+M*2}" fill="#0b0c0d"/>
    <rect width="${W}" height="${H}" fill="#101111"/>
    ${[...Array(10)].map((_,i)=>i%2?`<rect x="${i*(W/10)}" y="0" width="${W/10}" height="${H}" fill="#0c0d0e"/>`:"").join("")}
    <rect width="${W}" height="${H}" fill="none" stroke="#33383a" stroke-width="1" opacity=".9"/>
    <line x1="${W/2}" y1="0" x2="${W/2}" y2="${H}" stroke="#e8e8e8" stroke-width=".8" stroke-dasharray="5 7" opacity=".26"/>
    <line x1="4" y1="0" x2="4" y2="${H}" stroke="#e8e8e8" stroke-width=".8" opacity=".22"/>
    <line x1="${W-4}" y1="0" x2="${W-4}" y2="${H}" stroke="#e8e8e8" stroke-width=".8" opacity=".22"/>

    <g filter="url(#bnkLift)">${bunks}</g>
    ${bunkerLabels(layout.bunkers, sx, sy)}
    ${paths}

    <text x="${W/2}" y="${-M+8}" text-anchor="middle" fill="#8d9092" font-size="8" font-weight="700" letter-spacing="1.6">DORITO SIDE</text>
    <text x="${W/2}" y="${H+M-4}" text-anchor="middle" fill="#8d9092" font-size="8" font-weight="700" letter-spacing="1.6">SNAKE SIDE</text>
  </svg>`;
}

function stars(n, key){
  return [1,2,3,4,5].map(i=>`<span class="star" onclick="setThreat('${key}',${i})">${i<=n?"★":"☆"}</span>`).join("");
}
window.setThreat=(side,n)=>{S[side].threat=n;save(S);render()}

function staffed(){return S.role==="staff"||S.role==="admin"}

function promo(){
  return `<div class="promo">
    <div class="brand">GRIDLOCK</div>
    <div class="sys">SYSTEM · COACH EDITION</div>
    <div class="tag">Call the break. Direct the five. Own the point.</div>
    <div class="stack">
      <button class="btn" onclick="set({mode:'create'})">Staff — create account</button>
      <button class="btn ghost" onclick="set({mode:'login'})">Staff — log in</button>
      <button class="btn ghost" onclick="set({entered:true,showTutorial:true,tab:'playbook'})">Tutorial</button>
      <button class="btn ghost" onclick="set({entered:true,role:'guest'})">Continue as guest</button>
    </div>
    <p class="muted" style="margin-top:18px">GRIDLOCK System · powered by UPRA</p>
    ${authForm()}
  </div>`;
}
function authForm(){
  if(S.mode!=="create" && S.mode!=="login") return "";
  return `<div class="card" style="margin-top:16px">
    <h2>${S.mode==="create"?"Create staff account":"Staff log in"}</h2>
    <label>Email</label><input id="em" placeholder="coach@team.com"/>
    <label>Password</label><input id="pw" type="password"/>
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="doAuth()">${S.mode==="create"?"Create account":"Log in"}</button>
      <button class="btn ghost" onclick="set({mode:null})">Back</button>
    </div>
    <p class="muted">Stored on this device / browser only.</p>
  </div>`;
}
window.doAuth=()=>{
  const email=document.getElementById("em").value.trim();
  const pass=document.getElementById("pw").value;
  if(!email||pass.length<6){alert("Email + password (6+ characters).");return}
  const acc=JSON.parse(localStorage.getItem("gridlock.staff")||"{}");
  if(S.mode==="create"){
    localStorage.setItem("gridlock.staff", JSON.stringify({email,pass}));
    set({entered:true,role:"staff",email,mode:null});
  }else{
    if(acc.email===email && acc.pass===pass) set({entered:true,role:"staff",email,mode:null});
    else alert("Email or password does not match. Create an account first.");
  }
};

function tip(id,text){
  if(S.tips[id]) return "";
  return `<div class="tip">${text} <button class="chip" onclick="dismissTip('${id}')">Got it</button></div>`;
}
window.dismissTip=(id)=>{S.tips[id]=true;save(S);render()}

function playbook(){
  const br=BREAKS[S.script];
  return `${tip("pb","Playbook is the call. Pick a break, tap Play path, then direct each player.")}
  <div class="card">
    <div class="muted">EVENT · LAYOUT</div>
    <select onchange="set({layoutKey:this.value})">
      <option value="tbo" ${S.layoutKey==="tbo"?"selected":""}>NXL Tampa Bay Open · TBO</option>
      <option value="cin" ${S.layoutKey==="cin"?"selected":""}>Cincinnati footprint · CIN</option>
    </select>
    <div class="row" style="margin-top:8px">
      ${Object.entries(BREAKS).map(([k,v])=>`<button class="chip ${S.script===k?"on":""}" onclick="set({script:'${k}',t:0})">${v.name}</button>`).join("")}
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn" onclick="playPath()">${S.playing?"Pause":"Play path"}</button>
      <button class="chip ${S.faceOn?"on":""}" onclick="set({faceOn:!S.faceOn})">Face</button>
      <button class="chip ${S.shotOn?"on":""}" onclick="set({shotOn:!S.shotOn})">Shot lanes</button>
      <button class="chip" onclick="set({t:0,playing:false})">Reset</button>
    </div>
    <p class="muted">Training aid. Officials govern the live call.</p>
  </div>
  <div class="field-wrap">${fieldSVG()}</div>
  <div class="card">
    <h2>Direct your players</h2>
    ${br.paths.map(p=>`<div class="row" style="align-items:center;margin:6px 0">
      <b style="width:24px;color:var(--red)">${p.id}</b>
      <span class="grow">${p.label}</span>
      <span class="muted">P|S</span>
    </div>`).join("")}
  </div>`;
}

let raf=null;
window.playPath=()=>{
  S.playing=!S.playing;
  if(!S.playing){render();return}
  const start=performance.now()-(S.t*2200);
  const tick=(now)=>{
    if(!S.playing) return;
    S.t=Math.min(1,(now-start)/2200);
    render();
    if(S.t<1) raf=requestAnimationFrame(tick);
    else S.playing=false;
  };
  raf=requestAnimationFrame(tick);
};

function tally(){
  return `${tip("tally","Tap a player when they go out. Add shot-at or moved-to if you saw it.")}
  <div class="card"><h2>Tally</h2>
    <p class="muted">Point sheet · ${LAYOUTS[S.layoutKey].name}</p>
    <button class="btn" onclick="addOut()">Mark out</button>
    ${(S.tally||[]).map((x,i)=>`<div>${i+1}. ${x}</div>`).join("")||"<p class='muted'>No outs yet.</p>"}
  </div>`;
}
window.addOut=()=>{S.tally=[...S.tally,"Player out · "+(LAYOUTS[S.layoutKey].name)];save(S);render()}

function scout(){
  const L=S.left,R=S.right;
  return `${tip("scout","Left pit vs right pit. Tendency is YOUR film read. Sim bar is a training aid, not a prediction.")}
  <div class="pit">
    ${pitCard("left",L,"OPPONENT (LEFT)","var(--red)")}
    ${pitCard("right",R,"OPPONENT (RIGHT)","var(--blue)")}
  </div>
  <div class="row" style="margin:8px 0">
    <button class="chip ${S.rolesOn?"on":""}" onclick="set({rolesOn:!S.rolesOn})">Roles: ${S.rolesOn?"on":"off"}</button>
    <button class="btn" onclick="playPath()">Play break</button>
    <button class="chip ${S.shotOn?"on":""}" onclick="set({shotOn:!S.shotOn})">Shot lanes: ${S.shotOn?"on":"off"}</button>
  </div>
  <div class="field-wrap">${fieldSVG({both:true})}</div>
  <div class="card">
    <h2>Matchup & Sim</h2>
    <div class="bar"><i style="width:44%;background:var(--red)"></i><i style="width:56%;background:var(--blue)"></i></div>
    <div class="row muted"><span>${L.name} 44%</span><span class="grow"></span><span>56% ${R.name}</span></div>
    <p>Plan read: base vs snake · expected survivors ≈ 2.3 v 2.6 (heuristic model — a read, not a prediction).</p>
    <div class="row">
      <span class="chip">Snake front 11%</span><span class="chip">Snake 39%</span>
      <span class="chip">Center/50 25%</span><span class="chip">Dorito 25%</span>
    </div>
    <div class="who" style="margin-top:10px">
      <div><b>${L.name} — who goes where</b><div>1 snake MW<br>2 GP<br>3 MT 50<br>4 fwd MD<br>5 C lane</div></div>
      <div><b>${R.name} — who goes where</b><div>6 deep snake run<br>7 snake MW<br>8 GP<br>9 tree<br>10 MD hold</div></div>
    </div>
  </div>
  <div class="card">
    <h2>${L.name} — anticipate</h2>
    <p><b>Likely:</b> Balanced wire-to-wire — they spread and play position.</p>
    <p><b>Tells at the line:</b> Even body weighting. Shooters set to lane the middle.</p>
    <p><b>Your counter:</b> Win one wire first. Take the tower to choke the cross.</p>
  </div>
  <div class="card">
    <h2>${R.name} — anticipate</h2>
    <p><b>Likely:</b> Snake stack / runner — they overload the bottom.</p>
    <p><b>Tells at the line:</b> A body cheats toward snake. Quiet gun off the break is the runner.</p>
    <p><b>Your counter:</b> Take GP first and lane the snake. Deny the crawl.</p>
  </div>
  <div class="card">
    <h2>Counter-picker</h2>
    <div class="row">${["Ahead","Even","Must-score"].map(x=>`<button class="chip ${S.matchState===x?"on":""}" onclick="set({matchState:'${x}'})">${x}</button>`).join("")}</div>
    <p class="muted">If you are ${L.name} vs ${R.name}'s likely ${R.tend} break. Heuristic rank.</p>
    ${[["Snake Stack",54],["Dorito Flood",49],["Blitz",47],["Balanced Break",46],["Conservative",46]].map((r,i)=>`<div class="row"><span>${i+1}. ${r[0]}</span><span class="grow"></span><b>${r[1]}%</b></div>`).join("")}
  </div>
  <div class="card">
    <h2>Division scout board</h2>
    <p class="muted">CIN · Semi-Pro X-Ball · tap = right pit · double-tap = left pit</p>
    <table class="table"><tr><th>#</th><th>Team</th><th>REG</th><th>TEND</th><th>★</th></tr>
    ${TEAMS.map((t,i)=>`<tr onclick="loadPit('${t.name}',${i})" >
      <td>${i+1}</td><td>${t.name}</td><td>${t.reg}</td><td>${t.tend}</td><td>${"★".repeat(t.threat)}</td></tr>`).join("")}
    </table>
  </div>`;
}
function pitCard(side,T,label,color){
  return `<div class="card" style="border-color:${color}">
    <div class="muted">${label}</div>
    <h2>${T.name} <small class="muted">US ${T.pts} pts</small></h2>
    <select onchange="S.${side}.name=this.value;save(S);render()">
      ${TEAMS.map(t=>`<option ${t.name===T.name?"selected":""}>${t.name}</option>`).join("")}
    </select>
    <label>TENDENCY (YOUR FILM READ)</label>
    <div class="row">${["Snake","Balanced","Dorito"].map(x=>`<button class="chip ${T.tend===x?"on":""}" onclick="S.${side}.tend='${x}';save(S);render()">${x}</button>`).join("")}</div>
    <label>THREAT</label><div>${stars(T.threat,side)}</div>
    <label>NOTES</label>
    <textarea onchange="S.${side}.notes=this.value;save(S)" placeholder="break tendencies, key players, snake runner…">${T.notes||""}</textarea>
  </div>`;
}
window.loadPit=(name)=>{
  const t=TEAMS.find(x=>x.name===name); if(!t) return;
  S.right={...S.right,name:t.name,pts:t.pts,tend:t.tend==="Snake"?"Snake":t.tend==="Dorito"?"Dorito":"Balanced",threat:t.threat};
  save(S);render();
};

function sightlines(){
  return `<div class="card"><h2>Sightlines</h2><p class="muted">Clear shot if the line does not clip a bunker footprint.</p></div>
  <div class="field-wrap">${fieldSVG({static:true})}</div>`;
}

function classesPage(){
  const join = S.classes.find(c=>c.code.toLowerCase()===(S.joinCode||"").trim().toLowerCase());
  return `${tip("class","Staff creates a class and gets a code. Players join with that code. No account needed to join.")}
  <div class="card">
    <h2>Join class</h2>
    <label>Code</label>
    <input value="${S.joinCode||""}" onchange="S.joinCode=this.value;save(S)" placeholder="GL-7K2M"/>
    <button class="btn ghost" style="margin-top:8px" onclick="render()">Look up</button>
    ${join?formBox(join): (S.joinCode?`<p class="warn">No open class with that code on this device.</p>`:"")}
  </div>
  <div class="card">
    <h2>Staff classes</h2>
    ${staffed()?`
      <label>New class title</label>
      <input value="${S.newClassTitle||""}" onchange="S.newClassTitle=this.value;save(S)"/>
      <button class="btn" style="margin-top:8px" onclick="makeClass()">New class</button>
    `:`<p class="warn">Staff login required to create a class.</p><button class="btn" onclick="set({entered:false,mode:'login'})">Staff log in</button>`}
    ${(S.classes||[]).map(c=>`<div class="card" style="margin-top:8px">
      <b>${c.title}</b> · <code>${c.code}</code>
      <div class="muted">Share ?c=${c.code} · ${c.open?"open":"closed"}</div>
      <div>Responses: ${S.responses.filter(r=>r.code===c.code).length}</div>
      ${S.responses.filter(r=>r.code===c.code).map(r=>`<div class="muted">${r.name} · ${r.wire} · ${r.exp}</div>`).join("")}
    </div>`).join("")||"<p class='muted'>No classes yet.</p>"}
  </div>`;
}
function formBox(c){
  return `<div style="margin-top:10px">
    <p>Joining <b>${c.title}</b></p>
    <label>Name</label><input id="fn"/>
    <label>Contact</label><input id="fc" placeholder="phone or email"/>
    <label>Experience</label>
    <select id="fe"><option>New</option><option>Rec</option><option>Division</option><option>Pro-semi</option></select>
    <label>Preferred wire</label>
    <select id="fw"><option>Snake</option><option>Dorito</option><option>Center</option><option>Flex</option><option>Back</option></select>
    <label>Notes</label><textarea id="ft"></textarea>
    <label><input type="checkbox" id="fa"/> Training sign-in form</label>
    <button class="btn" style="margin-top:8px" onclick="submitForm('${c.code}')">Submit</button>
  </div>`;
}
window.makeClass=()=>{
  if(!staffed()) return;
  const code="GL-"+Math.random().toString(36).slice(2,6).toUpperCase();
  S.classes=[{id:code,code,title:S.newClassTitle||"Clinic",open:true},...S.classes];
  save(S);render();
};
window.submitForm=(code)=>{
  const name=document.getElementById("fn").value.trim();
  if(!name){alert("Name is required.");return}
  if(!document.getElementById("fa").checked){alert("Check the sign-in box.");return}
  S.responses=[{code,name,contact:document.getElementById("fc").value,exp:document.getElementById("fe").value,wire:document.getElementById("fw").value,notes:document.getElementById("ft").value},...S.responses];
  save(S);render();
};

function leaguePage(){
  if(!staffed()) return `<div class="card"><h2>League</h2><p class="warn">Staff login required.</p><button class="btn" onclick="set({entered:false,mode:'login'})">Staff log in</button></div>`;
  return `${tip("lg","Admin groups for ops texts. Only message people who agreed to league updates.")}
  <div class="card">
    <h2>Groups</h2>
    <div class="row">
      <input id="ng" placeholder="New group name" style="flex:1"/>
      <button class="btn" onclick="addGroup()">Add group</button>
    </div>
    ${S.groups.map(g=>`<div class="card" style="margin-top:8px">
      <div class="row"><b>${g.name}</b><span class="grow"></span>
        <button class="btn ghost" onclick="delGroup('${g.id}')">Delete group</button></div>
      ${(g.members||[]).map((m,i)=>`<div class="row"><span>${m.name} · ${m.phone||m.email||""}</span>
        <button class="chip" onclick="delMem('${g.id}',${i})">Remove</button></div>`).join("")}
      <div class="row">
        <input id="mn-${g.id}" placeholder="Name"/>
        <input id="mp-${g.id}" placeholder="Phone or email"/>
        <button class="btn ghost" onclick="addMem('${g.id}')">Add member</button>
      </div>
    </div>`).join("")}
  </div>
  <div class="card">
    <h2>Blast</h2>
    <textarea onchange="S.blastBody=this.value;save(S)" placeholder="Pit gate opens 8:00">${S.blastBody||""}</textarea>
    <p class="muted">Sends as a logged blast + copies text for the phone Messages app. Only people on these lists.</p>
    <button class="btn" onclick="sendBlast()">Send text blast</button>
    ${(S.blasts||[]).map(b=>`<div class="muted">${b.at} · ${b.n} people · ${b.body}</div>`).join("")}
  </div>`;
}
window.addGroup=()=>{
  const n=document.getElementById("ng").value.trim(); if(!n) return;
  S.groups=[...S.groups,{id:"g"+Date.now(),name:n,members:[]}];save(S);render();
};
window.delGroup=(id)=>{S.groups=S.groups.filter(g=>g.id!==id);save(S);render()}
window.addMem=(id)=>{
  const name=document.getElementById("mn-"+id).value.trim();
  const phone=document.getElementById("mp-"+id).value.trim();
  if(!name) return;
  S.groups=S.groups.map(g=>g.id===id?{...g,members:[...g.members,{name,phone}]}:g);save(S);render();
};
window.delMem=(id,i)=>{S.groups=S.groups.map(g=>g.id===id?{...g,members:g.members.filter((_,k)=>k!==i)}:g);save(S);render()}
window.sendBlast=()=>{
  const body=clean(S.blastBody||"");
  if(!body){alert("Write the update first.");return}
  const rec=[];
  S.groups.forEach(g=>g.members.forEach(m=>{if(m.phone) rec.push(m.phone)}));
  S.blasts=[{at:new Date().toLocaleString(),n:rec.length,body},...S.blasts];
  save(S);
  if(rec.length && window.gridlockShare){window.gridlockShare(body+"\n"+rec.join(", "), "GRIDLOCK league blast");}
  else {prompt("Copy this blast", body+"\n"+rec.join(", "));}
  render();
};

function morePage(){
  const items=[["walk","Walk"],["lineups","Lineups"],["movement","Movement"],["assess","Assess"],["codes","Codes"],["stats","Bunker stats"],["team","Team"],["messages","Messages"],["classes","Classes"],["league","League"],["nexus","Nexus"]];
  const body={
    walk:`<div class="card"><h2>Walk</h2><p>Notes for ${LAYOUTS[S.layoutKey].name}.</p><textarea placeholder="Snake mouth is hot. GP first."></textarea></div>`,
    lineups:`<div class="card"><h2>Lineups</h2>${S.roster.map(p=>`<div>${p.num} ${p.name} · P ${p.p} · S ${p.s}</div>`).join("")}</div>`,
    movement:`<div class="card"><h2>Movement</h2><p class="muted">Bunker-to-bunker after the break. Feeds bunker stats.</p></div><div class="field-wrap">${fieldSVG({static:true})}</div>`,
    assess:`<div class="card"><h2>Assess</h2><p class="muted">Grade a player after the point.</p></div>`,
    codes:`<div class="card"><h2>Codes</h2><p>Team code words for this event.</p></div>`,
    stats:`<div class="card"><h2>Bunker stats</h2><p class="muted">Visits / shots / holds / elims from tally + movement.</p></div><div class="field-wrap">${fieldSVG({static:true})}</div>`,
    team:`<div class="card"><h2>Team</h2>${S.roster.map(p=>`<div>${p.num} ${p.name} · ${p.p}</div>`).join("")}<p class="muted">Bunker calls show on the layout.</p></div><div class="field-wrap">${fieldSVG({static:true})}</div>`,
    messages:`<div class="card"><h2>Messages</h2>
      ${(S.messages||[]).map(m=>`<div>${m}</div>`).join("")}
      <input id="md" placeholder="Message the squad"/>
      <button class="btn" style="margin-top:8px" onclick="S.messages=[...S.messages,document.getElementById('md').value];save(S);render()">Send</button></div>`,
    classes: classesPage(),
    league: leaguePage(),
    nexus:`<div class="card"><h2>Nexus</h2>
      <p>Signed in as ${S.email||"guest"} (${S.role})</p>
      <button class="btn ghost" onclick="set({showTutorial:true,tab:'playbook',more:'classes'})">Show tutorial again</button>
      <button class="btn ghost" onclick="set({entered:false,role:'guest',email:''})">Staff sign out</button>
      <p class="muted">GRIDLOCK System · powered by UPRA</p></div>`
  };
  return `<div class="row">${items.map(([k,n])=>`<button class="chip ${S.more===k?"on":""}" onclick="set({more:'${k}'})">${n}</button>`).join("")}</div>
  ${body[S.more]||""}`;
}

function shell(){
  const tabs=[["playbook","Playbook"],["tally","Tally"],["scout","Scout"],["sightlines","Sightlines"],["more","More"]];
  const page={playbook:playbook,tally:tally,scout:scout,sightlines:sightlines,more:morePage}[S.tab]();
  const tut = S.showTutorial?`<div class="card"><h2>Tutorial</h2>
    <p>Playbook = the call. Tally = who went out. Scout = the other pit. Classes = clinic sign-in. League = staff groups.</p>
    <button class="btn" onclick="set({showTutorial:false})">Start coaching</button></div>`:"";
  return `<div class="app">
    <div class="top">
      <div class="brand">GRIDLOCK<small>SYSTEM · COACH</small></div>
      <div class="grow"></div>
      <span class="muted">${staffed()?"Staff":"Guest"}</span>
    </div>
    <div class="main">${tut}${page}
      <p class="muted" style="margin-top:24px">GRIDLOCK System · powered by UPRA · officials govern the live call</p>
    </div>
    <div class="tabs">${tabs.map(([k,n])=>`<button class="${S.tab===k?"on":""}" onclick="set({tab:'${k}'})">${n}</button>`).join("")}</div>
  </div>`;
}

function render(){
  document.getElementById("root").innerHTML = S.entered ? shell() : promo();
}
render();
</script>
<script src="native.js"></script>
</body>
</html>
