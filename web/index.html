function morePage(){
  if(!S.more){
    return MORE_GROUPS.map(([title,rows])=>sec(title,`<div class="list">
      ${rows.map(([k,n,d])=>`<button class="list__row" onclick="set({more:'${k}'})">
        <span class="list__body"><span class="list__name">${n}</span><span class="list__desc">${d}</span></span>
        ${moreCount(k)}<span class="list__go">›</span>
      </button>`).join("")}
    </div>`)).join("");
  }
  return `<button class="btn btn--quiet" style="align-self:flex-start" onclick="set({more:null})">‹ More</button>
    ${moreBody(S.more)}`;
}
function moreCount(k){
  const n={classes:(S.classes||[]).length, league:S.groups.reduce((a,g)=>a+(g.members||[]).length,0),
           messages:(S.messages||[]).length, team:(S.roster||[]).length, lineups:(S.roster||[]).length}[k];
  return n?`<span class="list__count">${n}</span>`:"";
}
function moreBody(k){
  const layoutName=curLayout().name;
  const roster=S.roster||[];
  const rosterList=`<div class="assigns">${roster.map(p=>`<div class="assign">
      <span class="assign__n" style="background:var(--panel-2);color:var(--ink)">${p.num}</span>
      <span class="assign__body"><span class="assign__job">${esc(p.name)}</span>
      <span class="assign__who">P ${esc(p.p)} · S ${esc(p.s)}</span></span>
    </div>`).join("")}</div>`;

  if(k==="walk"){
    const notes=walkNotes(), bl=curLayout().bunkers;
    return sec("Walk", `<p class="lede">What you noticed standing on it, against the bunker or the wire you
      noticed it on. Notes stay with this field.</p>
      <div class="fld"><label>Where</label>
        <select id="wkWhere">
          ${WIRES.map(w=>`<option>${esc(w)}</option>`).join("")}
          ${bl.map(b=>`<option value="${esc(callOf(b)+" · "+b.id)}">${esc(callOf(b))} · ${esc(b.id)}</option>`).join("")}
        </select></div>
      <div class="fld"><label>Note</label>
        <textarea id="wkNote" placeholder="Snake mouth is hot. GP first off the tape."></textarea></div>
      <button class="btn btn--block" onclick="addWalk()">Add note</button>`, layoutName)
    + sec("On the walk", notes.length
      ? `<div class="assigns">${notes.map((n,i)=>`<div class="assign">
          <span class="assign__body"><span class="assign__job">${esc(n.note)}</span>
          <span class="assign__who">${esc(n.where)}</span></span>
          <button class="btn btn--danger" onclick="delWalk(${i})">Remove</button></div>`).join("")}</div>`
      : `<div class="empty">Nothing noted on this field yet.</div>`,
      notes.length ? notes.length+(notes.length===1?" note":" notes") : layoutName);
  }
  if(k==="lineups"){
    const pt=S.point||1, line=lineupFor(pt), five=fiveFor(pt);
    const prev=Object.keys(S.lineups||{}).map(Number).filter(n=>n<pt).sort((a,b)=>b-a)[0];
    if(!roster.length) return sec("Lineups",
      `<div class="empty">No roster yet. Add your squad under Team, then set who is on the point.</div>`,
      "Point "+pt);
    const slots=`<div class="assigns">${five.map((pl,i)=>`<div class="assign">
        <span class="assign__n">${i+1}</span>
        <span class="assign__body">
          <select onchange="setSlot(${i},this.value)">
            <option value=""${pl?"":" selected"}>— empty —</option>
            ${roster.map(r=>`<option${pl&&pl.name===r.name?" selected":""}>${esc(r.name)}</option>`).join("")}
          </select>
          <span class="assign__who">${pl?esc("#"+pl.num+" · P "+(pl.p||"—")+" · S "+(pl.s||"—")):"no one on this slot"}</span>
        </span>
      </div>`).join("")}</div>`;
    return sec("Lineups", `<p class="lede">Who is on this point. Slot 1 to 5 are the five jobs on Playbook,
      in the same order — set a lineup here and the break is directed at these players.</p>
      ${slots}
      <div class="toggles">
        <button class="btn btn--quiet" onclick="fillLineup('roster')">Fill from roster</button>
        ${prev?`<button class="btn btn--quiet" onclick="fillLineup(${prev})">Same as point ${prev}</button>`:""}
        ${line.length?`<button class="btn btn--danger" onclick="clearLineup()">Clear</button>`:""}
      </div>`, "Point "+pt)
    + (Object.keys(S.lineups||{}).length?sec("Earlier points",
        `<div class="assigns">${Object.keys(S.lineups).map(Number).sort((a,b)=>b-a).map(n=>`<div class="assign">
          <span class="assign__n" style="background:var(--panel-2);color:var(--ink)">${n}</span>
          <span class="assign__body"><span class="assign__job">${esc(lineupFor(n).filter(Boolean).join(", ")||"—")}</span>
          <span class="assign__who">${lineupFor(n).filter(Boolean).length} on the point</span></span>
        </div>`).join("")}</div>`, "Logged"):"");
  }
  if(k==="team"){
    const list=curLayout().bunkers, calls=bunkerCalls();
    const named=Object.keys(calls);
    const field=(i,f,ph,val,cls)=>`<input class="${cls||""}" value="${esc(val)}" placeholder="${esc(ph)}"
        onchange="editPlayer(${i},'${f}',this.value)"/>`;
    const editor=`<p class="lede">Your squad. Playbook names the five off this list, Tally logs outs against
      it, and Movement and Assess pick players from it — so it is worth getting right once.</p>
      ${roster.length?`<div class="rost">${roster.map((pl,i)=>`<div class="rost__p">
          ${field(i,"num","#",pl.num,"rost__num")}
          ${field(i,"name","Name",pl.name)}
          <button class="btn btn--danger" onclick="delPlayer(${i})">Remove</button>
          <div class="rost__ps">
            <label><span class="note">Primary</span>${field(i,"p","snake MW",pl.p)}</label>
            <label><span class="note">Secondary</span>${field(i,"s","GP",pl.s)}</label>
          </div>
        </div>`).join("")}</div>`
        :`<div class="empty">No players yet. Add your five — their names then show up on Playbook,
          Tally, Movement and Assess.</div>`}
      <div class="rost__add">
        <input id="rNum" class="rost__num" placeholder="#" inputmode="numeric"/>
        <input id="rName" placeholder="Name"/>
        <div class="rost__ps">
          <label><span class="note">Primary</span><input id="rP" placeholder="snake MW"/></label>
          <label><span class="note">Secondary</span><input id="rS" placeholder="GP"/></label>
        </div>
      </div>
      <button class="btn btn--block" onclick="addPlayer()">Add player</button>`;
    return sec("Team", editor, roster.length+(roster.length===1?" player":" players"))
    + sec("Bunker calls", `<p class="lede">Give a bunker your team's name for it. The call replaces the official code on every field in the app.</p>
      <div class="who2">
        <label style="display:flex;flex-direction:column;gap:4px"><span class="note">Bunker</span>
          <select id="bcId">${list.map(b=>`<option value="${esc(b.id)}">${esc(b.n)} · ${esc(b.id)}</option>`).join("")}</select></label>
        <label style="display:flex;flex-direction:column;gap:4px"><span class="note">Call it</span>
          <input id="bcName" placeholder="Home"/></label>
      </div>
      <button class="btn btn--block" onclick="setCall()">Save call</button>
      ${named.length?`<div class="assigns">${named.map(id=>{
        const b=list.find(x=>x.id===id);
        return `<div class="assign"><span class="assign__body">
          <span class="assign__job">${esc(calls[id])}</span>
          <span class="assign__who">${b?esc(b.n+" · "+b.id):esc(id)}</span></span>
          <button class="btn btn--danger" onclick="clearCall('${esc(id)}')">Clear</button></div>`;
      }).join("")}</div>`:`<div class="empty">No calls yet. The official codes show until you set one.</div>`}
      <div class="field-wrap">${fieldSVG({static:true})}</div>`,
      named.length?named.length+" named":layoutName);
  }
  if(k==="movement"){
    const list=curLayout().bunkers;
    const mv=layoutMoves();
    const opt=b=>`<option value="${esc(b.id)}">${esc(callOf(b))} · ${esc(b.id)}</option>`;
    const who=roster.length?roster.map(p=>`<option>${esc(p.name)}</option>`).join("")
                           :["1","2","3","4","5"].map(n=>`<option>Player ${n}</option>`).join("");
    return sec("Log a rotation", `<p class="lede">Who moved, and bunker to bunker. Every rotation counts as a move into the new bunker on Bunker stats.</p>
      <div class="fld"><label>Player</label><select id="mvWho">${who}</select></div>
      <div class="who2">
        <div class="fld"><label>From</label><select id="mvFrom">${list.map(opt).join("")}</select></div>
        <div class="fld"><label>To</label><select id="mvTo">${list.map(opt).join("")}</select></div>
      </div>
      <button class="btn btn--block" onclick="logMove()">Log the move</button>`, "Point "+(S.point||1))
    + sec("On the field", `<div class="field-wrap">${fieldSVG({static:true,moves:true})}</div>
      ${mv.length?`<p class="note">Green arrows are logged rotations, newest first. Showing up to 40.</p>`
                 :`<div class="empty">No rotations logged on this layout yet.</div>`}`, layoutName)
    + (mv.length?sec("Rotations", `<div class="assigns">
        ${mv.slice(0,30).map((m,i)=>{
          const a=list.find(b=>b.id===m.from), b2=list.find(b=>b.id===m.to);
          return `<div class="assign">
            <span class="assign__n" style="background:var(--ok);color:#06210f;font-size:11px">${m.pt}</span>
            <span class="assign__body"><span class="assign__job">${esc(m.who)}</span>
            <span class="assign__who">${esc(a?callOf(a):m.from)} → ${esc(b2?callOf(b2):m.to)}</span></span>
            <button class="btn btn--danger" onclick="undoMove(${(S.moves||[]).indexOf(m)})">Undo</button>
          </div>`;
        }).join("")}</div>`, mv.length+" logged"):"");
  }
  if(k==="stats"){
    const list=curLayout().bunkers, t=bunkerTraffic();
    const rows=Object.entries(t).map(([id,v])=>({b:list.find(x=>x.id===id), id, ...v}))
      .filter(r=>r.b).sort((a,b)=>(b.outs+b.visits)-(a.outs+a.visits));
    return sec("Bunker stats", rows.length
      ? `<div class="facts">
          <span class="fact"><b>${rows.length}</b><span>Bunkers hit</span></span>
          <span class="fact"><b>${rows.reduce((n,r)=>n+r.outs,0)}</b><span>Outs</span></span>
          <span class="fact"><b>${rows.reduce((n,r)=>n+r.visits,0)}</b><span>Moves in</span></span>
        </div>
        <div class="field-wrap">${fieldSVG({static:true,heat:true})}</div>
        <div class="tblwrap"><table class="tbl">
          <thead><tr><th>Bunker</th><th>Code</th><th>Outs</th><th>Moves in</th></tr></thead>
          <tbody>${rows.map(r=>`<tr><td>${esc(callOf(r.b))}</td><td class="num">${esc(r.id)}</td>
            <td class="num">${r.outs}</td><td class="num">${r.visits}</td></tr>`).join("")}</tbody>
        </table></div>`
      : `<p class="lede">Outs and bunker traffic, from the tally sheet.</p>
         <div class="field-wrap">${fieldSVG({static:true})}</div>
         <div class="empty">Nothing logged yet. Set <b>shot at</b> or <b>moved to</b> on an out in Tally, or log a rotation in Movement, and it lands here.</div>`,
      layoutName);
  }
  if(k==="assess"){
    const all=S.assessments||[];
    const who=roster.length?roster.map(p=>`<option>${esc(p.name)}</option>`).join("")
                           :["1","2","3","4","5"].map(n=>`<option>Player ${n}</option>`).join("");
    const names=[...new Set(all.map(a=>a.who))];
    const avg=n=>{const g=all.filter(a=>a.who===n); return (g.reduce((t,a)=>t+a.score,0)/g.length).toFixed(1);};
    return sec("Grade a player", `<p class="lede">After the point, not during it. The grade stays with the roster.</p>
      <div class="fld"><label>Player</label><select id="asWho">${who}</select></div>
      <div class="fld"><label>Score</label>
        <select id="asScore">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} — ${["","poor","below","solid","strong","outstanding"][n]}</option>`).join("")}</select></div>
      <div class="fld"><label>Note</label><textarea id="asNote" placeholder="Read the snake early, held the corner."></textarea></div>
      <button class="btn btn--block" onclick="saveAssess()">Save grade</button>`, "Point "+(S.point||1))
    + (names.length?sec("Averages", `<div class="facts">
        ${names.map(n=>`<span class="fact"><b>${avg(n)}</b><span>${esc(n)}</span></span>`).join("")}
      </div>`, names.length+" graded"):"")
    + (all.length?sec("Grades", `<div class="assigns">
        ${all.slice(0,30).map((a,i)=>`<div class="assign">
          <span class="assign__n" style="background:${a.score>=4?"var(--ok)":a.score<=2?"var(--red)":"var(--panel-2)"};color:${a.score>=4?"#06210f":"#fff"}">${a.score}</span>
          <span class="assign__body"><span class="assign__job">${esc(a.who)}</span>
          <span class="assign__who">Point ${a.pt}${a.note?" · "+esc(a.note):""}</span></span>
          <button class="btn btn--danger" onclick="undoAssess(${i})">Undo</button>
        </div>`).join("")}</div>`, all.length+" total")
      : sec("Grades", `<div class="empty">No grades yet.</div>`));
  }
  if(k==="codes"){
    const codes=S.codes||[];
    return sec("Codes", `<p class="lede">The word and what it means. A list of words on its own is no use to
      the player who joined last week.</p>
      ${codes.length?`<div class="assigns">${codes.map((c,i)=>`<div class="assign">
          <span class="assign__body">
            <input value="${esc(c.word)}" onchange="editCode(${i},'word',this.value)" style="font-weight:700"/>
            <input value="${esc(c.means)}" placeholder="what it means" onchange="editCode(${i},'means',this.value)"/>
          </span>
          <button class="btn btn--danger" onclick="delCode(${i})">Remove</button></div>`).join("")}</div>`
        :`<div class="empty">No code words yet.</div>`}
      <div class="who2">
        <label style="display:flex;flex-direction:column;gap:4px"><span class="note">Word</span>
          <input id="cdWord" placeholder="Buzzer"/></label>
        <label style="display:flex;flex-direction:column;gap:4px"><span class="note">Means</span>
          <input id="cdMeans" placeholder="Go on the horn"/></label>
      </div>
      <button class="btn btn--block" onclick="addCode()">Add code word</button>`,
      codes.length?codes.length+(codes.length===1?" word":" words"):layoutName);
  }
  if(k==="messages") return sec("Messages",
    ((S.messages||[]).length?`<div class="assigns">${S.messages.map(m=>`<div class="assign">
      <span class="assign__body"><span class="assign__job">${esc(m)}</span></span></div>`).join("")}</div>`
      :`<div class="empty">No messages yet.</div>`)
    + `<div class="btnrow"><input id="md" placeholder="Message the squad" class="grow"/>
       <button class="btn" onclick="sendMsg()">Send</button></div>`, (S.messages||[]).length+" notes");
  if(k==="classes") return classesPage();
  if(k==="league") return leaguePage();
  if(k==="nexus") return sec("Nexus", `<div class="panel">
      <div class="kv">
        <div class="kv__row"><span class="kv__k">Signed in as</span><span class="kv__v">${esc(S.email||"guest")} · ${esc(S.role)}</span></div>
        <div class="kv__row"><span class="kv__k">Event</span><span class="kv__v">${esc(layoutName)}</span></div>
        <div class="kv__row"><span class="kv__k">Where your data lives</span><span class="kv__v">On this device only. Nothing is sent to a server, and your password is stored salted and hashed, never in the clear.</span></div>
      </div>
    </div>
    <button class="btn btn--ghost btn--block" onclick="set({showTutorial:true,tab:'playbook',more:null})">Show the tutorial again</button>
    <button class="btn btn--ghost btn--block" onclick="set({entered:false,role:'guest',email:''})">Staff sign out</button>
    <p class="note">GRIDLOCK System · powered by UPRA</p>`);
  return "";
}
window.sendMsg = () => {
  const el=document.getElementById("md"); const v=(el.value||"").trim();
  if(!v) return;
  S.messages=[...(S.messages||[]),clean(v)]; save(S); render();
};

/* ============================================================
   Shell
   ============================================================ */
function shell(){
  const tabs=[["playbook","Playbook"],["tally","Tally"],["scout","Scout"],["sightlines","Sightlines"],["more","More"]];
  const page={playbook,tally,scout,sightlines,more:morePage}[S.tab]();
  const tut = S.showTutorial?`<div class="panel">
    <h3 class="panel__title">How it works</h3>
    <div class="kv">
      <div class="kv__row"><span class="kv__k">Playbook</span><span class="kv__v">The call. Pick the break, play it, read the five jobs.</span></div>
      <div class="kv__row"><span class="kv__k">Tally</span><span class="kv__v">Tap a player the moment he goes out.</span></div>
      <div class="kv__row"><span class="kv__k">Scout</span><span class="kv__v">The other pit — tendency, threat and your counter.</span></div>
      <div class="kv__row"><span class="kv__k">More</span><span class="kv__v">The walk, the team, clinics and league ops.</span></div>
    </div>
    <button class="btn btn--block" onclick="set({showTutorial:false})">Start coaching</button>
  </div>`:"";

  const crumb = S.tab==="more" && S.more ? ` <span class="ctx__sep">·</span> <b>${MORE_TITLES[S.more]||""}</b>` : "";

  return `<div class="app">
    <header class="hdr">
      <div class="hdr__top">
        <div class="brand">GRIDLOCK<small>SYSTEM · COACH</small></div>
        <span class="grow"></span>
        <span class="who-chip ${staffed()?"staff":""}">${staffed()?"Staff":"Guest"}</span>
      </div>
      ${Object.keys(LAYOUTS).length>1
        ? `<button class="ctx" onclick="cycleEvent()">
        <span class="ctx__line"><b>${esc(curLayout().name)}</b> <span class="ctx__sep">·</span> ${esc(BREAKS[S.script].name)}${crumb}</span>
        <span class="ctx__caret">CHANGE ▾</span>
      </button>`
        : `<div class="ctx">
        <span class="ctx__line"><b>${esc(curLayout().name)}</b> <span class="ctx__sep">·</span> ${esc(BREAKS[S.script].name)}${crumb}</span>
      </div>`}
    </header>
    <main class="main">${tut}${page}
      <p class="note">GRIDLOCK System · powered by UPRA · officials govern the live call</p>
    </main>
    <nav class="tabs">${tabs.map(([k,n])=>`<button class="${S.tab===k?"on":""}" onclick="set({tab:'${k}',more:null})"><i></i>${n}</button>`).join("")}</nav>
  </div>`;
}
window.cycleEvent = () => {
  const keys=Object.keys(LAYOUTS);
  set({layoutKey:keys[(keys.indexOf(S.layoutKey)+1)%keys.length]});
};

function render(){
  document.getElementById("root").innerHTML = S.entered ? shell() : promo();
}
render();
</script>
<script src="native.js"></script>
</body>
</html>
