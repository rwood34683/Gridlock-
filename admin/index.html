<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="description" content="Gridlock Admin — the season across every coach, for the whole year."/>
<meta name="theme-color" content="#0b0c0d"/>
<title>Gridlock · Admin</title>
<style>
:root{
  --bg:#0b0c0d; --sunk:#0f1011; --panel:#161818; --panel-2:#1e2121;
  --line:#26292a; --line-lit:#3a3f40;
  --accent:#ad1515; --accent-deep:#8f1010; --accent-lit:#e5252a;
  --ink:#efedeb; --mute:#ff5a52; --dim:#f04a44;
  --red:#e5342f; --blue:#3d8bff; --ok:#3ecf8e; --warn:#e0a33a;
  --t-hero:30px; --t-xl:21px; --t-lg:17px; --t-md:15px; --t-sm:13px; --t-xs:11px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--t-md)/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{padding:0 max(16px,env(safe-area-inset-left)) 64px max(16px,env(safe-area-inset-right))}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--accent-lit)}
.wrap{max-width:1080px;margin:0 auto}
.hdr{position:sticky;top:0;z-index:5;background:#000;border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 14px) 0 12px;margin:0 calc(-1*max(16px,env(safe-area-inset-left))) var(--s5);
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.hdr .wrap{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.brand{font-size:var(--t-lg);font-weight:800;letter-spacing:.14em}
.brand small{display:block;margin-top:3px;font-size:9px;font-weight:700;letter-spacing:.3em;color:var(--accent-lit)}
.hdr__note{margin-left:auto;color:var(--dim);font-size:var(--t-xs);letter-spacing:.04em}
.hdr__note a{display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:0 var(--s2);font-size:var(--t-sm)}
.sec{margin-bottom:var(--s6)}
.sec__head{display:flex;align-items:baseline;gap:var(--s3);border-bottom:1px solid var(--line);padding-bottom:var(--s2);margin-bottom:var(--s4)}
.sec__eyebrow{font-size:var(--t-xs);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.sec__note{margin-left:auto;font-size:var(--t-xs);color:var(--dim)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4)}
.lede{color:var(--mute);font-size:var(--t-sm);line-height:1.5}
.note{color:var(--dim);font-size:var(--t-xs);line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);
  border-radius:var(--r-md);background:var(--accent);color:#fff;font-size:var(--t-md);font-weight:700}
.btn:active{background:var(--accent-deep)}
.btn--ghost{background:transparent;color:var(--ink);border:1px solid var(--line-lit)}
.btn--quiet{background:transparent;color:var(--mute);border:1px solid var(--line);min-height:44px;font-size:var(--t-sm)}
.btn--danger{background:transparent;color:var(--red);border:1px solid var(--line);min-height:44px;font-size:var(--t-xs);padding:0 var(--s3)}
.row{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}

/* Drop zone */
.drop{border:1.5px dashed var(--line-lit);border-radius:var(--r-lg);padding:var(--s6) var(--s4);text-align:center;
  background:var(--sunk);transition:border-color .12s,background .12s}
.drop.over{border-color:var(--accent-lit);background:rgba(173,21,21,.10)}
.drop h3{font-size:var(--t-lg);margin-bottom:var(--s2)}
.drop input[type=file]{display:none}

/* Loaded-season chips */
.seasons{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s4)}
.season{display:flex;align-items:center;gap:var(--s3);background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-md);padding:var(--s2) var(--s3);min-height:52px}
.season input{flex:1;min-width:0;background:var(--sunk);color:var(--ink);border:1px solid var(--line);
  border-radius:var(--r-sm);min-height:44px;padding:0 var(--s3);font:inherit;font-size:var(--t-sm)}
.season__meta{font-size:var(--t-xs);color:var(--dim);white-space:nowrap}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3)}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4)}
.tile__k{font-size:var(--t-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tile__v{font-size:var(--t-hero);font-weight:800;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.tile__sub{font-size:var(--t-xs);color:var(--dim);margin-top:4px}
.tile__v .win{color:var(--ok)} .tile__v .loss{color:var(--red)} .tile__v i{color:var(--dim);font-style:normal;font-weight:600}

/* Bars */
.bars{display:flex;flex-direction:column;gap:var(--s2)}
.bar{display:grid;grid-template-columns:130px 1fr 48px;align-items:center;gap:var(--s3);min-height:30px}
.bar__label{font-size:var(--t-sm);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar__track{background:var(--sunk);border-radius:var(--r-pill);height:14px;position:relative;overflow:hidden}
.bar__fill{position:absolute;top:0;left:0;height:100%;border-radius:var(--r-pill);background:var(--accent-lit)}
.bar__val{font-size:var(--t-sm);color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.bar:hover .bar__fill{background:#ff3b40}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
th,td{text-align:left;padding:10px var(--s3);border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:var(--t-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
tr:last-child td{border-bottom:0}
.win{color:var(--ok)} .loss{color:var(--red)}

details.cloud{margin-top:var(--s4);border:1px solid var(--line);border-radius:var(--r-md);padding:0 var(--s3)}
details.cloud summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-size:var(--t-sm);font-weight:700;color:var(--mute)}
details.cloud[open] summary{color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--s3)}
.fld label{font-size:var(--t-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.fld input,.fld select{background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);min-height:44px;padding:0 var(--s3);font:inherit;min-width:0;max-width:100%}
.admin-login{max-width:520px}.status{margin:var(--s3) 0;color:var(--mute);overflow-wrap:anywhere}.status.error{color:#ff8b87}
.admin-tabs{margin:var(--s5) 0}.admin-tabs [aria-selected=true]{border-color:var(--accent-lit);color:var(--ink)}
.user-list{display:grid;gap:var(--s3)}.user-card h3{font-size:var(--t-lg);overflow-wrap:anywhere}.user-meta{display:flex;flex-wrap:wrap;gap:var(--s3);margin:var(--s2) 0 var(--s4);font-size:var(--t-xs);color:var(--mute)}
.plan-form{display:grid;grid-template-columns:minmax(120px,1fr) minmax(180px,2fr) auto;gap:var(--s3);align-items:end}.plan-form .fld{margin:0}
.badge{display:inline-block;border:1px solid var(--line-lit);border-radius:var(--r-pill);padding:3px 8px;font-size:var(--t-xs);color:var(--mute)}
.section-actions{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-top:var(--s3)}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:2px solid var(--accent-lit);outline-offset:3px}
@media(max-width:620px){.plan-form{grid-template-columns:1fr}.hdr__note{margin-left:0}.season{flex-wrap:wrap}.season__meta{white-space:normal}.bar{grid-template-columns:110px 1fr 40px}}
.empty{color:var(--dim);text-align:center;padding:var(--s5);border:1px dashed var(--line);border-radius:var(--r-md)}
.foot{color:var(--dim);font-size:var(--t-xs);border-top:1px solid var(--line);padding-top:var(--s4);margin-top:var(--s6)}
</style>
</head>
<body>
<header class="hdr"><div class="wrap">
  <div class="brand">Gridlock<small>ADMIN · STAGING</small></div>
  <span class="hdr__note"><a href="/">Back to Gridlock</a></span>
</div></header>

<main class="wrap" id="root"></main>

<script>
"use strict";
/* Gridlock Admin Portal.
 *
 * A standalone dashboard. It reads the season copies the coach app writes
 * (Nexus > Save a copy: {"format":"gridlock.coach.copy", ... , "data":{...}})
 * and rolls the whole year up across every coach who sends one in.
 *
 * Manual exports remain browser-local. The configured cloud service verifies
 * the signed-in administrator before returning users or opted-in seasons.
 * Uploaded data and admin credentials remain in memory only. The Coach app
 * uploads seasons only when its owner enables League sync.
 */
const COPY_FORMAT = "gridlock.coach.copy";
// Separate manual imports from the older mixed-source cache. Cloud account
// records, tokens and uploaded seasons are never written to browser storage.
const LS = "gridlock.admin.manual.v2";
const CLOUD = Object.freeze({url:"https://tldgxtrvbzlnydlysdln.supabase.co",anon:"sb_publishable_06JZ1yePx_pl22MXZfVF2Q_ye_LQ0Os",fn:"gridlock-admin"});
const KNOWN_LAYOUTS = { lso:"Lone Star Open", mwo:"Midwest Open", tby:"Tampa Bay Open" };
const layoutName = k => Object.prototype.hasOwnProperty.call(KNOWN_LAYOUTS,k) ? KNOWN_LAYOUTS[k] : (k ? String(k).toUpperCase() : "—");

let seasons = load();   // Manual imports only: [{id, label, at, app, data}].
let cloudSeasons = [], users = [], caller = null, token = "", expiresAt = 0;
let epoch = 0, expiryTimer = null, activeTab = "users", busy = false;
let userPage = 1, userMore = false, seasonPage = 0, seasonMore = false;
let status = "", statusError = false;
let mfaPending = null;
const pending = new Set();
const allSeasons = () => {
  const cloud=token?cloudSeasons:[];
  return seasons.filter(s=>!cloud.some(c=>(s.seasonId&&s.seasonId===c.seasonId)||JSON.stringify(s.data)===JSON.stringify(c.data))).concat(cloud);
};

function load(){ try{ const rows=JSON.parse(localStorage.getItem(LS)); return Array.isArray(rows) ? rows.filter(s=>s&&typeof s==="object").map(s=>parseSeason(JSON.stringify({format:COPY_FORMAT,data:s.data,at:s.at,seasonId:s.seasonId}),s.label)).filter(s=>!s.error) : []; }catch(e){ return []; } }
function persist(){ try{ localStorage.setItem(LS, JSON.stringify(seasons));return true; }catch(e){status="These imports are only in memory: browser storage is full or unavailable. Keep your original files.";statusError=true;return false;} }

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function scalar(value,fallback=""){return typeof value==="string"?value:typeof value==="number"&&Number.isFinite(value)?String(value):fallback;}
function dateValue(value){return typeof value==="string"||typeof value==="number"&&Number.isFinite(value)?value:null;}
function dateText(value){value=dateValue(value);const d=new Date(value);return value!=null&&value!==""&&Number.isFinite(d.getTime())?d.toLocaleString():"—";}
function localDate(value){value=dateValue(value);const d=new Date(value);if(value==null||value===""||!Number.isFinite(d.getTime()))return "";return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}
function say(message,error=false){status=message;statusError=error;render();}
function clearCloud(message="Signed out. Cloud data has been cleared from this page."){
  ++epoch;for(const c of pending)c.abort();pending.clear();clearTimeout(expiryTimer);expiryTimer=null;
  token="";expiresAt=0;caller=null;users=[];cloudSeasons=[];busy=false;userPage=1;userMore=false;seasonPage=0;seasonMore=false;
  mfaPending=null;
  status=message;statusError=false;render();
}
function sessionExpired(){if(token&&Date.now()>=expiresAt){clearCloud("Your admin session expired. Sign in again.");return true;}return false;}

/* ---- ingest -------------------------------------------------------------- */
// A file may be the wrapped copy, or a bare state object. Accept both.
function parseSeason(text, label){
  let p; try{ p = JSON.parse(text); }catch(e){ return {error:"Not readable as JSON."}; }
  const data = (p && p.format === COPY_FORMAT && p.data) ? p.data
             : (p && (p.matches || p.calls || p.results || p.roster)) ? p
             : null;
  if(!data || typeof data!=="object" || Array.isArray(data)) return {error:"Not a Gridlock season copy."};
  // Uploaded files are untrusted. The dashboard needs only these records;
  // malformed collections and inherited property names cannot break a view.
  const clean={};
  for(const key of ["matches","results","calls","pens","roster"]){
    if(data[key]!=null&&!Array.isArray(data[key]))return {error:"A season collection is not a list."};
    if((data[key]||[]).length>50000)return {error:"A season collection is too large."};
    clean[key]=(data[key]||[]).filter(x=>x&&typeof x==="object"&&!Array.isArray(x)).map(x=>{
      const row={...x};for(const field of ["id","m","layout","vs","script","won"])if(field in row)row[field]=scalar(row[field]);row.watch=row.watch===true;return row;
    });
  }
  clean.breakCalls=Object.create(null);if(data.breakCalls&&typeof data.breakCalls==="object"&&!Array.isArray(data.breakCalls))for(const [key,value]of Object.entries(data.breakCalls))clean.breakCalls[key]=scalar(value);
  return { id: "s" + Date.now() + Math.random().toString(36).slice(2, 6), seasonId:typeof p.seasonId==="string"&&/^[a-f0-9]{32}$/i.test(p.seasonId)?p.seasonId:"",
           label: scalar(label,scalar(p.app,"Season")) || "Season", at: dateValue(p.at),
           scope: scalar(p.scope,"all"), data:clean };
}
function addSeason(text, label){
  const s = parseSeason(text, label);
  if(s.error) return s.error;
  const sig = x => x.seasonId || (x.label || "") + "|" + ((x.data.matches || []).map(m => m.id).join(","));
  const index=seasons.findIndex(x=>sig(x)===sig(s));
  if(index>=0){
    if(JSON.stringify(seasons[index].data)===JSON.stringify(s.data))return null;
    if(!confirm("This file contains a revised season already imported here. Replace the older import with these updated results?"))return "The older import was kept.";
    s.id=seasons[index].id;seasons[index]=s;persist();render();return null;
  }
  seasons.push(s); persist(); render(); return null;
}
window.__adminAdd = (text, label) => addSeason(text, label);   // for the suite
window.__adminSummary = () => summarize(allSeasons());
window.__adminReset = () => { seasons = []; persist(); render(); };
window.__adminCloudLoad = () => signIn();   // for the suite

/* ---- aggregate ----------------------------------------------------------- */
// A watched game is not one the coach played — it never counts toward a record.
const watched = (data, mid) => { const m = (data.matches || []).find(x => x.id === mid); return !!(m && m.watch); };

function summarize(list){
  const out = { coaches:list.length, events:new Set(), matches:0, played:0, wins:0, losses:0,
                breaks:0, penalties:0, calls:Object.create(null), byEvent:Object.create(null), byTeam:Object.create(null), byCoach:[] };
  for(const s of list){
    const d = s.data || {};
    const cwins = {}, coach = { label:s.label, at:s.at, matches:0, wins:0, losses:0, breaks:0 };
    (d.matches || []).forEach(m => { if(m.layout) out.events.add(m.layout);
      const ev = out.byEvent[m.layout] = out.byEvent[m.layout] || {matches:0,wins:0,losses:0,breaks:0,pens:0};
      if(!m.watch){ out.matches++; coach.matches++; ev.matches++; } });
    (d.results || []).forEach(r => { if(watched(d, r.m)) return;
      out.played++; const w = r.won === "us"; if(w) out.wins++; else out.losses++;
      if(w) coach.wins++; else coach.losses++;
      const m = (d.matches || []).find(x => x.id === r.m);
      if(m && m.layout){ const ev = out.byEvent[m.layout]; if(ev){ if(w) ev.wins++; else ev.losses++; } }
      // Record against the opponent named on the match.
      const vs = (m && m.vs) || null;
      if(vs){ const t = out.byTeam[vs] = out.byTeam[vs] || {wins:0,losses:0}; if(w) t.wins++; else t.losses++; } });
    (d.calls || []).forEach(c => { if(watched(d, c.m)) return;
      out.breaks++; coach.breaks++;
      const name = (d.breakCalls && Object.prototype.hasOwnProperty.call(d.breakCalls,c.script) && d.breakCalls[c.script]) || (Object.prototype.hasOwnProperty.call(CALL_NAMES,c.script) && CALL_NAMES[c.script]) || c.script || "—";
      out.calls[name] = (out.calls[name] || 0) + 1;
      const ev = out.byEvent[c.layout]; if(ev) ev.breaks++; });
    (d.pens || []).forEach(pn => { out.penalties++; const ev = out.byEvent[pn.layout]; if(ev) ev.pens++; });
    out.byCoach.push(coach);
  }
  out.events = out.events.size;
  return out;
}
// Fallback names for the built-in twelve, when a coach never renamed them.
const CALL_NAMES = { snake:"Snake Stack", blitz:"Blitz", hold:"Hold & Read", conserve:"Conservative",
  lock:"Lock the Lanes", balance:"Balanced Break", trade:"Clean / Lane Trade", tower:"Tower / Centre",
  contain:"Contain Both Wires", split:"Wire Split", counter:"Counter Break", dorito:"Dorito Flood" };

/* ---- render -------------------------------------------------------------- */
function render(){
  const root = document.getElementById("root");
  if(mfaPending){
    root.innerHTML=accountSection()+`<p class="status ${statusError?"error":""}" role="status" aria-live="polite">${esc(status)}</p>`+footer();
    wire();return;
  }
  root.innerHTML = accountSection() + `<p class="status ${statusError?"error":""}" role="status" aria-live="polite">${esc(status)}</p>`
    + (token ? `<nav class="row admin-tabs" role="tablist" aria-label="Administration"><button class="btn btn--ghost" role="tab" aria-selected="${activeTab==="users"}" id="usersTab">Users</button><button class="btn btn--ghost" role="tab" aria-selected="${activeTab==="seasons"}" id="seasonsTab">Seasons</button></nav>` : "")
    + (token&&activeTab==="users" ? usersSection() : sourceSection() + (allSeasons().length ? dashboard() : emptyState())) + footer();
  wire();
}
function accountSection(){
  if(mfaPending)return `<section class="sec panel admin-login"><h1>Verify your admin sign-in</h1><p class="lede" style="margin:12px 0">Use your authenticator app to finish signing in. Users and cloud seasons stay locked until verification.</p>${mfaPending.qr?`<img alt="Scan with your authenticator app" style="display:block;max-width:240px;width:100%;background:white" src="${esc(mfaPending.qr)}"><p class="note" style="overflow-wrap:anywhere;margin:12px 0">Setup key: <code>${esc(mfaPending.secret)}</code></p>`:""}${mfaPending.factorId?`<form id="adminMfa"><div class="fld"><label for="mfaCode">Six-digit authenticator code</label><input id="mfaCode" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></div><button class="btn" ${busy?"disabled":""}>Verify code</button></form>`:`<p class="note" style="margin:12px 0">Add this account to Microsoft Authenticator, Google Authenticator, or another authenticator app.</p><button class="btn" id="mfaEnroll" ${busy?"disabled":""}>Set up authenticator</button>`}<button class="btn btn--quiet" id="signOut" style="margin-top:16px">Cancel sign-in</button></section>`;
  if(token)return `<section class="sec panel"><div class="row"><h2>Administration</h2><span class="badge">Staging</span><button class="btn btn--quiet" id="signOut" style="margin-left:auto">Sign out</button></div><p class="lede" style="margin-top:12px">Signed in as ${esc(caller?.email||"administrator")}. Only seasons coaches choose to sync are available here.</p></section>`;
  return `<section class="sec panel admin-login"><h1>Gridlock administration</h1><p class="lede" style="margin:12px 0 20px">Sign in with your approved Gridlock account to view users, manage plan access, and review uploaded seasons.</p><form id="adminSignIn"><div class="fld"><label for="cloudEmail">Email</label><input id="cloudEmail" type="email" autocomplete="username" required></div><div class="fld"><label for="cloudPass">Password</label><input id="cloudPass" type="password" autocomplete="current-password" required></div><button class="btn" type="submit" ${busy?"disabled":""}>${busy?"Signing in…":"Sign in"}</button></form><p class="note" style="margin-top:12px">Use your Gridlock password. <a href="/">Reset a forgotten password in the app</a>. Signing out clears cloud records from this page.</p></section>`;
}
function usersSection(){
  return `<section class="sec"><div class="sec__head"><h2>Users</h2><span class="sec__note">Page ${userPage} · ${users.length} shown</span></div><p class="lede" style="margin-bottom:16px">All features are currently unlocked during staging testing. Plan changes are saved to the selected account.</p><div class="user-list">${users.map((u,i)=>{
    const plan=["free","team","program"].includes(u.entitlement?.plan)?u.entitlement.plan:"free";
    return `<article class="panel user-card"><div class="row"><h3>${esc(u.email||"No email address")}</h3><span class="badge">${u.email_confirmed_at?"Email confirmed":"Awaiting confirmation"}</span></div><div class="user-meta"><span>Created ${esc(dateText(u.created_at))}</span><span>Last sign-in ${esc(dateText(u.last_sign_in_at))}</span><span>Expires ${esc(u.entitlement?.expires_at?dateText(u.entitlement.expires_at):"No expiry")}</span></div><form class="plan-form" data-user-index="${i}"><div class="fld"><label for="plan-${i}">Plan</label><select id="plan-${i}" ${busy?"disabled":""}>${["free","team","program"].map(p=>`<option value="${p}" ${p===plan?"selected":""}>${p[0].toUpperCase()+p.slice(1)}</option>`).join("")}</select></div><div class="fld"><label for="expiry-${i}">Expires (optional, local time)</label><input id="expiry-${i}" type="datetime-local" value="${esc(localDate(u.entitlement?.expires_at))}" ${plan==="free"||busy?"disabled":""}></div><button class="btn btn--ghost" type="submit" ${busy?"disabled":""}>Save plan</button></form></article>`;
  }).join("")||`<div class="empty">No users on this page.</div>`}</div><div class="section-actions"><button class="btn btn--quiet" id="usersPrev" ${userPage<=1||busy?"disabled":""}>Previous</button><button class="btn btn--quiet" id="usersNext" ${!userMore||busy?"disabled":""}>Next</button><button class="btn btn--quiet" id="usersRefresh" ${busy?"disabled":""}>Refresh users</button></div></section>`;
}
function sourceSection(){
  return `<section class="sec">
    <div class="sec__head"><h2>Seasons</h2><span class="sec__note">${allSeasons().length} loaded</span></div>
    ${token?`<div class="panel" style="margin-bottom:20px"><h3>Cloud-synced seasons</h3><p class="lede">${cloudSeasons.length} uploaded season${cloudSeasons.length===1?"":"s"} loaded. These records are held only while you are signed in. Coaches control uploads from League sync.</p><div class="section-actions"><button class="btn btn--ghost" id="cloudSeasons" ${busy?"disabled":""}>${seasonPage?"Refresh synced seasons":"Load synced seasons"}</button>${seasonMore?`<button class="btn btn--quiet" id="moreSeasons" ${busy?"disabled":""}>Load more seasons</button>`:""}</div>${seasonMore?`<p class="note" style="margin-top:12px">More seasons are available. The totals below cover loaded seasons only.</p>`:""}${cloudSeasons.length?`<div class="seasons">${cloudSeasons.map(s=>`<div class="season"><strong style="overflow-wrap:anywhere">${esc(s.label)}</strong><span class="season__meta">Updated ${esc(dateText(s.at))} · ${s.data.matches.length} matches</span><span class="badge">Cloud</span></div>`).join("")}</div>`:""}</div>`:""}
    <div class="drop" id="drop">
      <h3>Import season copies</h3>
      <p class="lede">Each coach sends you their file from <b>Nexus &rsaquo; Save a copy</b>. Drop them in, or
        <label style="color:var(--accent-lit);cursor:pointer;text-decoration:underline">choose files<input type="file" id="file" accept="application/json,.json" multiple></label>.
        Imported files stay in this browser and remain available after sign-out.</p>
    </div>
    ${seasons.length ? `<div class="seasons">${seasons.map(seasonRow).join("")}</div>
      <div class="row" style="margin-top:var(--s3)"><button class="btn btn--danger" id="clear">Clear imported copies</button></div>` : ""}
  </section>`;
}
function seasonRow(s){
  return `<div class="season">
    <input value="${esc(s.label)}" data-id="${esc(s.id)}" aria-label="Coach or team label">
    <span class="season__meta">${s.at ? new Date(s.at).toLocaleDateString() : "no date"} · ${(s.data.matches||[]).length} matches</span>
    <button class="btn btn--danger" data-drop="${esc(s.id)}">Remove import</button>

}
function emptyState(){
  return `<div class="empty">Nothing loaded yet. Drop one or more season copies above to see the year across every coach —
    matches, record, the breaks they called, penalties, and a breakdown by event and by team.</div>`;
}
function dashboard(){
  const g = summarize(allSeasons());
  const pct = g.played ? Math.round(100 * g.wins / g.played) : 0;
  const tiles = [
    ["Coaches", g.coaches, "seasons loaded"],
    ["Events", g.events, "fields played"],
    ["Matches", g.matches, "not counting games watched"],
    ["Record", `<span class="win">${g.wins}</span><i>–</i><span class="loss">${g.losses}</span>`, g.played ? pct + "% of points won" : "no points scored yet"],
    ["Breaks logged", g.breaks, "calls charted"],
    ["Penalties", g.penalties, "recorded against a side"],
  ];
  const callRows = Object.entries(g.calls).sort((a,b) => b[1]-a[1]);
  const callMax = callRows.reduce((m,[,n]) => Math.max(m,n), 0) || 1;
  const eventRows = Object.entries(g.byEvent).sort((a,b) => b[1].matches - a[1].matches);
  const teamRows = Object.entries(g.byTeam).sort((a,b) => (b[1].wins+b[1].losses) - (a[1].wins+a[1].losses));

  return `
  <section class="sec">
    <div class="sec__head"><span class="sec__eyebrow">Loaded seasons</span></div>
    <div class="tiles">${tiles.map(([k,v,s]) => `<div class="tile"><div class="tile__k">${k}</div>
      <div class="tile__v">${v}</div><div class="tile__sub">${esc(s)}</div></div>`).join("")}</div>
  </section>

  <section class="sec">
    <div class="sec__head"><span class="sec__eyebrow">Breaks called across the year</span>
      <span class="sec__note">counted from what was logged</span></div>
    ${callRows.length ? `<div class="bars" role="img" aria-label="Breaks called, by count">
      ${callRows.map(([name,n]) => `<div class="bar" title="${esc(name)}: ${n} logged">
        <span class="bar__label">${esc(name)}</span>
        <span class="bar__track"><span class="bar__fill" style="width:${Math.round(100*n/callMax)}%"></span></span>
        <span class="bar__val">${n}</span></div>`).join("")}</div>`
      : `<div class="empty">No calls logged in the loaded seasons.</div>`}
  </section>

  <section class="sec">
    <div class="sec__head"><span class="sec__eyebrow">By event</span></div>
    <div class="tblwrap"><table>
      <thead><tr><th>Event</th><th class="num">Matches</th><th class="num">Record</th><th class="num">Breaks</th><th class="num">Penalties</th></tr></thead>
      <tbody>${eventRows.map(([k,e]) => `<tr><td>${esc(layoutName(k))}</td>
        <td class="num">${e.matches}</td>
        <td class="num"><span class="win">${e.wins}</span>–<span class="loss">${e.losses}</span></td>
        <td class="num">${e.breaks}</td><td class="num">${e.pens}</td></tr>`).join("") || `<tr><td colspan="5" class="note">Nothing yet.</td></tr>`}</tbody>
    </table></div>
  </section>

  <section class="sec">
    <div class="sec__head"><span class="sec__eyebrow">Record by opponent</span></div>
    <div class="tblwrap"><table>
      <thead><tr><th>Team</th><th class="num">Won</th><th class="num">Lost</th><th class="num">Points</th></tr></thead>
      <tbody>${teamRows.map(([name,t]) => `<tr><td>${esc(name)}</td>
        <td class="num win">${t.wins}</td><td class="num loss">${t.losses}</td>
        <td class="num">${t.wins+t.losses}</td></tr>`).join("") || `<tr><td colspan="4" class="note">No opponents recorded yet.</td></tr>`}</tbody>
    </table></div>
  </section>

  <section class="sec">
    <div class="sec__head"><span class="sec__eyebrow">By coach</span></div>
    <div class="tblwrap"><table>
      <thead><tr><th>Coach / team</th><th class="num">Matches</th><th class="num">Record</th><th class="num">Breaks</th></tr></thead>
      <tbody>${g.byCoach.map(c => `<tr><td>${esc(c.label)}</td><td class="num">${c.matches}</td>
        <td class="num"><span class="win">${c.wins}</span>–<span class="loss">${c.losses}</span></td>
        <td class="num">${c.breaks}</td></tr>`).join("")}</tbody>
    </table></div>
  </section>`;
}
function footer(){
  return `<p class="foot">Gridlock · Admin · Staging. Cloud records include only seasons coaches choose to upload. Imported files are stored in this browser; signing out clears cloud records, not those imports. Your account password and session token are never saved by this page.</p>`;
}

/* ---- wiring -------------------------------------------------------------- */
function readFiles(files){
  let errs = 0, done = 0, total = files.length;
  if(total>50)return say("Choose no more than 50 season copies at a time.",true);
  const finished=bad=>{if(bad)errs++;if(++done===total&&errs)say(`${errs} file${errs===1?"":"s"} could not be read. Use Gridlock JSON copies under 10 MB.`,true);};
  [...files].forEach(f => { if(f.size>10*1024*1024){finished(true);return;}const r = new FileReader();
    r.onload = () => { const e = addSeason(String(r.result), f.name.replace(/\.json$/i, "")); if(e) errs++;
      finished(false); };
    r.onerror = () => finished(true);
    r.readAsText(f); });
}
async function request(path,options={}){
  const c=new AbortController();pending.add(c);const timer=setTimeout(()=>c.abort(),20000);
  try{
    const res=await fetch(CLOUD.url+path,{...options,cache:"no-store",credentials:"omit",signal:c.signal});
    if(!res.ok){res.body?.cancel().catch(()=>{});return {ok:false,status:res.status,json:async()=>null};}
    const body=await res.json();
    return {ok:true,status:res.status,json:async()=>body};
  }
  finally{clearTimeout(timer);pending.delete(c);}
}
async function api(action,body=null,page=1){
  if(!token||sessionExpired())throw new Error("Sign in again to continue.");
  const current=epoch;
  const res=await request("/functions/v1/"+CLOUD.fn+(body?"":"?action="+encodeURIComponent(action)+"&page="+page+"&per_page="+(action==="seasons"?5:50)),{
    method:body?"POST":"GET",headers:{apikey:CLOUD.anon,Authorization:"Bearer "+token,"Content-Type":"application/json"},...(body?{body:JSON.stringify({action,...body})}:{})
  });
  if(current!==epoch)throw new Error("Cancelled.");
  if(res.status===401||res.status===403){clearCloud(res.status===403?"This account does not have admin access.":"Your session expired. Sign in again.");throw new Error("Cancelled.");}
  if(!res.ok){if(res.status===404)throw new Error("The admin service is not available yet.");throw new Error("The admin service could not complete that request. Try again.");}
  return res.json();
}
async function signIn(){
  if(busy)return;
  const email=(document.getElementById("cloudEmail")?.value||"").trim();
  let password=document.getElementById("cloudPass")?.value||"";
  if(!email||!password)return say("Enter your Gridlock email and password.",true);
  const current=++epoch;busy=true;status="Signing in…";statusError=false;render();
  try{
    const auth=await request("/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:CLOUD.anon,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
    password="";if(current!==epoch)return;
    if(!auth.ok)throw new Error("Sign-in was refused. Check your email, password, and email confirmation.");
    const result=await auth.json();if(current!==epoch)return;
    if(typeof result.access_token!=="string"||!Number.isFinite(Number(result.expires_in))||Number(result.expires_in)<=0)throw new Error("Sign-in could not be completed. Try again.");
    token=result.access_token;expiresAt=Date.now()+Math.min(Number(result.expires_in),3600)*1000;
    expiryTimer=setTimeout(()=>clearCloud("Your admin session expired. Sign in again."),Math.max(0,expiresAt-Date.now()));
    const identity=await api("identity");if(current!==epoch)return;
    caller=identity.caller;
    if(identity.mfa_required){
      const res=await request("/auth/v1/user",{headers:{apikey:CLOUD.anon,Authorization:"Bearer "+token}});
      const who=await res.json();if(current!==epoch)return;
      if(!res.ok||!Array.isArray(who?.factors||[]))throw new Error("Authenticator settings could not be loaded.");
      const factor=(who.factors||[]).find(f=>f.factor_type==="totp"&&f.status==="verified");
      mfaPending={factorId:factor?.id||"",qr:"",secret:""};busy=false;say("Complete authenticator verification.");return;
    }
    await finishAdminLogin(current);
  }catch(e){password="";if(current!==epoch)return;clearCloud(e.name==="AbortError"?"The request timed out. Try again.":e.message||"Could not reach Gridlock. Check your connection.");statusError=true;render();}
}
async function finishAdminLogin(current){
  const overview=await api("overview");if(current!==epoch)return;
  if(!Array.isArray(overview.users)||!overview.caller?.email)throw new Error("The admin service returned an unreadable response.");
  caller=overview.caller;users=overview.users;userPage=1;userMore=overview.has_more===true;activeTab="users";
  mfaPending=null;busy=false;say("Signed in. Admin permissions and authenticator were verified.");
}
async function mfaCall(path,body){
  if(sessionExpired())throw new Error("Sign in again.");
  const res=await request("/auth/v1"+path,{method:"POST",headers:{apikey:CLOUD.anon,Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok)throw new Error("Authenticator verification was refused. Check the code and try again.");
  return res.json();
}
async function enrollMfa(){
  if(busy||!mfaPending)return;const current=epoch;busy=true;render();
  try{
    const data=await mfaCall("/factors",{factor_type:"totp",friendly_name:"Gridlock Admin "+Date.now(),issuer:"Gridlock"});if(current!==epoch)return;
    const raw=data.totp?.qr_code;
    if(typeof data.id!=="string"||typeof raw!=="string"||raw.length>65536||typeof data.totp?.secret!=="string")throw new Error("Authenticator setup could not be read.");
    const qr=raw.trim().startsWith("<svg")?"data:image/svg+xml,"+encodeURIComponent(raw):/^data:image\/svg\+xml[;,]/.test(raw)?raw:"";
    if(!qr)throw new Error("Authenticator setup image was not valid.");
    mfaPending={factorId:data.id,qr,secret:data.totp.secret};status="Scan the code, then enter the six-digit code from your authenticator.";
  }catch(e){if(current===epoch){status=e.message;statusError=true;}}
  finally{if(current===epoch){busy=false;render();}}
}
async function verifyMfa(){
  if(busy||!mfaPending)return;const code=document.getElementById("mfaCode")?.value||"";
  if(!/^\d{6}$/.test(code))return say("Enter the six-digit code from your authenticator.",true);
  const current=epoch,factor=mfaPending.factorId;busy=true;render();
  try{
    const challenge=await mfaCall("/factors/"+encodeURIComponent(factor)+"/challenge",{});if(current!==epoch)return;
    const verified=await mfaCall("/factors/"+encodeURIComponent(factor)+"/verify",{challenge_id:challenge.id,code});if(current!==epoch)return;
    if(typeof verified.access_token!=="string"||!Number.isFinite(verified.expires_in)||verified.expires_in<=0)throw new Error("Verification did not return a session.");
    token=verified.access_token;expiresAt=Date.now()+Math.min(verified.expires_in,3600)*1000;
    clearTimeout(expiryTimer);expiryTimer=setTimeout(()=>clearCloud("Your admin session expired. Sign in again."),expiresAt-Date.now());
    await finishAdminLogin(current);
  }catch(e){if(current===epoch){status=e.message;statusError=true;busy=false;render();}}
}
async function loadUsers(page){
  if(busy)return;const current=epoch;busy=true;status="Loading users…";statusError=false;render();
  try{const data=await api("overview",null,page);if(current!==epoch)return;if(!Array.isArray(data.users))throw new Error("The user list could not be read.");users=data.users;caller=data.caller;userPage=page;userMore=data.has_more===true;status="Users updated.";}
  catch(e){if(current!==epoch)return;status=e.name==="AbortError"?"The request timed out. Try again.":e.message||"Could not load users.";statusError=true;}
  finally{if(current===epoch){busy=false;render();}}
}
async function loadSeasons(more=false){
  if(busy)return;const current=epoch,page=more?seasonPage+1:1;busy=true;status="Loading uploaded seasons…";statusError=false;render();
  try{
    const data=await api("seasons",null,page);if(current!==epoch)return;if(!Array.isArray(data.seasons))throw new Error("The season list could not be read.");
    const next=more?cloudSeasons.slice():[];let skipped=0;
    for(const row of data.seasons){
      if(!row||typeof row.owner!=="string"){skipped++;continue;}
      const parsed=parseSeason(typeof row.payload==="string"?row.payload:JSON.stringify(row.payload),row.label||"Uploaded season");
      if(parsed.error){skipped++;continue;}parsed.owner=row.owner;parsed.at=dateValue(row.updated_at);const old=next.findIndex(s=>s.owner===row.owner);if(old>=0)next[old]=parsed;else next.push(parsed);
    }
    cloudSeasons=next;seasonPage=page;seasonMore=data.has_more===true;status=`Loaded ${cloudSeasons.length} synced season${cloudSeasons.length===1?"":"s"}.`+(skipped?` ${skipped} unreadable record${skipped===1?" was":"s were"} skipped.`:"");statusError=skipped>0;
  }catch(e){if(current!==epoch)return;status=e.name==="AbortError"?"The request timed out. Try again.":e.message||"Could not load seasons.";statusError=true;}
  finally{if(current===epoch){busy=false;render();}}
}
async function savePlan(index){
  if(busy)return;const user=users[index];if(!user||typeof user.id!=="string")return;
  const plan=document.getElementById("plan-"+index).value,raw=document.getElementById("expiry-"+index).value;
  if(!["free","team","program"].includes(plan))return say("Choose a valid plan.",true);
  let expires_at=null;
  if(plan!=="free"&&raw){const d=new Date(raw);if(!Number.isFinite(d.getTime())||d.getTime()<=Date.now())return say("Choose a future expiry, or leave it blank for no expiry.",true);expires_at=d.toISOString();}
  const current=epoch;busy=true;status="Saving plan for "+user.email+"…";statusError=false;render();
  try{const data=await api("set_entitlement",{user_id:user.id,plan,expires_at});if(current!==epoch)return;if(!data.ok||!data.entitlement)throw new Error("The plan change was not confirmed.");const row=users.find(u=>u.id===user.id);if(row)row.entitlement=data.entitlement;status="Plan saved for "+user.email+".";}
  catch(e){if(current!==epoch)return;status=e.name==="AbortError"?"The request timed out. Refresh users to check whether the plan was saved.":e.message||"Could not save the plan.";statusError=true;}
  finally{if(current===epoch){busy=false;render();}}
}
function wire(){
  const drop = document.getElementById("drop"), file = document.getElementById("file");
  if(file) file.onchange = () => readFiles(file.files);
  if(drop){
    ["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", e => { if(e.dataTransfer && e.dataTransfer.files) readFiles(e.dataTransfer.files); });
  }
  document.querySelectorAll(".season input[data-id]").forEach(inp => inp.onchange = () => {
    const s = seasons.find(x => x.id === inp.dataset.id); if(s){ s.label = inp.value; persist(); render(); }
  });
  document.querySelectorAll("[data-drop]").forEach(b => b.onclick = () => {
    seasons = seasons.filter(x => x.id !== b.dataset.drop); persist(); render();
  });
  const clear = document.getElementById("clear");
  if(clear) clear.onclick = () => { if(confirm("Remove all imported copies from this browser? This does not delete anyone's cloud season or original export.")){ seasons = []; persist(); render(); } };
  const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
  const login=document.getElementById("adminSignIn");if(login)login.onsubmit=e=>{e.preventDefault();signIn();};
  bind("signOut",()=>clearCloud());bind("usersTab",()=>{activeTab="users";render();});bind("seasonsTab",()=>{activeTab="seasons";render();});
  bind("mfaEnroll",()=>enrollMfa());const mfaForm=document.getElementById("adminMfa");if(mfaForm)mfaForm.onsubmit=e=>{e.preventDefault();verifyMfa();};
  bind("usersPrev",()=>loadUsers(Math.max(1,userPage-1)));bind("usersNext",()=>loadUsers(userPage+1));bind("usersRefresh",()=>loadUsers(userPage));
  bind("cloudSeasons",()=>loadSeasons(false));bind("moreSeasons",()=>loadSeasons(true));
  document.querySelectorAll("form[data-user-index]").forEach(form=>{const i=Number(form.dataset.userIndex);form.onsubmit=e=>{e.preventDefault();savePlan(i);};const plan=document.getElementById("plan-"+i),expiry=document.getElementById("expiry-"+i);plan.onchange=()=>{expiry.disabled=plan.value==="free";if(expiry.disabled)expiry.value="";};});
}
window.addEventListener("pageshow",()=>sessionExpired());
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sessionExpired();});
render();
</script>
