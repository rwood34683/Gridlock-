name: Publish Gridlock site
# Publishing stays manual. The owner must first enable Pages in Settings ->
# Pages -> Build and deployment -> Source: GitHub Actions. The workflow checks
# this before deploying, then attempts to set the configured custom domain.
# Domain DNS must be configured separately.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run site:check
      # Pages has to exist before anything can be deployed to it. The job token
      # has not been allowed to create it on this repository, so when it is
      # missing the run stops here with the one sentence that fixes it, instead
      # of a stack of action errors three steps further down.
      - name: Is GitHub Pages enabled?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}'             -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then echo "Pages is enabled."; exit 0; fi
          msg="GitHub Pages is not enabled on this repository. Once, by the owner: Settings → Pages → Build and deployment → Source: GitHub Actions. Then re-run this workflow."
          echo "::error title=Enable GitHub Pages first::$msg"
          { echo "## Site not published"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: site/CNAME
          sparse-checkout-cone-mode: false
      # The domain in site/CNAME (written by npm run contact -- --domain). A
      # refusal here is reported, not fatal: the site is already live on the
      # github.io address, and the domain can still be typed into Settings → Pages.
      - name: Set the custom domain
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          domain=$(tr -d '[:space:]' < site/CNAME)
          [ -n "$domain" ] || { echo "No domain in site/CNAME; leaving the github.io address."; exit 0; }
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d "{\"cname\":\"$domain\",\"https_enforced\":true}")
          echo "PUT /pages → $code"; cat /tmp/pages.json; echo
          case "$code" in 2*) echo "Custom domain set to $domain. Point its DNS at GitHub Pages if not already.";;
            *) echo "Could not set the domain from here (HTTP $code). Enter $domain under Settings → Pages → Custom domain."; exit 1;; esac
