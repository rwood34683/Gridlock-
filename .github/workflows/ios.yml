name: Build iOS simulator
on:
  push:
    branches: [main]
    paths: ['web/**', 'ios/**', 'scripts/native*', 'scripts/configure-native.js', 'scripts/patch-speech-plugin.js', 'scripts/xcode.js', 'package*.json', '.github/workflows/ios.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm run ios:preflight
      - run: npm ci
      - run: npm run build:ios:simulator
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GrindX-iOS-simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
