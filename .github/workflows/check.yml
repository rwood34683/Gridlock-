name: Check GRIDLOCK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm run site:check
      - uses: actions/upload-artifact@v4
        with:
          name: gridlock-static-site
          path: dist/
