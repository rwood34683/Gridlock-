let raf=null;
/* Stop the break, without drawing anything.
 *
 * The loop ends by calling render(), which rebuilds the whole screen. That is
 * right while you are watching the break and wrong the moment you are not: tap
 * Play, go to Messages or Walk and start typing, and 2.2 seconds later the
 * animation finishes on a tab you cannot see and wipes what you had typed.
 * Nothing is committed until onchange, so it is simply gone. Leaving the tab
 * ends the run, the same way leaving Playbook ends the drill.
 */
function stopPlaying(){
  if(raf) cancelAnimationFrame(raf);
  raf = null; S.playing = false;
}
window.playPath = () => {
  S.playing=!S.playing;
  if(!S.playing){ if(raf) cancelAnimationFrame(raf); render(); return; }
  render();
  if(S.t >= 1) S.t = 0;                 // they are set; run it again from the line
  const start=performance.now()-(S.t*2200);
  const tick=(now)=>{
    if(!S.playing) return;
    S.t=Math.min(1,(now-start)/2200);
    paintField();                 // only the field, not the whole app
    if(S.t<1) raf=requestAnimationFrame(tick);
    else { S.playing=false; render(); }
  };
  raf=requestAnimationFrame(tick);
};
// Repaint just the field SVGs. A full render() per frame rebuilt the entire
// document — including the division table — sixty times a second.
function paintField(){
  const opts = S.tab==="scout" ? {both:true, outs:!!S.outsOn, their:!!S.theirOn} : {edit:S.editPath};
  const layer = fieldRunners(opts);
  document.querySelectorAll(".field-wrap[data-live]").forEach(el => {
    const g = el.querySelector("svg.field g.live");
    // Swap only the moving layer. If the field is not drawn yet — first paint,
    // or the tab just changed — fall back to drawing the whole thing.
    if(g) g.innerHTML = layer; else el.innerHTML = fieldSVG(opts);
  });
}

/* ============================================================
   Tally — a point sheet, tap a player to mark him out
   ============================================================ */
function tally(){
  const pt=S.point||1;
  const sc=matchScore(), was=resultFor(pt);
  const bl=curLayout().bunkers;
  const mine=fiveFor(S.point||1).filter(Boolean);
  // The sheet, the counts and the log are this match's. A season of outs under
  // a point number that starts again every game is not a point sheet.
  const outs=rowsHere(S.tally);
  const thisPoint=outs.filter(o=>o.pt===pt);
  const isOut=(side,name)=>thisPoint.some(o=>o.side===side && o.name===name);
  const alive=side=>5-thisPoint.filter(o=>o.side===side).length;

  const col=(side,label,colour,names)=>`<div>
    <h4 class="sec__eyebrow" style="color:${colour};margin-bottom:8px">${label} · ${alive(side)} up</h4>
    <div class="assigns">
      ${names.map(n=>`<button class="assign" onclick="markOut('${side}',${jsq(n)})" style="${isOut(side,n)?"opacity:.4":""}">
        <span class="assign__n" style="background:${isOut(side,n)?"var(--line-lit)":colour}">${isOut(side,n)?"✕":"●"}</span>
        <span class="assign__body"><span class="assign__job">${esc(n)}</span>
        ${isOut(side,n)?`<span class="assign__who">out</span>`:""}</span>
      </button>`).join("")}
    </div></div>`;

  return `${tip("tally","Tap a player the moment he goes out. Next point clears the sheet and keeps the log.")}

  ${sec("Point sheet", `<div class="facts">
      <span class="fact" style="flex:1 0 100%;text-align:center">
        <b style="font-size:var(--t-hero);letter-spacing:-.02em">${sc.us}<span style="color:var(--dim)"> – </span>${sc.them}</b>
        <span>${esc(matchVs()||"Them")} · point ${pt}</span></span>
      <span class="fact"><b>${alive("us")}</b><span>You up</span></span>
      <span class="fact"><b>${alive("them")}</b><span>Them up</span></span>
      <span class="fact"><b>${sc.us+sc.them}</b><span>Points played</span></span>
    </div>
  ${/* The call, on the sheet.
       *
       * The loop on a sideline is: point ends, who won it, what are we calling,
       * play it, tally the outs. Three of those five live on Tally and the call
       * lived a tab away, so every point of a long day cost two tab switches to
       * read a name the coach was about to shout. It is the same call — this
       * sets the same `script` Playbook does, so changing it here changes it
       * there and the field redraws to match. Logging is here too, because a
       * coach who never opens Playbook was never logging, and self-scout is
       * only worth anything if it has the calls in it. */""}
    <div class="sec__head" style="margin-top:var(--s4)">
      <span class="sec__eyebrow">The call</span></div>
    <div class="call" style="padding:var(--s3) var(--s4)">
      <div class="call__name" style="font-size:var(--t-xl)">${esc(breakName())}</div>
      <div class="call__read">${esc(breakMeta(S.script).read)}</div>
    </div>
    <div class="btnrow">
      <button class="btn btn--quiet grow" onclick="set({tallyPick:!S.tallyPick})">${
        S.tallyPick?"Close":"Change the call"}</button>
      <button class="btn btn--ghost grow" onclick="logCall()">✓&nbsp; Log it · point ${pt}</button>
    </div>
    ${S.tallyPick?`<div class="seg seg--wrap">
      ${Object.entries(BREAKS).map(([k,v])=>`<button class="${S.script===k?"on":""}"
        onclick="set({script:'${k}',t:1,playing:false,tallyPick:false})">${esc(v.name)}</button>`).join("")}
    </div>`:""}
    ${(() => {
      const n = loggedCalls().filter(c => c.m === S.matchId).length;
      return n ? `<p class="note">${n} call${n===1?"":"s"} logged on this sheet. Playbook counts how
        predictable you have been on this field.</p>` : "";
    })()}
    <p class="note" style="margin-top:var(--s4)">Tap a player the moment he goes out.</p>
    ${curMatch() && curMatch().layout && curMatch().layout !== S.layoutKey
      ? `<p class="warn">This sheet was played on <b>${esc((LAYOUTS[curMatch().layout]||{}).name || curMatch().layout)}</b>.
         You are looking at ${esc(curLayout().name)}, so the bunkers under an out are the wrong field's.</p>`
      : ""}
    ${matchVs() && (S.right||{}).name && (S.right||{}).name !== matchVs()
      ? `<div class="fld">
           <p class="warn">This sheet is <b>${esc(matchVs())}</b>. The right pit is
           <b>${esc(S.right.name)}</b> — scouting them does not move the sheet.</p>
           <button class="btn btn--quiet" onclick="newMatch()">Start a match vs ${esc(S.right.name)}</button>
         </div>`
      : ""}
    <div class="who2">
      ${col("us", mine.length?"Your five":"Your five · add them in Team", "var(--red)",
            mine.length?mine.map(p=>p.name):["1","2","3","4","5"])}
      ${col("them",esc(matchVs()||"Them"),"var(--blue)",["1","2","3","4","5"].map(n=>"#"+n))}
    </div>
    <p class="note">Who won it? That is the whole score, and it sets Ahead / Even / Must-score
      on the counter-picker for you.</p>
    <div class="btnrow">
      <button class="btn grow btn--lg" onclick="endPoint('us')">We won it</button>
      <button class="btn grow btn--lg" style="background:var(--blue)" onclick="endPoint('them')">They won it</button>
    </div>
    <div class="btnrow">
      ${pt > 1 ? `<button class="btn btn--quiet grow" onclick="backPoint()">‹ Point ${pt-1}</button>` : ""}
      <button class="btn btn--quiet grow" onclick="nextPoint()">Next point, no result</button>
    </div>
    <button class="btn btn--quiet btn--block" onclick="newMatch()">New match</button>`,
    matchLabel(curMatch()))}

  ${sec("Log", outs.length?`<div class="assigns">
      ${outs.slice(0,40).map(o=>{
        // The log shows this match; Undo and the pickers write to the season.
        // So the index handed to them is the row's real place in S.tally, not
        // its place in the filtered view — those stopped being the same number
        // the moment the sheet became one match's.
        const i = (S.tally||[]).indexOf(o);
        // Only the point you are on gets the pickers. Each one is 58 options,
        // so rendering them for the whole log costs thousands of nodes a
        // repaint — and you should not be editing an old point by accident.
        const live = !!o.pt && o.pt === pt;
        const named = id => { const b = bl.find(x=>x.id===id); return b?esc(callOf(b)):esc(id); };
        const where = [o.how?o.how.toLowerCase():"", o.by?`by ${esc(o.by)}`:"",
          o.shotAt?`at ${named(o.shotAt)}`:"", o.movedTo?`moved to ${named(o.movedTo)}`:""]
          .filter(Boolean).join(" · ");
        return `<div class="assign" style="flex-wrap:wrap">
        <span class="assign__n" style="background:${o.side==="them"?"var(--blue)":o.side?"var(--red)":"var(--line-lit)"};font-size:11px">${o.pt||"·"}</span>
        <span class="assign__body"><span class="assign__job">${esc(o.name)}</span>
        <span class="assign__who">${o.side==="us"?"your player":o.side?esc(o.vs||matchVs()):"logged before matches"}${where?" · "+where:""}</span></span>
        <button class="btn btn--danger" onclick="undoOut(${i})">Undo</button>
        ${live?`<div class="who2" style="flex-basis:100%;margin-top:6px">
          ${bunkerPick("Shot at", i, "shotAt", o.shotAt)}
          ${bunkerPick("Moved to", i, "movedTo", o.movedTo)}
          ${causePick("How", i, "how", o.how, OUT_CAUSES.map(c=>({v:c,t:c})))}
          ${whoPick(i, o.side, o.by)}
        </div>`:""}
      </div>`;}).join("")}
    </div>${outs.length>40?`<p class="note">Showing the last 40 of ${outs.length}. Bunkers can be set on the point you are on.</p>`:`<p class="note">Bunkers can be set on the point you are on.</p>`}`
    : `<div class="empty">No outs yet. Tap a player above the moment he walks.</div>`,
    outs.length?outs.length+" on this sheet":"")}`;
}
// Optional detail on an out: which bunker he was shot at, which he had moved
// to. Both feed Bunker stats. The fast path stays one tap — this is after.
// How he went out. Where is not why: a player laned off the break and a player
// caught crawling the snake are different problems, and the tally could not
// tell them apart. "By" reaches for the other pit's logged five when it is your
// player, and your own roster when it is theirs.
const OUT_CAUSES = ["Laned", "Traded", "Run-through", "Snake crawl", "Bounce", "Unknown"];
function causePick(label, idx, field, value, options){
  return `<label style="display:flex;flex-direction:column;gap:4px">
    <span class="note">${label}</span>
    <select onchange="setOutBunker(${idx},'${field}',this.value)" style="font-size:var(--t-sm)">
      <option value="">—</option>
      ${options.map(o=>`<option value="${esc(o.v)}" ${value===o.v?"selected":""}>${esc(o.t)}</option>`).join("")}
    </select></label>`;
}
function whoPick(idx, side, value){
  // Your player went out — who got him? Theirs went out — which of yours?
  const list = side === "us"
    ? (pitOf("right").players || []).map(m => ({v:"#"+(m.num||"?"), t:"#"+(m.num||"?")+(m.name?" "+m.name:"")}))
    : (S.roster || []).map(r => ({v:r.name, t:"#"+r.num+" "+r.name}));
  return causePick(side === "us" ? "By (them)" : "By (yours)", idx, "by", value, list);
}

function bunkerPick(label, idx, field, value){
  const list = curLayout().bunkers;
  return `<label style="display:flex;flex-direction:column;gap:4px">
    <span class="note">${label}</span>
    <select onchange="setOutBunker(${idx},'${field}',this.value)" style="font-size:var(--t-sm)">
      <option value="">—</option>
      ${list.map(b=>`<option value="${esc(b.id)}" ${value===b.id?"selected":""}>${esc(callOf(b))} · ${esc(b.id)}</option>`).join("")}
    </select></label>`;
}
window.setOutBunker = (i, field, val) => {
  const t = [...(S.tally||[])];
  if(!t[i] || typeof t[i] !== "object") return;
  t[i] = {...t[i], [field]: val || undefined};
  S.tally = t; save(S); render();
};

window.markOut = (side,name) => {
  const pt=S.point||1;
  const already=(S.tally||[]).some(o=>typeof o==="object" && o.m===S.matchId && o.pt===pt
                                    && o.side===side && o.name===name);
  if(already) return;
  // Enough context to count honestly afterwards: which break was called, on
  // which field, against whom. Without these an out is a number with no story.
  S.tally=[{pt,side,name,at:Date.now(),m:S.matchId,
            script:S.script, layout:S.layoutKey, vs:matchVs()},...(S.tally||[])];
  save(S); render();
};
window.undoOut = i => { S.tally=(S.tally||[]).filter((_,k)=>k!==i); save(S); render(); };
window.nextPoint = () => { S.point=(S.point||1)+1; save(S); render(); };
/* Who won it, and on to the next. One tap, because it happens between every
 * point of a long day. Recording it again on the same point replaces the old
 * answer rather than scoring it twice. */
window.endPoint = won => {
  const pt = S.point || 1;
  S.results = [...(S.results || []).filter(r => !(r.m === S.matchId && r.pt === pt)),
               {m: S.matchId, pt, won: won === "them" ? "them" : "us", at: Date.now()}];
  // The score is the read. Ahead / Even / Must-score follows it rather than
  // waiting to be told.
  S.matchState = derivedState();
  S.point = pt + 1;
  save(S); render();
};
// Back a point, because Next point is one tap and a sideline is a sideline.
// It moves the cursor; it does not throw away what was logged on the point you
// are leaving, and markOut already refuses to log the same man twice.
window.backPoint = () => {
  const to = Math.max(1, (S.point || 1) - 1);
  // The result goes with it. Otherwise the score still counts a point he is
  // about to play again, and Back a point silently becomes a way to inflate it.
  S.results = (S.results || []).filter(r => !(r.m === S.matchId && r.pt === to));
  S.point = to;
  S.matchState = derivedState();
  save(S); render();
};

/* A new match: the opponent across the tape now, and the point back to one.
 *
 * Nothing is deleted — the sheet you are walking away from keeps every out,
 * lineup and grade against its own match, and Matches on More can still read
 * it. But it is a boundary you cannot undo by tapping again, so a match with
 * anything in it asks first.
 */
window.newMatch = () => {
  // The opponent is stamped on every out this sheet records, so it has to be a
  // team the coach picked, not whoever the app happened to have in the pit.
  if(!pitNamed("right")){
    alert("Put the team you are playing in the right pit on Scout first — "
        + "every out on this sheet is logged against them.");
    return set({tab:"scout", scoutTab:"matchup"});
  }
  const cur = curMatch();
  const n = cur ? matchSize(cur.id) : 0;
  if(n && !confirm(`Close the sheet ${matchLabel(cur)}? It keeps its ${n} `
                 + `${n===1?"entry":"entries"} — the point goes back to 1 for the new one.`)) return;
  const id = newMatchId();
  S.matches = [{id, at: Date.now(), vs: (S.right||{}).name || "", layout: S.layoutKey},
               ...(S.matches || [])];
  S.matchId = id; S.point = 1;
  // A fresh sheet is level. Ahead / Must-score is read off the score, so it has
  // to be recomputed here or the counter-picker ranks the new match on the last
  // one's result.
  S.matchState = derivedState();
  save(S); render();
};
// An old sheet is worth reading, and worth adding to when you tallied a point
// late. Opening one puts you on its last point rather than back at one.
window.openMatch = id => {
  if(!(S.matches || []).some(m => m.id === id)) return;
  S.matchId = id;
  // Where he actually left off. A point that already has a winner recorded is
  // finished, so land on the next one — otherwise the first "We won it" after
  // reopening replaces that result instead of adding to the score. A point with
  // outs but no winner is one he was still playing, so land on it.
  const last = lastPoint(id);
  S.point = resultFor(last) ? last + 1 : last;
  S.matchState = derivedState();
  save(S); render();
};
// kept: older builds called this
window.addOut = () => window.markOut("us","Player");

/* ============================================================
   History — arithmetic on what you logged, not a model
   ============================================================

   Nothing here predicts anything. It counts outs you recorded and reports
   them, which is the honest version of "analysis" for a tool with one device
   and a season's worth of points. Entries logged before an out carried its
   context are simply not counted rather than guessed at. */
function loggedOuts(match){
  return (S.tally || []).filter(o => o && typeof o === "object" && match(o));
}
function breakRecord(scriptKey){
  const rows = loggedOuts(o => o.script === scriptKey && o.layout === S.layoutKey);
  return {points: new Set(rows.map(o => o.pt)).size,
          us: rows.filter(o => o.side === "us").length,
          them: rows.filter(o => o.side === "them").length};
}
// How a given team takes your players out, and which of them does it.
function opponentRead(team){
  const rows = loggedOuts(o => o.side === "us" && o.vs === team);
  const tally = (key) => rows.reduce((m, o) => (o[key] ? {...m, [o[key]]:(m[o[key]] || 0) + 1} : m), {});
  const rank = m => Object.entries(m).sort((a, b) => b[1] - a[1]);
  return {n: rows.length, points: new Set(rows.map(o => o.pt)).size,
          how: rank(tally("how")), who: rank(tally("by"))};
}

/* ============================================================
   Self-scout — how predictable you have been
   ============================================================

   The spec's Log break chip. Nothing is modelled: this counts the calls a
   coach pressed the button on, on the field he is standing on, and reports the
   share. A team that watches your film is doing exactly this arithmetic, so it
   is better that you see it first. */
function loggedCalls(){
  return (S.calls || []).filter(c => c && c.layout === S.layoutKey);
}
function selfScout(){
  const rows = loggedCalls();
  const seen = rows.reduce((m, c) => ({...m, [c.script]: (m[c.script] || 0) + 1}), {});
  const rank = Object.entries(seen).sort((a, b) => b[1] - a[1]);
  const recent = rows.slice(0, 10);
  const top = rank[0];
  // Ten calls is enough to have a habit; half of them the same one is a habit
  // a scout can hang a break on.
  const tell = recent.length >= 6 && top
    ? recent.filter(c => c.script === top[0]).length / recent.length : 0;
  return {n: rows.length, rank, recent, top, tell};
}
window.logCall = () => {
  S.calls = [{script: S.script, layout: S.layoutKey, pt: S.point || 1, m: S.matchId,
              vs: matchVs(), at: Date.now()}, ...(S.calls || [])];
  save(S); render();
};
window.unlogCall = i => {
  const all = [...(S.calls || [])];
  all.splice((S.calls || []).indexOf(loggedCalls()[i]), 1);
  S.calls = all; save(S); render();
};

/* ============================================================
   Scout — sub-tabs, because six stacked panels is not a screen
   ============================================================ */
const SCOUT_TABS=[["matchup","Matchup"],["breakouts","Breakouts"],["anticipate","Anticipate"],
                  ["arrival","How did they get there?"],["voice","Voice log"],["counter","Counter"],["layers","Layers"],["games","Games"],["board","Division"]];

function plantsLogged(){
  return ["left","right"].some(side =>
    (pitOf(side).players || []).some(m => plantOf(m)));
}
function outsLogged(){
  return (S.tally||[]).some(o => typeof o==="object" && o.layout===S.layoutKey && o.shotAt);
}
function scout(){
  const L=pitOf("left"),R=pitOf("right");
  const view=S.scoutTab||"matchup";
  const navigation = `<div class="seg seg--wrap" aria-label="Scout views">${SCOUT_TABS.map(([k,n])=>`<button class="${view===k?"on":""}" onclick="set({scoutTab:'${k}'})">${n}</button>`).join("")}</div>`;
  if(view === "arrival") return navigation + scoutArrival();
  if(view === "voice") return navigation + scoutVoice();
  // Every sub-tab but the board reads off the team in the right pit. With
  // nobody in it there is nothing to say, and saying it about whoever the app
  // picked is how a coach ends up scouting a team he is not playing. Division
  // is exempt — it is where you pick one.
  const body = (!R.named && view !== "board")
    ? sec("Who are you playing?", `<div class="empty">Nothing here until the other team is in the
        right pit. Tap a row on Division to load one, or pick from the card above.</div>
        <button class="btn btn--block" onclick="set({scoutTab:'board'})">Open Division</button>`)
    : {matchup:scoutMatchup,breakouts:scoutBreakouts,anticipate:scoutAnticipate,
       counter:scoutCounter,layers:scoutLayers,games:scoutGames,board:scoutBoard}[view]();
  return `${tip("scout","Left pit and right pit. Tendency is your film read — the percentages are a training aid, not a prediction.")}
  ${navigation}

  <div class="pits">${pit("left",L,"Opponent · left")}${pit("right",R,"Opponent · right")}</div>

  ${sec("The break, both pits", `<div class="toggles">
      <button class="tgl ${S.rolesOn?"on":""}" onclick="set({rolesOn:!S.rolesOn})"><i></i>Roles</button>
      <button class="tgl ${S.shotOn?"on":""}" onclick="set({shotOn:!S.shotOn})"><i></i>Shot lanes</button>
      <button class="tgl ${S.outsOn?"on":""}" onclick="set({outsOn:!S.outsOn})"><i></i>Outs</button>
      <button class="tgl ${S.theirOn?"on":""}" onclick="set({theirOn:!S.theirOn})"><i></i>Their five</button>
      <button class="btn btn--quiet" onclick="playPath()">${S.playing?"Pause":"Play break"}</button>
    </div>
    <div class="field-wrap" data-live>${fieldSVG({both:true, outs:!!S.outsOn, their:!!S.theirOn})}</div>
    <div class="toggles" style="font-size:var(--t-xs);color:var(--dim)">
      <span style="display:inline-flex;align-items:center;gap:6px"><i style="width:16px;height:3px;border-radius:2px;background:var(--red)"></i>${esc(L.named?L.name:"Left pit · not set")}</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><i style="width:16px;height:3px;border-radius:2px;background:var(--blue)"></i>${esc(R.named?R.name:"Right pit · not set")}</span>
      ${S.theirOn?`<span style="display:inline-flex;align-items:center;gap:6px"><i style="width:12px;height:12px;border-radius:3px;background:var(--blue);border:1.5px solid #efedeb"></i>their man, where you have seen him set up</span>`:""}
      ${S.outsOn?`<span style="display:inline-flex;align-items:center;gap:6px"><b style="color:#efedeb">✕</b> somebody went out here</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><i style="width:12px;height:12px;border-radius:50%;border:2px solid #ffb020"></i>traded both ways · a gunfight</span>`:""}
    </div>
    ${S.theirOn&&!plantsLogged()?`<div class="empty">Nobody placed on ${esc(curLayout().name)} yet. Log their five on
      the pit card above and set <b>Plants on</b> for each man you have seen set up.</div>`:""}
    ${S.outsOn&&!outsLogged()?`<div class="empty">No outs logged on ${esc(curLayout().name)} yet. Tally an out
      and set <b>Shot at</b> on it, and the field marks where the point was decided.</div>`:""}
    <p class="aid"><b>A training aid, not a prediction.</b> Everything on the sub-tabs below is
      counted from what you logged or scored yourself. Officials govern the live call.</p>`)}

  ${body}`;
}

/* How did they get there?
 * Observations are evidence; every connecting line is a possible route. A
 * plant in a roster has no match/point/time, so opening it only selects a
 * destination. It does not silently become a sighting in today's game. */
const _arrivalRoutesCache = new Map();
const _arrivalGeometryCache = new Map();
let _arrivalPlayback = {raf:null, running:false, t:0, key:""};
let _arrivalCustom = null; // Unsubmitted form text never becomes season data.
const arrivalText = value => clean(String(value || "").trim().replace(/\s+/g," "));
const arrivalCompare = value => arrivalText(value).toLowerCase();
function arrivalTeamNames(){
  return [...new Set([arrivalContext().team,...["left","right"].map(s=>pitOf(s)).filter(p=>p.named).map(p=>p.name),
    ...teamsHere().map(t=>t.name),...Object.values(S.teams || {}).flat().map(t=>t.name),
    ...Object.keys(S.scout || {}),...(S.arrivalSightings || []).map(o=>o.team),...(S.voiceEvents || []).map(o=>o.team)])];
}
window.toggleArrivalCustom = kind => {
  stopArrivalPlayback();
  _arrivalCustom = _arrivalCustom && _arrivalCustom.kind === kind ? null
    : {kind,scope:arrivalScope(),team:"",name:"",number:"",error:""};
  render();
  const input = document.getElementById(kind === "team" ? "arrival-custom-team" : "arrival-custom-name");
  if(input) input.focus();
};
window.cancelArrivalCustom = () => { _arrivalCustom = null; render(); };
window.editArrivalCustom = (field,value) => {
  if(_arrivalCustom && ["team","name","number"].includes(field)) _arrivalCustom[field] = value;
};
function arrivalCustomReady(kind){
  if(!_arrivalCustom || _arrivalCustom.kind !== kind) return false;
  if(_arrivalCustom.scope !== arrivalScope()){
    _arrivalCustom = null;
    S.arrival = {...(S.arrival || {}),notice:"The opponent or point changed. Open the form again before saving."};
    render(); return false;
  }

// Which wire the called break actually sends people to. Counted off the plants
// in BREAK_PLANTS against the measured layout — not a guess about the game.
function wireSplit(){
  const bucket = {Snake:0, Centre:0, Dorito:0};
  currentPaths().forEach(p => {
    const w = wireOf(p.to[1]);
    bucket[w.startsWith("snake") ? "Snake" : w === "centre" ? "Centre" : "Dorito"]++;
  });
  return bucket;
}

/* The four numbers that used to sit here — a 44/56 win bar, "expected survivors
   about 2.3 to 2.6", and an 11/39/25/25 wire split — were hard-coded. They never
   moved, whatever team was in the pit. A constant dressed as analysis is worse
   than a heuristic: the first coach who notices stops trusting the geometry too.
   Everything below is computed from the called break, the measured layout, and
   what the coach entered himself, and it says which is which. */
function scoutMatchup(){
  const L=pitOf("left"),R=pitOf("right");
  const split=wireSplit(), five=currentPaths();
  const tl=Math.max(1,L.threat||1), tr=Math.max(1,R.threat||1);
  const lPct=Math.round(tl/(tl+tr)*100);
  return sec("Matchup", `
    <div class="fld"><label>Threat, as you scored them</label>
      <div class="bar"><i style="width:${lPct}%;background:var(--red)"></i><i style="width:${100-lPct}%;background:var(--blue)"></i></div>
      <div class="barends" style="margin-top:8px">
        <span style="color:var(--red)">${esc(L.name)} ${"★".repeat(L.threat||0)}</span>
        <span style="color:var(--blue)">${"★".repeat(R.threat||0)} ${esc(R.name)}</span>
      </div>
    </div>
    <p class="lede">Your call is <b>${esc(breakName())}</b>. It puts your five here:</p>
    <div class="facts">
      ${Object.entries(split).map(([k,n])=>`<span class="fact"><b>${n}</b><span>${k}</span></span>`).join("")}
      <span class="fact"><b>${(L.players||[]).length + (R.players||[]).length}</b><span>Players logged</span></span>
    </div>
    <div class="who2">
      <div><h4>Your five · ${esc(breakName())}</h4><ol>
        ${five.map((p,i)=>`<li><b>${i+1}</b>${esc(p.label)}</li>`).join("")}
      </ol></div>
      <div><h4>${esc(R.name)} · logged</h4><ol>
        ${(R.players||[]).length
          ? R.players.map(m=>`<li><b>${esc(m.num||"?")}</b>${esc(m.wire||"")}${m.note?" · "+esc(m.note):""}</li>`).join("")
          : `<li class="note" style="grid-column:1/-1">Nobody logged yet — log them in the pit card above.</li>`}
      </ol></div>
    </div>
    <p class="aid"><b>Counted, not predicted.</b> The wire split is where this break actually plants on
    ${esc(curLayout().name)}. The bar is the threat you scored the two teams, nothing more.
    Officials govern the live call.</p>`,
    "This call");
}

function scoutAnticipate(){
  // The generic reads are a starting point. What a coach actually wants before
  // the horn is the two or three players he logged himself, hardest first.
  const card=(T,likely,tells,counter)=>{
    const men=[...(T.players||[])].sort((a,b)=>(b.threat||0)-(a.threat||0)).slice(0,3);
    return `<div class="panel">
    <h3 class="panel__title">${esc(T.name)}</h3>
    <div class="kv">
      <div class="kv__row"><span class="kv__k">Likely</span><span class="kv__v">${likely}</span></div>
      <div class="kv__row"><span class="kv__k">Tells at the line</span><span class="kv__v">${tells}</span></div>
      <div class="kv__row"><span class="kv__k">Your counter</span><span class="kv__v">${counter}</span></div>
      ${men.map(m=>`<div class="kv__row"><span class="kv__k">${esc(m.num?"#"+m.num:"Watch")}${m.name?" "+esc(m.name):""}</span>
        <span class="kv__v">${esc(m.wire||"")}${m.note?" · "+esc(m.note):""}
        <span style="color:var(--accent-lit)">${"★".repeat(m.threat||0)}</span></span></div>`).join("")}
      ${(()=>{const r=opponentRead(T.name); if(!r.n) return "";
        const how=r.how.slice(0,3).map(([k,n])=>`${esc(k.toLowerCase())} ${n}`).join(", ");
        const who=r.who.slice(0,3).map(([k,n])=>`${esc(k)} ${n}`).join(", ");
        return `<div class="kv__row"><span class="kv__k">How they get you</span><span class="kv__v">
          ${r.n} of your outs over ${r.points} point${r.points===1?"":"s"}${how?` · ${how}`:""}${who?`<br>${who}`:""}
          </span></div>`;})()}
      ${(T.notes||"").trim()?`<div class="kv__row"><span class="kv__k">Your film</span><span class="kv__v">${esc(T.notes)}</span></div>`:""}
    </div></div>`;
  };
  return sec("Anticipate",
    card(pitOf("left"),"Balanced wire to wire — they spread and play position.","Even body weighting. Shooters set to lane the middle.","Win one wire first. Take the tower to choke the cross.")
  + card(pitOf("right"),"Snake stack or runner — they overload the bottom.","A body cheats toward snake. The quiet gun off the break is the runner.","Take GP first and lane the snake. Deny the crawl."),
  "Both pits");
}

const LAYERS=[["theirOuts","Their outs","Where their players went out"],
              ["yourOuts","Your outs","Where you lost players"],
              ["rotations","Your rotations","Bunker to bunker after the break"]];
function scoutLayers(){
  const R=pitOf("right"), on=S.scoutLayers||{theirOuts:true};
  const vs=o=>o.vs===R.name;
  const counts={
    theirOuts:(S.tally||[]).filter(o=>o&&o.side==="them"&&vs(o)&&o.shotAt).length,
    yourOuts:(S.tally||[]).filter(o=>o&&o.side==="us"&&vs(o)&&o.shotAt).length,
    rotations:layoutMoves().length,
  };
  const live=LAYERS.filter(([k])=>on[k]);
  const heat=live.some(([k])=>k!=="rotations")
    ? (o => (on.theirOuts && o.side==="them" && vs(o)) || (on.yourOuts && o.side==="us" && vs(o)))
    : false;
  const any=live.reduce((n,[k])=>n+counts[k],0);
  return sec("Layers", `<p class="lede">Everything you have logged against ${esc(R.name)} on
      ${esc(curLayout().name)}, drawn where it happened. Rings are traffic, arrows are rotations.</p>
    <div class="toggles">
      ${LAYERS.map(([k,n,d])=>`<button class="tgl ${on[k]?"on":""}"
        onclick="toggleLayer('${k}')"><i></i>${n} · ${counts[k]}</button>`).join("")}
    </div>
    <div class="field-wrap">${fieldSVG({static:true, heat, moves:on.rotations?(()=>true):false})}</div>
    ${any?`<p class="note">${live.map(([k,n])=>`${counts[k]} ${n.toLowerCase()}`).join(" · ")}.</p>`
        :`<div class="empty">Nothing logged against ${esc(R.name)} on this field yet. Outs get a bunker on
          the Tally tab, on the point you are on.</div>`}`,
    esc(R.name));
}

/* ---- Games: the points you played, and what happened in each ------------ */
function scoutGames(){
  const R=pitOf("right");
  // A sheet at a time. You may have played this team four times, and their
  // point 3 is four different points — merging them into one list of "Point 3"
  // was the whole reason a match had to exist.
  const theirs=(S.tally||[]).filter(o=>o&&typeof o==="object"&&o.vs===R.name&&o.pt);
  const games=[...new Set(theirs.map(o=>o.m))].map(id=>{
    const m=(S.matches||[]).find(x=>x.id===id);
    return {id, at:(m&&m.at)||Math.min(...theirs.filter(o=>o.m===id).map(o=>o.at||0)),
            n:theirs.filter(o=>o.m===id).length};
  }).sort((a,b)=>b.at-a.at);
  if(!games.length) return sec("Games", `<div class="empty">No points logged against ${esc(R.name)} yet.
    Tally a point and it shows up here.</div>`, esc(R.name));
  // The one you are on, if it is against them; otherwise the most recent.
  const gid=games.some(g=>g.id===S.replayMatch)?S.replayMatch
           :games.some(g=>g.id===S.matchId)?S.matchId:games[0].id;
  const mine=theirs.filter(o=>o.m===gid);
  const pts=[...new Set(mine.map(o=>o.pt))].sort((a,b)=>b-a);
  const pick=pts.includes(S.replayPt)?S.replayPt:pts[0];
  const events=mine.filter(o=>o.pt===pick).sort((a,b)=>(a.at||0)-(b.at||0));
  const step=Math.min(events.length, S.replayStep==null?events.length:S.replayStep);
  const bl=curLayout().bunkers;
  const named=id=>{const b=bl.find(x=>x.id===id);return b?callOf(b):id;};
  const when=t=>new Date(t).toLocaleDateString([], {month:"short", day:"numeric"});
  return sec("Games", `${games.length>1?`<div class="seg" style="flex-wrap:wrap">
      ${games.map(g=>`<button class="${g.id===gid?"on":""}" onclick="set({replayMatch:${jsq(g.id)},replayPt:null,replayStep:null})">${
        when(g.at)}${g.id===S.matchId?" · on now":""}</button>`).join("")}
    </div>`:""}
    <div class="seg" style="flex-wrap:wrap">
      ${pts.map(n=>`<button class="${n===pick?"on":""}" onclick="set({replayPt:${n},replayStep:null})">Point ${n}</button>`).join("")}
    </div>
    <p class="note">${events.length} out${events.length===1?"":"s"} logged on point ${pick}, in the order you tapped them.</p>`,
    esc(R.name))
  + sec("Replay", `<div class="fld"><label>Step through it · ${step} of ${events.length}</label>
      <input type="range" min="0" max="${events.length}" value="${step}"
        oninput="set({replayStep:Number(this.value)})"/></div>
    <div class="assigns">${events.slice(0,step).map((o,i)=>{
      const bits=[o.how?o.how.toLowerCase():"", o.by?`by ${esc(o.by)}`:"",
                  o.shotAt?`at ${esc(named(o.shotAt))}`:"", o.movedTo?`moved to ${esc(named(o.movedTo))}`:""]
                 .filter(Boolean).join(" · ");
      return `<div class="assign">
        <span class="assign__n" style="background:${o.side==="them"?"var(--blue)":"var(--red)"};font-size:11px">${i+1}</span>
        <span class="assign__body"><span class="assign__job">${esc(o.name)}</span>
        <span class="assign__who">${o.side==="us"?"yours":esc(R.name)}${bits?" · "+bits:""}</span></span>
      </div>`;}).join("")}</div>
    ${step<events.length?`<p class="note">${events.length-step} still up.</p>`:""}
    <p class="aid">What you logged, in the order you logged it. Nothing is reconstructed.</p>`,
    "Point "+pick);
}

window.loadPit = (name, side) => {
  if(!anyTeam(name)) return;
  S[side === "left" ? "left" : "right"] = {name}; save(S); render();
};

/* Both pits off one board.
 *
 * A tap loads who you are about to play; a press and hold loads the other pit,
 * which is how you set up a matchup you are not in — two teams you are scouting
 * for the bracket. Held is 450 ms, and the row is taken out of the running for
 * the tap so a hold never does both.
 */
let _press = null;
window.pressTeam = name => {
  cancelTeam();
  _press = {name, held:false};
  _press.t = setTimeout(() => { _press.held = true; loadPit(name, "left"); }, 450);
};
window.releaseTeam = name => {
  const p = _press; if(!p) return;
  clearTimeout(p.t); _press = null;
  if(!p.held) loadPit(name, "right");
};
window.cancelTeam = () => { if(_press) clearTimeout(_press.t); _press = null; };

/* Narrowing the board is this moment's business, not something to keep, so it
 * hides rows in place rather than going through state — which would also take
 * the keyboard down on every letter. */
window.findTeam = q => {
  const t = clean(q || "").trim().toLowerCase();
  const body = document.getElementById("boardRows"); if(!body) return;
  [...body.rows].forEach(tr => {
    const cell = tr.children[1];
    tr.hidden = !!t && !(cell && cell.textContent.toLowerCase().includes(t));
  });
};

window.setSightPick = which => set({sightPick:which});

function sightlines(){
  const list=curLayout().bunkers;
  const from=S.sightFrom && list.some(b=>b.id===S.sightFrom) ? S.sightFrom : list[0].id;
  const res=sightLines(from,300/150,240/120);
  const lane=S.sightTo ? res.lines.find(l=>l.to.id===S.sightTo) : null;
  // Four bunkers on this field are called Tr. A coach's own call wins when he
  // has set one; otherwise the unique code does, because "SD to Tr" names
  // nothing he can stand in.
  const name=b=>{ const o=typeof b==="string" ? list.find(x=>x.id===b) : b;
                  if(!o) return "—";
                  const call=bunkerCalls()[o.id];
                  return call || o.id; };
  const picking=S.sightPick==="to" ? "to" : "from";
  return `${tip("sl","Tap the field where you are standing. Tap again on what you want to see. Green is a clear lane, red is blocked.")}

  ${sec("Tap the field", `<div class="seg">
      <button class="${picking==="from"?"on":""}" onclick="setSightPick('from')">Standing in · ${esc(name(from))}</button>
      <button class="${picking==="to"?"on":""}" onclick="setSightPick('to')">Looking at · ${esc(S.sightTo?name(S.sightTo):"anything")}</button>
    </div>
    <div class="field-wrap">${fieldSVG({sightFrom:from,sightTo:S.sightTo,static:true,pick:true})}</div>
    ${lane
      ? `<div class="verdict ${lane.blocked?"verdict--no":"verdict--yes"}">
           <b>${lane.blocked?"Blocked":"Clear"}</b>
           <span>${esc(name(from))} to ${esc(name(lane.to.id))} · ${lane.ft} ft${
             lane.blocked ? " · " + lane.by.slice(0,2).map(o=>esc(name(o))).join(" then ") + " in the way" : ""}</span>
         </div>`
      : `<p class="note">Tap a bunker to ask about one lane. Everything red is clipped by something
         between you and it.</p>`}
    <div class="facts">
      <span class="fact"><b>${res.clear}</b><span>Clear lanes</span></span>
      <span class="fact"><b>${res.lines.length-res.clear}</b><span>Blocked</span></span>
      <span class="fact"><b>${res.lines.length}</b><span>Bunkers</span></span>
    </div>
    <p class="aid">Geometry only. It does not know where bodies are — <b>walk it before you trust it.</b></p>`,
    curLayout().name)}

  ${/* Headed "Clear from here" while listing the blocked ones too, which reads
        as a list of clear lanes with wrong rows in it. It is every lane from
        where you are standing; how many are clear is the count beside it. */""}
  ${sec("Every lane from here", `<div class="tblwrap"><table class="tbl">
      <thead><tr><th>Bunker</th><th>Code</th><th>Lane</th></tr></thead>
      <tbody>${res.lines.map(l=>`<tr class="tap ${l.to.id===S.sightTo?"tap--on":""}"
          onclick="pickSight('to',${jsq(l.to.id)})">
        <td>${esc(l.to.n)}</td><td class="num">${esc(l.to.id)}</td>
        <td style="color:${l.blocked?"var(--dim)":"var(--ok)"}">${l.blocked
          ? "blocked by "+esc(name(l.by[0]))
          : "clear · "+l.ft+" ft"}</td>
      </tr>`).join("")}</tbody>
    </table></div>`, res.clear+" of "+res.lines.length+" clear")}`;
}

        <span class="list__count">${(g.members||[]).length}</span>
        <button class="btn btn--danger" onclick="delGroup(${jsq(g.id)})">Delete</button>
      </div>
      ${(g.members||[]).length?`<div class="assigns">${(g.members||[]).map((m,i)=>`<div class="assign">

      </div>`).join("")}</div>`:`<div class="empty">Nobody in this group yet.</div>`}
      <div class="btnrow">
        <input id="mn-${esc(g.id)}" placeholder="Name" class="grow"/>
        <input id="mp-${esc(g.id)}" placeholder="Phone or email" class="grow"/>
        <button class="btn btn--ghost" onclick="addMem(${jsq(g.id)})">Add member</button>
      </div>
    </div>`).join("")}`, people+" people")}

  ${sec("Blast", `<div class="fld"><label>Update</label>
      <textarea onchange="S.blastBody=this.value;save(S)" placeholder="Pit gate opens 8:00">${esc(S.blastBody)}</textarea></div>
    <div class="fld"><label>Who gets it</label>
      <div class="toggles">${S.groups.map(g=>`
        <button class="tgl${blastPicked(g.id)?" on":""}" onclick="toggleBlastGroup(${jsq(g.id)})">
          <i></i>${esc(g.name)} <span class="list__count">${reachable(g).length}</span>
        </button>`).join("") || `<span class="empty">Make a group first.</span>`}</div></div>
    <button class="btn btn--block" onclick="sendBlast()">${
      blastTo().length ? `Send to ${blastCount()} ${blastCount()===1?"person":"people"}` : "Pick a group"}</button>
    <p class="aid">Not a bulk-messaging tool. <b>Only message people who agreed to league ops texts.</b>
      A gate time is for ops; it is not for refs, and it is not for everybody.</p>
    ${(S.blasts||[]).length?`<div class="assigns">${S.blasts.map(b=>`<div class="assign">
      <span class="assign__body"><span class="assign__job">${esc(b.body)}</span>
      <span class="assign__who">${esc(b.at)} · ${b.n} recipients${b.to?" · "+esc(b.to):""}</span></span>
    </div>`).join("")}</div>`:""}`, (S.blasts||[]).length?S.blasts.length+" sent":"")}`;

/* Who a blast actually goes to.
 *
 * Sending every update to every member is how a league teaches its refs to
 * stop reading the texts. A gate time is for ops; a rules change is for refs.
 * So the blast carries a set of groups, and only members with a contact on
 * file are counted — the button used to promise a number that included people
 * there was no way to reach.
 *
 * No pick means no send, not everybody: a missed tap must not become a text to
 * two hundred people. New groups start picked so the common case is one tap.
 */
const reachable = g => (g.members||[]).filter(m => clean(m.phone||m.email||""));
function blastTo(){
  const live = S.groups.map(g=>g.id);
  return (S.blastTo || live).filter(id => live.includes(id));
}
const blastPicked = id => blastTo().includes(id);
const blastCount = () => S.groups.filter(g=>blastPicked(g.id))
  .reduce((n,g)=>n+reachable(g).length, 0);
window.toggleBlastGroup = id => {
  const on = blastTo();
  S.blastTo = on.includes(id) ? on.filter(x=>x!==id) : [...on, id];
  save(S); render();
};
window.addGroup = () => {
  const n=document.getElementById("ng").value.trim(); if(!n) return;
  const id="g"+Date.now();
  S.blastTo=[...blastTo(), id];
  S.groups=[...S.groups,{id,name:n,members:[]}]; save(S); render();
};
window.delGroup = id => {
  S.groups=S.groups.filter(g=>g.id!==id);
  if(S.blastTo) S.blastTo=S.blastTo.filter(x=>x!==id);
  save(S); render();
};
window.addMem = id => {
  const name=document.getElementById("mn-"+id).value.trim();
  const phone=document.getElementById("mp-"+id).value.trim();
  if(!name) return;
  S.groups=S.groups.map(g=>g.id===id?{...g,members:[...g.members,{name,phone}]}:g); save(S); render();
};
window.delMem = (id,i) => {
  S.groups=S.groups.map(g=>g.id===id?{...g,members:g.members.filter((_,k)=>k!==i)}:g); save(S); render();
};
window.sendBlast = () => {
  const body=clean(S.blastBody||"");
  if(!body){alert("Write the update first.");return}
  const picked=S.groups.filter(g=>blastPicked(g.id));
  if(!picked.length){alert("Pick at least one group.");return}
  const rec=[];
  picked.forEach(g=>reachable(g).forEach(m=>rec.push(m.phone||m.email)));
  S.blasts=[{at:new Date().toLocaleString(),n:rec.length,body,
             to:picked.map(g=>g.name).join(", ")},...S.blasts];
  save(S);
  if(rec.length && window.gridlockShare) window.gridlockShare(body+"\n"+rec.join(", "),"GRIDLOCK league blast");
  else prompt("Copy this blast", body+"\n"+rec.join(", "));
  render();
};

  if(k==="assess"){

  + sec("Save a copy", `<p class="lede">There is no server behind this app, so there is no automatic backup. A copy

    ${S.copyText?`<div class="fld"><label>Copy this and keep it somewhere safe</label>

function shell(){
  const tabs=[["playbook","Playbook"],["tally","Tally"],["scout","Scout"],["sightlines","Sightlines"],["more","More"]];
  const page={playbook,tally,scout,sightlines,more:morePage}[S.tab]();
  const tut = S.showTutorial?`<div class="panel">
    <h3 class="panel__title">How it works</h3>
    <div class="kv">
      <div class="kv__row"><span class="kv__k">Playbook</span><span class="kv__v">The call. Pick the break, play it, read the five jobs.</span></div>
      <div class="kv__row"><span class="kv__k">Tally</span><span class="kv__v">Tap a player the moment he goes out.</span></div>
      <div class="kv__row"><span class="kv__k">Scout</span><span class="kv__v">The other pit — tendency, threat and your counter.</span></div>
      <div class="kv__row"><span class="kv__k">More</span><span class="kv__v">The walk, the team, clinics and league ops.</span></div>
    </div>
    <button class="btn btn--block" onclick="set({showTutorial:false})">Start coaching</button>
  </div>`:"";

  const crumb = S.tab==="more" && S.more ? ` <span class="ctx__sep">·</span> <b>${MORE_TITLES[S.more]||""}</b>` : "";
  /* The score rides in the header once a point has been won, so it is never a
   * tab away from wherever the coach is standing. It sits in the top row beside
   * the Staff chip and not on the context line underneath: that line carries the
   * event and the call, ellipsizes on a phone, and swallowed the score whole. */
  const sc = matchScore();
  const line = sc.us + sc.them
    ? `<span class="score-chip"><b>${sc.us}</b><i>–</i><b>${sc.them}</b></span>` : "";
  // The drill is over the moment the header names the break it is showing.
  const drilling = S.pbView === "rep" && repState().running;

  return `<div class="app">
    <header class="hdr">
      <div class="hdr__top">
        <div class="brand">GRIDLOCK<small>SYSTEM · COACH</small></div>
        <span class="grow"></span>
        ${line}
        <span class="who-chip ${staffed()?"staff":""}">${staffed()?"Staff":"Guest"}</span>
      </div>
      ${Object.keys(LAYOUTS).length>1
        ? `<button class="ctx" onclick="cycleEvent()">
        <span class="ctx__line"><b>${esc(curLayout().name)}</b> <span class="ctx__sep">·</span> ${drilling?"NAME THE CALL":esc(breakName())}${crumb}</span>
        <span class="ctx__caret">CHANGE ▾</span>
      </button>`
        : `<div class="ctx">
        <span class="ctx__line"><b>${esc(curLayout().name)}</b> <span class="ctx__sep">·</span> ${drilling?"NAME THE CALL":esc(breakName())}${crumb}</span>
      </div>`}
    </header>
    <main class="main">${contextWarning()}${storeWarning()}${tut}${page}
      <p class="note">GRIDLOCK System · powered by UPRA · officials govern the live call</p>
    </main>
    <nav class="tabs">${tabs.map(([k,n])=>`<button class="${S.tab===k?"on":""}" onclick="set({tab:'${k}',more:null})"><i></i>${n}</button>`).join("")}</nav>
  </div>`;
}
window.cycleEvent = () => {
  const keys=Object.keys(LAYOUTS);
  set({layoutKey:keys[(keys.indexOf(S.layoutKey)+1)%keys.length]});
};
window.pickEvent = key => { if(LAYOUTS[key]) set({layoutKey:key}); };
window.setSmooth = on => set({smoothOn:!!on});
/* The screen goes to sleep between points otherwise: a coach makes the call,
 * puts the phone down, and picks up a locked screen on the buzzer. The lock is
 * only held while the app is actually on screen — the browser drops it the
 * moment you background it — so it costs nothing in a pocket. His call either
 * way, because it is his battery. */
window.setAwake = on => {
  S.awake = !!on; save(S);
  if(window.gridlockAwake) window.gridlockAwake(S.awake);
  render();
};

// Every tap rebuilds the whole screen, and the browser puts a rebuilt scroller
// back at the top. So grading a man at the bottom of a long card, or dropping a
// row off a pasted roster, threw the coach back to the head of the tab. Between
// points on a sideline that is the difference between using this and putting it
// down. Hold the place unless the screen itself changed — a new tab does belong
// at the top.
let _where = "";
function render(){
  guardVoiceSession();
  if(_arrivalPlayback.running && (S.tab !== "scout" || S.scoutTab !== "arrival")) stopArrivalPlayback(true);
  const main = document.querySelector(".main");
  const at = main ? main.scrollTop : 0;
  const screen = [S.entered, S.tab, S.more, S.scoutTab].join("|");
  document.getElementById("root").innerHTML = S.entered ? shell() : promo() + (_recoveryText ? storeWarning() : "");
  const next = document.querySelector(".main");
  if(next && screen === _where) next.scrollTop = at;
  _where = screen;
}
render();

<script>
/* GRIDLOCK Coach — native bridge.
   Loaded on web and on device. Everything here degrades to a no-op in a
   plain browser, so web/index.html stays the single source of truth for UI. */
(function () {
  var Cap = window.Capacitor;
  var native = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
  var P = (Cap && Cap.Plugins) || {};

  document.documentElement.classList.add(native ? "is-native" : "is-web");
  if (Cap && Cap.getPlatform) {
    document.documentElement.classList.add("platform-" + Cap.getPlatform());
  }

  /* Share: native sheet on device, Web Share API in the browser, clipboard last. */
  window.gridlockShare = function (text, title) {
    function canceled(error) { return error && (error.name === "AbortError" || /cancel/i.test(error.message || "")); }
    function showText() { window.prompt("Copy this text to share it:", text); return false; }
    function copy() {
      if (!navigator.clipboard || !navigator.clipboard.writeText) return Promise.resolve(showText());
      return navigator.clipboard.writeText(text).then(function () {
        alert("Copied."); return true;
      }).catch(showText);
    }
    if (native && P.Share) {
      return P.Share.share({ title: title || "GRIDLOCK", text: text }).catch(function (error) {
        return canceled(error) ? false : copy();
      });
    }
    if (navigator.share) {
      return navigator.share({ title: title || "GRIDLOCK", text: text }).catch(function (error) {
        return canceled(error) ? false : copy();
      });
    }
    return copy();
  };

  /* Export a real JSON attachment. The calling UI keeps a text fallback and
     decides what to say; handing a file to another app is not a saved receipt. */
  if (native) {
    var exportPending = null;
    window.gridlockExportFile = function (text, filename) {
      if (exportPending) return exportPending;
      exportPending = Promise.resolve().then(function () {
        if (!P.Filesystem || !P.Share) throw new Error("File sharing is unavailable in this app build.");
        if (typeof text !== "string" || !text.length) throw new Error("The backup is empty.");
        JSON.parse(text);
        var name = String(filename || "GRIDLOCK-backup.json").replace(/[^a-zA-Z0-9._-]/g, "-").replace(/^\.+/, "").slice(0, 120);
        if (!name) name = "GRIDLOCK-backup.json";
        if (!/\.json$/i.test(name)) name += ".json";
        var file = "gridlock-exports/" + name;
        return P.Filesystem.writeFile({ path: file, data: text, directory: "CACHE", encoding: "utf8", recursive: true }).then(function (written) {
          if (written && written.uri) return written;
          return P.Filesystem.getUri({ path: file, directory: "CACHE" });
        }).then(function (written) {
          if (!written || !/^file:\/\//.test(written.uri || "")) throw new Error("The backup file could not be located.");
          return P.Share.share({ title: "GRIDLOCK backup", files: [written.uri], dialogTitle: "Save or share GRIDLOCK backup" });
        }).then(function () { return { status: "shared" }; });
      }).catch(function (error) {
        if (error && (error.name === "AbortError" || /cancel/i.test(error.message || ""))) return { status: "cancelled" };
        return { status: "failed", message: error && error.message ? error.message : "The backup could not be shared." };
      }).then(function (result) { exportPending = null; return result; });
      return exportPending;
    };
  }

  /* The durable copy of the season.
   *
   * web/index.html keeps working in localStorage — save() is synchronous and
   * called from every handler — and hands the same text here on every save.
   * This mirrors it into app storage (UserDefaults on iOS, SharedPreferences
   * on Android), which the OS does not clear to reclaim space and which rides
   * along in the device backup. On a launch where localStorage came back empty,
   * the copy goes back the other way.
   *
   * Writes are debounced: a coach dragging a path fires save() on every frame,
   * and a plugin round trip per frame would be felt. Half a second of lag on a
   * backup copy costs nothing; the working store is already written.
   */
  var KEY = "gridlock.coach.v2";
  var ACCOUNT = "gridlock.staff.v2";
  var pending = {}, timer = null, flushing = null;

  function storageStatus(failed) {
    var message = failed ? "The phone could not update its second copy. Keep a backup with Save a copy on Nexus." : "";
    if (window.gridlockDurableError === message) return;
    window.gridlockDurableError = message;
    if (typeof window.render === "function") window.render();
  }

  function flush() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (!P.Preferences) return Promise.resolve();
    // Keep plugin writes ordered: a slow older write must never finish after a
    // newer one and roll the durable copy backwards.
    if (flushing) return flushing.then(flush);
    if (!Object.keys(pending).length) return Promise.resolve();
    var out = pending; pending = {};
    var failed = false;
    flushing = Promise.all(Object.keys(out).map(function (k) {
      return Promise.resolve().then(function () {
        return P.Preferences.set({ key: k, value: out[k] });
      }).catch(function () {
        failed = true;
        // Retry the failed text only if an even newer save is not queued.
        if (!(k in pending)) pending[k] = out[k];
      });
    })).then(function () {
      flushing = null;
      storageStatus(failed);
      if (Object.keys(pending).length && !timer) timer = setTimeout(flush, failed ? 5000 : 0);
    });
    return flushing;
  }

  // Whether there is anywhere durable to keep it. Nexus reads this rather than
  // promising a safety net a browser does not have.
  window.gridlockDurable = !!(native && P.Preferences);
  window.gridlockDurableError = "";

  window.gridlockKeep = function (text, key) {
    if (!window.gridlockDurable) return;         // a browser has nowhere durable
    pending[key || KEY] = text;
    if (!timer) timer = setTimeout(flush, 500);
  };

  /* Keep the screen awake on a sideline.
   *
   * The Screen Wake Lock API, not a plugin: it is in WKWebView from iOS 16.4
   * and in the Android WebView, so the phone app and the browser get the same
   * behaviour with no new native dependency. The lock is released by the system
   * whenever the page stops being visible, which is exactly right — it holds
   * while the coach is looking at the app and costs nothing once the phone is
   * in a pocket — but it means it has to be taken again on the way back.
   */
  window.gridlockCanAwake = !!(navigator.wakeLock && navigator.wakeLock.request);
  var lock = null, acquiring = false;
  var wanted = function () { return !(window.S && window.S.awake === false); };

  function acquire() {
    if (!window.gridlockCanAwake || lock || acquiring || !wanted()) return;
    if (document.visibilityState !== "visible") return;
    acquiring = true;
    navigator.wakeLock.request("screen").then(function (l) {
      acquiring = false;
      if (!wanted() || document.visibilityState !== "visible") {
        return l.release().catch(function () {});
      }
      lock = l;
      l.addEventListener("release", function () { if (lock === l) lock = null; });
    }).catch(function () { acquiring = false; }); // denied, low battery, no permission
  }
  function drop() {
    if (!lock) return;
    try { lock.release().catch(function () {}); } catch (e) {}
    lock = null;
  }
  window.gridlockAwake = function (on) { if (on) acquire(); else drop(); };
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") acquire(); else drop();
  });
  acquire();

  if (!native) return;

  if (P.Preferences) {
    // The staff account first: it is what gates creating a class or sending a
    // blast, and restoring a season the coach can no longer sign in to is half
    // a rescue.
    P.Preferences.get({ key: ACCOUNT }).then(function (r) {
      if (r && r.value && window.gridlockRestoreAccount) window.gridlockRestoreAccount(r.value);
    }).catch(function () {});
    P.Preferences.get({ key: KEY }).then(function (r) {
      // gridlockRestore decides: it only takes this if the launch found no
      // usable local state, which is the whole point of keeping it.
      if (r && r.value && window.gridlockRestore) window.gridlockRestore(r.value);
    }).catch(function () {});
  }

  /* Dark stadium status bar. */
  if (P.SystemBars) {
    P.SystemBars.setStyle({ style: "DARK" }).catch(function () {});
  } else if (P.StatusBar) {
    P.StatusBar.setStyle({ style: "DARK" }).catch(function () {});
    if (Cap.getPlatform() === "android") {
      P.StatusBar.setBackgroundColor({ color: "#000000" }).catch(function () {});
    }
  }

  /* Deep links: gridlock://class/GL-7K2M and https://…/?c=GL-7K2M both open
     Classes with the code prefilled. */
  function openJoinCode(code) {
    if (!code || typeof window.set !== "function") return;
    window.set({ joinCode: code, entered: true, tab: "more", more: "classes" });
  }

  function codeFromUrl(url) {
    if (!url) return null;
    var m = /(?:class\/|[?&]c=)([A-Za-z0-9-]+)/.exec(url);
    return m ? m[1].toUpperCase() : null;
  }

  if (P.App) {
    // appUrlOpen covers a running app. A link that launches a stopped app is
    // delivered separately, and otherwise its class code never reaches the UI.
    if (P.App.getLaunchUrl) P.App.getLaunchUrl().then(function (event) {
      openJoinCode(codeFromUrl(event && event.url));
    }).catch(function () {});
    P.App.addListener("appUrlOpen", function (event) {
      openJoinCode(codeFromUrl(event && event.url));
    });

    /* Backgrounding is the last moment anything here is guaranteed to run, and
       the phone may not come back. Write the durable copy now rather than
       waiting out the debounce. */
    P.App.addListener("appStateChange", function (st) {
      if (st && st.isActive === false) flush();
    });

    /* Android hardware back walks the app instead of closing it. */
    P.App.addListener("backButton", function () {
      var S = window.S;
      if (!S || typeof window.set !== "function") {
        P.App.exitApp();
        return;
      }
      if (S.mode) return window.set({ mode: null });
      if (S.pbView) return window.set({ pbView: null });
      if (S.pad) return window.set({ pad: null });
      if (S.tab === "more" && S.more) return window.set({ more: null });
      if (S.tab && S.tab !== "playbook") return window.set({ tab: "playbook" });
      P.App.exitApp();
    });
  }
})();

</script>
