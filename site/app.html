    saved = true;
  } catch(e){}
  S.copyStatus = `Copy made · ${copySummary(JSON.parse(text).data)}. `
    + (saved ? `Look for ${name} in your downloads or the share sheet — if neither arrived, use Show it as text.`
             : `Use Show it as text below and keep it somewhere safe.`);

};

window.loadCopy = mode => {
  const el = document.getElementById("copyIn");

  const d = r.payload.data;
  // Two squads' rosters stirred together is a mess nobody notices until the
  // five on Playbook are strangers. The code says whose copy this is; a merge
  // that mixes squads still happens, but it says so out loud.
  const clash = mode !== "replace" && d.teamCode && S.teamCode && d.teamCode !== S.teamCode
                && (S.roster || []).length && (d.roster || []).length;
  S.copyStatus = (mode === "replace" ? "Replaced with " : "Merged in ") + copySummary(d)

             : "");
  // Replace swaps the data, not the session: you stay signed in, on this screen,

  const SESSION = ["entered","role","email","tab","more","scoutTab","tips","showTutorial","copyStatus"];
  const held = {};

  /* A merge takes their records, never their place in the day.

   * matchId, point, layoutKey and script are where *this* coach is standing:
   * the sheet in front of him, the point he is on, the field and the call. They
   * are scalars, so mergeInto took the incoming side and a coach who merged an
   * assistant's copy between points was silently moved onto the assistant's
   * sheet, at the assistant's point number. The next out he tapped landed on
   * the wrong match. Replace is different — that is asking to become the other
   * phone, and it takes the lot.
   */
  const HERE = ["teamCode", "matchId", "point", "layoutKey", "script", "division", "matchState"];
  const mine = {};
  HERE.forEach(k => { mine[k] = S[k]; });
  const next = mode === "replace" ? {...defaultState(), ...d, ...held} : mergeInto(S, d);
  if(mode !== "replace") HERE.forEach(k => { if(mine[k] !== undefined) next[k] = mine[k]; });
  Object.keys(next).forEach(k => { S[k] = next[k]; });
  if(!curMatch()){
    const id = newMatchId();
    S.matches = [{id, at:Date.now(), vs:(S.right || {}).name || "", layout:S.layoutKey}, ...(S.matches || [])];
    S.matchId = id;

};

//
// Pointer events, not mouse: the same code has to work under a thumb. The SVG
// is scaled by its viewBox, so every position is converted through the screen
// matrix rather than assumed.
function fieldFeet(svg, ev){
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [Math.max(1, Math.min(149, p.x / 2)), Math.max(1, Math.min(119, p.y / 2))];
}
function setVia(id, via){
  S.pathEdits = {...(S.pathEdits || {}), [pathKey(id)]: via};
  pathsChanged(); save(S);
}
window.resetPath = id => {

};

// Sightlines by touch. A bunker is ten pixels across on a phone, so the field
// itself takes the tap and the nearest bunker wins — a coach points at where he
// is standing, he does not aim at a shape.
(function sightPicking(){
  document.addEventListener("pointerdown", ev => {
    if(S.tab !== "sightlines") return;
    const surface = ev.target.closest("[data-pick]");
    if(!surface) return;
    const svg = surface.closest("svg.field");
    if(!svg) return;
    ev.preventDefault();
    const b = bunkerAt(fieldFeet(svg, ev));
    if(!b) return;
    // Two taps answer the question a coach actually has: where he is, then what
    // he is looking at. Setting the first advances to the second on its own, so
    // nobody has to think about a mode — and the chips above go back.
    if(S.sightPick === "to" && S.sightFrom){
      set({sightTo: (b.id === S.sightTo || b.id === S.sightFrom) ? null : b.id});
    } else {
      set({sightFrom:b.id, sightTo:null, sightPick:"to"});
    }
  });
})();

// One delegated listener on the app, so it survives every repaint.
(function pathEditing(){
  let drag = null;
  const svgOf = el => el.closest("svg.field");
  document.addEventListener("pointerdown", ev => {
    if(!S.editPath || S.tab !== "playbook") return;
    const h = ev.target.closest("[data-h],[data-aim],[data-leg]");
    if(!h) return;
    const svg = svgOf(h);
    if(!svg) return;
    ev.preventDefault();
    const at = fieldFeet(svg, ev);
    if(h.hasAttribute("data-aim")){
      drag = {kind:"aim", id:Number(h.dataset.aim), moved:false};
    } else if(h.hasAttribute("data-h")){
      drag = {kind:"via", id:Number(h.dataset.h), i:Number(h.dataset.i), moved:false, at};
    } else {
      // Tapping the line itself adds a corner where you tapped, on the nearest leg.
      const id = Number(h.dataset.leg);   // dataset is text; path ids are numbers
      const p = currentPaths().find(x => x.id === id);
      if(!p) return;
      const pts = [p.from, ...(p.via || []), p.to];
      let best = 0, bestD = Infinity;
      for(let i = 0; i < pts.length - 1; i++){
        const m = [(pts[i][0]+pts[i+1][0])/2, (pts[i][1]+pts[i+1][1])/2];
        const d = Math.hypot(m[0]-at[0], m[1]-at[1]);
        if(d < bestD){ bestD = d; best = i; }
      }
      const via = [...(p.via || [])];
      via.splice(best, 0, at);
      setVia(id, via);
      drag = {kind:"via", id, i:best, moved:true, at};
      paintField();
    }
    if(h.setPointerCapture) h.setPointerCapture(ev.pointerId);
  });
  document.addEventListener("pointermove", ev => {
    if(!drag) return;
    const svg = document.querySelector(".field-wrap[data-live] svg.field");
    if(!svg) return;
    const at = fieldFeet(svg, ev);
    if(drag.kind === "via"){
      const p = currentPaths().find(x => x.id === drag.id);
      if(!p) return;
      if(Math.hypot(at[0]-drag.at[0], at[1]-drag.at[1]) > 1.2) drag.moved = true;
      const via = [...(p.via || [])];
      via[drag.i] = at;
      setVia(drag.id, via);
    } else {
      const p = currentPaths().find(x => x.id === drag.id);
      if(!p) return;
      const now = posAt(p, S.t);
      const deg = Math.round(Math.atan2(at[1]-now[1], at[0]-now[0]) * 180 / Math.PI);
      if(Math.abs(deg - (directOf(drag.id).face ?? 999)) < 1) return;
      const all = {...(S.direct || {})};
      all[directKey(drag.id)] = {...(all[directKey(drag.id)] || {}), face: deg};
      S.direct = all; save(S); drag.moved = true;
    }
    paintField();
  });
  document.addEventListener("pointerup", () => {
    if(!drag) return;
    // A tap on a corner, with no drag, takes that corner out.
    if(drag.kind === "via" && !drag.moved){
      const p = currentPaths().find(x => x.id === drag.id);
      if(p){
        const via = [...(p.via || [])];
        via.splice(drag.i, 1);
        setVia(drag.id, via);
      }
    }
    drag = null;
    render();
  });
})();

function bunkerTraffic(keep){
  // Bunker ids belong to a layout, so traffic logged on one field must not
  // leak onto another. Anything the current layout does not have is dropped.
  // `keep` narrows it further — one opponent, one side — for the layers on Scout.
  const here = new Set(curLayout().bunkers.map(b => b.id));
  const ok = keep || (() => true);
  const t = {};
  const bump = (id, key) => {
    if(!id || !here.has(id)) return;
    t[id] = t[id] || {outs:0, visits:0};
    t[id][key]++;
  };
  (S.tally || []).forEach(o => {
    if(typeof o !== 'object' || !ok(o)) return;
    bump(o.shotAt, 'outs');
    bump(o.movedTo, 'visits');
  });
  (S.moves || []).forEach(m => { if(ok(m)) bump(m.to, 'visits'); });
  return t;
}

// A bunker laid across the field at an angle — Tampa Bay prints six beam
// sections in two Vs — is a poor fit for one field-aligned box: the box that
// contains it is half again as wide as the beam and blocks lanes the beam
// leaves open. Everything that asks what a bunker blocks asks for its boxes
// instead, and an angled one comes back as three along its length.
function bunkerBoxes(b){
  const w = b.w || 4, h = b.h || 4;
  if(!b.a || b.t !== "beam") return [{x:b.x, y:b.y, w, h}];
  // Squares the thickness of the beam, laid end to end along it. Fewer and
  // fatter boxes would be quicker and would block lanes the beam leaves open,
  // which is the whole thing this is here to avoid; the spacing below never
  // exceeds a box, so there is no gap to shoot through either.
  const t = b.a * Math.PI / 180;
  const span = w - h;
  const n = Math.max(2, Math.ceil(span / h) + 1);
  const out = [];
  for(let i = 0; i < n; i++){
    const d = -span / 2 + (span * i) / (n - 1);
    out.push({x: b.x + d * Math.cos(t), y: b.y + d * Math.sin(t), w: h, h: h});
  }
  return out;
}

/* The outline, and where it sits.
 *
 * A stroke straddles the line it is drawn on, so half of it lands outside the
 * shape. Insetting the whole shape by half a stroke put the *outer edge of the
 * paint* on the measurement, which is right for the footprint and wrong for
 * the picture: the outer half-stroke is near-black, so two bunkers that touch
 * showed a stripe of field between their fills. On the snake that is exactly
 * where it hurts — the beams run into the giant plus on the official map, and
 * on screen they stopped a third of a foot short of it with black in between.
 *
 * So the fill now runs to the measurement and the outline is drawn inside it:
 * same silhouette, same footprint, no gap where two bunkers meet.
 */
const BNK_STROKE = 0.7;
const BNK_IN = BNK_STROKE / 2;      // how far in the stroke path sits
function bunkerSize(b, sx=2, sy=2){
  if(b.w && b.h) return {h:Math.max(0.4, (b.w*sx)/2), v:Math.max(0.4, (b.h*sy)/2)};
  return BUNKER[b.t] || BUNKER.can;
}
// A rounded box: filled to its own edge, outlined just inside it.
function inkBox(x, y, w, h, r, fill, edge){
  const iw = Math.max(0.2, w - BNK_IN), ih = Math.max(0.2, h - BNK_IN);
  return `<rect x="${(x-w).toFixed(2)}" y="${(y-h).toFixed(2)}" width="${(w*2).toFixed(2)}" height="${(h*2).toFixed(2)}" rx="${r}" fill="${fill}"/>`
       + `<rect x="${(x-iw).toFixed(2)}" y="${(y-ih).toFixed(2)}" width="${(iw*2).toFixed(2)}" height="${(ih*2).toFixed(2)}" rx="${r}" fill="none" stroke="${edge}" stroke-width="${BNK_STROKE}"/>`;
}

// One material for every bunker so the silhouette carries the type, and the
// red and blue break paths stay the loudest thing on the field.
function bunkerShape(b, sx, sy){
  const x = b.x*sx, y = b.y*sy, s = bunkerSize(b, sx, sy);
  // b.c is the body colour sampled off the official map, b.d the contrasting
  // cap, band or inset it prints. Neither is chosen here.
  const blue = b.c === 'b', red = b.c === 'r';
  const fill = blue ? 'url(#bnkBlue)' : red ? 'url(#bnkRed)' : 'url(#bnkFace)';
  const edge = blue ? '#1b1a55' : red ? '#5c0f0d' : '#63676a';
  const sw = `stroke-width="${BNK_STROKE}"`;
  // The official map picks each bunker out with a contrasting cap, band or
  // inset. Those are drawn here in a darker tone of the same material, so the
  // silhouettes match the map without a second hue fighting the wires.
  const detail = b.d === 'b' ? '#3f3eb0' : b.d === 'r' ? '#b8332c'
               : blue ? '#2f2e8a' : red ? '#9a231e' : '#70767a';
  const box = (w,h,r) => inkBox(x, y, w, h, r, fill, edge);
  const band = (hw,hh,cy2,r) => `<rect x="${(x-hw).toFixed(2)}" y="${(cy2-hh).toFixed(2)}" width="${(hw*2).toFixed(2)}" height="${(hh*2).toFixed(2)}" rx="${r}" fill="${detail}"/>`;

  // A beam printed at an angle is drawn on its own axis, so the silhouette on
  // screen is the one on the official map rather than the box around it.
  if(b.a && b.t === "beam"){
    const L = s.h, T = s.v;
    // Nearly square ends, because that is what the map prints and because a
    // beam is the one bunker that butts another: rounded to eighty per cent of
    // its own half-thickness, the fill domed away and left a hole where the
    // snake meets the plus.
    const r = Math.min(0.8, T * 0.22);
    return `<g transform="rotate(${b.a} ${x.toFixed(2)} ${y.toFixed(2)})">`
      + inkBox(x, y, L, T, r.toFixed(2), fill, edge)
      + `<rect x="${(x+L-T*1.4).toFixed(2)}" y="${(y-T).toFixed(2)}" width="${(T*1.4).toFixed(2)}" height="${(T*2).toFixed(2)}" rx="${(T*0.5).toFixed(2)}" fill="${detail}"/>`
      + `</g>`;
  }

  switch(b.t){
    case "dorito":
      return `<polygon points="${x},${(y-s.v).toFixed(2)} ${(x-s.h).toFixed(2)},${(y+s.v).toFixed(2)} ${(x+s.h).toFixed(2)},${(y+s.v).toFixed(2)}" fill="${fill}" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
    case "wing": {
      // Wings point away from the 50, toward their own end line.
      const dir = b.x < 75 ? -1 : 1;
      return `<polygon points="${(x+s.h*dir).toFixed(2)},${y} ${(x-s.h*dir).toFixed(2)},${(y-s.v).toFixed(2)} ${(x-s.h*dir).toFixed(2)},${(y+s.v).toFixed(2)}" fill="${fill}" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
    }
    case "plus": {
      // A giant plus is a chunky cross: its arms are four feet across against
      // a span of eleven, and the width of them is most of what it looks like.
      // b.k is that width, measured off the map like everything else.
      const arm = (H, V, A) => `M${(x-A).toFixed(2)} ${(y-V).toFixed(2)}h${(A*2).toFixed(2)}v${(V-A).toFixed(2)}h${(H-A).toFixed(2)}v${(A*2).toFixed(2)}h-${(H-A).toFixed(2)}v${(V-A).toFixed(2)}h-${(A*2).toFixed(2)}v-${(V-A).toFixed(2)}h-${(H-A).toFixed(2)}v-${(A*2).toFixed(2)}h${(H-A).toFixed(2)}z`;
      const H = s.h, V = s.v, A = Math.max(1.2, ((b.k || 4) * sx) / 2);
      // Filled to the arm tips the map measured, outlined just inside them, so
      // the snake beam that ends on this arm ends against paint.
      const plus = `<path d="${arm(H, V, A)}" fill="${fill}"/>`
        + `<path d="${arm(H-BNK_IN, V-BNK_IN, Math.max(1, A-BNK_IN))}" fill="none" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
      // Turned on its corner it is the same cross, turned. It does not grow:
      // the span the map measured is the span between the arm tips either way.
      return b.a ? `<g transform="rotate(${b.a} ${x.toFixed(2)} ${y.toFixed(2)})">${plus}</g>` : plus;
    }
    case "cake":
      return `<circle cx="${x}" cy="${y}" r="${s.h}" fill="${fill}" stroke="${edge}" ${sw}/>`
           + `<circle cx="${x}" cy="${y}" r="${(s.h*0.45).toFixed(2)}" fill="none" stroke="${edge}" stroke-width=".6" opacity=".7"/>`;
    case "ball":     // an ellipse, so the drawn footprint is exactly the measured one
      return `<ellipse cx="${x}" cy="${y}" rx="${s.h.toFixed(2)}" ry="${s.v.toFixed(2)}" fill="${fill}" stroke="${edge}" ${sw}/>`;
    case "tridown":  // cakes and small doritos point back down the field
      return `<polygon points="${x},${(y+s.v).toFixed(2)} ${(x-s.h).toFixed(2)},${(y-s.v).toFixed(2)} ${(x+s.h).toFixed(2)},${(y-s.v).toFixed(2)}" fill="${fill}" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
    case "gwing":    return box(s.h, s.v, 2.4);            // giant wing
    case "gbrick":   return box(s.h, s.v, 2.4);            // giant brick
    case "temple": {                                       // squared, inset centre
      const i = Math.min(s.h, s.v) * 0.44;
      return box(s.h, s.v, 1.6)
           + `<rect x="${(x-i).toFixed(2)}" y="${(y-i).toFixed(2)}" width="${(i*2).toFixed(2)}" height="${(i*2).toFixed(2)}" rx="${(i*0.34).toFixed(2)}" fill="${detail}"/>`;
    }
    case "tower":
    case "towerbig": return box(s.h, s.v, s.h*0.8);        // tall and narrow
    case "beam": {                                         // long bar, capped ends
      const w = s.h, cap = Math.min(1.3, w*0.09);
      return box(w, s.v, Math.min(0.8, s.v*0.22).toFixed(2))
           + `<rect x="${(x-w).toFixed(2)}" y="${(y-s.v).toFixed(2)}" width="${(cap*2).toFixed(2)}" height="${(s.v*2).toFixed(2)}" rx="${cap.toFixed(2)}" fill="${detail}"/>`
           + `<rect x="${(x+w-cap*2).toFixed(2)}" y="${(y-s.v).toFixed(2)}" width="${(cap*2).toFixed(2)}" height="${(s.v*2).toFixed(2)}" rx="${cap.toFixed(2)}" fill="${detail}"/>`;
    }
    case "mw":                                             // narrow bar, banded
      return box(s.h, s.v, s.h)
           + band(s.h*0.84, Math.min(0.9, s.v*0.07), y + s.v*0.16, 0.4)
           + band(s.h*0.84, Math.min(0.9, s.v*0.07), y + s.v*0.50, 0.4);
    case "bar":      return box(s.h, s.v, s.h);            // wing — plain upright bar
    default: {                                             // can / brick — capped
      const cap = Math.min(1.1, s.v*0.12);
      return box(s.h, s.v, s.h)
           + band(s.h*0.86, cap, y - s.v + cap, cap.toFixed(2))
           + band(s.h*0.86, cap, y + s.v - cap, cap.toFixed(2));
    }
  }
}

// One structure, one code.
//
// The snake is printed as nine sections but a coach calls it once, so touching
// footprints that share a code get a single label at the middle of the whole
// run. Codes go below the structure and shift above it when the slot below is
// taken, biggest structure first — without this the centre bunkers print
// "MW MW MW" on top of one another.
function bunkerLabels(list, sx, sy){
  const FS = 6, CH = 3.4, PAD = 1.2;

  // Merge touching same-code footprints, so nine snake sections read as one.
  const groups = [];
  list.forEach(b => {
    const s = bunkerSize(b, sx, sy), x = b.x*sx, y = b.y*sy;
    const box = {n: b.n, nm: callOf(b), x0:x-s.h, x1:x+s.h, y0:y-s.v, y1:y+s.v, area:s.h*s.v};
    const near = groups.find(g => g.n === box.n && g.nm === box.nm
      && g.x0 <= box.x1 + 1.5 && box.x0 <= g.x1 + 1.5
      && g.y0 <= box.y1 + 1.5 && box.y0 <= g.y1 + 1.5);
    if(!near){ groups.push(box); return; }
    near.x0 = Math.min(near.x0, box.x0); near.x1 = Math.max(near.x1, box.x1);
    near.y0 = Math.min(near.y0, box.y0); near.y1 = Math.max(near.y1, box.y1);
    near.area += box.area;
  });

  const placed = [];
  const hits = a => placed.some(b =>
    Math.abs(a.cx-b.cx) < (a.w+b.w)/2 + PAD && Math.abs(a.cy-b.cy) < (a.h+b.h)/2 + PAD);

  // Big structures claim their slot first — they are the ones a coach hunts for.
  return groups.slice().sort((a, b) => b.area - a.area).map(g => {
    const x = (g.x0+g.x1)/2, w = g.nm.length*CH + 1, h = FS;
    const below = {cx:x, cy:g.y1 + FS*0.9, w, h};
    const above = {cx:x, cy:g.y0 - FS*0.4, w, h};
    const spot = !hits(below) ? below : (!hits(above) ? above : null);
    if(!spot) return "";                       // no room — the shape still reads
    placed.push(spot);
    return `<text x="${spot.cx.toFixed(1)}" y="${(spot.cy+FS*0.35).toFixed(1)}" text-anchor="middle" font-size="${FS}" font-weight="600" fill="#f2f4f5" stroke="#0b0c0d" stroke-width="2.1" paint-order="stroke" stroke-linejoin="round">${esc(g.nm)}</text>`;
  }).join("");
}

// Segment vs. axis-aligned footprint. Used by Sightlines to decide whether a
// lane from one bunker to another actually clears everything between them.
function segHitsBox(x1,y1,x2,y2,cx,cy,hw,hh){
  // Liang–Barsky against the box, in the segment's own parameter space.
  const dx=x2-x1, dy=y2-y1;
  let t0=0, t1=1;
  const edges=[[-dx, x1-(cx-hw)],[dx,(cx+hw)-x1],[-dy, y1-(cy-hh)],[dy,(cy+hh)-y1]];
  for(const [p,q] of edges){
    if(p===0){ if(q<0) return false; continue; }
    const r=q/p;
    if(p<0){ if(r>t1) return false; if(r>t0) t0=r; }
    else   { if(r<t0) return false; if(r<t1) t1=r; }
  }
  return t0<t1;
}

function sightLines(fromId, sx, sy){
  const list = curLayout().bunkers;
  const src  = list.find(b=>b.id===fromId) || list[0];
  if(!src) return {src:null, lines:[], clear:0};
  const ox=src.x*sx, oy=src.y*sy;
  const lines = list.filter(b=>b!==src).map(b=>{
    const tx=b.x*sx, ty=b.y*sy;
    // Anything that is not the two endpoints can block the lane. Naming the
    // one in the way is the whole answer — "blocked" on its own tells a coach
    // nothing he can act on.
    const by = list.filter(o=>{
      if(o===src||o===b) return false;
      return bunkerBoxes(o).some(k =>
        segHitsBox(ox,oy,tx,ty,k.x*sx,k.y*sy,(k.w*sx)/2,(k.h*sy)/2));
    }).sort((p,q)=>Math.hypot(p.x-src.x,p.y-src.y) - Math.hypot(q.x-src.x,q.y-src.y));
    return {to:b, x:tx, y:ty, blocked:by.length>0, by,
            ft:Math.round(Math.hypot(b.x-src.x, b.y-src.y))};
  });
  return {src, lines, clear:lines.filter(l=>!l.blocked).length};
}
// The bunker nearest a tap, in feet. A bunker is about ten pixels across on a
// phone — far under anything a gloved thumb can hit — so the field takes the
// tap and the closest one wins, rather than asking anyone to land on a shape.
function bunkerAt(at){
  const list = curLayout().bunkers;
  let best = null, bestD = Infinity;
  list.forEach(b => {
    const d = Math.hypot(b.x - at[0], b.y - at[1]);
    if(d < bestD){ bestD = d; best = b; }
  });
  return bestD <= 14 ? best : null;         // 14 ft — a thumb's worth of field
}

// The moving layer, on its own. Everything else on the field — 58 bunkers,
// their labels, the ground, the wires — is identical from one animation frame
// to the next, so rebuilding it sixty times a second was most of the cost of
// playing a break. fieldSVG draws the whole thing once; paintField swaps only
// what moves.
function fieldRunners(opts={}){
  const parts = fieldSVG(opts, true);
  return parts;
}
function fieldSVG(opts={}, runnersOnly){
  const layout = curLayout();
  const W=300,H=240,sx=W/150,sy=H/120;
  const M=18;                                  // margin for the side labels
  const br = curBreak();
  const brPaths = currentPaths();
  const t = opts.static?1:S.t;

  // Break paths. A dark casing under each line keeps it readable where it
  // crosses a bunker.
  const runner = (list, colour, offset) => list.map(p=>{
    const legs=[p.from,...(p.via||[]),p.to];
    const run=drawnRun(p, legs, sx, sy);
    const xy=posAt(p,t), cx=xy[0]*sx, cy=xy[1]*sy;
    let out = `<path fill="none" d="${run}" stroke="#000000" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>`
            + `<path fill="none" d="${run}" stroke="${colour}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"${offset===0&&opts.edit?` data-leg="${p.id}"`:""}/>`;
    // In edit mode every corner is a handle: drag it, or tap it to take it out.
    if(offset===0 && opts.edit) out += (p.via||[]).map((v,vi)=>
      `<circle class="hnd" data-h="${p.id}" data-i="${vi}" cx="${(v[0]*sx).toFixed(1)}" cy="${(v[1]*sy).toFixed(1)}" r="5"/>`).join("");
    // Where the player is actually heading right now, so the chevron and the
    // lane travel with him instead of snapping to the plant.
    const a0=posAt(p,Math.max(0,t-0.02)), a1=posAt(p,Math.min(1,t+0.02));
    let travel = Math.atan2(a1[1]-a0[1], a1[0]-a0[0]);
    if(!isFinite(travel) || (a0[0]===a1[0] && a0[1]===a1[1]))
      travel = Math.atan2(p.to[1]-p.from[1], p.to[0]-p.from[0]);
    const d = offset===0 ? directOf(p.id) : {};

    if(S.shotOn){
      let ang = travel, len = 26, mark = "";
      const lane = shotLane(d.shot);
      if(lane !== null){
        // A lane the coach pointed, with no bunker named. The spec asks for
        // this as well as a target: a man can be told to hold a gap.
        ang = lane * Math.PI / 180;
        len = 34;
      } else if(d.shot){
        const tb = layout.bunkers.find(x=>x.id===d.shot);
        if(tb){
          const tx=tb.x*sx, ty=tb.y*sy;
          ang = Math.atan2(ty-cy, tx-cx);
          // Capped, because a cone drawn all the way to a far bunker swamps
          // the field. A ring on the target says what he is laning instead.
          len = Math.min(46, Math.max(14, Math.hypot(tx-cx, ty-cy) - 6));
          // The solid lane is capped so a long one does not swamp the field,
          // and a stub that stops short reads as if he is laning whatever it
          // happens to end on. A hairline carries the rest of the way to the
          // ring, so the man and the bunker he is laning are joined up.
          mark = `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="#fff" stroke-width=".9" stroke-dasharray="2 4" opacity=".55"/>`
               + `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="8" fill="none" stroke="#000" stroke-width="3" opacity=".5"/>`
               + `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="8" fill="none" stroke="#fff" stroke-width="1.4" stroke-dasharray="3 3"/>`;
        }
      }
      // The lane is a cone, not a ray, so it reads as a field of fire. White,
      // per the house rule, so it reads against both wires — but a sliver four
      // units across at a sixth opacity read against neither, and with no
      // target set it lay exactly under the face chevron, so the two came out
      // as one white scribble. It is a real wedge now, and the hard line down
      // the middle is drawn only when the coach has named the bunker: that is
      // the difference between "he is covering this" and "he is laning that".
      const sp=0.22, P=(o,l)=>`${(cx+Math.cos(ang+o)*l).toFixed(1)},${(cy+Math.sin(ang+o)*l).toFixed(1)}`;
      const tip=P(0,len).split(",");
      const named = !!d.shot && lane === null;
      out += `<polygon points="${cx.toFixed(1)},${cy.toFixed(1)} ${P(-sp,len)} ${P(sp,len)}" fill="#fff" opacity="${named?".22":".3"}" stroke="#000" stroke-width=".8" stroke-opacity=".5"/>`;
      if(d.shot) out += `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tip[0]}" y2="${tip[1]}" stroke="#000" stroke-width="3.6" stroke-linecap="round" opacity=".55"/>`
           + `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tip[0]}" y2="${tip[1]}" stroke="#fff" stroke-width="2" stroke-linecap="round"/>`;
      out += mark;
    }

    if(S.faceOn){
      const fa = (d.face!=null && d.face!==undefined) ? d.face*Math.PI/180 : travel;
      // The chevron is his body, so it sits on the marker as its nose. Out at
      // arm's length it collided with the shot lane and neither read.
      const fx=cx+Math.cos(fa)*9, fy=cy+Math.sin(fa)*9;
      const W=(o)=>`${(fx-Math.cos(fa+o)*4.6).toFixed(1)},${(fy-Math.sin(fa+o)*4.6).toFixed(1)}`;
      const pts=`${W(-0.85)} ${fx.toFixed(1)},${fy.toFixed(1)} ${W(0.85)}`;
      out += `<polyline points="${pts}" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>`
           + `<polyline points="${pts}" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    out += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="${colour}" stroke="#fff" stroke-width="1.4"${offset===0&&opts.edit?` class="aim" data-aim="${p.id}"`:""}/>`
         + `<text x="${cx.toFixed(1)}" y="${(cy+2.6).toFixed(1)}" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="700">${p.id+offset}</text>`;
    return out;
  }).join("");

  let paths = opts.noPaths ? "" : runner(brPaths, opts.color||"#e5342f", 0);
  if(opts.both){
    const flip=q=>[150-q[0],q[1]];
    paths += runner(brPaths.map(p=>({...p,from:flip(p.from),to:flip(p.to),via:(p.via||[]).map(flip)})), "#3d8bff", 5);
  }

  // Sightlines replace the break paths when a source bunker is picked.
  let sight = "";
  if(opts.sightFrom){
    const S1 = sightLines(opts.sightFrom, sx, sy);
    paths = "";
    if(S1.src){
      const fx=(S1.src.x*sx).toFixed(1), fy=(S1.src.y*sy).toFixed(1);
      const lit = opts.sightTo;              // the one lane being asked about
      sight = S1.lines.map(l=>{
        const on = lit && l.to.id === lit;
        const dim = lit && !on;
        return `<line x1="${fx}" y1="${fy}" x2="${l.x.toFixed(1)}" y2="${l.y.toFixed(1)}" `
          + `stroke="${l.blocked?"#e5342f":"#3ecf8e"}" stroke-width="${on?3:l.blocked?1:1.6}" `
          + `opacity="${dim?.08:on?1:l.blocked?.22:.85}" stroke-linecap="round"/>`;
      }).join("")
      // What is in the way of the asked-about lane, ringed so it is findable.
      + (lit ? (S1.lines.find(l=>l.to.id===lit)?.by || []).map(o=>
          `<circle cx="${(o.x*sx).toFixed(1)}" cy="${(o.y*sy).toFixed(1)}" r="6" fill="none" stroke="#e5342f" stroke-width="1.6"/>`
        ).join("") : "")
      + (lit ? (()=>{ const t=S1.lines.find(l=>l.to.id===lit);
          return t ? `<circle cx="${t.x.toFixed(1)}" cy="${t.y.toFixed(1)}" r="6" fill="none" stroke="#fff" stroke-width="1.6"/>` : ""; })() : "")
      + `<circle cx="${fx}" cy="${fy}" r="7" fill="none" stroke="#fff" stroke-width="1.8"/>`;
    }
  }

  const bunks = layout.bunkers.map(b=>`<g class="bnk" data-b="${b.id}">${bunkerShape(b,sx,sy)}</g>`).join("");
  const pick = opts.pick
    ? `<rect data-pick="1" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>` : "";

  // Movement draws each logged rotation as an arrow between two footprints.
  let moveArrows = "";
  if(opts.moves){
    const byId = Object.fromEntries(layout.bunkers.map(b=>[b.id,b]));
    moveArrows = layoutMoves().filter(typeof opts.moves === "function" ? opts.moves : () => true)
      .slice(0,40).map(m=>{
      const a=byId[m.from], b=byId[m.to]; if(!a||!b) return "";
      const x1=a.x*sx, y1=a.y*sy, x2=b.x*sx, y2=b.y*sy;
      const ang=Math.atan2(y2-y1,x2-x1), L=Math.hypot(x2-x1,y2-y1);
      if(L<6) return "";
      // stop short of the target so the head sits beside it, not on it
      const tx=x2-Math.cos(ang)*5, ty=y2-Math.sin(ang)*5;
      const head=(o)=>`${(tx-Math.cos(ang-o)*5).toFixed(1)},${(ty-Math.sin(ang-o)*5).toFixed(1)}`;
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="#000" stroke-width="3.4" opacity=".5" stroke-linecap="round"/>`
           + `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="#3ecf8e" stroke-width="1.6" opacity=".95" stroke-linecap="round"/>`
           + `<polygon points="${tx.toFixed(1)},${ty.toFixed(1)} ${head(0.5)} ${head(-0.5)}" fill="#3ecf8e"/>`;
    }).join("");
  }

  // Bunker stats tint each footprint by how much traffic the tally recorded.
  let heat = "";
  if(opts.heat){
    const t = bunkerTraffic(typeof opts.heat === "function" ? opts.heat : null);
    const peak = Math.max(1, ...Object.values(t).map(v=>v.outs+v.visits));
    heat = layout.bunkers.map(b=>{
      const v = t[b.id]; if(!v) return "";
      const s2 = bunkerSize(b, sx, sy);
      const k = (v.outs+v.visits)/peak;
      // A ring, not a tint: a red wash would vanish on a red bunker.
      return `<rect x="${(b.x*sx-s2.h-3).toFixed(1)}" y="${(b.y*sy-s2.v-3).toFixed(1)}" width="${(s2.h*2+6).toFixed(1)}" height="${(s2.v*2+6).toFixed(1)}" rx="4" fill="none" stroke="#ffb020" stroke-width="${(1.2+k*3).toFixed(1)}" opacity="${(0.5+k*0.5).toFixed(2)}"/>`;
    }).join("");
  }

  /* Where men actually went out, and where they went out both ways.
   *
   * An X sits on a bunker somebody was shot at, one arm heavier the more often
   * it happened. A ring around it means the trade went both directions there —
   * we lost men behind that paint and so did they. That is a gunfight, and it
   * is the thing a coach wants off a field drawing rather than a table: the two
   * or three bunkers where the point is actually decided.
   *
   * Both are counted straight off the tally, on this layout. Nothing is
   * modelled, and a bunker nobody has been shot at carries no mark at all. */
  let outs = "";
  if(opts.outs){
    const here = new Set(layout.bunkers.map(b=>b.id));
    const at = {};
    (S.tally||[]).forEach(o => {
      if(typeof o!=="object" || o.layout!==layout.key || !o.shotAt || !here.has(o.shotAt)) return;
      at[o.shotAt] = at[o.shotAt] || {us:0, them:0};
      at[o.shotAt][o.side==="them"?"them":"us"]++;
    });
    const peak = Math.max(1, ...Object.values(at).map(v=>v.us+v.them));
    outs = layout.bunkers.map(b => {
      const v = at[b.id]; if(!v) return "";
      const n = v.us + v.them, k = n/peak;
      const s2 = bunkerSize(b, sx, sy);
      const x = b.x*sx, y = b.y*sy;
      const r = Math.max(6, Math.min(s2.h, s2.v) + 4 + k*4);
      const w = (1.4 + k*2.2).toFixed(1);
      // White, like the shot lanes, because it has to read on a red bunker and
      // on a blue one.
      let g = `<g opacity="${(0.55+k*0.45).toFixed(2)}">`
        + `<path d="M${(x-r*0.55).toFixed(1)} ${(y-r*0.55).toFixed(1)}L${(x+r*0.55).toFixed(1)} ${(y+r*0.55).toFixed(1)}`
        + `M${(x+r*0.55).toFixed(1)} ${(y-r*0.55).toFixed(1)}L${(x-r*0.55).toFixed(1)} ${(y+r*0.55).toFixed(1)}" `
        + `stroke="#000" stroke-width="${(+w+2).toFixed(1)}" stroke-linecap="round" opacity=".6"/>`
        + `<path d="M${(x-r*0.55).toFixed(1)} ${(y-r*0.55).toFixed(1)}L${(x+r*0.55).toFixed(1)} ${(y+r*0.55).toFixed(1)}`
        + `M${(x+r*0.55).toFixed(1)} ${(y-r*0.55).toFixed(1)}L${(x-r*0.55).toFixed(1)} ${(y+r*0.55).toFixed(1)}" `
        + `stroke="#efedeb" stroke-width="${w}" stroke-linecap="round"/>`;
      // Traded both ways: the ring, as heavy as the thinner side of the trade.
      if(v.us && v.them){
        const two = Math.min(v.us, v.them) / peak;
        g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="none" `
           + `stroke="#000" stroke-width="${(2.2+two*3).toFixed(1)}" opacity=".55"/>`
           + `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="none" `
           + `stroke="#ffb020" stroke-width="${(1.2+two*2.6).toFixed(1)}"/>`;
      }
      return g + "</g>";
    }).join("");
  }

  /* Their five, where you have seen them set up.
   *
   * Not the break: the break paths on this field are your own call, mirrored to
   * the far side so the two can be read together. This is the other thing a
   * coach wants on a field drawing — the men themselves, at the bunkers you
   * logged them at, in that pit's wire colour with the number he wears. Only
   * the ones you have actually placed appear; a player you have not seen plant
   * is not guessed onto a bunker.
   */
  let their = "";
  if(opts.their){
    const sides = opts.both ? [["left", "#e5342f"], ["right", "#3d8bff"]]
                            : [["right", "#3d8bff"]];
    their = sides.map(([side, colour]) => {
      const men = (pitOf(side).players || []);
      return men.map(m => {
        const b = layout.bunkers.find(x => x.id === plantOf(m));
        if(!b) return "";
        const x = b.x * sx, y = b.y * sy;
        const tag = (m.num || "").toString().slice(0, 2) || "·";
        // A square, not a circle. A runner on the break is a circle, and at six
        // pixels a dashed outline is not a difference you can see on a sideline
        // — the shape is. Same wire colour, so it is still obvious whose man he
        // is; different shape, so he is never mistaken for the break.
        const r = 6.2;
        return `<g opacity=".95">`
          + `<rect x="${(x-r-0.6).toFixed(1)}" y="${(y-r-0.6).toFixed(1)}" `
          + `width="${(r*2+1.2).toFixed(1)}" height="${(r*2+1.2).toFixed(1)}" rx="2.4" fill="#000" opacity=".55"/>`
          + `<rect x="${(x-r).toFixed(1)}" y="${(y-r).toFixed(1)}" width="${(r*2).toFixed(1)}" `
          + `height="${(r*2).toFixed(1)}" rx="2" fill="${colour}" stroke="#efedeb" stroke-width="1.3"/>`
          + `<text x="${x.toFixed(1)}" y="${(y + 2.6).toFixed(1)}" text-anchor="middle" `
          + `font-size="7" fill="#fff" font-weight="800">${esc(tag)}</text></g>`;
      }).join("");
    }).join("");
  }

  if(runnersOnly) return paths;

  return `<svg class="field" viewBox="-8 ${-M} ${W+16} ${H+M*2}">
    <defs>
      <!-- The official map paints every bunker red or blue; both are sampled
           from it. They sit a step darker than the wires (#e5342f / #3d8bff)
           so the break paths still lead the eye. -->
      <linearGradient id="bnkRed" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c2453d"/>
        <stop offset="1" stop-color="#7d1512"/>
      </linearGradient>
      <linearGradient id="bnkBlue" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a49c4"/>
        <stop offset="1" stop-color="#25246e"/>
      </linearGradient>
      <!-- A layout whose colour was never sampled stays neutral rather than
           being guessed into one of the two. -->
      <linearGradient id="bnkFace" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d4d6d7"/>
        <stop offset="1" stop-color="#8d9092"/>
      </linearGradient>
      <filter id="bnkLift" x="-40%" y="-40%" width="180%" height="200%">
        <feDropShadow dx="0" dy="1.1" stdDeviation="1" flood-color="#000000" flood-opacity=".55"/>
      </filter>
    </defs>

    <rect x="-8" y="${-M}" width="${W+16}" height="${H+M*2}" fill="#0b0c0d"/>
    <rect width="${W}" height="${H}" fill="#101111"/>
    ${[...Array(10)].map((_,i)=>i%2?`<rect x="${i*(W/10)}" y="0" width="${W/10}" height="${H}" fill="#0c0d0e"/>`:"").join("")}
    <rect width="${W}" height="${H}" fill="none" stroke="#33383a" stroke-width="1" opacity=".9"/>
    <line x1="${W/2}" y1="0" x2="${W/2}" y2="${H}" stroke="#e8e8e8" stroke-width=".8" stroke-dasharray="5 7" opacity=".26"/>
    <line x1="4" y1="0" x2="4" y2="${H}" stroke="#e8e8e8" stroke-width=".8" opacity=".22"/>
    <line x1="${W-4}" y1="0" x2="${W-4}" y2="${H}" stroke="#e8e8e8" stroke-width=".8" opacity=".22"/>

    <g filter="url(#bnkLift)">${bunks}</g>
    ${heat}
    ${outs}
    ${moveArrows}
    ${sight}
    ${bunkerLabels(layout.bunkers, sx, sy)}
    <g class="live">${paths}</g>
    ${/* Their men sit above the break, or a marker disappears under a path the
          moment the two coincide — which is exactly where a scouted plant and a
          break runner both want to be. */""}
    ${their}
    ${opts.overlay || ""}
    ${pick}

    <text x="${W/2}" y="${-M+8}" text-anchor="middle" fill="#8d9092" font-size="8" font-weight="700" letter-spacing="1.6">DORITO SIDE</text>
    <text x="${W/2}" y="${H+M-4}" text-anchor="middle" fill="#8d9092" font-size="8" font-weight="700" letter-spacing="1.6">SNAKE SIDE</text>
  </svg>`;
}

/* ============================================================
   Scouting — what you know about a team, kept with the team
   ============================================================

   The two pits used to hold the film read themselves. They are slots, not
   teams, so tapping another team on the division board left your note behind
   and silently reattached it to whoever you tapped. A read on the Rejects
   became a read on Las Vegas Shock. Everything you learn now lives under the
   team's name and follows it in and out of the pit. */
function teamMeta(name){
  return anyTeam(name) || {name};
}
function profileOf(name){
  if(!name) return {tend:"Balanced", threat:3, notes:"", players:[], breaks:[],
                    answers:{}, unscored:true};
  const kept = (S.scout || {})[name];
  if(kept) return {players:[], breaks:[], answers:{}, ...kept};
  // Seeded where the event data knew; neutral where it did not. A team nobody
  // has scored is a 3 because that is the middle, not because it is average.
  const t = teamMeta(name);
  return {tend: t.tend === "Snake" ? "Snake" : t.tend === "Dorito" ? "Dorito" : "Balanced",
          threat: t.threat || 3, notes: "", players: [], breaks: [], answers: {},
          unscored: t.threat === undefined};
}
/* Who is in a pit, or nobody.
 *
 * This used to fall back to the first team of the division, and the app shipped
 * with two real teams already in the pits. A coach who never picked anyone saw
 * two strangers on five tabs — and once a match record existed, every out he
 * tallied was stamped with a team he had never played. That is invented
 * opposition written into his season, which is the same thing the pro board is
 * forbidden from doing.
 *
 * So an unset pit has no name. `named` is what callers branch on; the display
 * name is theirs to choose, because "Them" is right on a point sheet and
 * "Pick a team" is right on a picker.
 */
function pitOf(side){
  const name = ((S[side] || {}).name) || "";
  return {name, named: !!name, pts: name ? teamMeta(name).pts : undefined, ...profileOf(name)};
}
const pitNamed = side => !!((S[side] || {}).name);
// What to print for a pit. Never a team the coach did not pick: the caller says
// what an empty one reads as, because "Them" is right on a point sheet and
// "Right pit" is right on a legend.
const pitName = (side, blank) => ((S[side] || {}).name) || blank;
function scouted(name){
  const p = (S.scout || {})[name];
  return !!p && (!!(p.notes || "").trim() || (p.players || []).length > 0);
}
function editProfile(side, patch){
  const name = pitOf(side).name;
  // Nobody in the pit means nothing to write against. Without this the scout
  // book grows an entry keyed on the empty string that no team can ever reach.
  if(!name) return;
  S.scout = {...(S.scout || {}), [name]: {...profileOf(name), ...patch}};
  save(S);
}
window.setPitTeam = (side, name) => {
  S[side] = {...(S[side] || {}), name: name || ""};
  if(side === "right") adoptPitAsOpponent();
  save(S); render();
};
window.setPitTend = (side, tend) => { editProfile(side, {tend}); render(); };
window.setPitNotes = (side, notes) => editProfile(side, {notes: clean(notes)});   // no redraw mid-type

// ---- what they ran, logged as you see it ----
// Nothing recorded the opponent's call. Their tendency was a single word you
// picked off film; this is the count behind it.
function theirBreaks(side){ return pitOf(side).breaks || []; }
function breakFreq(side){
  const seen = theirBreaks(side).reduce((m,b) => ({...m, [b.script]:(m[b.script]||0)+1}), {});
  return Object.entries(seen).sort((a,b) => b[1]-a[1]);
}
window.logTheirBreak = (side, script) => {
  editProfile(side, {breaks: [{script, pt:S.point||1, at:Date.now()}, ...theirBreaks(side)]});
  render();
};
window.unlogTheirBreak = (side, i) => {
  editProfile(side, {breaks: theirBreaks(side).filter((_,k) => k !== i)});
  render();
};

/* ---- the opponent library: they run X, we run Y --------------------------
 *
 * The spec's Opp chip. An answer is stored against the team, not the pit, so
 * it follows them in and out of the slot like everything else you know about
 * them, and it is the coach's own — nothing here proposes one. The
 * counter-picker already ranks the twelve by a heuristic; this is the line a
 * coach wrote down after watching them, which beats a heuristic every time. */
function answersFor(side){ return pitOf(side).answers || {}; }
window.setAnswer = (side, theirs, ours) => {
  const all = {...answersFor(side)};
  if(ours) all[theirs] = ours; else delete all[theirs];
  editProfile(side, {answers: all});
  render();
};
// What you have written down for the call they run most, if you have one.
function oppAnswer(side){
  const f = breakFreq(side);
  const a = answersFor(side);
  const hit = f.find(([k]) => a[k]);
  return hit ? {theirs: hit[0], ours: a[hit[0]], seen: hit[1]} : null;
}

// ---- the other pit's five, which is the point of scouting at all ----
window.addScoutPlayer = side => {
  const g = id => (document.getElementById(id) || {}).value || "";
  const num = g("sp-num-" + side).trim(), name = clean(g("sp-name-" + side).trim());
  if(!num && !name) return;                       // a number alone is a real entry
  editProfile(side, {players: [...pitOf(side).players, {
    num, name, wire: g("sp-wire-" + side), note: clean(g("sp-note-" + side).trim()), threat: 3,
  }]});
  render();
};
window.editScoutPlayer = (side, i, field, value) => {
  const players = pitOf(side).players.map((p, k) => k === i ? {...p, [field]: clean(String(value).trim())} : p);
  editProfile(side, {players});
};
/* Where you have seen one of their men set up.
 *
 * A wire is the rough answer — snake, dorito, centre — and it is what the
 * roster row has carried. The useful answer on a sideline is the bunker, and
 * a bunker only means something on one field, so it is kept per layout: the
 * same player plants somewhere else at the next event and both are true.
 */
function plantOf(m){ return ((m || {}).plant || {})[S.layoutKey] || ""; }
window.setScoutPlant = (side, i, id) => {
  editProfile(side, {players: pitOf(side).players.map((p, k) =>
    k === i ? {...p, plant: {...(p.plant || {}), [S.layoutKey]: id || undefined}} : p)});
  // editProfile saves without redrawing, so typing in a note is not interrupted.
  // A plant is not typing: it moves a man on the field and has to show.
  render();
};
window.setScoutThreat = (side, i, n) => {
  editProfile(side, {players: pitOf(side).players.map((p, k) => k === i ? {...p, threat:n} : p)});
  render();
};
// ---- rosters the league published ----
// Not scouting. These are names off the league's own pages, and they go in
// flagged as published so a name nobody here has watched is never mistaken for
// something a coach saw. A team is in this list only if its roster was actually
// read somewhere; the rest stay empty rather than being filled in from memory.
const PRO_ROSTERS = {
  "San Diego Dynasty": {
    read: "September 2026",
    src: "the NXL team page and the team's 2026 roster write-up",
    men: [{num:"7", name:"Alex Fraige"}, {num:"18", name:"Ryan Greenspan"},
          {num:"32", name:"Yosh Rau"}, {num:"", name:"Eliot Weaver"},
          {num:"", name:"Archie Barnes Jr"}],
  },
};
function published(name){ return PRO_ROSTERS[name] || null; }
window.addPublished = side => {
  const name = pitOf(side).name, r = published(name);
  if(!r) return;
  const have = pitOf(side).players;
  const add = r.men
    .filter(p => !have.some(h => (p.num && h.num === p.num) ||
                                 (h.name || "").toLowerCase() === p.name.toLowerCase()))
    .map(p => ({num: p.num, name: p.name, wire: "Flex", note: "", threat: 3, from: "published"}));
  editProfile(side, {players: [...have, ...add]});
  render();
};

// ---- a roster read off a screenshot ----
// Nothing is fetched: there is no network in this app and there is not going to
// be one. The phone already reads text out of a picture — press and hold a
// screenshot in Photos on iOS, tap the text button in Lens on Android — so the
// coach copies it there and drops it in here. What arrives is loose and messy,
// so it is parsed, shown back, and only added once he has looked at it.
const ROSTER_JUNK = /^(#|no\.?|num(ber)?|player(s)?|name|roster|pos(ition)?|team(s)?|division|class|event|rank(ing)?|pts|points|paid|owed|reg(istration)?|status|home|menu|share|follow|back)$/i;
const ROSTER_WIRE = [[/\bsnake\b/i,"Snake"],[/\bdorito\b/i,"Dorito"],[/\bcent(er|re)\b/i,"Centre"],[/\bback\b/i,"Back"]];
// The class column travels with the name on a phone screenshot: "18 Ryan
// Greenspan Pro". Jr and Sr are part of a man's name and are never stripped.
const ROSTER_CLASS = /^(pro|semi|semi-pro|semipro|am|amateur|novice|rookie|d[1-5]|div|division|open|race|champs|champions|ladies|women'?s|mens|youth|xball|x-ball)$/i;
const NAME_PARTICLE = /^(van|von|de|del|della|der|di|da|la|le|du|st\.?|mc|mac|ter|ten)$/i;
// A screenshot carries the phone's own status bar: "9:41 LTE 100%".
const PHONE_CHROME = /^\d{1,2}:\d{2}\b|^(lte|5g|4g|wi-?fi|carrier)\b/i;
function looksLikeName(s){
  const words = s.split(" ").filter(Boolean);
  if(!words.length || words.length > 4 || s.length > 40) return false;
  return words.every(w => /^[A-Za-z][A-Za-z'’.\-]*$/.test(w)) &&
         // A man's name is capitalised on the page and comes through OCR that
         // way. Prose does not: "days before the event" used to read as a
         // player because every word in it is a word.
         words.every((w, i) => /^[A-Z]/.test(w) || (i > 0 && NAME_PARTICLE.test(w)));
}
function parseRoster(text, team){
  const found = [], skipped = [];
  const known = n => !!anyTeam(n) || (team || "").toLowerCase() === n.toLowerCase();
  String(text || "").split(/[\n\r]+/).forEach(raw => {
    const line = raw.replace(/[|\t,;]+/g, " ").replace(/^[•\-–*]\s*/, "")
                    .replace(/\s+/g, " ").trim();
    if(!line) return;
    if(PHONE_CHROME.test(line)) return;                    // the phone's own status bar
    // one heading, or a whole header row of them: "Player  No.", "# Name Team"
    if(line.split(" ").every(w => ROSTER_JUNK.test(w))) return;
    let rest = line, num = "";
    const lead = rest.match(/^#?\s*(\d{1,3})\b\s*/);
    const tail = rest.match(/\s*#?\s*(\d{1,3})$/);
    if(lead){ num = lead[1]; rest = rest.slice(lead[0].length); }
    else if(tail){ num = tail[1]; rest = rest.slice(0, tail.index); }
    let wire = "";
    ROSTER_WIRE.forEach(([re, w]) => {
      if(!wire && re.test(rest)){ wire = w; rest = rest.replace(re, " "); }
    });
    rest = rest.replace(/[^A-Za-z'’.\- ]/g, " ").replace(/\s+/g, " ").trim();
    let words = rest.split(" ").filter(Boolean);           // shed the class column
    while(words.length && ROSTER_CLASS.test(words[words.length - 1])) words.pop();
    rest = words.join(" ");
    if(!rest && !num){ skipped.push(line); return; }
    if(rest && known(rest)) return;                        // the team's own name, not a man
    if(rest && !looksLikeName(rest)){ skipped.push(line); return; }   // prose, not a player
    found.push({num, name: clean(rest), wire: wire || "Flex", note: "", threat: 3});
  });
  return {found: found.slice(0, 40), skipped};
}
window.openPaste = side => { S.pasteSide = side; S.paste = null; S.pasteNote = ""; save(S); render(); };
window.closePaste = () => { S.pasteSide = ""; S.paste = null; save(S); render(); };
window.readRoster = side => {
  const el = document.getElementById("rosterIn"), text = el ? el.value : "";
  S.paste = {side, text, ...parseRoster(text, pitOf(side).name)};
  save(S); render();
};
window.dropPasted = i => {
  S.paste = {...S.paste, found: S.paste.found.filter((_, k) => k !== i)};
  save(S); render();
};
window.keepRoster = () => {
  const {side, found} = S.paste || {};
  if(!side || !(found || []).length) return;
  const have = pitOf(side).players;
  const dupe = p => have.some(h => (p.num && h.num === p.num) ||
                                  (p.name && (h.name || "").toLowerCase() === p.name.toLowerCase()));
  const add = found.filter(p => !dupe(p));
  editProfile(side, {players: [...have, ...add]});
  const already = found.length - add.length;
  S.pasteSide = ""; S.paste = null;
  S.pasteNote = `Added ${add.length}.` + (already ? ` ${already} ${already===1?"was":"were"} already logged.` : "");
  save(S); render();
};
window.delScoutPlayer = (side, i) => {
  editProfile(side, {players: pitOf(side).players.filter((_, k) => k !== i)});
  render();
};

function stars(n, key){
  return [1,2,3,4,5].map(i=>`<button class="star ${i<=n?"on":""}" aria-label="Threat ${i}" onclick="setThreat('${key}',${i})">${i<=n?"★":"☆"}</button>`).join("");
}
window.setThreat=(side,n)=>{editProfile(side,{threat:n});render()}

function staffed(){return S.role==="staff"||S.role==="admin"}

/* ============================================================
   View helpers
   ============================================================ */
const esc = v => String(v==null?"":v).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
// Handler arguments need JavaScript string encoding *and* HTML encoding. HTML
// escaping alone turns O'Brien into a broken call, and entities/backslashes can
// become executable syntax when the browser decodes the attribute.
const jsq = v => esc(JSON.stringify(String(v == null ? "" : v)));

// The staff password never touches storage in the clear. It is salted and
// hashed with the platform's own crypto, and only the hash is kept — so a
// shared or stolen phone does not hand over the password itself.
const STAFF_KEY = "gridlock.staff.v2";
async function hashPass(pass, saltHex){
  const enc = new TextEncoder().encode(saltHex + "|" + pass);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function newSalt(){
  return [...crypto.getRandomValues(new Uint8Array(16))]
    .map(b => b.toString(16).padStart(2, "0")).join("");
}

/* The staff account is kept alongside the season, and for the same reason: the
 * season coming back on a phone the coach can no longer sign in to is half a
 * rescue — creating a class and sending a blast are both gated on it. */
function writeAccount(acc){
  const text = JSON.stringify(acc);
  try{ localStorage.setItem(STAFF_KEY, text); }catch(e){}
  if(window.gridlockKeep) try{ window.gridlockKeep(text, STAFF_KEY); }catch(e){}
}
window.gridlockRestoreAccount = text => {
  let have = null;
  try{ have = JSON.parse(localStorage.getItem(STAFF_KEY) || "null"); }catch(e){}
  if(have && have.email) return false;              // this phone has one already
  let d = null;
  try{ d = JSON.parse(text); }catch(e){ return false; }
  if(!d || !d.email || !d.hash) return false;
  try{ localStorage.setItem(STAFF_KEY, text); }catch(e){}
  return true;
};

window.doAuth = async () => {
  const email = document.getElementById("em").value.trim();
  const pass = document.getElementById("pw").value;
  if(!email || pass.length < 6){ alert("Email and a password of 6 characters or more."); return; }
  if(!(window.crypto && crypto.subtle)){
    alert("This browser cannot hash the password securely, so sign-in is disabled here. Use the app, or a browser on https.");
    return;
  }
  let acc = {};
  try{ acc = JSON.parse(localStorage.getItem(STAFF_KEY) || "{}"); }catch(e){}

  if(S.mode === "create"){
    // Creating over an account that is already here is how a coach who meant to
    // sign in loses the one he had — nothing else on the phone can get it back.
    if(acc.email && acc.email !== email &&
       !confirm(`This phone already has ${acc.email}. Making a new account replaces it, `
              + `and there is no way back. Continue?`)) return;
    const salt = newSalt();
    writeAccount({email, salt, hash: await hashPass(pass, salt)});
    localStorage.removeItem("gridlock.staff");   // drop any old clear-text account
    set({entered:true, role:"staff", email, mode:null});
    return;
  }

  if(acc.email === email && acc.salt && acc.hash === await hashPass(pass, acc.salt)){
    set({entered:true, role:"staff", email, mode:null});
    return;
  }

  // An account made before hashing is upgraded on the next correct sign-in
  // rather than locking the coach out of his own phone.
  let old = {};
  try{ old = JSON.parse(localStorage.getItem("gridlock.staff") || "{}"); }catch(e){}
  if(old.email === email && old.pass === pass){
    const salt = newSalt();
    writeAccount({email, salt, hash: await hashPass(pass, salt)});
    localStorage.removeItem("gridlock.staff");
    set({entered:true, role:"staff", email, mode:null});
    return;
  }
  alert("Email or password does not match. Create an account first.");
};

function cardLines(){
  const five = fiveFor(S.point || 1);
  return currentPaths().map((p, i) => {
    const d = directOf(p.id);
    const who = five[i];
    const lane = shotLane(d.shot);
    const shotB = d.shot ? curLayout().bunkers.find(b => b.id === d.shot) : null;
    // His card is the app speaking to him, so it uses his word for the bunker
    // where he has one. The field keeps the team's.
    const mine = who && who.name;
    return {n: p.id, who, job: p.label, wire: wireOf((curLayout().bunkers.find(b => b.id === p.bunker) || {y:60}).y),
            bunker: callOf(curLayout().bunkers.find(b => b.id === p.bunker) || {n: "—"}, mine),
            role: d.role === "S" ? "Secondary" : "Primary",
            face: d.face != null ? LANE_NAME[d.face] : "with the run",
            shot: lane !== null ? LANE_NAME[lane] : shotB ? callOf(shotB, mine) : "the lane he is running"};
  });
}
window.shareCards = () => {

        + `   ${c.bunker} · ${c.job}\n   ${c.role} · faces ${c.face} · lanes ${c.shot}`).join("\n\n");
  if(window.gridlockShare) window.gridlockShare(t, "GRIDLOCK cards"); else prompt("Cards", t);
};

/* ============================================================
   Rep — the recognition drill
   ============================================================

   The spec asks for the break run at the coach until the call is instant,
   under two seconds. So the field draws one of the twelve with nothing naming
   it — not the card, not the header — and the clock runs from the moment it is
   on screen to the moment he taps. The call he was on is put back when he
   stops: a drill must not quietly change what he is about to call. */
const REP_TARGET = 2000;
function repState(){ return S.rep || {log:[]}; }
window.startRep = () => {
  const keys = Object.keys(BREAKS);
  S.rep = {running:true, was:S.script, wasT:S.t, log:[],
           ask:keys[Math.floor(Math.random()*keys.length)], at:Date.now()};
  S.script = S.rep.ask; S.t = 1; S.playing = false; S.pbView = "rep";
  dropPathCache(); save(S); render();
};
window.answerRep = key => {
  const r = repState();
  if(!r.running || !r.ask) return;
  const ms = Date.now() - r.at;
  const keys = Object.keys(BREAKS).filter(k => k !== r.ask);
  const next = keys[Math.floor(Math.random()*keys.length)];
  S.rep = {...r, log:[{ask:r.ask, said:key, ms, right:key === r.ask}, ...r.log],
           ask: next, at: Date.now()};
  S.script = next; S.t = 1;
  save(S); render();
};
window.stopRep = () => { endRep(); save(S); render(); };
function repScore(){
  const log = repState().log || [];
  const right = log.filter(x => x.right);
  const avg = right.length ? Math.round(right.reduce((a, x) => a + x.ms, 0) / right.length) : 0;
  return {n: log.length, right: right.length, avg,
          best: right.length ? Math.min(...right.map(x => x.ms)) : 0};
}
