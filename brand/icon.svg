<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1e1f"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.02" r="0.78">
      <stop offset="0" stop-color="#ad1515" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ad1515" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5252a"/>
      <stop offset="1" stop-color="#a01010"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#tile)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="3">
    <path d="M0 341H1024M0 683H1024M341 0V1024M683 0V1024"/>
  </g>

  <!-- the call: face chevron -->
  <path d="M512 196 L742 474 L636 474 L512 324 L388 474 L282 474 Z" fill="url(#mark)"/>

  <!-- the five: players breaking off the start line -->
  <g fill="url(#mark)">
    <circle cx="222" cy="754" r="62"/>
    <circle cx="367" cy="700" r="62"/>
    <circle cx="512" cy="678" r="62"/>
    <circle cx="657" cy="700" r="62"/>
    <circle cx="802" cy="754" r="62"/>
  </g>

  <!-- start line -->
  <rect x="222" y="856" width="580" height="16" rx="8" fill="#efedeb" fill-opacity="0.34"/>
</svg>
