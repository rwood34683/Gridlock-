<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17263f"/>
      <stop offset="1" stop-color="#070d17"/>
    </linearGradient>
    <radialGradient id="turf" cx="0.5" cy="0.02" r="0.78">
      <stop offset="0" stop-color="#1e6b3a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1e6b3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8d97e"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#tile)"/>
  <rect width="1024" height="1024" fill="url(#turf)"/>

  <!-- grid turf -->
  <g stroke="#2a3a55" stroke-opacity="0.5" stroke-width="3">
    <path d="M0 341H1024M0 683H1024M341 0V1024M683 0V1024"/>
  </g>

  <!-- the call: face chevron -->
  <path d="M512 196 L742 474 L636 474 L512 324 L388 474 L282 474 Z" fill="url(#gold)"/>

  <!-- the five: players breaking off the start line -->
  <g fill="url(#gold)">
    <circle cx="222" cy="754" r="62"/>
    <circle cx="367" cy="700" r="62"/>
    <circle cx="512" cy="678" r="62"/>
    <circle cx="657" cy="700" r="62"/>
    <circle cx="802" cy="754" r="62"/>
  </g>

  <!-- start line -->
  <rect x="222" y="856" width="580" height="16" rx="8" fill="#e8eef8" fill-opacity="0.32"/>
</svg>
