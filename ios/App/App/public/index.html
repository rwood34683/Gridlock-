// A bunker laid across the field at an angle — Tampa Bay prints six beam
// sections in two Vs — is a poor fit for one field-aligned box: the box that
// contains it is half again as wide as the beam and blocks lanes the beam
// leaves open. Everything that asks what a bunker blocks asks for its boxes
// instead, and an angled one comes back as three along its length.
function bunkerBoxes(b){
  const w = b.w || 4, h = b.h || 4;
  if(!b.a || b.t !== "beam") return [{x:b.x, y:b.y, w, h}];
  // Squares the thickness of the beam, laid end to end along it. Fewer and
  // fatter boxes would be quicker and would block lanes the beam leaves open,
  // which is the whole thing this is here to avoid; the spacing below never
  // exceeds a box, so there is no gap to shoot through either.
  const t = b.a * Math.PI / 180;
  const span = w - h;
  const n = Math.max(2, Math.ceil(span / h) + 1);
  const out = [];
  for(let i = 0; i < n; i++){
    const d = -span / 2 + (span * i) / (n - 1);
    out.push({x: b.x + d * Math.cos(t), y: b.y + d * Math.sin(t), w: h, h: h});
  }
  return out;
}

// The outline is stroked, and a stroke straddles the line it is drawn on, so
// a shape built at its measured size paints half a stroke wider all round —
// a quarter of a foot on a snake beam a foot and a half thick, which reads
// as a fat beam. So the geometry is inset by half the stroke and the paint
// lands on the measurement. tools/verify_bunkers.js adds it back.
const BNK_STROKE = 0.7;
function bunkerSize(b, sx=2, sy=2){
  if(b.w && b.h) return {h:Math.max(0.4, (b.w*sx - BNK_STROKE)/2),
                         v:Math.max(0.4, (b.h*sy - BNK_STROKE)/2)};
  return BUNKER[b.t] || BUNKER.can;
}

// One material for every bunker so the silhouette carries the type, and the
// red and blue break paths stay the loudest thing on the field.
function bunkerShape(b, sx, sy){
  const x = b.x*sx, y = b.y*sy, s = bunkerSize(b, sx, sy);
  // b.c is the body colour sampled off the official map, b.d the contrasting
  // cap, band or inset it prints. Neither is chosen here.
  const blue = b.c === 'b', red = b.c === 'r';
  const fill = blue ? 'url(#bnkBlue)' : red ? 'url(#bnkRed)' : 'url(#bnkFace)';
  const edge = blue ? '#1b1a55' : red ? '#5c0f0d' : '#63676a';
  const sw = `stroke-width="${BNK_STROKE}"`;
  // The official map picks each bunker out with a contrasting cap, band or
  // inset. Those are drawn here in a darker tone of the same material, so the
  // silhouettes match the map without a second hue fighting the wires.
  const detail = b.d === 'b' ? '#3f3eb0' : b.d === 'r' ? '#b8332c'
               : blue ? '#2f2e8a' : red ? '#9a231e' : '#70767a';
  const box = (w,h,r) => `<rect x="${(x-w).toFixed(2)}" y="${(y-h).toFixed(2)}" width="${(w*2).toFixed(2)}" height="${(h*2).toFixed(2)}" rx="${r}" fill="${fill}" stroke="${edge}" ${sw}/>`;
  const band = (hw,hh,cy2,r) => `<rect x="${(x-hw).toFixed(2)}" y="${(cy2-hh).toFixed(2)}" width="${(hw*2).toFixed(2)}" height="${(hh*2).toFixed(2)}" rx="${r}" fill="${detail}"/>`;

  // A beam printed at an angle is drawn on its own axis, so the silhouette on
  // screen is the one on the official map rather than the box around it.
  if(b.a && b.t === "beam"){
    const L = s.h, T = s.v;
    return `<g transform="rotate(${b.a} ${x.toFixed(2)} ${y.toFixed(2)})">`
      + `<rect x="${(x-L).toFixed(2)}" y="${(y-T).toFixed(2)}" width="${(L*2).toFixed(2)}" height="${(T*2).toFixed(2)}" rx="${(T*0.8).toFixed(2)}" fill="${fill}" stroke="${edge}" ${sw}/>`
      + `<rect x="${(x+L-T*1.4).toFixed(2)}" y="${(y-T).toFixed(2)}" width="${(T*1.4).toFixed(2)}" height="${(T*2).toFixed(2)}" rx="${(T*0.6).toFixed(2)}" fill="${detail}"/>`
      + `</g>`;
  }

  switch(b.t){
    case "dorito":
      return `<polygon points="${x},${(y-s.v).toFixed(2)} ${(x-s.h).toFixed(2)},${(y+s.v).toFixed(2)} ${(x+s.h).toFixed(2)},${(y+s.v).toFixed(2)}" fill="${fill}" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
    case "wing": {
      // Wings point away from the 50, toward their own end line.
      const dir = b.x < 75 ? -1 : 1;
      return `<polygon points="${(x+s.h*dir).toFixed(2)},${y} ${(x-s.h*dir).toFixed(2)},${(y-s.v).toFixed(2)} ${(x-s.h*dir).toFixed(2)},${(y+s.v).toFixed(2)}" fill="${fill}" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
    }
    case "plus": {
      // A giant plus is a chunky cross: its arms are four feet across against
      // a span of eleven, and the width of them is most of what it looks like.
      // b.k is that width, measured off the map like everything else.
      const H = s.h, V = s.v, A = Math.max(1.2, ((b.k || 4) * sx - BNK_STROKE) / 2);
      const plus = `<path d="M${(x-A).toFixed(2)} ${(y-V).toFixed(2)}h${(A*2).toFixed(2)}v${(V-A).toFixed(2)}h${(H-A).toFixed(2)}v${(A*2).toFixed(2)}h-${(H-A).toFixed(2)}v${(V-A).toFixed(2)}h-${(A*2).toFixed(2)}v-${(V-A).toFixed(2)}h-${(H-A).toFixed(2)}v-${(A*2).toFixed(2)}h${(H-A).toFixed(2)}z" fill="${fill}" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
      // Turned on its corner it is the same cross, turned. It does not grow:
      // the span the map measured is the span between the arm tips either way.
      return b.a ? `<g transform="rotate(${b.a} ${x.toFixed(2)} ${y.toFixed(2)})">${plus}</g>` : plus;
    }
    case "cake":
      return `<circle cx="${x}" cy="${y}" r="${s.h}" fill="${fill}" stroke="${edge}" ${sw}/>`
           + `<circle cx="${x}" cy="${y}" r="${(s.h*0.45).toFixed(2)}" fill="none" stroke="${edge}" stroke-width=".6" opacity=".7"/>`;
    case "ball":     // an ellipse, so the drawn footprint is exactly the measured one
      return `<ellipse cx="${x}" cy="${y}" rx="${s.h.toFixed(2)}" ry="${s.v.toFixed(2)}" fill="${fill}" stroke="${edge}" ${sw}/>`;
    case "tridown":  // cakes and small doritos point back down the field
      return `<polygon points="${x},${(y+s.v).toFixed(2)} ${(x-s.h).toFixed(2)},${(y-s.v).toFixed(2)} ${(x+s.h).toFixed(2)},${(y-s.v).toFixed(2)}" fill="${fill}" stroke="${edge}" ${sw} stroke-linejoin="round"/>`;
    case "gwing":    return box(s.h, s.v, 2.4);            // giant wing
    case "gbrick":   return box(s.h, s.v, 2.4);            // giant brick
    case "temple": {                                       // squared, inset centre
      const i = Math.min(s.h, s.v) * 0.44;
      return box(s.h, s.v, 1.6)
           + `<rect x="${(x-i).toFixed(2)}" y="${(y-i).toFixed(2)}" width="${(i*2).toFixed(2)}" height="${(i*2).toFixed(2)}" rx="${(i*0.34).toFixed(2)}" fill="${detail}"/>`;
    }
    case "tower":
    case "towerbig": return box(s.h, s.v, s.h*0.8);        // tall and narrow
    case "beam": {                                         // long bar, capped ends
      const w = s.h, cap = Math.min(1.3, w*0.09);
      return box(w, s.v, s.v)
           + `<rect x="${(x-w).toFixed(2)}" y="${(y-s.v).toFixed(2)}" width="${(cap*2).toFixed(2)}" height="${(s.v*2).toFixed(2)}" rx="${cap.toFixed(2)}" fill="${detail}"/>`
           + `<rect x="${(x+w-cap*2).toFixed(2)}" y="${(y-s.v).toFixed(2)}" width="${(cap*2).toFixed(2)}" height="${(s.v*2).toFixed(2)}" rx="${cap.toFixed(2)}" fill="${detail}"/>`;
    }
    case "mw":                                             // narrow bar, banded
      return box(s.h, s.v, s.h)
           + band(s.h*0.84, Math.min(0.9, s.v*0.07), y + s.v*0.16, 0.4)
           + band(s.h*0.84, Math.min(0.9, s.v*0.07), y + s.v*0.50, 0.4);
    case "bar":      return box(s.h, s.v, s.h);            // wing — plain upright bar
    default: {                                             // can / brick — capped
      const cap = Math.min(1.1, s.v*0.12);
      return box(s.h, s.v, s.h)
           + band(s.h*0.86, cap, y - s.v + cap, cap.toFixed(2))
           + band(s.h*0.86, cap, y + s.v - cap, cap.toFixed(2));
    }
  }
}

// One structure, one code.
//
// The snake is printed as nine sections but a coach calls it once, so touching
// footprints that share a code get a single label at the middle of the whole
// run. Codes go below the structure and shift above it when the slot below is
// taken, biggest structure first — without this the centre bunkers print
// "MW MW MW" on top of one another.
function bunkerLabels(list, sx, sy){
  const FS = 6, CH = 3.4, PAD = 1.2;

  // Merge touching same-code footprints, so nine snake sections read as one.
  const groups = [];
  list.forEach(b => {
    const s = bunkerSize(b, sx, sy), x = b.x*sx, y = b.y*sy;
    const box = {n: b.n, nm: callOf(b), x0:x-s.h, x1:x+s.h, y0:y-s.v, y1:y+s.v, area:s.h*s.v};
    const near = groups.find(g => g.n === box.n && g.nm === box.nm
      && g.x0 <= box.x1 + 1.5 && box.x0 <= g.x1 + 1.5
      && g.y0 <= box.y1 + 1.5 && box.y0 <= g.y1 + 1.5);
    if(!near){ groups.push(box); return; }
    near.x0 = Math.min(near.x0, box.x0); near.x1 = Math.max(near.x1, box.x1);
    near.y0 = Math.min(near.y0, box.y0); near.y1 = Math.max(near.y1, box.y1);
    near.area += box.area;
  });

  const placed = [];
  const hits = a => placed.some(b =>
    Math.abs(a.cx-b.cx) < (a.w+b.w)/2 + PAD && Math.abs(a.cy-b.cy) < (a.h+b.h)/2 + PAD);

  // Big structures claim their slot first — they are the ones a coach hunts for.
  return groups.slice().sort((a, b) => b.area - a.area).map(g => {
    const x = (g.x0+g.x1)/2, w = g.nm.length*CH + 1, h = FS;
    const below = {cx:x, cy:g.y1 + FS*0.9, w, h};
    const above = {cx:x, cy:g.y0 - FS*0.4, w, h};
    const spot = !hits(below) ? below : (!hits(above) ? above : null);
    if(!spot) return "";                       // no room — the shape still reads
    placed.push(spot);
    return `<text x="${spot.cx.toFixed(1)}" y="${(spot.cy+FS*0.35).toFixed(1)}" text-anchor="middle" font-size="${FS}" font-weight="600" fill="#f2f4f5" stroke="#0b0c0d" stroke-width="2.1" paint-order="stroke" stroke-linejoin="round">${esc(g.nm)}</text>`;
  }).join("");
}

// Segment vs. axis-aligned footprint. Used by Sightlines to decide whether a
// lane from one bunker to another actually clears everything between them.
function segHitsBox(x1,y1,x2,y2,cx,cy,hw,hh){
  // Liang–Barsky against the box, in the segment's own parameter space.
  const dx=x2-x1, dy=y2-y1;
  let t0=0, t1=1;
  const edges=[[-dx, x1-(cx-hw)],[dx,(cx+hw)-x1],[-dy, y1-(cy-hh)],[dy,(cy+hh)-y1]];
  for(const [p,q] of edges){
    if(p===0){ if(q<0) return false; continue; }
    const r=q/p;
    if(p<0){ if(r>t1) return false; if(r>t0) t0=r; }
    else   { if(r<t0) return false; if(r<t1) t1=r; }
  }
  return t0<t1;
}

function sightLines(fromId, sx, sy){
  const list = curLayout().bunkers;
  const src  = list.find(b=>b.id===fromId) || list[0];
  if(!src) return {src:null, lines:[], clear:0};
  const ox=src.x*sx, oy=src.y*sy;
  const lines = list.filter(b=>b!==src).map(b=>{
    const tx=b.x*sx, ty=b.y*sy;
    // Anything that is not the two endpoints can block the lane. Naming the
    // one in the way is the whole answer — "blocked" on its own tells a coach
    // nothing he can act on.
    const by = list.filter(o=>{
      if(o===src||o===b) return false;
      return bunkerBoxes(o).some(k =>
        segHitsBox(ox,oy,tx,ty,k.x*sx,k.y*sy,(k.w*sx)/2,(k.h*sy)/2));
    }).sort((p,q)=>Math.hypot(p.x-src.x,p.y-src.y) - Math.hypot(q.x-src.x,q.y-src.y));
    return {to:b, x:tx, y:ty, blocked:by.length>0, by,
            ft:Math.round(Math.hypot(b.x-src.x, b.y-src.y))};
  });
  return {src, lines, clear:lines.filter(l=>!l.blocked).length};
}
// The bunker nearest a tap, in feet. A bunker is about ten pixels across on a
// phone — far under anything a gloved thumb can hit — so the field takes the
// tap and the closest one wins, rather than asking anyone to land on a shape.
function bunkerAt(at){
  const list = curLayout().bunkers;
  let best = null, bestD = Infinity;
  list.forEach(b => {
    const d = Math.hypot(b.x - at[0], b.y - at[1]);
    if(d < bestD){ bestD = d; best = b; }
  });
  return bestD <= 14 ? best : null;         // 14 ft — a thumb's worth of field
}

// The moving layer, on its own. Everything else on the field — 58 bunkers,
// their labels, the ground, the wires — is identical from one animation frame
// to the next, so rebuilding it sixty times a second was most of the cost of
// playing a break. fieldSVG draws the whole thing once; paintField swaps only
// what moves.
function fieldRunners(opts={}){
  const parts = fieldSVG(opts, true);
  return parts;
}
function fieldSVG(opts={}, runnersOnly){
  const layout = curLayout();
  const W=300,H=240,sx=W/150,sy=H/120;
  const M=18;                                  // margin for the side labels
  const br = BREAKS[S.script] || BREAKS.snake;
  const brPaths = currentPaths();
  const t = opts.static?1:S.t;

  // Break paths. A dark casing under each line keeps it readable where it
  // crosses a bunker.
  const runner = (list, colour, offset) => list.map(p=>{
    const legs=[p.from,...(p.via||[]),p.to];
    const run=drawnRun(p, legs, sx, sy);
    const xy=posAt(p,t), cx=xy[0]*sx, cy=xy[1]*sy;
    let out = `<path fill="none" d="${run}" stroke="#000000" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>`
            + `<path fill="none" d="${run}" stroke="${colour}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"${offset===0&&opts.edit?` data-leg="${p.id}"`:""}/>`;
    // In edit mode every corner is a handle: drag it, or tap it to take it out.
    if(offset===0 && opts.edit) out += (p.via||[]).map((v,vi)=>
      `<circle class="hnd" data-h="${p.id}" data-i="${vi}" cx="${(v[0]*sx).toFixed(1)}" cy="${(v[1]*sy).toFixed(1)}" r="5"/>`).join("");
    // Where the player is actually heading right now, so the chevron and the
    // lane travel with him instead of snapping to the plant.
    const a0=posAt(p,Math.max(0,t-0.02)), a1=posAt(p,Math.min(1,t+0.02));
    let travel = Math.atan2(a1[1]-a0[1], a1[0]-a0[0]);
    if(!isFinite(travel) || (a0[0]===a1[0] && a0[1]===a1[1]))
      travel = Math.atan2(p.to[1]-p.from[1], p.to[0]-p.from[0]);
    const d = offset===0 ? directOf(p.id) : {};

    if(S.shotOn){
      let ang = travel, len = 26, mark = "";
      const lane = shotLane(d.shot);
      if(lane !== null){
        // A lane the coach pointed, with no bunker named. The spec asks for
        // this as well as a target: a man can be told to hold a gap.
        ang = lane * Math.PI / 180;
        len = 34;
      } else if(d.shot){
        const tb = layout.bunkers.find(x=>x.id===d.shot);
        if(tb){
          const tx=tb.x*sx, ty=tb.y*sy;
          ang = Math.atan2(ty-cy, tx-cx);
          // Capped, because a cone drawn all the way to a far bunker swamps
          // the field. A ring on the target says what he is laning instead.
          len = Math.min(46, Math.max(14, Math.hypot(tx-cx, ty-cy) - 6));
          // The solid lane is capped so a long one does not swamp the field,
          // and a stub that stops short reads as if he is laning whatever it
          // happens to end on. A hairline carries the rest of the way to the
          // ring, so the man and the bunker he is laning are joined up.
          mark = `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="#fff" stroke-width=".9" stroke-dasharray="2 4" opacity=".55"/>`
               + `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="8" fill="none" stroke="#000" stroke-width="3" opacity=".5"/>`
               + `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="8" fill="none" stroke="#fff" stroke-width="1.4" stroke-dasharray="3 3"/>`;
        }
      }
      // The lane is a cone, not a ray, so it reads as a field of fire. White,
      // per the house rule, so it reads against both wires — but a sliver four
      // units across at a sixth opacity read against neither, and with no
      // target set it lay exactly under the face chevron, so the two came out
      // as one white scribble. It is a real wedge now, and the hard line down
      // the middle is drawn only when the coach has named the bunker: that is
      // the difference between "he is covering this" and "he is laning that".
      const sp=0.22, P=(o,l)=>`${(cx+Math.cos(ang+o)*l).toFixed(1)},${(cy+Math.sin(ang+o)*l).toFixed(1)}`;
      const tip=P(0,len).split(",");
      const named = !!d.shot && lane === null;
      out += `<polygon points="${cx.toFixed(1)},${cy.toFixed(1)} ${P(-sp,len)} ${P(sp,len)}" fill="#fff" opacity="${named?".22":".3"}" stroke="#000" stroke-width=".8" stroke-opacity=".5"/>`;
      if(d.shot) out += `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tip[0]}" y2="${tip[1]}" stroke="#000" stroke-width="3.6" stroke-linecap="round" opacity=".55"/>`
           + `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tip[0]}" y2="${tip[1]}" stroke="#fff" stroke-width="2" stroke-linecap="round"/>`;
      out += mark;
    }

    if(S.faceOn){
      const fa = (d.face!=null && d.face!==undefined) ? d.face*Math.PI/180 : travel;
      // The chevron is his body, so it sits on the marker as its nose. Out at
      // arm's length it collided with the shot lane and neither read.
      const fx=cx+Math.cos(fa)*9, fy=cy+Math.sin(fa)*9;
      const W=(o)=>`${(fx-Math.cos(fa+o)*4.6).toFixed(1)},${(fy-Math.sin(fa+o)*4.6).toFixed(1)}`;
      const pts=`${W(-0.85)} ${fx.toFixed(1)},${fy.toFixed(1)} ${W(0.85)}`;
      out += `<polyline points="${pts}" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>`
           + `<polyline points="${pts}" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    out += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="${colour}" stroke="#fff" stroke-width="1.4"${offset===0&&opts.edit?` class="aim" data-aim="${p.id}"`:""}/>`
         + `<text x="${cx.toFixed(1)}" y="${(cy+2.6).toFixed(1)}" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="700">${p.id+offset}</text>`;
    return out;
  }).join("");

  let paths = runner(brPaths, opts.color||"#e5342f", 0);
  if(opts.both){
    const flip=q=>[150-q[0],q[1]];
    paths += runner(brPaths.map(p=>({...p,from:flip(p.from),to:flip(p.to),via:(p.via||[]).map(flip)})), "#3d8bff", 5);
  }

  // Sightlines replace the break paths when a source bunker is picked.
  let sight = "";
  if(opts.sightFrom){
    const S1 = sightLines(opts.sightFrom, sx, sy);
    paths = "";
    if(S1.src){
      const fx=(S1.src.x*sx).toFixed(1), fy=(S1.src.y*sy).toFixed(1);
      const lit = opts.sightTo;              // the one lane being asked about
      sight = S1.lines.map(l=>{
        const on = lit && l.to.id === lit;
        const dim = lit && !on;
        return `<line x1="${fx}" y1="${fy}" x2="${l.x.toFixed(1)}" y2="${l.y.toFixed(1)}" `
          + `stroke="${l.blocked?"#e5342f":"#3ecf8e"}" stroke-width="${on?3:l.blocked?1:1.6}" `
          + `opacity="${dim?.08:on?1:l.blocked?.22:.85}" stroke-linecap="round"/>`;
      }).join("")
      // What is in the way of the asked-about lane, ringed so it is findable.
      + (lit ? (S1.lines.find(l=>l.to.id===lit)?.by || []).map(o=>
          `<circle cx="${(o.x*sx).toFixed(1)}" cy="${(o.y*sy).toFixed(1)}" r="6" fill="none" stroke="#e5342f" stroke-width="1.6"/>`
        ).join("") : "")
      + (lit ? (()=>{ const t=S1.lines.find(l=>l.to.id===lit);
          return t ? `<circle cx="${t.x.toFixed(1)}" cy="${t.y.toFixed(1)}" r="6" fill="none" stroke="#fff" stroke-width="1.6"/>` : ""; })() : "")
      + `<circle cx="${fx}" cy="${fy}" r="7" fill="none" stroke="#fff" stroke-width="1.8"/>`;
    }
  }

  const bunks = layout.bunkers.map(b=>`<g class="bnk" data-b="${b.id}">${bunkerShape(b,sx,sy)}</g>`).join("");
  const pick = opts.pick
    ? `<rect data-pick="1" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>` : "";

  // Movement draws each logged rotation as an arrow between two footprints.
  let moveArrows = "";
  if(opts.moves){
    const byId = Object.fromEntries(layout.bunkers.map(b=>[b.id,b]));
    moveArrows = layoutMoves().filter(typeof opts.moves === "function" ? opts.moves : () => true)
      .slice(0,40).map(m=>{
      const a=byId[m.from], b=byId[m.to]; if(!a||!b) return "";
      const x1=a.x*sx, y1=a.y*sy, x2=b.x*sx, y2=b.y*sy;
      const ang=Math.atan2(y2-y1,x2-x1), L=Math.hypot(x2-x1,y2-y1);
      if(L<6) return "";
      // stop short of the target so the head sits beside it, not on it
      const tx=x2-Math.cos(ang)*5, ty=y2-Math.sin(ang)*5;
      const head=(o)=>`${(tx-Math.cos(ang-o)*5).toFixed(1)},${(ty-Math.sin(ang-o)*5).toFixed(1)}`;
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="#000" stroke-width="3.4" opacity=".5" stroke-linecap="round"/>`
           + `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="#3ecf8e" stroke-width="1.6" opacity=".95" stroke-linecap="round"/>`
           + `<polygon points="${tx.toFixed(1)},${ty.toFixed(1)} ${head(0.5)} ${head(-0.5)}" fill="#3ecf8e"/>`;
    }).join("");
  }

  // Bunker stats tint each footprint by how much traffic the tally recorded.
  let heat = "";
  if(opts.heat){
    const t = bunkerTraffic(typeof opts.heat === "function" ? opts.heat : null);
    const peak = Math.max(1, ...Object.values(t).map(v=>v.outs+v.visits));
    heat = layout.bunkers.map(b=>{
      const v = t[b.id]; if(!v) return "";
      const s2 = bunkerSize(b, sx, sy);
      const k = (v.outs+v.visits)/peak;
      // A ring, not a tint: a red wash would vanish on a red bunker.
      return `<rect x="${(b.x*sx-s2.h-3).toFixed(1)}" y="${(b.y*sy-s2.v-3).toFixed(1)}" width="${(s2.h*2+6).toFixed(1)}" height="${(s2.v*2+6).toFixed(1)}" rx="4" fill="none" stroke="#ffb020" stroke-width="${(1.2+k*3).toFixed(1)}" opacity="${(0.5+k*0.5).toFixed(2)}"/>`;
    }).join("");
  }

  /* Where men actually went out, and where they went out both ways.
   *
   * An X sits on a bunker somebody was shot at, one arm heavier the more often
   * it happened. A ring around it means the trade went both directions there —
   * we lost men behind that paint and so did they. That is a gunfight, and it
   * is the thing a coach wants off a field drawing rather than a table: the two
   * or three bunkers where the point is actually decided.
   *
   * Both are counted straight off the tally, on this layout. Nothing is
   * modelled, and a bunker nobody has been shot at carries no mark at all. */
  let outs = "";
  if(opts.outs){
    const here = new Set(layout.bunkers.map(b=>b.id));
    const at = {};
    (S.tally||[]).forEach(o => {
      if(typeof o!=="object" || o.layout!==layout.key || !o.shotAt || !here.has(o.shotAt)) return;
      at[o.shotAt] = at[o.shotAt] || {us:0, them:0};
      at[o.shotAt][o.side==="them"?"them":"us"]++;
    });
    const peak = Math.max(1, ...Object.values(at).map(v=>v.us+v.them));
    outs = layout.bunkers.map(b => {
      const v = at[b.id]; if(!v) return "";
      const n = v.us + v.them, k = n/peak;
      const s2 = bunkerSize(b, sx, sy);
      const x = b.x*sx, y = b.y*sy;
      const r = Math.max(6, Math.min(s2.h, s2.v) + 4 + k*4);
      const w = (1.4 + k*2.2).toFixed(1);
      // White, like the shot lanes, because it has to read on a red bunker and
      // on a blue one.
      let g = `<g opacity="${(0.55+k*0.45).toFixed(2)}">`
        + `<path d="M${(x-r*0.55).toFixed(1)} ${(y-r*0.55).toFixed(1)}L${(x+r*0.55).toFixed(1)} ${(y+r*0.55).toFixed(1)}`
        + `M${(x+r*0.55).toFixed(1)} ${(y-r*0.55).toFixed(1)}L${(x-r*0.55).toFixed(1)} ${(y+r*0.55).toFixed(1)}" `
        + `stroke="#000" stroke-width="${(+w+2).toFixed(1)}" stroke-linecap="round" opacity=".6"/>`
        + `<path d="M${(x-r*0.55).toFixed(1)} ${(y-r*0.55).toFixed(1)}L${(x+r*0.55).toFixed(1)} ${(y+r*0.55).toFixed(1)}`
        + `M${(x+r*0.55).toFixed(1)} ${(y-r*0.55).toFixed(1)}L${(x-r*0.55).toFixed(1)} ${(y+r*0.55).toFixed(1)}" `
        + `stroke="#efedeb" stroke-width="${w}" stroke-linecap="round"/>`;
      // Traded both ways: the ring, as heavy as the thinner side of the trade.
      if(v.us && v.them){
        const two = Math.min(v.us, v.them) / peak;
        g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="none" `
           + `stroke="#000" stroke-width="${(2.2+two*3).toFixed(1)}" opacity=".55"/>`
           + `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="none" `
           + `stroke="#ffb020" stroke-width="${(1.2+two*2.6).toFixed(1)}"/>`;
      }
      return g + "</g>";
    }).join("");
  }

  if(runnersOnly) return paths;

  return `<svg class="field" viewBox="-8 ${-M} ${W+16} ${H+M*2}">
    <defs>
      <!-- The official map paints every bunker red or blue; both are sampled
           from it. They sit a step darker than the wires (#e5342f / #3d8bff)
           so the break paths still lead the eye. -->
      <linearGradient id="bnkRed" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c2453d"/>
        <stop offset="1" stop-color="#7d1512"/>
      </linearGradient>
      <linearGradient id="bnkBlue" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a49c4"/>
        <stop offset="1" stop-color="#25246e"/>
      </linearGradient>
      <!-- A layout whose colour was never sampled stays neutral rather than
           being guessed into one of the two. -->
      <linearGradient id="bnkFace" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d4d6d7"/>
        <stop offset="1" stop-color="#8d9092"/>
      </linearGradient>
      <filter id="bnkLift" x="-40%" y="-40%" width="180%" height="200%">
        <feDropShadow dx="0" dy="1.1" stdDeviation="1" flood-color="#000000" flood-opacity=".55"/>
      </filter>
    </defs>

    <rect x="-8" y="${-M}" width="${W+16}" height="${H+M*2}" fill="#0b0c0d"/>
    <rect width="${W}" height="${H}" fill="#101111"/>
    ${[...Array(10)].map((_,i)=>i%2?`<rect x="${i*(W/10)}" y="0" width="${W/10}" height="${H}" fill="#0c0d0e"/>`:"").join("")}

/* ============================================================
   Scouting — what you know about a team, kept with the team
   ============================================================

   The two pits used to hold the film read themselves. They are slots, not
   teams, so tapping another team on the division board left your note behind
   and silently reattached it to whoever you tapped. A read on the Rejects
   became a read on Las Vegas Shock. Everything you learn now lives under the
   team's name and follows it in and out of the pit. */
function teamMeta(name){
  return anyTeam(name) || {name};
}
function profileOf(name){
  if(!name) return {tend:"Balanced", threat:3, notes:"", players:[], breaks:[],
                    answers:{}, unscored:true};
  const kept = (S.scout || {})[name];
  if(kept) return {players:[], breaks:[], answers:{}, ...kept};
  // Seeded where the event data knew; neutral where it did not. A team nobody
  // has scored is a 3 because that is the middle, not because it is average.
  const t = teamMeta(name);
  return {tend: t.tend === "Snake" ? "Snake" : t.tend === "Dorito" ? "Dorito" : "Balanced",
          threat: t.threat || 3, notes: "", players: [], breaks: [], answers: {},
          unscored: t.threat === undefined};
}
/* Who is in a pit, or nobody.
 *
 * This used to fall back to the first team of the division, and the app shipped
 * with two real teams already in the pits. A coach who never picked anyone saw
 * two strangers on five tabs — and once a match record existed, every out he
 * tallied was stamped with a team he had never played. That is invented
 * opposition written into his season, which is the same thing the pro board is
 * forbidden from doing.
 *
 * So an unset pit has no name. `named` is what callers branch on; the display
 * name is theirs to choose, because "Them" is right on a point sheet and
 * "Pick a team" is right on a picker.
 */
function pitOf(side){
  const name = ((S[side] || {}).name) || "";
  return {name, named: !!name, pts: name ? teamMeta(name).pts : undefined, ...profileOf(name)};
}
const pitNamed = side => !!((S[side] || {}).name);
// What to print for a pit. Never a team the coach did not pick: the caller says
// what an empty one reads as, because "Them" is right on a point sheet and
// "Right pit" is right on a legend.
const pitName = (side, blank) => ((S[side] || {}).name) || blank;
function scouted(name){
  const p = (S.scout || {})[name];
  return !!p && (!!(p.notes || "").trim() || (p.players || []).length > 0);
}
function editProfile(side, patch){
  const name = pitOf(side).name;
  // Nobody in the pit means nothing to write against. Without this the scout
  // book grows an entry keyed on the empty string that no team can ever reach.
  if(!name) return;
  S.scout = {...(S.scout || {}), [name]: {...profileOf(name), ...patch}};
  save(S);
}
window.setPitTeam = (side, name) => {
  S[side] = {...(S[side] || {}), name: name || ""};
  if(side === "right") adoptPitAsOpponent();
  save(S); render();
};
window.setPitTend = (side, tend) => { editProfile(side, {tend}); render(); };
window.setPitNotes = (side, notes) => editProfile(side, {notes: clean(notes)});   // no redraw mid-type

// ---- what they ran, logged as you see it ----
// Nothing recorded the opponent's call. Their tendency was a single word you
// picked off film; this is the count behind it.
function theirBreaks(side){ return pitOf(side).breaks || []; }
function breakFreq(side){
  const seen = theirBreaks(side).reduce((m,b) => ({...m, [b.script]:(m[b.script]||0)+1}), {});
  return Object.entries(seen).sort((a,b) => b[1]-a[1]);
}
window.logTheirBreak = (side, script) => {
  editProfile(side, {breaks: [{script, pt:S.point||1, at:Date.now()}, ...theirBreaks(side)]});
  render();
};
window.unlogTheirBreak = (side, i) => {

};

/* ---- the opponent library: they run X, we run Y --------------------------
 *
 * The spec's Opp chip. An answer is stored against the team, not the pit, so
 * it follows them in and out of the slot like everything else you know about
 * them, and it is the coach's own — nothing here proposes one. The
 * counter-picker already ranks the twelve by a heuristic; this is the line a
 * coach wrote down after watching them, which beats a heuristic every time. */
function answersFor(side){ return pitOf(side).answers || {}; }
window.setAnswer = (side, theirs, ours) => {
  const all = {...answersFor(side)};
  if(ours) all[theirs] = ours; else delete all[theirs];
  editProfile(side, {answers: all});
  render();
};
// What you have written down for the call they run most, if you have one.
function oppAnswer(side){
  const f = breakFreq(side);
  const a = answersFor(side);
  const hit = f.find(([k]) => a[k]);
  return hit ? {theirs: hit[0], ours: a[hit[0]], seen: hit[1]} : null;
}

// ---- rosters the league published ----
// Not scouting. These are names off the league's own pages, and they go in
// flagged as published so a name nobody here has watched is never mistaken for
// something a coach saw. A team is in this list only if its roster was actually
// read somewhere; the rest stay empty rather than being filled in from memory.
const PRO_ROSTERS = {
  "San Diego Dynasty": {
    read: "September 2026",
    src: "the NXL team page and the team's 2026 roster write-up",
    men: [{num:"7", name:"Alex Fraige"}, {num:"18", name:"Ryan Greenspan"},
          {num:"32", name:"Yosh Rau"}, {num:"", name:"Eliot Weaver"},

  },
};

                                 (h.name || "").toLowerCase() === p.name.toLowerCase()))
    .map(p => ({num: p.num, name: p.name, wire: "Flex", note: "", threat: 3, from: "published"}));

// ---- a roster read off a screenshot ----
// Nothing is fetched: there is no network in this app and there is not going to
// be one. The phone already reads text out of a picture — press and hold a
// screenshot in Photos on iOS, tap the text button in Lens on Android — so the
// coach copies it there and drops it in here. What arrives is loose and messy,
// so it is parsed, shown back, and only added once he has looked at it.
const ROSTER_JUNK = /^(#|no\.?|num(ber)?|player(s)?|name|roster|pos(ition)?|team(s)?|division|class|event|rank(ing)?|pts|points|paid|owed|reg(istration)?|status|home|menu|share|follow|back)$/i;
const ROSTER_WIRE = [[/\bsnake\b/i,"Snake"],[/\bdorito\b/i,"Dorito"],[/\bcent(er|re)\b/i,"Centre"],[/\bback\b/i,"Back"]];
// The class column travels with the name on a phone screenshot: "18 Ryan
// Greenspan Pro". Jr and Sr are part of a man's name and are never stripped.
const ROSTER_CLASS = /^(pro|semi|semi-pro|semipro|am|amateur|novice|rookie|d[1-5]|div|division|open|race|champs|champions|ladies|women'?s|mens|youth|xball|x-ball)$/i;
const NAME_PARTICLE = /^(van|von|de|del|della|der|di|da|la|le|du|st\.?|mc|mac|ter|ten)$/i;
// A screenshot carries the phone's own status bar: "9:41 LTE 100%".
const PHONE_CHROME = /^\d{1,2}:\d{2}\b|^(lte|5g|4g|wi-?fi|carrier)\b/i;
function looksLikeName(s){
  const words = s.split(" ").filter(Boolean);
  if(!words.length || words.length > 4 || s.length > 40) return false;
  return words.every(w => /^[A-Za-z][A-Za-z'’.\-]*$/.test(w)) &&
         // A man's name is capitalised on the page and comes through OCR that
         // way. Prose does not: "days before the event" used to read as a
         // player because every word in it is a word.
         words.every((w, i) => /^[A-Z]/.test(w) || (i > 0 && NAME_PARTICLE.test(w)));
}
function parseRoster(text, team){
  const found = [], skipped = [];
  const known = n => !!anyTeam(n) || (team || "").toLowerCase() === n.toLowerCase();
  String(text || "").split(/[\n\r]+/).forEach(raw => {
    const line = raw.replace(/[|\t,;]+/g, " ").replace(/^[•\-–*]\s*/, "")
                    .replace(/\s+/g, " ").trim();
    if(!line) return;
    if(PHONE_CHROME.test(line)) return;                    // the phone's own status bar
    // one heading, or a whole header row of them: "Player  No.", "# Name Team"
    if(line.split(" ").every(w => ROSTER_JUNK.test(w))) return;
    let rest = line, num = "";
    const lead = rest.match(/^#?\s*(\d{1,3})\b\s*/);
    const tail = rest.match(/\s*#?\s*(\d{1,3})$/);
    if(lead){ num = lead[1]; rest = rest.slice(lead[0].length); }
    else if(tail){ num = tail[1]; rest = rest.slice(0, tail.index); }
    let wire = "";
    ROSTER_WIRE.forEach(([re, w]) => {
      if(!wire && re.test(rest)){ wire = w; rest = rest.replace(re, " "); }
    });
    rest = rest.replace(/[^A-Za-z'’.\- ]/g, " ").replace(/\s+/g, " ").trim();
    let words = rest.split(" ").filter(Boolean);           // shed the class column
    while(words.length && ROSTER_CLASS.test(words[words.length - 1])) words.pop();
    rest = words.join(" ");
    if(!rest && !num){ skipped.push(line); return; }
    if(rest && known(rest)) return;                        // the team's own name, not a man
    if(rest && !looksLikeName(rest)){ skipped.push(line); return; }   // prose, not a player
    found.push({num, name: clean(rest), wire: wire || "Flex", note: "", threat: 3});
  });
  return {found: found.slice(0, 40), skipped};
}

// The staff password never touches storage in the clear. It is salted and
// hashed with the platform's own crypto, and only the hash is kept — so a
// shared or stolen phone does not hand over the password itself.
const STAFF_KEY = "gridlock.staff.v2";
async function hashPass(pass, saltHex){
  const enc = new TextEncoder().encode(saltHex + "|" + pass);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function newSalt(){
  return [...crypto.getRandomValues(new Uint8Array(16))]
    .map(b => b.toString(16).padStart(2, "0")).join("");
}

/* The staff account is kept alongside the season, and for the same reason: the
 * season coming back on a phone the coach can no longer sign in to is half a
 * rescue — creating a class and sending a blast are both gated on it. */
function writeAccount(acc){
  const text = JSON.stringify(acc);
  try{ localStorage.setItem(STAFF_KEY, text); }catch(e){}
  if(window.gridlockKeep) try{ window.gridlockKeep(text, STAFF_KEY); }catch(e){}
}
window.gridlockRestoreAccount = text => {
  let have = null;
  try{ have = JSON.parse(localStorage.getItem(STAFF_KEY) || "null"); }catch(e){}
  if(have && have.email) return false;              // this phone has one already
  let d = null;
  try{ d = JSON.parse(text); }catch(e){ return false; }
  if(!d || !d.email || !d.hash) return false;
  try{ localStorage.setItem(STAFF_KEY, text); }catch(e){}
  return true;
};

window.doAuth = async () => {
  const email = document.getElementById("em").value.trim();
  const pass = document.getElementById("pw").value;
  if(!email || pass.length < 6){ alert("Email and a password of 6 characters or more."); return; }
  if(!(window.crypto && crypto.subtle)){
    alert("This browser cannot hash the password securely, so sign-in is disabled here. Use the app, or a browser on https.");
    return;
  }
  let acc = {};
  try{ acc = JSON.parse(localStorage.getItem(STAFF_KEY) || "{}"); }catch(e){}

  if(S.mode === "create"){
    // Creating over an account that is already here is how a coach who meant to
    // sign in loses the one he had — nothing else on the phone can get it back.
    if(acc.email && acc.email !== email &&
       !confirm(`This phone already has ${acc.email}. Making a new account replaces it, `
              + `and there is no way back. Continue?`)) return;
    const salt = newSalt();
    writeAccount({email, salt, hash: await hashPass(pass, salt)});
    localStorage.removeItem("gridlock.staff");   // drop any old clear-text account
    set({entered:true, role:"staff", email, mode:null});
    return;
  }

  if(acc.email === email && acc.salt && acc.hash === await hashPass(pass, acc.salt)){
    set({entered:true, role:"staff", email, mode:null});
    return;
  }

  // An account made before hashing is upgraded on the next correct sign-in
  // rather than locking the coach out of his own phone.
  let old = {};
  try{ old = JSON.parse(localStorage.getItem("gridlock.staff") || "{}"); }catch(e){}
  if(old.email === email && old.pass === pass){
    const salt = newSalt();
    writeAccount({email, salt, hash: await hashPass(pass, salt)});
    localStorage.removeItem("gridlock.staff");
    set({entered:true, role:"staff", email, mode:null});
    return;
  }
  alert("Email or password does not match. Create an account first.");
};

      ${Object.entries(BREAKS).map(([k,v])=>`<button class="${key===k?"on":""}" onclick="set({script:'${k}',t:1,playing:false})">${esc(v.name)}</button>`).join("")}
    </div>`, curLayout().name)}

  ${sec("Direct the five", `${roster.length?"":`<div class="empty" style="margin-bottom:var(--s4)">
      These are the five jobs this break creates. Put names on them — <button class="btn"
      style="margin-top:10px" onclick="set({tab:'more',more:'team'})">Add your squad</button></div>`}
    <div class="assigns">
      ${currentPaths().map((pth,i)=>{
        const who=fiveFor(S.point||1)[i], d=directOf(pth.id);
        const bl=curLayout().bunkers;
        const shotB=d.shot?bl.find(b=>b.id===d.shot):null;   // null when it is a lane
        const role=d.role||"P";
        const open=S.pad==="face:"+pth.id, openShot=S.pad==="shot:"+pth.id;
        return `<div class="assign" style="flex-wrap:wrap">
          <span class="assign__n">${pth.id}</span>
          <span class="assign__body">
            <span class="assign__job">${esc(pth.label)}</span>

          </span>
          <span class="assign__ctl">
            <span class="ps">
              <button class="${role==="P"?"on":""}" onclick="setDirect('${pth.id}','role','P')">P</button>
              <button class="${role==="S"?"on":""}" onclick="setDirect('${pth.id}','role','S')">S</button>
            </span>
            <button class="tgl ${d.face!=null?"on":""}" onclick="openPad('face','${pth.id}')"><i></i>${d.face!=null?FACE_GLYPH[d.face]:"Face"}</button>
            <button class="tgl ${d.shot?"on":""}" onclick="openPad('shot','${pth.id}')"><i></i>${shotLane(d.shot)!==null?FACE_GLYPH[shotLane(d.shot)]:shotB?esc(callOf(shotB)):"Shot"}</button>
            ${pth.edited?`<button class="btn btn--danger" onclick="resetPath('${pth.id}')">Reset path</button>`:""}
          </span>
          ${open?`<div class="pad">
            ${FACE_PAD.map(([g,deg])=>`<button class="${deg===null?(d.face==null?"on":""):(d.face===deg?"on":"")}"
              onclick="setDirect('${pth.id}','face',${deg===null?"null":deg})">${g}</button>`).join("")}
          </div>`:""}
          ${openShot?`<div style="flex-basis:100%">
            <select onchange="setDirect('${pth.id}','shot',this.value)">
              <option value="">Lane he is running — no fixed target</option>
              <optgroup label="A lane, no bunker named">
                ${FACE_PAD.filter(f=>f[1]!==null).map(([g,deg])=>
                  `<option value="@${deg}" ${d.shot===("@"+deg)?"selected":""}>${g} ${esc(LANE_NAME[deg])}</option>`).join("")}
              </optgroup>

                ${bl.map(b=>`<option value="${esc(b.id)}" ${d.shot===b.id?"selected":""}>${esc(callOf(b))} · ${esc(b.id)}</option>`).join("")}

    </div>
    <p class="note">Face sets which way he points. Shot is the bunker he lanes, or a lane
      with no bunker named — a gap he holds. Both travel with him down the path.</p>
    <p class="aid"><b>A training aid, not a prediction.</b> Officials govern the live call.</p>`)}

  ${(()=>{ const ss = selfScout();
    return sec("What you have called", ss.n
      ? `${ss.tell >= 0.5 ? `<p class="warn">${Math.round(ss.tell*100)}% of your last ${ss.recent.length}
          calls have been <b>${esc((BREAKS[ss.top[0]]||{}).name||ss.top[0])}</b>. Anyone filming you has that too.</p>`
        : `<p class="lede">Counted from the calls you logged on this field. Nothing here is a prediction —
          it is the same arithmetic a team watching your film would do.</p>`}
        <div class="assigns">
          ${ss.rank.map(([k,n])=>{
            const pct = Math.round(n/ss.n*100);
            return `<div class="assign" style="flex-wrap:wrap">
              <span class="assign__n" style="background:var(--panel-2);color:var(--ink)">${n}</span>
              <span class="assign__body"><span class="assign__job">${esc((BREAKS[k]||{}).name||k)}</span>
              <span class="assign__who">${pct}% of ${ss.n} logged here</span></span>
              <span class="bar" style="flex:1 0 100%;margin-top:6px"><i style="width:${pct}%;background:${
                ss.top && k===ss.top[0] && ss.tell>=0.5 ? "var(--warn)" : "var(--accent)"}"></i></span>
            </div>`;}).join("")}
        </div>
        <div class="assigns" style="margin-top:var(--s3)">
          ${ss.recent.map((c,i)=>`<div class="assign">
            <span class="assign__n" style="background:var(--panel-2);color:var(--mute);font-size:11px">${c.pt}</span>
            <span class="assign__body"><span class="assign__job">${esc((BREAKS[c.script]||{}).name||c.script)}</span>
            <span class="assign__who">point ${c.pt}${c.vs?" · vs "+esc(c.vs):""}</span></span>
            <button class="btn btn--danger" onclick="unlogCall(${i})">Undo</button>
          </div>`).join("")}
        </div>`
      : `<div class="empty">Nothing logged on ${esc(curLayout().name)} yet. Tap <b>Log this call</b> the
         moment you make it, and this counts how predictable you have been.</div>`,
      ss.n ? ss.n + (ss.n===1?" call":" calls") : curLayout().name);
  })()}`;
}

/* ============================================================
   Cards — here is your job, in type a player can read
   ============================================================ */
function cardLines(){
  const five = fiveFor(S.point || 1);
  return currentPaths().map((p, i) => {
    const d = directOf(p.id);
    const who = five[i];
    const lane = shotLane(d.shot);
    const shotB = d.shot ? curLayout().bunkers.find(b => b.id === d.shot) : null;
    // His card is the app speaking to him, so it uses his word for the bunker
    // where he has one. The field keeps the team's.
    const mine = who && who.name;
    return {n: p.id, who, job: p.label, wire: wireOf((curLayout().bunkers.find(b => b.id === p.bunker) || {y:60}).y),
            bunker: callOf(curLayout().bunkers.find(b => b.id === p.bunker) || {n: "—"}, mine),
            role: d.role === "S" ? "Secondary" : "Primary",
            face: d.face != null ? LANE_NAME[d.face] : "with the run",
            shot: lane !== null ? LANE_NAME[lane] : shotB ? callOf(shotB, mine) : "the lane he is running"};
  });
}
window.shareCards = () => {
  const t = `GRIDLOCK · ${BREAKS[S.script].name} · ${curLayout().name}\n\n`
    + cardLines().map(c => `${c.n}. ${c.who ? "#" + c.who.num + " " + c.who.name : "(no name)"}\n`
        + `   ${c.bunker} · ${c.job}\n   ${c.role} · faces ${c.face} · lanes ${c.shot}`).join("\n\n");
  if(window.gridlockShare) window.gridlockShare(t, "GRIDLOCK cards"); else prompt("Cards", t);
};

/* ============================================================
   Rep — the recognition drill
   ============================================================

   The spec asks for the break run at the coach until the call is instant,
   under two seconds. So the field draws one of the twelve with nothing naming
   it — not the card, not the header — and the clock runs from the moment it is
   on screen to the moment he taps. The call he was on is put back when he
   stops: a drill must not quietly change what he is about to call. */
const REP_TARGET = 2000;
function repState(){ return S.rep || {log:[]}; }
window.startRep = () => {
  const keys = Object.keys(BREAKS);
  S.rep = {running:true, was:S.script, wasT:S.t, log:[],
           ask:keys[Math.floor(Math.random()*keys.length)], at:Date.now()};
  S.script = S.rep.ask; S.t = 1; S.playing = false; S.pbView = "rep";
  dropPathCache(); save(S); render();
};
window.answerRep = key => {
  const r = repState();
  if(!r.running || !r.ask) return;
  const ms = Date.now() - r.at;
  const keys = Object.keys(BREAKS).filter(k => k !== r.ask);
  const next = keys[Math.floor(Math.random()*keys.length)];
  S.rep = {...r, log:[{ask:r.ask, said:key, ms, right:key === r.ask}, ...r.log],
           ask: next, at: Date.now()};
  S.script = next; S.t = 1;
  save(S); render();
};
window.stopRep = () => { endRep(); save(S); render(); };
function repScore(){
  const log = repState().log || [];
  const right = log.filter(x => x.right);
  const avg = right.length ? Math.round(right.reduce((a, x) => a + x.ms, 0) / right.length) : 0;
  return {n: log.length, right: right.length, avg,
          best: right.length ? Math.min(...right.map(x => x.ms)) : 0};
}

/* ---- the two Playbook views the chips open ------------------------------ */
function cardsView(){
  const cards = cardLines();
  return `<button class="btn btn--quiet" style="align-self:flex-start" onclick="set({pbView:null})">‹ Playbook</button>
  ${sec("Cards", `<p class="lede">One card a man. Hand him the phone, or share the five into the squad
      chat — it is the same words either way.</p>
    <div class="assigns">
      ${cards.map(c=>`<div class="assign" style="flex-wrap:wrap;align-items:flex-start">
        <span class="assign__n">${c.n}</span>
        <span class="assign__body">
          <span class="call__name" style="font-size:var(--t-xl)">${esc(c.bunker)}</span>
          <span class="assign__job">${c.who?esc("#"+c.who.num+" "+c.who.name):"no one on this job yet"}</span>
          <span class="assign__who">on the ${esc(c.wire)}</span>
        </span>
        <span class="assign__ctl" style="flex-basis:100%">
          <span class="tag">${esc(c.role)}</span>
          <span class="tag">faces ${esc(c.face)}</span>
          <span class="tag">lanes ${esc(c.shot)}</span>
        </span>
      </div>`).join("")}
    </div>
    <button class="btn btn--block" onclick="shareCards()">Share the five</button>
    <p class="aid"><b>A training aid, not a prediction.</b> Officials govern the live call.</p>`,
    esc(BREAKS[S.script].name))}`;
}

function repView(){
  const r = repState(), sc = repScore();
  const done = sc.n && !r.running;
  return `<button class="btn btn--quiet" style="align-self:flex-start" onclick="stopRep()">‹ Playbook</button>
  ${sec("Name the call", `<p class="lede">The field is one of the twelve and nothing on this screen says
      which. Name it. The clock runs from the moment it is up to the moment you tap — under two seconds
      and you are calling it, not reading it.</p>
    <div class="field-wrap">${fieldSVG({static:true})}</div>
    ${r.running ? `<div class="seg seg--wrap">
        ${Object.entries(BREAKS).map(([k,v])=>`<button onclick="answerRep('${k}')">${esc(v.name)}</button>`).join("")}
      </div>` : ""}
    <div class="facts">
      <span class="fact"><b>${sc.right}/${sc.n}</b><span>Right</span></span>
      <span class="fact"><b>${sc.avg?(sc.avg/1000).toFixed(1)+"s":"—"}</b><span>Average</span></span>
      <span class="fact"><b>${sc.best?(sc.best/1000).toFixed(1)+"s":"—"}</b><span>Best</span></span>
    </div>
    ${sc.right >= 3 && sc.avg && sc.avg <= REP_TARGET
      ? `<div class="verdict verdict--yes"><b>Under two seconds</b>
         <span>That is a call, not a read. Same drill on the other two fields.</span></div>`
      : sc.right >= 3
      ? `<div class="verdict"><b>${(sc.avg/1000).toFixed(1)}s average</b>
         <span>Keep going. The target is two seconds, on every field you will play.</span></div>` : ""}
    <div class="toggles">
      ${r.running ? `<button class="btn btn--quiet" onclick="stopRep()">Stop the drill</button>`
                  : `<button class="btn" onclick="startRep()">${sc.n?"Go again":"Start"}</button>`}
    </div>
    ${sc.n ? `<div class="assigns">${(r.log||[]).slice(0,10).map(x=>`<div class="assign">
        <span class="assign__n" style="background:${x.right?"var(--ok)":"var(--red)"};color:${x.right?"#06210f":"#fff"};font-size:11px">${x.right?"✓":"✕"}</span>
        <span class="assign__body"><span class="assign__job">${esc((BREAKS[x.ask]||{}).name||x.ask)}</span>
        <span class="assign__who">${x.right?"":`you said ${esc((BREAKS[x.said]||{}).name||x.said)} · `}${(x.ms/1000).toFixed(1)}s</span></span>
      </div>`).join("")}</div>` : ""}`,
    r.running ? "drill running" : done ? "stopped" : curLayout().name)}`;
}

let raf=null;
window.playPath = () => {
  S.playing=!S.playing;
  if(!S.playing){ if(raf) cancelAnimationFrame(raf); render(); return; }
  render();
  if(S.t >= 1) S.t = 0;                 // they are set; run it again from the line
  const start=performance.now()-(S.t*2200);
  const tick=(now)=>{
    if(!S.playing) return;
    S.t=Math.min(1,(now-start)/2200);
    paintField();                 // only the field, not the whole app
    if(S.t<1) raf=requestAnimationFrame(tick);
    else { S.playing=false; render(); }
  };
  raf=requestAnimationFrame(tick);
};
// Repaint just the field SVGs. A full render() per frame rebuilt the entire
// document — including the division table — sixty times a second.
function paintField(){
  const opts = S.tab==="scout" ? {both:true, outs:!!S.outsOn} : {edit:S.editPath};
  const layer = fieldRunners(opts);
  document.querySelectorAll(".field-wrap[data-live]").forEach(el => {
    const g = el.querySelector("svg.field g.live");
    // Swap only the moving layer. If the field is not drawn yet — first paint,
    // or the tab just changed — fall back to drawing the whole thing.
    if(g) g.innerHTML = layer; else el.innerHTML = fieldSVG(opts);
  });
}

/* ============================================================
   Tally — a point sheet, tap a player to mark him out
   ============================================================ */
function tally(){
  const pt=S.point||1;
  const bl=curLayout().bunkers;
  const mine=fiveFor(S.point||1).filter(Boolean);
  // The sheet, the counts and the log are this match's. A season of outs under
  // a point number that starts again every game is not a point sheet.
  const outs=rowsHere(S.tally);
  const thisPoint=outs.filter(o=>o.pt===pt);
  const isOut=(side,name)=>thisPoint.some(o=>o.side===side && o.name===name);
  const alive=side=>5-thisPoint.filter(o=>o.side===side).length;

  const col=(side,label,colour,names)=>`<div>
    <h4 class="sec__eyebrow" style="color:${colour};margin-bottom:8px">${label} · ${alive(side)} up</h4>
    <div class="assigns">
      ${names.map(n=>`<button class="assign" onclick="markOut('${side}',${JSON.stringify(n).replace(/"/g,'&quot;')})" style="${isOut(side,n)?"opacity:.4":""}">
        <span class="assign__n" style="background:${isOut(side,n)?"var(--line-lit)":colour}">${isOut(side,n)?"✕":"●"}</span>
        <span class="assign__body"><span class="assign__job">${esc(n)}</span>
        ${isOut(side,n)?`<span class="assign__who">out</span>`:""}</span>
      </button>`).join("")}
    </div></div>`;

  return `${tip("tally","Tap a player the moment he goes out. Next point clears the sheet and keeps the log.")}

  ${sec("Point sheet", `<div class="facts">
      <span class="fact"><b>${pt}</b><span>Point</span></span>
      <span class="fact"><b>${alive("us")}</b><span>You up</span></span>
      <span class="fact"><b>${alive("them")}</b><span>Them up</span></span>
      <span class="fact"><b>${outs.length}</b><span>This match</span></span>
    </div>
    <p class="note">Tap a player the moment he goes out.</p>
    ${curMatch() && curMatch().layout && curMatch().layout !== S.layoutKey
      ? `<p class="warn">This sheet was played on <b>${esc((LAYOUTS[curMatch().layout]||{}).name || curMatch().layout)}</b>.
         You are looking at ${esc(curLayout().name)}, so the bunkers under an out are the wrong field's.</p>`
      : ""}
    ${matchVs() && (S.right||{}).name && (S.right||{}).name !== matchVs()
      ? `<div class="fld">
           <p class="warn">This sheet is <b>${esc(matchVs())}</b>. The right pit is
           <b>${esc(S.right.name)}</b> — scouting them does not move the sheet.</p>
           <button class="btn btn--quiet" onclick="newMatch()">Start a match vs ${esc(S.right.name)}</button>
         </div>`
      : ""}
    <div class="who2">
      ${col("us", mine.length?"Your five":"Your five · add them in Team", "var(--red)",
            mine.length?mine.map(p=>p.name):["1","2","3","4","5"])}
      ${col("them",esc(matchVs()||"Them"),"var(--blue)",["1","2","3","4","5"].map(n=>"#"+n))}
    </div>
    <div class="btnrow">
      ${pt > 1 ? `<button class="btn btn--quiet" onclick="backPoint()">‹ Point ${pt-1}</button>` : ""}
      <button class="btn grow" onclick="nextPoint()">Next point</button>
    </div>
    <button class="btn btn--quiet btn--block" onclick="newMatch()">New match</button>`,
    matchLabel(curMatch()))}

  ${sec("Log", outs.length?`<div class="assigns">
      ${outs.slice(0,40).map(o=>{
        // The log shows this match; Undo and the pickers write to the season.
        // So the index handed to them is the row's real place in S.tally, not
        // its place in the filtered view — those stopped being the same number
        // the moment the sheet became one match's.
        const i = (S.tally||[]).indexOf(o);
        // Only the point you are on gets the pickers. Each one is 58 options,
        // so rendering them for the whole log costs thousands of nodes a
        // repaint — and you should not be editing an old point by accident.
        const live = !!o.pt && o.pt === pt;
        const named = id => { const b = bl.find(x=>x.id===id); return b?esc(callOf(b)):esc(id); };
        const where = [o.how?o.how.toLowerCase():"", o.by?`by ${esc(o.by)}`:"",
          o.shotAt?`at ${named(o.shotAt)}`:"", o.movedTo?`moved to ${named(o.movedTo)}`:""]
          .filter(Boolean).join(" · ");
        return `<div class="assign" style="flex-wrap:wrap">
        <span class="assign__n" style="background:${o.side==="them"?"var(--blue)":o.side?"var(--red)":"var(--line-lit)"};font-size:11px">${o.pt||"·"}</span>
        <span class="assign__body"><span class="assign__job">${esc(o.name)}</span>
        <span class="assign__who">${o.side==="us"?"your player":o.side?esc(o.vs||matchVs()):"logged before matches"}${where?" · "+where:""}</span></span>
        <button class="btn btn--danger" onclick="undoOut(${i})">Undo</button>
        ${live?`<div class="who2" style="flex-basis:100%;margin-top:6px">
          ${bunkerPick("Shot at", i, "shotAt", o.shotAt)}
          ${bunkerPick("Moved to", i, "movedTo", o.movedTo)}
          ${causePick("How", i, "how", o.how, OUT_CAUSES.map(c=>({v:c,t:c})))}
          ${whoPick(i, o.side, o.by)}
        </div>`:""}
      </div>`;}).join("")}
    </div>${outs.length>40?`<p class="note">Showing the last 40 of ${outs.length}. Bunkers can be set on the point you are on.</p>`:`<p class="note">Bunkers can be set on the point you are on.</p>`}`
    : `<div class="empty">No outs yet. Tap a player above the moment he walks.</div>`,
    outs.length?outs.length+" on this sheet":"")}`;
}
// Optional detail on an out: which bunker he was shot at, which he had moved
// to. Both feed Bunker stats. The fast path stays one tap — this is after.
// How he went out. Where is not why: a player laned off the break and a player
// caught crawling the snake are different problems, and the tally could not
// tell them apart. "By" reaches for the other pit's logged five when it is your
// player, and your own roster when it is theirs.
const OUT_CAUSES = ["Laned", "Traded", "Run-through", "Snake crawl", "Bounce", "Unknown"];
function causePick(label, idx, field, value, options){
  return `<label style="display:flex;flex-direction:column;gap:4px">
    <span class="note">${label}</span>
    <select onchange="setOutBunker(${idx},'${field}',this.value)" style="font-size:var(--t-sm)">
      <option value="">—</option>
      ${options.map(o=>`<option value="${esc(o.v)}" ${value===o.v?"selected":""}>${esc(o.t)}</option>`).join("")}
    </select></label>`;
}
function whoPick(idx, side, value){
  // Your player went out — who got him? Theirs went out — which of yours?
  const list = side === "us"
    ? (pitOf("right").players || []).map(m => ({v:"#"+(m.num||"?"), t:"#"+(m.num||"?")+(m.name?" "+m.name:"")}))
    : (S.roster || []).map(r => ({v:r.name, t:"#"+r.num+" "+r.name}));
  return causePick(side === "us" ? "By (them)" : "By (yours)", idx, "by", value, list);
}

function bunkerPick(label, idx, field, value){
  const list = curLayout().bunkers;
  return `<label style="display:flex;flex-direction:column;gap:4px">
    <span class="note">${label}</span>
    <select onchange="setOutBunker(${idx},'${field}',this.value)" style="font-size:var(--t-sm)">
      <option value="">—</option>
      ${list.map(b=>`<option value="${esc(b.id)}" ${value===b.id?"selected":""}>${esc(callOf(b))} · ${esc(b.id)}</option>`).join("")}
    </select></label>`;
}
window.setOutBunker = (i, field, val) => {
  const t = [...(S.tally||[])];
  if(!t[i] || typeof t[i] !== "object") return;
  t[i] = {...t[i], [field]: val || undefined};
  S.tally = t; save(S); render();
};

window.markOut = (side,name) => {
  const pt=S.point||1;
  const already=(S.tally||[]).some(o=>typeof o==="object" && o.m===S.matchId && o.pt===pt
                                    && o.side===side && o.name===name);
  if(already) return;
  // Enough context to count honestly afterwards: which break was called, on
  // which field, against whom. Without these an out is a number with no story.
  S.tally=[{pt,side,name,at:Date.now(),m:S.matchId,
            script:S.script, layout:S.layoutKey, vs:matchVs()},...(S.tally||[])];
  save(S); render();
};
window.undoOut = i => { S.tally=(S.tally||[]).filter((_,k)=>k!==i); save(S); render(); };
window.nextPoint = () => { S.point=(S.point||1)+1; save(S); render(); };
// Back a point, because Next point is one tap and a sideline is a sideline.
// It moves the cursor; it does not throw away what was logged on the point you
// are leaving, and markOut already refuses to log the same man twice.
window.backPoint = () => { S.point=Math.max(1,(S.point||1)-1); save(S); render(); };

/* A new match: the opponent across the tape now, and the point back to one.
 *
 * Nothing is deleted — the sheet you are walking away from keeps every out,
 * lineup and grade against its own match, and Matches on More can still read
 * it. But it is a boundary you cannot undo by tapping again, so a match with
 * anything in it asks first.
 */
window.newMatch = () => {
  // The opponent is stamped on every out this sheet records, so it has to be a
  // team the coach picked, not whoever the app happened to have in the pit.
  if(!pitNamed("right")){
    alert("Put the team you are playing in the right pit on Scout first — "
        + "every out on this sheet is logged against them.");
    return set({tab:"scout", scoutTab:"matchup"});
  }
  const cur = curMatch();
  const n = cur ? matchSize(cur.id) : 0;
  if(n && !confirm(`Close the sheet ${matchLabel(cur)}? It keeps its ${n} `
                 + `${n===1?"entry":"entries"} — the point goes back to 1 for the new one.`)) return;
  const id = newMatchId();
  S.matches = [{id, at: Date.now(), vs: (S.right||{}).name || "", layout: S.layoutKey},
               ...(S.matches || [])];
  S.matchId = id; S.point = 1;
  save(S); render();
};
// An old sheet is worth reading, and worth adding to when you tallied a point
// late. Opening one puts you on its last point rather than back at one.
window.openMatch = id => {
  if(!(S.matches || []).some(m => m.id === id)) return;
  S.matchId = id;
  const pts = rowsHere(S.tally).map(o => o.pt);
  S.point = pts.length ? Math.max(...pts) : 1;
  save(S); render();
};
// kept: older builds called this
window.addOut = () => window.markOut("us","Player");

/* ============================================================
   History — arithmetic on what you logged, not a model
   ============================================================

   Nothing here predicts anything. It counts outs you recorded and reports
   them, which is the honest version of "analysis" for a tool with one device
   and a season's worth of points. Entries logged before an out carried its
   context are simply not counted rather than guessed at. */
function loggedOuts(match){
  return (S.tally || []).filter(o => o && typeof o === "object" && match(o));
}
function breakRecord(scriptKey){
  const rows = loggedOuts(o => o.script === scriptKey && o.layout === S.layoutKey);
  return {points: new Set(rows.map(o => o.pt)).size,
          us: rows.filter(o => o.side === "us").length,
          them: rows.filter(o => o.side === "them").length};
}
// How a given team takes your players out, and which of them does it.
function opponentRead(team){
  const rows = loggedOuts(o => o.side === "us" && o.vs === team);
  const tally = (key) => rows.reduce((m, o) => (o[key] ? {...m, [o[key]]:(m[o[key]] || 0) + 1} : m), {});
  const rank = m => Object.entries(m).sort((a, b) => b[1] - a[1]);
  return {n: rows.length, points: new Set(rows.map(o => o.pt)).size,
          how: rank(tally("how")), who: rank(tally("by"))};
}

/* ============================================================
   Self-scout — how predictable you have been
   ============================================================

   The spec's Log break chip. Nothing is modelled: this counts the calls a
   coach pressed the button on, on the field he is standing on, and reports the
   share. A team that watches your film is doing exactly this arithmetic, so it
   is better that you see it first. */
function loggedCalls(){
  return (S.calls || []).filter(c => c && c.layout === S.layoutKey);
}
function selfScout(){
  const rows = loggedCalls();
  const seen = rows.reduce((m, c) => ({...m, [c.script]: (m[c.script] || 0) + 1}), {});
  const rank = Object.entries(seen).sort((a, b) => b[1] - a[1]);
  const recent = rows.slice(0, 10);
  const top = rank[0];
  // Ten calls is enough to have a habit; half of them the same one is a habit
  // a scout can hang a break on.
  const tell = recent.length >= 6 && top
    ? recent.filter(c => c.script === top[0]).length / recent.length : 0;
  return {n: rows.length, rank, recent, top, tell};
}
window.logCall = () => {
  S.calls = [{script: S.script, layout: S.layoutKey, pt: S.point || 1, m: S.matchId,
              vs: matchVs(), at: Date.now()}, ...(S.calls || [])];
  save(S); render();
};
window.unlogCall = i => {
  const all = [...(S.calls || [])];
  all.splice((S.calls || []).indexOf(loggedCalls()[i]), 1);
  S.calls = all; save(S); render();
};

// Which wire the called break actually sends people to. Counted off the plants
// in BREAK_PLANTS against the measured layout — not a guess about the game.
function wireSplit(){
  const bucket = {Snake:0, Centre:0, Dorito:0};
  currentPaths().forEach(p => {
    const w = wireOf(p.to[1]);
    bucket[w.startsWith("snake") ? "Snake" : w === "centre" ? "Centre" : "Dorito"]++;
  });
  return bucket;
}

/* ---- Layers: where it has actually happened, on the measured field ------ */
const LAYERS=[["theirOuts","Their outs","Where their players went out"],
              ["yourOuts","Your outs","Where you lost players"],
              ["rotations","Your rotations","Bunker to bunker after the break"]];
function scoutLayers(){
  const R=pitOf("right"), on=S.scoutLayers||{theirOuts:true};
  const vs=o=>o.vs===R.name;
  const counts={
    theirOuts:(S.tally||[]).filter(o=>o&&o.side==="them"&&vs(o)&&o.shotAt).length,
    yourOuts:(S.tally||[]).filter(o=>o&&o.side==="us"&&vs(o)&&o.shotAt).length,
    rotations:layoutMoves().length,
  };
  const live=LAYERS.filter(([k])=>on[k]);
  const heat=live.some(([k])=>k!=="rotations")
    ? (o => (on.theirOuts && o.side==="them" && vs(o)) || (on.yourOuts && o.side==="us" && vs(o)))
    : false;
  const any=live.reduce((n,[k])=>n+counts[k],0);
  return sec("Layers", `<p class="lede">Everything you have logged against ${esc(R.name)} on
      ${esc(curLayout().name)}, drawn where it happened. Rings are traffic, arrows are rotations.</p>
    <div class="toggles">
      ${LAYERS.map(([k,n,d])=>`<button class="tgl ${on[k]?"on":""}"
        onclick="toggleLayer('${k}')"><i></i>${n} · ${counts[k]}</button>`).join("")}
    </div>
    <div class="field-wrap">${fieldSVG({static:true, heat, moves:on.rotations?(()=>true):false})}</div>
    ${any?`<p class="note">${live.map(([k,n])=>`${counts[k]} ${n.toLowerCase()}`).join(" · ")}.</p>`
        :`<div class="empty">Nothing logged against ${esc(R.name)} on this field yet. Outs get a bunker on
          the Tally tab, on the point you are on.</div>`}`,
    esc(R.name));
}

/* ---- Games: the points you played, and what happened in each ------------ */
function scoutGames(){
  const R=pitOf("right");
  // A sheet at a time. You may have played this team four times, and their
  // point 3 is four different points — merging them into one list of "Point 3"
  // was the whole reason a match had to exist.
  const theirs=(S.tally||[]).filter(o=>o&&typeof o==="object"&&o.vs===R.name&&o.pt);
  const games=[...new Set(theirs.map(o=>o.m))].map(id=>{
    const m=(S.matches||[]).find(x=>x.id===id);
    return {id, at:(m&&m.at)||Math.min(...theirs.filter(o=>o.m===id).map(o=>o.at||0)),
            n:theirs.filter(o=>o.m===id).length};
  }).sort((a,b)=>b.at-a.at);
  if(!games.length) return sec("Games", `<div class="empty">No points logged against ${esc(R.name)} yet.
    Tally a point and it shows up here.</div>`, esc(R.name));
  // The one you are on, if it is against them; otherwise the most recent.
  const gid=games.some(g=>g.id===S.replayMatch)?S.replayMatch
           :games.some(g=>g.id===S.matchId)?S.matchId:games[0].id;
  const mine=theirs.filter(o=>o.m===gid);
  const pts=[...new Set(mine.map(o=>o.pt))].sort((a,b)=>b-a);
  const pick=pts.includes(S.replayPt)?S.replayPt:pts[0];
  const events=mine.filter(o=>o.pt===pick).sort((a,b)=>(a.at||0)-(b.at||0));
  const step=Math.min(events.length, S.replayStep==null?events.length:S.replayStep);
  const bl=curLayout().bunkers;
  const named=id=>{const b=bl.find(x=>x.id===id);return b?callOf(b):id;};
  const when=t=>new Date(t).toLocaleDateString([], {month:"short", day:"numeric"});
  return sec("Games", `${games.length>1?`<div class="seg" style="flex-wrap:wrap">
      ${games.map(g=>`<button class="${g.id===gid?"on":""}" onclick="set({replayMatch:'${g.id}',replayPt:null,replayStep:null})">${
        when(g.at)}${g.id===S.matchId?" · on now":""}</button>`).join("")}
    </div>`:""}
    <div class="seg" style="flex-wrap:wrap">
      ${pts.map(n=>`<button class="${n===pick?"on":""}" onclick="set({replayPt:${n},replayStep:null})">Point ${n}</button>`).join("")}
    </div>
    <p class="note">${events.length} out${events.length===1?"":"s"} logged on point ${pick}, in the order you tapped them.</p>`,
    esc(R.name))
  + sec("Replay", `<div class="fld"><label>Step through it · ${step} of ${events.length}</label>
      <input type="range" min="0" max="${events.length}" value="${step}"
        oninput="set({replayStep:Number(this.value)})"/></div>
    <div class="assigns">${events.slice(0,step).map((o,i)=>{
      const bits=[o.how?o.how.toLowerCase():"", o.by?`by ${esc(o.by)}`:"",
                  o.shotAt?`at ${esc(named(o.shotAt))}`:"", o.movedTo?`moved to ${esc(named(o.movedTo))}`:""]
                 .filter(Boolean).join(" · ");
      return `<div class="assign">
        <span class="assign__n" style="background:${o.side==="them"?"var(--blue)":"var(--red)"};font-size:11px">${i+1}</span>
        <span class="assign__body"><span class="assign__job">${esc(o.name)}</span>
        <span class="assign__who">${o.side==="us"?"yours":esc(R.name)}${bits?" · "+bits:""}</span></span>
      </div>`;}).join("")}</div>
    ${step<events.length?`<p class="note">${events.length-step} still up.</p>`:""}
    <p class="aid">What you logged, in the order you logged it. Nothing is reconstructed.</p>`,
    "Point "+pick);
}

window.loadPit = (name, side) => {
  if(!anyTeam(name)) return;
  S[side === "left" ? "left" : "right"] = {name}; save(S); render();
};

/* Both pits off one board.
 *
 * A tap loads who you are about to play; a press and hold loads the other pit,
 * which is how you set up a matchup you are not in — two teams you are scouting
 * for the bracket. Held is 450 ms, and the row is taken out of the running for
 * the tap so a hold never does both.
 */
let _press = null;
window.pressTeam = name => {
  cancelTeam();
  _press = {name, held:false};
  _press.t = setTimeout(() => { _press.held = true; loadPit(name, "left"); }, 450);
};
window.releaseTeam = name => {
  const p = _press; if(!p) return;
  clearTimeout(p.t); _press = null;
  if(!p.held) loadPit(name, "right");
};
window.cancelTeam = () => { if(_press) clearTimeout(_press.t); _press = null; };

/* Narrowing the board is this moment's business, not something to keep, so it
 * hides rows in place rather than going through state — which would also take
 * the keyboard down on every letter. */
window.findTeam = q => {
  const t = clean(q || "").trim().toLowerCase();
  const body = document.getElementById("boardRows"); if(!body) return;
  [...body.rows].forEach(tr => {
    const cell = tr.children[1];
    tr.hidden = !!t && !(cell && cell.textContent.toLowerCase().includes(t));
  });
};

function sightlines(){
  const list=curLayout().bunkers;

  const res=sightLines(from,300/150,240/120);
  const lane=S.sightTo ? res.lines.find(l=>l.to.id===S.sightTo) : null;
  // Four bunkers on this field are called Tr. A coach's own call wins when he
  // has set one; otherwise the unique code does, because "SD to Tr" names
  // nothing he can stand in.
  const name=b=>{ const o=typeof b==="string" ? list.find(x=>x.id===b) : b;
                  if(!o) return "—";
                  const call=bunkerCalls()[o.id];
                  return call || o.id; };
  const picking=S.sightPick==="to" ? "to" : "from";
  return `${tip("sl","Tap the field where you are standing. Tap again on what you want to see. Green is a clear lane, red is blocked.")}

  ${sec("Tap the field", `<div class="seg">
      <button class="${picking==="from"?"on":""}" onclick="setSightPick('from')">Standing in · ${esc(name(from))}</button>
      <button class="${picking==="to"?"on":""}" onclick="setSightPick('to')">Looking at · ${esc(S.sightTo?name(S.sightTo):"anything")}</button>
    </div>
    <div class="field-wrap">${fieldSVG({sightFrom:from,sightTo:S.sightTo,static:true,pick:true})}</div>
    ${lane
      ? `<div class="verdict ${lane.blocked?"verdict--no":"verdict--yes"}">
           <b>${lane.blocked?"Blocked":"Clear"}</b>
           <span>${esc(name(from))} to ${esc(name(lane.to.id))} · ${lane.ft} ft${
             lane.blocked ? " · " + lane.by.slice(0,2).map(o=>esc(name(o))).join(" then ") + " in the way" : ""}</span>
         </div>`
      : `<p class="note">Tap a bunker to ask about one lane. Everything red is clipped by something
         between you and it.</p>`}
    <div class="facts">
      <span class="fact"><b>${res.clear}</b><span>Clear lanes</span></span>
      <span class="fact"><b>${res.lines.length-res.clear}</b><span>Blocked</span></span>
      <span class="fact"><b>${res.lines.length}</b><span>Bunkers</span></span>
    </div>
    <p class="aid">Geometry only. It does not know where bodies are — <b>walk it before you trust it.</b></p>`,
    curLayout().name)}

  ${sec("Clear from here", `<div class="tblwrap"><table class="tbl">
      <thead><tr><th>Bunker</th><th>Code</th><th>Lane</th></tr></thead>
      <tbody>${res.lines.map(l=>`<tr class="tap ${l.to.id===S.sightTo?"tap--on":""}"
          onclick="pickSight('to','${esc(l.to.id)}')">
        <td>${esc(l.to.n)}</td><td class="num">${esc(l.to.id)}</td>
        <td style="color:${l.blocked?"var(--dim)":"var(--ok)"}">${l.blocked
          ? "blocked by "+esc(name(l.by[0]))
          : "clear · "+l.ft+" ft"}</td>
      </tr>`).join("")}</tbody>
    </table></div>`, res.clear+" of "+res.lines.length)}`;
}

        </button>`).join("") || `<span class="empty">Make a group first.</span>`}</div></div>
    <button class="btn btn--block" onclick="sendBlast()">${
      blastTo().length ? `Send to ${blastCount()} ${blastCount()===1?"person":"people"}` : "Pick a group"}</button>
    <p class="aid">Not a bulk-messaging tool. <b>Only message people who agreed to league ops texts.</b>
      A gate time is for ops; it is not for refs, and it is not for everybody.</p>
    ${(S.blasts||[]).length?`<div class="assigns">${S.blasts.map(b=>`<div class="assign">
      <span class="assign__body"><span class="assign__job">${esc(b.body)}</span>
      <span class="assign__who">${esc(b.at)} · ${b.n} recipients${b.to?" · "+esc(b.to):""}</span></span>
    </div>`).join("")}</div>`:""}`, (S.blasts||[]).length?S.blasts.length+" sent":"")}`;
}

/* Who a blast actually goes to.
 *
 * Sending every update to every member is how a league teaches its refs to
 * stop reading the texts. A gate time is for ops; a rules change is for refs.
 * So the blast carries a set of groups, and only members with a contact on
 * file are counted — the button used to promise a number that included people
 * there was no way to reach.
 *
 * No pick means no send, not everybody: a missed tap must not become a text to
 * two hundred people. New groups start picked so the common case is one tap.
 */
const reachable = g => (g.members||[]).filter(m => clean(m.phone||m.email||""));
function blastTo(){
  const live = S.groups.map(g=>g.id);
  return (S.blastTo || live).filter(id => live.includes(id));
}
const blastPicked = id => blastTo().includes(id);
const blastCount = () => S.groups.filter(g=>blastPicked(g.id))
  .reduce((n,g)=>n+reachable(g).length, 0);
window.toggleBlastGroup = id => {
  const on = blastTo();
  S.blastTo = on.includes(id) ? on.filter(x=>x!==id) : [...on, id];
  save(S); render();
};
window.addGroup = () => {
  const n=document.getElementById("ng").value.trim(); if(!n) return;
  const id="g"+Date.now();
  S.blastTo=[...blastTo(), id];
  S.groups=[...S.groups,{id,name:n,members:[]}]; save(S); render();
};
window.delGroup = id => {
  S.groups=S.groups.filter(g=>g.id!==id);
  if(S.blastTo) S.blastTo=S.blastTo.filter(x=>x!==id);
  save(S); render();
};
window.addMem = id => {
  const name=document.getElementById("mn-"+id).value.trim();
  const phone=document.getElementById("mp-"+id).value.trim();
  if(!name) return;
  S.groups=S.groups.map(g=>g.id===id?{...g,members:[...g.members,{name,phone}]}:g); save(S); render();
};
window.delMem = (id,i) => {
  S.groups=S.groups.map(g=>g.id===id?{...g,members:g.members.filter((_,k)=>k!==i)}:g); save(S); render();
};
window.sendBlast = () => {
  const body=clean(S.blastBody||"");
  if(!body){alert("Write the update first.");return}
  const picked=S.groups.filter(g=>blastPicked(g.id));
  if(!picked.length){alert("Pick at least one group.");return}
  const rec=[];
  picked.forEach(g=>reachable(g).forEach(m=>rec.push(m.phone||m.email)));
  S.blasts=[{at:new Date().toLocaleString(),n:rec.length,body,
             to:picked.map(g=>g.name).join(", ")},...S.blasts];
  save(S);
  if(rec.length && window.gridlockShare) window.gridlockShare(body+"\n"+rec.join(", "),"GRIDLOCK league blast");
  else prompt("Copy this blast", body+"\n"+rec.join(", "));
  render();
};
