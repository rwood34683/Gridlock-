<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0d"/>
<meta name="color-scheme" content="dark"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GRIDLOCK"/>
<meta name="format-detection" content="telephone=no"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<title>GRIDLOCK System · Coach Edition</title>
<style>
:root{
  /* ---- surface: five steps, so depth means something ---- */
  --bg:#0b0c0d;        /* the page */
  --sunk:#0f1011;      /* inputs, wells */
  --panel:#161818;     /* raised object */
  --panel-2:#1e2121;   /* raised object, one step up */
  --line:#26292a;      /* hairline */
  --line-lit:#3a3f40;  /* hairline on a raised object */

  /* ---- one accent, three weights ---- */
  --accent:#ad1515; --accent-deep:#8f1010; --accent-lit:#e5252a;

  /* ---- type ---- */
  --ink:#efedeb; --mute:#9b9d9e; --dim:#6d7173;

  /* ---- semantic, never decorative ---- */
  --red:#e5342f; --blue:#3d8bff; --ok:#3ecf8e; --warn:#e0a33a;

  /* ---- type scale: real steps, so a heading reads as one ---- */
  --t-hero:30px; --t-xl:21px; --t-lg:17px; --t-md:15px; --t-sm:13px; --t-xs:11px;

  /* ---- spacing scale ---- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;

  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{
  margin:0;height:100%;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font:400 var(--t-md)/1.45 var(--sans);
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
body{-webkit-touch-callout:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent-lit);outline-offset:2px;border-radius:var(--r-sm)}
h1,h2,h3,p{margin:0}
.grow{flex:1}

/* Every control a coach taps is at least 44 px in its short axis. Apple asks
   for 44 pt and Android for 48 dp, but the real reason is the promise on the
   box: this gets used on a sideline, in a hurry, with a glove on.
   test/devices.js fails the build if anything drops under it. */

/* ============================================================
   SHELL — header and tab bar pinned, only .main scrolls
   ============================================================ */
#root{height:100%;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.main{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:var(--s4) calc(var(--s4) + env(safe-area-inset-left)) var(--s6) calc(var(--s4) + env(safe-area-inset-right));
  display:flex;flex-direction:column;gap:var(--s5);
}
/* A scrolling flex column shrinks its children to fit. Without this every
   block is squashed — and anything with overflow:hidden gets clipped. */
.main > *{flex:0 0 auto}

/* Tablets. A phone layout stretched to 1366 px is not a tablet layout: the
   call button becomes a metre wide and a line of notes runs past 200
   characters, which nobody reads. So the whole screen holds one centred column
   — every heading on the same left edge, the way it reads on a phone — and the
   field gets 860 px, which is two and a half times what it has on a phone. */
@media (min-width:680px){
  .main{align-items:center}
  .main > *{width:100%;max-width:860px}
  .main .note{max-width:74ch}          /* a caption, not a wall of text */
}

.hdr{
  background:#000;border-bottom:1px solid var(--line);
  padding:var(--s3) calc(var(--s4) + env(safe-area-inset-right)) 0 calc(var(--s4) + env(safe-area-inset-left));
  padding-top:calc(var(--s3) + env(safe-area-inset-top));
}
.hdr__top{display:flex;align-items:center;gap:var(--s3)}
.brand{font-size:var(--t-md);font-weight:800;letter-spacing:.14em;line-height:1}
.brand small{
  display:block;margin-top:3px;font-size:9px;font-weight:700;
  letter-spacing:.3em;color:var(--accent-lit);
}
.who-chip{
  font-size:var(--t-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);border:1px solid var(--line-lit);border-radius:var(--r-pill);padding:4px 10px;
}
.who-chip.staff{color:var(--ink);border-color:var(--accent);background:rgba(173,21,21,.18)}

/* live context: what field and what call, always on screen */
.ctx{
  display:flex;align-items:center;gap:var(--s2);width:100%;min-height:44px;
  padding:var(--s2) 0 var(--s3);margin-top:var(--s2);
  color:var(--mute);font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;font-weight:700;
}
.ctx__line{
  min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ctx b{color:var(--ink);font-weight:700}
.ctx__sep{color:var(--dim)}
.ctx__caret{color:var(--dim);font-size:10px}

.tabs{
  display:flex;background:#000;border-top:1px solid var(--line);
  padding:var(--s1) calc(var(--s2) + env(safe-area-inset-left)) calc(var(--s2) + env(safe-area-inset-bottom)) calc(var(--s2) + env(safe-area-inset-right));
}
.tabs button{
  flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
}
.tabs button i{display:block;width:16px;height:2px;border-radius:2px;background:transparent}
.tabs button.on{color:var(--ink)}
.tabs button.on i{background:var(--accent-lit)}

/* Tablet. A row of five destinations along the bottom of a 1024 px screen is a
   phone habit: the thumb is nowhere near it and the labels swim in a metre of
   black. On a wide screen the same five stand in a rail down the left, the
   header sits beside them, and the field gets the room. Below 900 the bottom
   bar is right and stays. */
@media (min-width:900px){
  .app{display:grid;grid-template-columns:216px minmax(0,1fr);
       grid-template-rows:auto minmax(0,1fr);grid-template-areas:"rail hdr" "rail main"}
  .hdr{grid-area:hdr}
  .main{grid-area:main}
  .tabs{
    grid-area:rail;flex-direction:column;justify-content:flex-start;gap:2px;
    border-top:0;border-right:1px solid var(--line);
    padding:var(--s4) var(--s2) calc(var(--s4) + env(safe-area-inset-bottom)) calc(var(--s2) + env(safe-area-inset-left));
  }
  .tabs button{
    flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:var(--s3);
    min-height:52px;padding:0 var(--s3);border-radius:var(--r-md);
    font-size:var(--t-sm);letter-spacing:.08em;
  }
  .tabs button i{width:3px;height:20px;border-radius:2px}
  .tabs button.on{background:var(--panel)}
}

/* ============================================================
   SECTION — an eyebrow and a rule, not another card.
   Cards are reserved for things that are actually objects.
   ============================================================ */
.sec{display:flex;flex-direction:column;gap:var(--s3)}
.sec__head{display:flex;align-items:baseline;gap:var(--s3);border-bottom:1px solid var(--line);padding-bottom:var(--s2)}
.sec__eyebrow{font-size:var(--t-xs);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.sec__note{margin-left:auto;font-size:var(--t-xs);color:var(--dim);letter-spacing:.04em}
.sec__body{display:flex;flex-direction:column;gap:var(--s3)}

.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);
}
.panel--flush{padding:0;overflow:hidden}
.panel__title{font-size:var(--t-lg);font-weight:700;letter-spacing:.01em}

.lede{color:var(--mute);font-size:var(--t-sm);line-height:1.5}
.note{color:var(--dim);font-size:var(--t-xs);line-height:1.5}
.warn{color:var(--warn);font-size:var(--t-sm)}

/* ============================================================
   THE CALL — the one thing a coach needs in forty seconds
   ============================================================ */
.call{
  background:linear-gradient(150deg,#1a1010,#0f1011 60%);
  border:1px solid var(--line-lit);border-radius:var(--r-lg);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);
  position:relative;overflow:hidden;
}
.call::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
}
.call__label{font-size:var(--t-xs);font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-lit)}
.call__name{font-size:var(--t-hero);font-weight:800;letter-spacing:-.01em;line-height:1.02}
.call__read{color:var(--mute);font-size:var(--t-sm);line-height:1.45}
.call__meta{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;padding-top:var(--s1)}

/* aggression as five pips, not a number nobody can feel */
.aggr{display:flex;align-items:center;gap:var(--s2)}
.aggr__pips{display:flex;gap:3px}
.aggr__pips i{width:14px;height:4px;border-radius:2px;background:var(--line-lit)}
.aggr__pips i.on{background:var(--accent-lit)}
.aggr__label{font-size:var(--t-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

.vs{font-size:var(--t-xs);color:var(--dim);letter-spacing:.06em}
.vs b{color:var(--ink)}

/* ============================================================
   CONTROLS — three shapes, so you can tell them apart:
   segmented = pick one, toggle = on/off, button = do something
   ============================================================ */
.seg{
  display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);
  border-radius:var(--r-md);padding:3px;overflow-x:auto;scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none}
.seg{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);
     mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent)}
.seg:not(:has(button:nth-child(4))){-webkit-mask-image:none;mask-image:none}
/* Seven destinations do not fit one line on a phone, and a scroller hides the
   last three behind an edge nobody swipes. This one wraps instead, so every
   sub-tab is on screen. */
.seg--wrap{flex-wrap:wrap;overflow-x:visible;-webkit-mask-image:none;mask-image:none}
.seg--wrap button{flex:1 1 auto;min-width:31%}
.seg button{
  flex:1 0 auto;min-height:44px;padding:0 var(--s3);border-radius:var(--r-sm);
  color:var(--mute);font-size:var(--t-sm);font-weight:600;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;
}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}

.toggles{display:flex;gap:var(--s2);flex-wrap:wrap}
.tgl{
  display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s3);
  border:1px solid var(--line-lit);border-radius:var(--r-pill);background:var(--panel);
  font-size:var(--t-sm);font-weight:600;color:var(--mute);
}
.tgl i{width:7px;height:7px;border-radius:50%;background:var(--line-lit);flex:none}
.tgl.on{color:var(--ink);border-color:var(--accent)}
.tgl.on i{background:var(--accent-lit);box-shadow:0 0 0 3px rgba(229,37,42,.2)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:44px;padding:0 var(--s4);border-radius:var(--r-md);
  background:var(--accent);color:#fff;font-size:var(--t-md);font-weight:700;
  transition:background .12s;
}
.btn:active{background:var(--accent-deep)}
.btn--block{width:100%}
.btn--lg{min-height:52px;font-size:var(--t-lg);letter-spacing:.02em}
.btn--ghost{background:transparent;color:var(--ink);border:1px solid var(--line-lit)}
.btn--ghost:active{background:var(--panel-2)}
.btn--quiet{background:transparent;color:var(--mute);border:1px solid var(--line);min-height:44px;font-size:var(--t-sm)}
.btn--danger{background:transparent;color:var(--red);border:1px solid var(--line);min-height:44px;font-size:var(--t-xs);padding:0 var(--s3)}
.btnrow{display:flex;gap:var(--s2);flex-wrap:wrap}

/* ============================================================
   FORM
   ============================================================ */
.fld{display:flex;flex-direction:column;gap:6px}
.fld > label{font-size:var(--t-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
input,select,textarea{
  /* 46, not 44: inside a flex row these get shrunk half a pixel, and a control
     that measures 43.5 is a control that fails the 44 px rule. */
  width:100%;min-height:46px;flex:0 0 auto;background:var(--sunk);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r-md);padding:11px var(--s3);
}
input::placeholder,textarea::placeholder{color:var(--dim)}
/* The file picker ships a grey system button that reads as somebody else's app
   on a black panel. Same shape as every other quiet button here. */
/* The default range slider is system blue on a black panel. */
input[type=range]{
  -webkit-appearance:none;appearance:none;background:transparent;
  min-height:44px;padding:0;border:0;width:100%;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line-lit)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line-lit)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:-9px;
  border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:pointer;
}
input[type=file]{padding:9px var(--s3);color:var(--mute);font-size:var(--t-sm)}
input[type=file]::file-selector-button{
  margin-right:var(--s3);padding:0 var(--s4);min-height:36px;
  border:1px solid var(--line-lit);border-radius:var(--r-sm);
  background:var(--panel);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;
}
input[type=file]::file-selector-button:hover{border-color:var(--accent)}
textarea{min-height:78px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--line-lit);outline:none}
select{appearance:none;-webkit-appearance:none;padding-right:var(--s5);
  background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.checkrow{display:flex;align-items:center;gap:var(--s3);font-size:var(--t-sm);color:var(--mute)}
.checkrow input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}

/* ============================================================
   FIELD
   ============================================================ */
/* Editing handles. Big enough to find under a thumb, quiet enough not to
   fight the field when you are only looking at it. */
.hnd{fill:#0b0c0d;stroke:#fff;stroke-width:1.6;cursor:grab}
.hnd:active{cursor:grabbing}
.aim{cursor:grab}
svg.field [data-leg]{cursor:copy}
.field-wrap{background:#0b0c0d;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
svg.field{width:100%;height:auto;display:block}
/* A phone turned sideways is short, and the field is 150 by 120 — at full width
   it comes out taller than the screen, so you see less of it than in portrait,
   which is the wrong way round. Fit it to the height instead and centre it. */
@media (orientation:landscape) and (max-height:520px){
  .field-wrap{display:flex;justify-content:center;background:#0b0c0d}
  svg.field{width:auto;height:auto;max-height:calc(100vh - 190px);max-width:100%}
  /* Wide and short is the one shape where the call and the field fit side by
     side. Stacked, the card alone fills the screen and the field — the whole
     point of the tab — never gets on it. */
  .pbtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
         gap:var(--s3);align-items:start}
  .pbtop .call__name{font-size:var(--t-xl);line-height:1.1}
  .pbtop .call__read{font-size:var(--t-sm)}
  .pbtop svg.field{max-height:calc(100vh - 170px)}
  /* One column across a sideways phone is a very long line to read. Cap the
     measure so a sentence still scans between points. */
  p, .lede, .note, .empty, dd{max-width:70ch}
}

/* ============================================================
   ASSIGNMENTS — the five, as a roster not a paragraph
   ============================================================ */
.assigns{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.assign{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);background:var(--panel);min-height:56px}
.assign + .assign{border-top:1px solid var(--line)}
.assign__n{
  flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:var(--red);color:#fff;font-size:var(--t-sm);font-weight:800;
  font-variant-numeric:tabular-nums;
}
.assign__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.assign__job{font-size:var(--t-md);font-weight:600;line-height:1.25}
.assign__who{font-size:var(--t-xs);color:var(--dim);letter-spacing:.04em}
/* The job is the thing being read; the controls act on it. On a phone there is
   not room for both on one line once every control is 44 px, so the controls
   take their own row rather than breaking the label into three. */
.assign__ctl{flex:1 0 100%;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
@media (min-width:520px){
  .assign__ctl{flex:0 0 auto;justify-content:flex-end}
}
.ps{display:flex;gap:4px;flex:none}
/* 44 px square. Apple asks for 44 pt and Android for 48 dp, but the real
   reason is the promise on the box: this gets tapped on a sideline, in a
   hurry, with a glove on. */
.ps button{
  width:44px;height:44px;border-radius:8px;display:grid;place-items:center;
  font-size:13px;font-weight:800;letter-spacing:.04em;
  border:1px solid var(--line-lit);color:var(--dim);background:transparent;
}
.ps button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* the 8-way face pad the spec asks for */
.pad{
  flex-basis:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  margin-top:8px;padding:8px;background:var(--sunk);
  border:1px solid var(--line);border-radius:var(--r-md);
}
.pad button{
  min-height:46px;border-radius:var(--r-sm);border:1px solid var(--line-lit);
  background:var(--panel);color:var(--ink);font-size:18px;font-weight:700;
  display:grid;place-items:center;
}
.pad button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ============================================================
   LIST — the More menu, and anything else that is a list of places
   ============================================================ */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.list__row{
  display:flex;align-items:center;gap:var(--s3);width:100%;
  padding:var(--s3) var(--s4);background:var(--panel);min-height:58px;
}
.list__row + .list__row{border-top:1px solid var(--line)}
.list__row:active{background:var(--panel-2)}
.list__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.list__name{font-size:var(--t-md);font-weight:600}
.list__desc{font-size:var(--t-xs);color:var(--dim);line-height:1.35}
.list__go{color:var(--dim);font-size:var(--t-lg);flex:none}
.list__count{
  flex:none;font-size:var(--t-xs);font-weight:700;color:var(--mute);
  background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 9px;
  font-variant-numeric:tabular-nums;
}

/* ============================================================
   PITS — the two opponents. A wire stripe, not a coloured border
   on an otherwise identical card.
   ============================================================ */
.pits{display:grid;gap:var(--s3)}
@media(min-width:720px){.pits{grid-template-columns:1fr 1fr}}
.pit{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);
  border-top:3px solid var(--wire);
}
.pit--l{--wire:var(--red)}
.pit--r{--wire:var(--blue)}
.pit__side{font-size:var(--t-xs);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--wire)}
.pit__name{font-size:var(--t-xl);font-weight:800;line-height:1.1}
.pit__pts{font-size:var(--t-xs);color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.stars{display:flex;gap:2px;margin:-6px}   /* the pad is bleed, not spacing */
.star{
  width:44px;height:44px;display:grid;place-items:center;font-size:19px;line-height:1;
  color:var(--dim);
}
.star.on{color:var(--accent-lit)}

/* ============================================================
   DATA
   ============================================================ */
.bar{height:8px;border-radius:var(--r-pill);overflow:hidden;display:flex;background:var(--sunk)}
.bar i{display:block;height:100%}
.barends{display:flex;font-size:var(--t-sm);font-weight:700;font-variant-numeric:tabular-nums}
.barends span:last-child{margin-left:auto}

.facts{display:flex;flex-wrap:wrap;gap:var(--s2)}
.fact{
  display:flex;flex-direction:column;gap:1px;flex:1 0 auto;min-width:76px;
  background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s2) var(--s3);
}

</head>
<body>
<div id="root"></div>
<script>
const STORE_KEY = "gridlock.coach.v2";
const BANNED = /gunz\s*up/ig;
function clean(s){return String(s||"").replace(BANNED,"Shot lanes")}

// What each break is, in a coach's words, and how hot it runs (1–5).
// Aggression drives the counter-picker ranking and the pips on the call.
const BREAK_META = {
  hold:  {aggr:1, read:"Give up nothing early. Read their bodies, then trade on your terms.",
          vs:{Snake:2, Balanced:1, Dorito:4}},
  base:  {aggr:2, read:"Wire to wire, five jobs, no gaps. The call you make when you are level.",
          vs:{Snake:3, Balanced:3, Dorito:3}},
  snake: {aggr:3, read:"Overload the bottom. Runner goes on the buzzer, support fills behind.",
          vs:{Snake:-2, Balanced:5, Dorito:6}},
  flood: {aggr:4, read:"Weight the D-wire and take the corner before they set.",
          vs:{Snake:6, Balanced:2, Dorito:-2}},
  blitz: {aggr:5, read:"Both wires at once. You are down and the point has to end early.",
          vs:{Snake:1, Balanced:4, Dorito:1}},
  conserve: {aggr:1, read:"Nobody past the quarter. Trade from your own end and make them come to you.",
          vs:{Snake:3, Balanced:0, Dorito:3}},
  lock:  {aggr:1, read:"Five on lanes and nobody runs. Every yard they take costs them a body.",
          vs:{Snake:5, Balanced:0, Dorito:5}},
  trade: {aggr:2, read:"Everyone to a bunker he can shoot from. No runners — win the exchange.",
          vs:{Snake:2, Balanced:4, Dorito:2}},
  tower: {aggr:2, read:"Own the middle. From there you see both wires and they cannot cross.",
          vs:{Snake:5, Balanced:2, Dorito:5}},
  contain: {aggr:2, read:"A man up each wire to deny the corner, three back holding the middle.",
          vs:{Snake:4, Balanced:1, Dorito:4}},
  split: {aggr:3, read:"Two on each wire, nothing in the middle. Win an end before they rotate.",
          vs:{Snake:1, Balanced:4, Dorito:1}},
  counter: {aggr:3, read:"Take the middle first, then answer whichever wire they committed to.",
          vs:{Snake:4, Balanced:2, Dorito:4}}
};
function breakMeta(k){ return BREAK_META[k] || BREAK_META.base; }

// A break on a digitized layout is written as the bunker each player plants
// on, never as a typed coordinate — the position comes from the layout, so
// the call stays true to the field even if the map is re-digitized.
// The snake is one continuous beam a player crawls down, not nine bunkers to
// share out — the official 3D makes that plain. So exactly one player takes it
// on any break; the rest support off it.
const BREAK_PLANTS = {
  lso: {
    hold:     ["SB#9","MT#3","C#2","T#1","MT#1"],
    base:     ["SB#12","MT#3","GW#2","Br#2","SD#1"],
    snake:    ["SB#11","MW#4","Tr#3","GB#2","Br#2"],
    flood:    ["MD#2","MD#1","SD#1","Br#2","C#2"],
    blitz:    ["SB#11","Tr#3","Tr#2","Br#2","MD#2"],
    conserve: ["MW#1","T#4","C#2","T#1","MT#1"],
    counter:  ["Tr#2","SB#12","SD#1","MT#3","T#1"],
    split:    ["MW#4","MT#3","MD#1","Br#2","C#4"],
    tower:    ["Tr#2","GW#2","MT#3","Br#2","MW#1"],
    trade:    ["MW#4","MT#3","GW#2","Br#2","MD#1"],
    contain:  ["SB#11","MD#2","C#2","T#4","T#1"],
    lock:     ["MW#1","MT#3","C#2","T#1","MT#1"]
  },
  tby: {
    hold:     ["Ck#1","C#1","GW#1","MD#6","SD#1"],
    base:     ["SB#12","C#1","GW#1","MT#1","MD#1"],
    snake:    ["SB#13","Wg#1","C#3","GB#1","MT#1"],
    flood:    ["MD#2","MD#1","SD#1","MT#1","GW#1"],
    blitz:    ["SB#13","C#3","Tr#3","Tr#1","MD#2"],
    conserve: ["SB#10","T#3","T#1","MD#6","SD#1"],
    counter:  ["SB#3","Br#5","MD#1","C#1","MW#1"],
    split:    ["SB#12","C#1","MD#2","MT#1","T#1"],
    tower:    ["Tr#3","GW#1","C#1","MW#1","SB#10"],
    trade:    ["Br#5","GB#1","GW#1","MT#1","MD#1"],
    contain:  ["SB#13","MD#2","T#1","T#3","MW#1"],
    lock:     ["SB#10","C#1","T#1","MW#1","SD#1"]
  },
  mwo: {
    hold:     ["Br#5","Ck#1","T#3","C#2","MD#5"],
    base:     ["Wg#2","Ck#1","GW#1","C#4","MD#1"],
    snake:    ["GP#1","Wg#2","SB#6","GW#2","C#4"],
    flood:    ["SB#1","MD#1","MD#5","C#4","T#3"],
    blitz:    ["GP#1","SB#6","GW#1","Tr#1","MD#2"],
    conserve: ["SD#1","SB#3","T#3","Br#2","T#1"],
    counter:  ["GW#1","Wg#2","MD#1","SB#3","Br#2"],
    split:    ["Wg#2","SB#4","MD#2","C#4","T#3"],
    tower:    ["GW#1","T#3","Ck#1","C#4","Br#5"],
    trade:    ["Wg#2","MW#3","T#3","C#4","MD#1"],
    contain:  ["GP#1","MD#2","T#3","SB#3","Br#2"],
    lock:     ["Br#5","SB#3","T#3","Br#2","T#1"]
  }
};

/* The bunker key, exactly as the NXL prints it in the corner of every one of
 * these maps — same fifteen entries on Lone Star, Tampa Bay and the Midwest
 * Open, in this order. Nothing here is a guess: it is read off the legend.
 *
 * TCK is in the key and on none of the three fields. That is the key doing its
 * job — it lists the pack, not the layout — and the app says so rather than
 * quietly leaving a code out. */
const BUNKER_CODE = [
  ["GP", "Giant Plus"],   ["MT", "Maya Temple"], ["C",  "Cylinder"],
  ["Tr", "Tree"],         ["GB", "Giant Brick"], ["GW", "Giant Wing"],
  ["MD", "Medium Dorito"],["Ck", "Cake"],        ["SB", "Snake Beam"],
  ["Br", "Brick"],        ["Wg", "Wing"],        ["TCK","Tall Cake"],
  ["SD", "Small Dorito"], ["T",  "Temple"],      ["MW", "Mini W"],
];
function codeCount(code){ return curLayout().bunkers.filter(b => b.n === code).length; }

// Which wire a bunker sits on, for the job label a coach reads off.
function wireOf(y){
  return y > 88 ? "snake wire" : y > 66 ? "snake side"
       : y > 44 ? "centre"     : y > 24 ? "dorito side" : "dorito wire";
}

// Nobody runs through a bunker, and nobody runs through the snake.
//
// The snake is one continuous structure printed as nine sections, so for
// routing they are merged back into a single obstacle — otherwise stepping
// around one section just lands you in the next. Any bunkers of the same code
// whose footprints touch are merged the same way.
function routeObstacles(list, pad){
  pad = pad === undefined ? 0.9 : pad;   // players run within a foot of a bunker
  let boxes = list.flatMap(b => bunkerBoxes(b).map(k => ({ids:[b.id], n:b.n,
    x0:k.x-k.w/2-pad, x1:k.x+k.w/2+pad,
    y0:k.y-k.h/2-pad, y1:k.y+k.h/2+pad})));
  for(let pass = 0; pass < 6; pass++){
    let merged = false;
    outer:
    for(let i = 0; i < boxes.length; i++){
      for(let j = i + 1; j < boxes.length; j++){
        const a = boxes[i], b = boxes[j];
        if(a.n !== b.n) continue;
        if(a.x0 > b.x1 + 1.5 || b.x0 > a.x1 + 1.5) continue;
        if(a.y0 > b.y1 + 1.5 || b.y0 > a.y1 + 1.5) continue;
        boxes[i] = {ids:a.ids.concat(b.ids), n:a.n,
          x0:Math.min(a.x0,b.x0), x1:Math.max(a.x1,b.x1),
          y0:Math.min(a.y0,b.y0), y1:Math.max(a.y1,b.y1)};
        boxes.splice(j, 1);
        merged = true;
        break outer;
      }
    }
    if(!merged) break;
  }
  return boxes.map(o => ({ids:new Set(o.ids), n:o.n,
    x:(o.x0+o.x1)/2, y:(o.y0+o.y1)/2, hw:(o.x1-o.x0)/2, hh:(o.y1-o.y0)/2}));
}

// Route around whatever is in the way, the way a player does: run to a corner,
// then on. A player never trades a clear lane for a shorter one they cannot
// take, so this picks the shortest route that is actually clear rather than
// nudging at the blockage until it gives up.
//
// Every corner of every obstacle is a place you can plant a foot. Join the
// start, the target and all those corners wherever the leg between them is
// clear, and take the shortest chain. If no chain exists the player is walled
// in and the straight line stands.
function routeClear(from, to, targetId, obstacles){
  // You cannot collide with the bunker you are standing behind: the five start
  // with a hand on the back-centre bunker, so whatever contains the start is
  // not an obstacle for that player. Nor is the bunker they are running to.
  const holds = o => Math.abs(from[0]-o.x) <= o.hw && Math.abs(from[1]-o.y) <= o.hh;
  const live = obstacles.filter(o => !o.ids.has(targetId) && !holds(o));
  const clear = (a, b) => !live.some(o => segHitsBox(a[0],a[1],b[0],b[1],o.x,o.y,o.hw,o.hh));
  const inField = c => c[0] > 1 && c[0] < 149 && c[1] > 1 && c[1] < 119;

  if(clear(from, to)) return [];

  const m = 1.4;                       // a shoulder's clearance off the corner
  const nodes = [from, to];
  live.forEach(o => {
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy]) => {
      const c = [o.x + sx*(o.hw+m), o.y + sy*(o.hh+m)];
      if(inField(c) && !live.some(k => Math.abs(c[0]-k.x) < k.hw && Math.abs(c[1]-k.y) < k.hh)) nodes.push(c);
    });
  });

  const N = nodes.length;
  const dist = nodes.map(() => Infinity), prev = nodes.map(() => -1), done = nodes.map(() => false);
  dist[0] = 0;
  for(;;){
    let u = -1;
    for(let i = 0; i < N; i++) if(!done[i] && dist[i] < (u < 0 ? Infinity : dist[u])) u = i;
    if(u < 0 || u === 1) break;
    done[u] = true;
    for(let v = 0; v < N; v++){
      if(done[v] || v === u) continue;
      const d = dist[u] + Math.hypot(nodes[v][0]-nodes[u][0], nodes[v][1]-nodes[u][1]);
      if(d >= dist[v] || !clear(nodes[u], nodes[v])) continue;
      dist[v] = d; prev[v] = u;
    }
  }
  if(prev[1] < 0) return [];           // walled in — draw it straight and honest

  const via = [];
  for(let k = prev[1]; k > 1; k = prev[k]) via.unshift(nodes[k]);
  return via;
}

function breakPaths(layoutKey, scriptKey){
  // Only a layout with no plants ever sees this. The five that were written
  // before plants existed carry their own shape; the rest borrow the balanced
  // one rather than have five more sets of coordinates typed by hand.
  const fallback = (BREAKS[scriptKey] || {}).paths || BREAKS.base.paths;
  const plants = (BREAK_PLANTS[layoutKey] || {})[scriptKey];
  const layout = LAYOUTS[layoutKey];
  if(!plants || !layout) return fallback;
  const targets = plants.map(id => layout.bunkers.find(b => b.id === id));
  if(targets.some(t => !t)) return fallback;   // layout changed under us

  // All five break from the station at the centre of their own back line —
  // that is where an Xball point starts, not spread across the whole width.
  // The home back-centre bunker anchors it.
  const back = layout.bunkers
    .filter(b => b.x < 20)
    .sort((a, b) => Math.abs(a.y - 60) - Math.abs(b.y - 60))[0];
  const cy = back ? back.y : 60;
  const obstacles = routeObstacles(layout.bunkers);
  const order = targets.map((_, i) => i).sort((p, q) => targets[p].y - targets[q].y);
  const slot = {};
  order.forEach((idx, k) => { slot[idx] = cy - 8 + k * 4; });   // a 16 ft station

  const runs = targets.map((b, i) => {
    const from = [3, slot[i]];
    const to = [b.x, b.y];
    const via = routeClear(from, to, b.id, obstacles);
    const pts = [from, ...via, to];
    let len = 0;
    for(let k = 0; k < pts.length - 1; k++)
      len += Math.hypot(pts[k+1][0] - pts[k][0], pts[k+1][1] - pts[k][1]);
    return {id: i + 1, from, to, via, len,
            label: `${b.n} · ${wireOf(b.y)}`, bunker: b.id};
  });
  // The longest run leaves on the buzzer and waits for nobody. Everyone else
  // holds in proportion to how much less ground he has to cover, so the five
  // arrive closer together than they would if they all went at once — but only
  // about half of that difference, because a man stood still while the point is
  // on reads as a mistake rather than a plan. Nobody holds past a quarter.
  const far = Math.max(...runs.map(r => r.len));
  runs.forEach(r => {
    r.lag = Number(Math.min(0.28, 0.55 * (1 - r.len / far)).toFixed(3));
  });
  return runs;
}
// A coach who disagrees with the route drags it. Edits are stored per layout
// per break per player, over the top of the computed route, and any leg without
// one keeps the route the router worked out.
function pathKey(id){ return `${S.layoutKey}|${S.script}|${id}`; }
function pathEdit(id){ return (S.pathEdits || {})[pathKey(id)] || null; }

// Routing is expensive and the drawn curve is expensive; neither changes while
// a break plays. Only the marker moves. So both are cached against the field,
// the call and a counter bumped by any edit, and the animation loop does no
// geometry at all — it just reads a string and moves a dot.
let _routeCache = {}, _drawCache = {}, _pathVersion = 0;
function dropPathCache(){ _routeCache = {}; _drawCache = {}; _pathVersion++; }
function pathsChanged(){ _drawCache = {}; _pathVersion++; }
// Keyed on the edits themselves, not on everyone remembering to invalidate.
// It is at most five short arrays, read once per paint.
function editFingerprint(){
  const pre = `${S.layoutKey}|${S.script}|`;
  const all = S.pathEdits || {};
  let out = "";
  for(const k in all) if(k.startsWith(pre)) out += k + JSON.stringify(all[k]);
  return out;
}
function currentPaths(){
  const k = `${S.layoutKey}|${S.script}|${_pathVersion}|${editFingerprint()}`;
  const hit = _drawCache[k];
  if(hit) return hit;
  const rk = S.layoutKey + "|" + S.script;
  const routed = _routeCache[rk] || (_routeCache[rk] = breakPaths(S.layoutKey, S.script));
  return (_drawCache[k] = routed.map(p => {
    const e = pathEdit(p.id);
    return e ? {...p, via:e, edited:true} : p;
  }));
}

// A path is a run, not a set of corners: round every turn so it reads like a
// player moving. The radius is capped at a third of the shorter leg, which
// keeps the curve inside the corridor the router already proved clear —
// test/functions.js samples the drawn curve and checks it against every bunker.
// The same five curves are rebuilt sixty times a second otherwise.
const _runCache = {};
function drawnRun(p, legs, sx, sy){
  const sm = S.smoothOn === false ? 0 : 1;
  const k = `${S.layoutKey}|${S.script}|${_pathVersion}|${p.id}|${sx}|${sm}|${JSON.stringify(p.via||[])}`;
  return _runCache[k] || (_runCache[k] = smoothD(legs, sx, sy));
}
/* Rounded corners, or the line as it is routed.
 *
 * Smoothing is on because a man does not turn on a dime and a mitre reads as an
 * instruction to stop and pivot. But a corner you dragged to a foot off a
 * bunker is not where the rounded line goes, and a coach setting a path that
 * tight wants to see the thing he actually set. So it comes off, and the legs
 * are drawn as routed. Nothing else changes: the plants, the timing and where
 * each man ends up are the same either way — this is the drawing, not the run.
 */
function smoothD(pts, sx, sy){
  const P = pts.map(q => [q[0] * sx, q[1] * sy]);
  const straight = `M${P.map(q => q[0].toFixed(1) + " " + q[1].toFixed(1)).join("L")}`;
  if(P.length < 3 || S.smoothOn === false) return straight;
  const R = 9;
  let d = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
  for(let i = 1; i < P.length - 1; i++){
    const a = P[i - 1], b = P[i], c = P[i + 1];
    const la = Math.hypot(b[0]-a[0], b[1]-a[1]), lc = Math.hypot(c[0]-b[0], c[1]-b[1]);
    const r = Math.min(R, la / 3, lc / 3);
    const p1 = [b[0] + (a[0]-b[0]) * r / la, b[1] + (a[1]-b[1]) * r / la];
    const p2 = [b[0] + (c[0]-b[0]) * r / lc, b[1] + (c[1]-b[1]) * r / lc];
    d += `L${p1[0].toFixed(1)} ${p1[1].toFixed(1)}Q${b[0].toFixed(1)} ${b[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  const e = P[P.length - 1];
  return d + `L${e[0].toFixed(1)} ${e[1].toFixed(1)}`;
}

// Heuristic rank, not a prediction. Two inputs a coach actually has: what the
// other pit reads as, and whether you can afford to be patient. Safer calls
// rise when you are ahead; aggressive ones rise when you have to score.
const STATE_BIAS = {Ahead:-1, Even:0, "Must-score":1};
function counterRank(theirTendency, matchState){
  const bias = STATE_BIAS[matchState] || 0;
  return Object.entries(BREAKS).map(([k,v])=>{
    const m = breakMeta(k);
    const fit = (m.vs && m.vs[theirTendency]) || 0;
    return {key:k, name:v.name, aggr:m.aggr, pct:Math.round(45 + fit + bias*(m.aggr-3)*2.5)};
  }).sort((a,b)=>b.pct-a.pct || a.aggr-b.aggr);
}

/* Where a season actually lives.
 *
 * localStorage inside a WKWebView is not a safe place to keep a coach's year.
 * iOS may clear web-view storage when the device is short of space, and it is
 * not in the device backup the way app storage is — so a phone that ran low, or
 * a phone restored from a backup, comes back with an empty app and no warning.
 * A full season measures about 400 KB, which fits in app storage with room to
 * spare, and `@capacitor/preferences` has been a dependency the whole time
 * without anything calling it.
 *
 * It is a mirror, not a move. localStorage stays the working store because
 * `save()` is synchronous and called from every handler in the app, and the
 * plugin is async; making the whole app await a write to change a toggle would
 * be a rewrite with a lot of new ways to go wrong. So every save also writes a
 * durable copy, and on a launch where localStorage has nothing, the durable
 * copy is read back.
 *
 * Restoring is deliberately timid: it only happens when there is no usable
 * local state at all, which is exactly the eviction and restored-from-backup
 * case. If localStorage has something, it is the truth and nothing overwrites
 * it. `web/native.js` owns the plugin end and no-ops in a browser.
 */
let _hadLocal = false;      // was there a real save to come back to?
let _storeFail = "";        // ...and can we still write one?
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    _hadLocal = true;
    return Object.assign(defaultState(), parsed);
  }catch(e){return defaultState()}   // unreadable counts as nothing to come back to
}
function save(s){
  s.savedAt = Date.now();
  const text = JSON.stringify(s);
  // A throw here used to escape through set() before render() ever ran, so the
  // screen froze mid-tap with nothing said. Storage being full or switched off
  // is a thing the coach has to be told, not a thing the app dies of.
  try{ localStorage.setItem(STORE_KEY, text); _storeFail = ""; }
  catch(e){ _storeFail = (e && e.name === "QuotaExceededError")
    ? "This phone's storage for the app is full."
    : "This phone is not letting the app save."; }
  if(window.gridlockKeep) try{ window.gridlockKeep(text); }catch(e){}
}
/* Handed the durable copy by native.js once the plugin has answered. Takes it
 * only when this launch found nothing locally — see above. */
window.gridlockRestore = text => {
  if(_hadLocal || !text) return false;
  let d = null;
  try{ d = JSON.parse(text); }catch(e){ return false; }
  if(!d || typeof d !== "object" || !d.savedAt) return false;
  const held = {tab:S.tab, more:S.more, scoutTab:S.scoutTab};
  Object.keys(d).forEach(k => { S[k] = d[k]; });
  Object.assign(S, held);
  if(!LAYOUTS[S.layoutKey]) S.layoutKey = "lso";
  _hadLocal = true;
  S.restored = new Date(d.savedAt).toLocaleString([], {month:"short", day:"numeric",
                                                      hour:"numeric", minute:"2-digit"});
  dropPathCache();
  save(S); render();
  return true;
};
// Said once, at the top of the screen, because both of these mean the coach
// cannot trust what he is looking at to still be there later.
function storeWarning(){
  if(_storeFail) return `<div class="tip" style="border-color:var(--red);background:rgba(229,37,42,.14)">
    <span><b>${esc(_storeFail)}</b> Nothing you tap is being saved. Free some space, then use
    Nexus &rsaquo; Save a copy before you close the app.</span></div>`;
  if(S.restored) return `<div class="tip">
    <span>This phone had lost its saved season, so it was put back from the copy the app keeps —
    everything up to <b>${esc(S.restored)}</b>.</span>
    <button onclick="set({restored:null})">OK</button></div>`;
  return "";
}

/* A match, so a point number means something.
 *
 * Everything logged on a sideline — an out, a lineup, a rotation, a grade, the
 * call you made — was stamped with a bare point number, and the point number
 * only ever counted up. Two consequences, both bad: a mis-tap on Next point was
 * permanent, and your second tournament opened on point 63 with the sheet
 * showing outs from a game in March.
 *
 * So every one of those rows now carries the match it belongs to, and the point
 * number counts from one inside it. There is always exactly one match in play —
 * the app makes one if it has to — so nothing downstream has to handle "no
 * match", and New match is the only boundary a coach has to think about.
 */
const newMatchId = () => "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function curMatch(){ return (S.matches || []).find(m => m.id === S.matchId) || null; }
function matchLabel(m){
  if(!m) return "";
  const d = new Date(m.at);

  return m.vs ? `vs ${m.vs} · ${day}` : `No opponent yet · ${day}`;

// How much is actually recorded against a match, so New match can warn before
// it walks away from a sheet and Matches can say what is in each one.
function matchSize(id){
  const n = a => (a || []).filter(x => x && typeof x === "object" && x.m === id).length;
  return n(S.tally) + n(S.moves) + n(S.assessments) + n(S.calls)
       + Object.keys(S.lineups || {}).filter(k => k.startsWith(id + "|")).length;
}
/* Who the match is against.
 *

 * pit follows him there. What gets stamped on an out has to be who was actually
 * across the tape when it happened, which is the match's own opponent.
 */
function matchVs(){ const m = curMatch(); return (m && m.vs) || ""; }

// while nothing has been logged names it, rather than leaving a coach to work
// out that he had to start a match before the tally would say who he played.
function adoptPitAsOpponent(){
  const m = curMatch();
  if(!m || m.vs || !pitNamed("right") || matchSize(m.id)) return;
  S.matches = S.matches.map(x => x.id === m.id ? {...x, vs: S.right.name} : x);
}
// This match's rows, out of a season of them.
const rowsHere = list => (list || []).filter(o => o && typeof o === "object" && o.m === S.matchId);

// different fives, and the old bare-number key could not say so.
const lineKey = (pt, mid) => `${mid || S.matchId}|${pt}`;

// It is one long game as far as the data knows, so it becomes one match, dated
// from the oldest thing in it and named for whoever was in the right pit. That
// keeps every point sheet, rotation and grade readable instead of orphaning it.
(function adoptLooseRows(){
  const lists = ["tally", "moves", "assessments", "calls"];
  const loose = lists.some(k => (S[k] || []).some(x => x && typeof x === "object" && !x.m));
  const looseLines = Object.keys(S.lineups || {}).some(k => !k.includes("|"));
  if(!loose && !looseLines) return;

  const id = newMatchId();
  // Only a row that is an object has a timestamp. `x && x.at` on the bare
  // string an old build wrote hands back String.prototype.at — a function,
  // which is truthy, survives the filter and turns Math.min into NaN. The
  // match then carries a date of NaN and sorts nowhere.

    .map(x => (x && typeof x === "object") ? x.at : null))
    .filter(t => typeof t === "number" && isFinite(t));

                note: "Everything logged before matches existed"},
               ...(S.matches || [])];
  lists.forEach(k => {
    S[k] = (S[k] || []).map(x => {
      // A very old build wrote a bare string for an out. Wrap it rather than
      // let a match-scoped sheet quietly stop showing it. Nothing is invented:
      // it keeps its text and gets no side and no point, so it counts toward
      // nobody and never claims to belong to a point it cannot name.
      if(typeof x === "string") return {name: x, m: id, at: oldest, legacy: true};
      return (x && typeof x === "object" && !x.m) ? {...x, m: id} : x;
    });
  });
  const lines = {};
  Object.entries(S.lineups || {}).forEach(([k, v]) => {
    lines[k.includes("|") ? k : `${id}|${k}`] = v;
  });
  S.lineups = lines;
  S.matchId = id;            // carry on in it — the point number is still theirs
})();

// There is always a match in play. A fresh install gets one rather than a null
// every writer would have to check.
if(!curMatch()){
  const id = newMatchId();
  S.matches = [{id, at: Date.now(), vs: (S.right || {}).name || "", layout: S.layoutKey},
               ...(S.matches || [])];
  S.matchId = id;
  if(!S.point) S.point = 1;
}

// Everything that needs the current field goes through here. Half the call
// sites used to fall back and half read straight through, so an unknown key —
// a layout that stopped shipping, a corrupted save — took the whole screen
// down instead of showing the field it does have.
function curLayout(){ return LAYOUTS[S.layoutKey] || LAYOUTS.lso; }
window.S = S;   // the bridge in native.js reads this; set() mutates in place
const params = new URLSearchParams(location.search);
if(params.get("c")){ S.joinCode = params.get("c"); S.entered = true; S.tab = "more"; S.more = "classes"; }

function set(patch){
  // The drill puts a call on the field that the coach did not make, and only
  // Stop put his own call back. Walking away from Playbook mid-drill left him
  // on a random one — one tap from playing it, or logging it as the call he
  // made. Leaving ends the drill, the same as stopping it.
  if(repState().running &&
     (("tab" in patch && patch.tab !== "playbook") ||
      ("pbView" in patch && patch.pbView !== "rep"))) endRep();
  Object.assign(S, patch); save(S); render();
}
// Put back what he was on, without a redraw — the caller is about to do one.
function endRep(){
  const r = repState();
  if(r.was){ S.script = r.was; S.t = r.wasT == null ? 1 : r.wasT; }
  S.rep = {...r, running:false, ask:null};
  S.pbView = null;
  dropPathCache();
}

function ease(t){return 1-Math.pow(1-t,3)}
function lerp(a,b,t){return a+(b-a)*t}
// Off the buzzer the five do not leave together: the man with the furthest to
// run goes first and the short runs leave later, so they arrive together rather
// than the snake runner still crossing while everyone else is set. `lag` is how
// long he waits, as a share of the break; it is worked out in breakPaths from
// how far he has to go, and it is zero for the longest run.
function posAt(path, t){
  const pts = [path.from, ...(path.via||[]), path.to];
  if(pts.length===1) return pts[0];
  const lag = path.lag || 0;
  const u = ease(Math.max(0,Math.min(1,(t - lag) / (1 - lag))));
  const seg = (pts.length-1)*u;
  const i = Math.min(pts.length-2, Math.floor(seg));
  const f = seg-i;
  return [lerp(pts[i][0],pts[i+1][0],f), lerp(pts[i][1],pts[i+1][1],f)];
}

// Bunker footprints, in SVG units, as half-extents. Sized against the real
// spacing of the layout: the tightest pair on the field sits 12 units apart, so the
// widest piece stays under 6 either side and nothing merges into a blob.
const BUNKER = {
  dorito:  {h:5.2, v:4.6},
  temple:  {h:4.6, v:4.2},
  tower:   {h:2.6, v:5.8},
  towerbig:{h:3.6, v:8.2},
  beam:    {h:15,  v:2.6},
  plus:    {h:5.6, v:5.6},
  wing:    {h:6.6, v:4.2},
  mw:      {h:4.6, v:3.2},
  cake:    {h:4.6, v:4.6},
  can:     {h:3.6, v:4.6},
  ball:    {h:3.6, v:3.6},
  bar:     {h:3.6, v:4.6},
  gwing:   {h:5.4, v:5.0},
  gbrick:  {h:4.6, v:9.8}

// A digitized layout carries its own measured footprint in feet (w, h), so the
// renderer draws the real thing rather than a per-type guess. sx/sy convert
// field feet to SVG units.
// A team can rename any bunker for the event. The call overlays the official
// code on the field, per the spec, and falls back to the printed code.
function bunkerCalls(){ return (S.bunkerCalls || {})[S.layoutKey] || {}; }
function playerCalls(who){ return (((S.playerCalls || {})[S.layoutKey] || {})[who] || {}); }
/* What to call a bunker, and to whom.
 *
 * The team's call is the team's language and overlays the official code
 * everywhere. But a coach shouting at one man uses that man's word for it, so a
 * player may have his own name for a bunker he lives behind. His word is only
 * ever used when the app is speaking to him — his card — and never on the
 * field, where five people are reading the same picture. */
function callOf(b, who){
  return (who && playerCalls(who)[b.id]) || bunkerCalls()[b.id] || b.n;
}
// The roster is the spine: Playbook names the five off it, Tally logs outs
// against it, Movement and Assess pick players from it. It shipped read-only,
// with two placeholders called "Snake" and "Center" and no way to change them.
const rosterVal = id => (document.getElementById(id) || {}).value || "";
window.addPlayer = () => {
  const name = clean(rosterVal("rName").trim());
  if(!name) return;                       // a player with no name is not a player
  const num = parseInt(rosterVal("rNum"), 10);
  S.roster = [...(S.roster || []), {
    name, num: isFinite(num) ? num : (S.roster || []).length + 1,

// Edits save without re-rendering. onchange fires on blur, and blur happens as
// you tap the next thing — so redrawing here would destroy the control under
// the coach's thumb before the tap landed. The field already shows what was
// typed; nothing else on this screen depends on it.
window.editPlayer = (i, field, value) => {
  const list = S.roster || [];
  if(!list[i]) return;
  if(field === "num"){
    const n = parseInt(value, 10);
    if(isFinite(n)) list[i].num = n;
  } else {
    const v = clean(String(value).trim());
    if(field === "name" && !v) return;     // never let a name be emptied by accident
    list[i][field] = v;

};
window.delPlayer = i => {
  const list = [...(S.roster || [])];
  const gone = (list[i] || {}).name;
  list.splice(i, 1);
  S.roster = list;

  // four names and a hole with nothing saying why. What he already did stays:
  // outs, grades and rotations are history and keep his name.
  if(gone){

    Object.entries(S.lineups || {}).forEach(([k, v]) => {
      lines[k] = v.map(n => n === gone ? "" : n);

/* QR, byte mode, error correction level M, versions 1 to 3.
 *
 * The app ships as one file with no network, so a join code cannot be handed to
 * a library. Three versions is not a limitation in practice: version 3 holds 42
 * bytes and the thing being encoded is gridlock://class/GL-7K2M, which is 24.
 * Anything longer is refused rather than silently mangled.
 *
 * Versions 1 to 3 at level M are single block, so there is no interleaving. */
const QR_CAP  = {1:16, 2:28, 3:44};      // data codewords at level M
const QR_EC   = {1:10, 2:16, 3:26};      // error-correction codewords at level M
const QR_ALIGN= {1:null, 2:18, 3:22};    // centre of the one alignment pattern

// GF(256), the field QR error correction is computed in. 0x11d is its polynomial.
const GF_EXP = new Uint8Array(512), GF_LOG = new Uint8Array(256);
(() => {
  let x = 1;
  for(let i = 0; i < 255; i++){
    GF_EXP[i] = x; GF_LOG[x] = i;
    x <<= 1; if(x & 0x100) x ^= 0x11d;
  }
  for(let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
})();
const gfMul = (a, b) => (a && b) ? GF_EXP[GF_LOG[a] + GF_LOG[b]] : 0;

function rsGenerator(n){
  let g = [1];
  for(let i = 0; i < n; i++){
    const next = new Array(g.length + 1).fill(0);
    for(let j = 0; j < g.length; j++){
      next[j] ^= g[j];
      next[j + 1] ^= gfMul(g[j], GF_EXP[i]);
    }
    g = next;
  }
  return g;
}
function rsRemainder(data, n){
  const gen = rsGenerator(n), rem = new Array(n).fill(0);
  for(const d of data){
    const factor = d ^ rem[0];
    rem.shift(); rem.push(0);
    for(let i = 0; i < n; i++) rem[i] ^= gfMul(gen[i + 1], factor);
  }
  return rem;
}

function qrCodewords(text, version){
  const bytes = [];
  for(const ch of unescape(encodeURIComponent(text))) bytes.push(ch.charCodeAt(0));
  const cap = QR_CAP[version];
  if(bytes.length + 2 > cap) return null;              // mode + length + payload

  const bits = [];
  const push = (v, n) => { for(let i = n - 1; i >= 0; i--) bits.push((v >> i) & 1); };
  push(0b0100, 4);                                      // byte mode
  push(bytes.length, 8);                                // length, 8 bits for v1-9
  bytes.forEach(b => push(b, 8));
  push(0, Math.min(4, cap * 8 - bits.length));          // terminator
  while(bits.length % 8) bits.push(0);

  const data = [];
  for(let i = 0; i < bits.length; i += 8)
    data.push(bits.slice(i, i + 8).reduce((v, b) => (v << 1) | b, 0));
  for(let i = 0; data.length < cap; i++) data.push(i % 2 ? 0x11 : 0xec);   // pad bytes

  return data.concat(rsRemainder(data, QR_EC[version]));
}

// ---- the matrix -----------------------------------------------------------
function qrMatrix(text){
  let version = null, code = null;
  for(const v of [1, 2, 3]){ code = qrCodewords(text, v); if(code){ version = v; break; } }
  if(!code) return null;

  const n = version * 4 + 17;
  const m = Array.from({length:n}, () => new Array(n).fill(null));   // null = free
  const put = (r, c, v) => { if(r >= 0 && r < n && c >= 0 && c < n) m[r][c] = v; };

  const finder = (r0, c0) => {
    for(let r = -1; r <= 7; r++) for(let c = -1; c <= 7; c++){
      const inRing = (r >= 0 && r <= 6 && (c === 0 || c === 6)) || (c >= 0 && c <= 6 && (r === 0 || r === 6));
      const inCore = r >= 2 && r <= 4 && c >= 2 && c <= 4;
      put(r0 + r, c0 + c, inRing || inCore ? 1 : 0);
    }
  };
  finder(0, 0); finder(0, n - 7); finder(n - 7, 0);

  for(let i = 8; i < n - 8; i++){                       // timing
    m[6][i] = i % 2 ? 0 : 1;
    m[i][6] = i % 2 ? 0 : 1;
  }
  const a = QR_ALIGN[version];
  if(a != null) for(let r = -2; r <= 2; r++) for(let c = -2; c <= 2; c++)
    m[a + r][a + c] = (Math.abs(r) === 2 || Math.abs(c) === 2 || (r === 0 && c === 0)) ? 1 : 0;

  // The thirty format-information modules, in exactly the places the standard
  // puts them: a copy around the top-left finder and a copy split between the
  // bottom-left and top-right. Getting this set wrong shifts every data module.
  const fmtCells = [];
  for(let i = 0; i <= 5; i++) fmtCells.push([i, 8], [8, i]);
  fmtCells.push([7, 8], [8, 8], [8, 7]);
  for(let i = 0; i <= 6; i++) fmtCells.push([n - 1 - i, 8]);   // seven up the bottom-left
  for(let i = 7; i <= 14; i++) fmtCells.push([8, n - 15 + i]);  // eight along the top-right
  fmtCells.push([n - 8, 8]);                                    // and the dark module, its own
  fmtCells.forEach(([r, c]) => { m[r][c] = 0; });
  m[n - 8][8] = 1;
  const reserved = m.map(row => row.map(v => v !== null));

  // data, zigzag up-down in two-column strips, skipping the timing column
  let bit = 0;
  const bitAt = i => (code[i >> 3] >> (7 - (i & 7))) & 1;
  const total = code.length * 8;
  for(let col = n - 1; col > 0; col -= 2){
    if(col === 6) col--;
    for(let step = 0; step < n; step++){
      const up = ((n - 1 - col) >> 1) % 2 === 0;
      const row = up ? n - 1 - step : step;
      for(const c of [col, col - 1])
        if(!reserved[row][c]) m[row][c] = bit < total ? bitAt(bit++) : 0;
    }
  }

  const MASK = [
    (r, c) => (r + c) % 2 === 0,
    (r) => r % 2 === 0,
    (r, c) => c % 3 === 0,
    (r, c) => (r + c) % 3 === 0,
    (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
    (r, c) => (r * c) % 2 + (r * c) % 3 === 0,
    (r, c) => ((r * c) % 2 + (r * c) % 3) % 2 === 0,
    (r, c) => ((r + c) % 2 + (r * c) % 3) % 2 === 0,
  ];
  const FORMAT_M = [0b101010000010010, 0b101000100100101, 0b101111001111100, 0b101101101001011,
                    0b100010111111001, 0b100000011001110, 0b100111110010111, 0b100101010100000];

  const penalty = g => {
    let p = 0;
    const run = line => {
      let c = 1;
      for(let i = 1; i < n; i++){
        if(line[i] === line[i - 1]) c++;
        else { if(c >= 5) p += c - 2; c = 1; }
      }
      if(c >= 5) p += c - 2;
    };
    for(let r = 0; r < n; r++) run(g[r]);
    for(let c = 0; c < n; c++) run(g.map(row => row[c]));
    for(let r = 0; r < n - 1; r++) for(let c = 0; c < n - 1; c++)
      if(g[r][c] === g[r][c+1] && g[r][c] === g[r+1][c] && g[r][c] === g[r+1][c+1]) p += 3;
    const PAT = [1,0,1,1,1,0,1,0,0,0,0];
    const hasAt = (arr, i) => PAT.every((v, k) => arr[i + k] === v);
    const scan = arr => {
      for(let i = 0; i + 11 <= n; i++){
        if(hasAt(arr, i)) p += 40;
        if(PAT.every((v, k) => arr[i + 10 - k] === v)) p += 40;
      }
    };
    for(let r = 0; r < n; r++) scan(g[r]);
    for(let c = 0; c < n; c++) scan(g.map(row => row[c]));
    const dark = g.flat().filter(v => v === 1).length;
    p += Math.floor(Math.abs(dark * 100 / (n * n) - 50) / 5) * 10;
    return p;
  };

  let best = null, bestScore = Infinity;
  for(let mask = 0; mask < 8; mask++){
    const g = m.map((row, r) => row.map((v, c) => reserved[r][c] ? v : (MASK[mask](r, c) ? v ^ 1 : v)));
    const f = FORMAT_M[mask];
    const bitOf = i => (f >> i) & 1;
    // Copy one, wrapped around the top-left finder.
    for(let i = 0; i <= 5; i++) g[i][8] = bitOf(i);
    g[7][8] = bitOf(6); g[8][8] = bitOf(7); g[8][7] = bitOf(8);
    for(let i = 9; i <= 14; i++) g[8][14 - i] = bitOf(i);
    // Copy two runs the other way round: the high bits go up the bottom-left,
    // the low bits along the top-right.
    for(let i = 0; i <= 6; i++) g[n - 1 - i][8] = bitOf(14 - i);
    for(let j = 0; j <= 7; j++) g[8][n - 8 + j] = bitOf(7 - j);
    g[n - 8][8] = 1;                                    // dark module wins
    const sc = penalty(g);
    if(sc < bestScore){ bestScore = sc; best = g; }
  }
  return best;
}

// Draw it. A QR is only useful if a phone camera can read it off a screen held
// up on a sideline, so it goes out as crisp SVG rects with the quiet zone the
// standard asks for — four modules, or scanners fail on a busy background.
function qrSVG(text, px){
  const m = qrMatrix(text);
  if(!m) return "";
  const n = m.length, q = 4, side = n + q * 2;
  let d = "";
  for(let r = 0; r < n; r++){
    let c = 0;
    while(c < n){
      if(!m[r][c]){ c++; continue; }
      let w = 1;
      while(c + w < n && m[r][c + w]) w++;          // run of dark modules, one rect
      d += `M${c + q} ${r + q}h${w}v1h-${w}z`;
      c += w;
    }
  }
  return `<svg class="qr" viewBox="0 0 ${side} ${side}" width="${px}" height="${px}" role="img"
    aria-label="QR code for the join link"><rect width="${side}" height="${side}" fill="#fff"/>
    <path d="${d}" fill="#0b0c0d"/></svg>`;
}
// The deep link both platforms register. Nothing draws a QR of it at the
// moment, on purpose: a scan opens the app to a session that does not exist on
// the scanner's phone, because sessions live on the device that created them.
// The encoder stays verified and ready for the day a session can be reached
// from another device — that is a backend decision, not an encoder one.
function joinLink(code){ return "gridlock://class/" + code; }

/* ============================================================
   Your data, off this phone and back onto it
   ============================================================

   There is no server, so there is no sync and no backup — a season lives on one
   device and goes with it. That is the honest cost of an app that makes no
   network requests, and it is not a reason to leave a coach with no way out.

   A copy is a plain JSON file you own: share it, mail it, drop it in a note,
   hand it to an assistant coach, keep one before a tournament. Loading one back
   either replaces what is here or merges into it. Nothing leaves the phone
   unless you tap the button. */
const COPY_FORMAT = "gridlock.coach.copy";
const COPY_VERSION = 1;

// What is worth keeping. Everything else — which tab you were on, whether a
// path is mid-animation, a half-typed join code — is this session's business.
const KEEP_ALL = ["roster","scout","left","right","tally","calls","reps","moves","assessments","walk","codes",
                  "lineups","matches","matchId","bunkerCalls","playerCalls","teamCode","direct","pathEdits","classes","responses","groups",
                  "blasts","blastTo","messages","point","layoutKey","script","matchState"];
const KEEP_SQUAD = ["roster","scout","bunkerCalls","playerCalls","teamCode","codes"];

function copyPayload(scope){
  const keys = scope === "squad" ? KEEP_SQUAD : KEEP_ALL;
  const data = {};
  keys.forEach(k => { if(S[k] !== undefined) data[k] = S[k]; });
  return JSON.stringify({format: COPY_FORMAT, v: COPY_VERSION, scope: scope || "all",
                         at: new Date().toISOString(), app: "GRIDLOCK Coach", data}, null, 1);
}
function copySummary(d){
  const n = (k, f) => { const v = d[k]; return v ? (Array.isArray(v) ? v.length : Object.keys(v).length) : 0; };
  const bits = [[n("roster"), "player"], [n("scout"), "team scouted"], [n("tally"), "out"],
                [n("classes"), "session"], [n("responses"), "sign-in"], [n("moves"), "rotation"],
                [n("assessments"), "grade"], [n("messages"), "message"]];
  return bits.filter(b => b[0])
             .map(b => `${b[0]} ${b[1]}${b[0] === 1 ? "" : b[1].endsWith("scouted") ? "s scouted" : "s"}`
                        .replace("team scouteds scouted", "teams scouted"))
             .join(" · ") || "nothing in it";
}
// Merge, not clobber: two devices that both did real work should end up with
// both lots. Lists join on what makes an entry the same entry; maps take the
// incoming side for a key that exists on both.
const SAME = {
  roster:      r => (r.name || "").toLowerCase(),
  tally:       o => [o.pt, o.side, o.name, o.at].join("|"),
  moves:       m => [m.pt, m.who, m.from, m.to, m.at].join("|"),
  assessments: a => [a.who, a.pt, a.at].join("|"),
  calls:       c => [c.at, c.script].join("|"),
  classes:     c => c.code,
  responses:   r => [r.code, (r.name || "").toLowerCase()].join("|"),
  matches:     m => m.id,
  groups:      g => g.id,
  blasts:      b => [b.at, b.body].join("|"),
  blastTo:     id => id,
  codes:       c => (c.word || "").toLowerCase(),
  messages:    m => String(m),
};
function mergeInto(cur, incoming){
  const out = {...cur};
  Object.entries(incoming).forEach(([k, v]) => {
    const mine = cur[k];
    if(Array.isArray(v) && Array.isArray(mine) && SAME[k]){
      const seen = new Set(mine.map(SAME[k]));
      out[k] = [...mine, ...v.filter(x => !seen.has(SAME[k](x)))];
    } else if(Array.isArray(v)){
      out[k] = v;
    } else if(v && typeof v === "object" && mine && typeof mine === "object"){
      out[k] = {...mine, ...v};
    } else {
      out[k] = v;
    }
  });
  return out;
}
function readCopy(text){
  let p;
  try { p = JSON.parse(String(text || "").trim()); }
  catch(e){ return {error: "That is not a GRIDLOCK copy — it is not readable as JSON."}; }
  if(!p || p.format !== COPY_FORMAT) return {error: "That file is not a GRIDLOCK copy."};
  if(!(p.v <= COPY_VERSION)) return {error: `That copy was written by a newer version of the app (v${p.v}).`};
  if(!p.data || typeof p.data !== "object") return {error: "That copy has nothing in it."};
  return {payload: p};
}

window.saveCopy = scope => {
  const text = copyPayload(scope);
  const stamp = new Date().toISOString().slice(0, 10);
  const name = `gridlock-${scope === "squad" ? "squad" : "everything"}-${stamp}.json`;
  if(window.gridlockShare) window.gridlockShare(text, name);
  // A download as well, where the browser allows one. Some sandboxes refuse it
  // outright and say nothing, so never promise the file landed — point at the
  // text box, which works everywhere.
  let saved = false;
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], {type: "application/json"}));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    saved = true;
  } catch(e){}
  S.copyStatus = `Copy made · ${copySummary(JSON.parse(text).data)}. `
    + (saved ? `Look for ${name} in your downloads or the share sheet — if neither arrived, use Show it as text.`
             : `Use Show it as text below and keep it somewhere safe.`);
  save(S);
  render();
};
window.showCopy = scope => { S.copyText = copyPayload(scope); save(S); render(); };
window.loadCopy = mode => {
  const el = document.getElementById("copyIn");
  const r = readCopy(el && el.value);
  if(r.error){ S.copyStatus = r.error; save(S); render(); return; }
  const d = r.payload.data;
  // Two squads' rosters stirred together is a mess nobody notices until the
  // five on Playbook are strangers. The code says whose copy this is; a merge
  // that mixes squads still happens, but it says so out loud.
  const clash = mode !== "replace" && d.teamCode && S.teamCode && d.teamCode !== S.teamCode
                && (S.roster || []).length && (d.roster || []).length;
  S.copyStatus = (mode === "replace" ? "Replaced with " : "Merged in ") + copySummary(d)
    + (clash ? ` — heads up, that copy is squad ${d.teamCode} and this phone is ${S.teamCode}.`
             : "");
  // Replace swaps the data, not the session: you stay signed in, on this screen,
  // looking at the message that says what just happened.
  const SESSION = ["entered","role","email","tab","more","scoutTab","tips","showTutorial","copyStatus"];
  const held = {};
  SESSION.forEach(k => { held[k] = S[k]; });
  /* A merge takes their records, never their place in the day.
   *
   * matchId, point, layoutKey and script are where *this* coach is standing:
   * the sheet in front of him, the point he is on, the field and the call. They
   * are scalars, so mergeInto took the incoming side and a coach who merged an
   * assistant's copy between points was silently moved onto the assistant's
   * sheet, at the assistant's point number. The next out he tapped landed on
   * the wrong match. Replace is different — that is asking to become the other
   * phone, and it takes the lot.
   */
  const HERE = ["teamCode", "matchId", "point", "layoutKey", "script"];
  const mine = {};
  HERE.forEach(k => { mine[k] = S[k]; });
  const next = mode === "replace" ? {...defaultState(), ...d, ...held} : mergeInto(S, d);
  if(mode !== "replace") HERE.forEach(k => { if(mine[k] !== undefined) next[k] = mine[k]; });
  Object.keys(next).forEach(k => { S[k] = next[k]; });
  if(!LAYOUTS[S.layoutKey]) S.layoutKey = "lso";
  dropPathCache();
  S.copyText = ""; save(S); render();
};
window.readCopyFile = input => {
  const f = input.files && input.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onload = () => { const el = document.getElementById("copyIn"); if(el) el.value = fr.result;
                      S.copyStatus = `Read ${f.name} — now choose Merge or Replace.`; save(S); render(); };
  fr.readAsText(f);
};

// ---- editing the break on the field ----------------------------------------
//
// Pointer events, not mouse: the same code has to work under a thumb. The SVG
// is scaled by its viewBox, so every position is converted through the screen
// matrix rather than assumed.
function fieldFeet(svg, ev){
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [Math.max(1, Math.min(149, p.x / 2)), Math.max(1, Math.min(119, p.y / 2))];
}
function setVia(id, via){
  S.pathEdits = {...(S.pathEdits || {}), [pathKey(id)]: via};
  pathsChanged(); save(S);
}
window.resetPath = id => {
  const all = {...(S.pathEdits || {})};
  delete all[pathKey(id)];
  S.pathEdits = all; pathsChanged(); save(S); render();
};
window.resetAllPaths = () => {
  const all = {...(S.pathEdits || {})};
  currentPaths().forEach(p => delete all[pathKey(p.id)]);
  S.pathEdits = all; pathsChanged(); save(S); render();
};

// Sightlines by touch. A bunker is ten pixels across on a phone, so the field
// itself takes the tap and the nearest bunker wins — a coach points at where he
// is standing, he does not aim at a shape.
(function sightPicking(){
  document.addEventListener("pointerdown", ev => {
    if(S.tab !== "sightlines") return;
    const surface = ev.target.closest("[data-pick]");
    if(!surface) return;
    const svg = surface.closest("svg.field");
    if(!svg) return;
    ev.preventDefault();
    const b = bunkerAt(fieldFeet(svg, ev));
    if(!b) return;
    // Two taps answer the question a coach actually has: where he is, then what
    // he is looking at. Setting the first advances to the second on its own, so
    // nobody has to think about a mode — and the chips above go back.
    if(S.sightPick === "to" && S.sightFrom){
      set({sightTo: (b.id === S.sightTo || b.id === S.sightFrom) ? null : b.id});
    } else {
      set({sightFrom:b.id, sightTo:null, sightPick:"to"});
    }
  });
})();

// One delegated listener on the app, so it survives every repaint.
(function pathEditing(){
  let drag = null;
  const svgOf = el => el.closest("svg.field");
  document.addEventListener("pointerdown", ev => {
    if(!S.editPath || S.tab !== "playbook") return;
    const h = ev.target.closest("[data-h],[data-aim],[data-leg]");
    if(!h) return;
    const svg = svgOf(h);
    if(!svg) return;
    ev.preventDefault();
    const at = fieldFeet(svg, ev);
    if(h.hasAttribute("data-aim")){
      drag = {kind:"aim", id:Number(h.dataset.aim), moved:false};
    } else if(h.hasAttribute("data-h")){
      drag = {kind:"via", id:Number(h.dataset.h), i:Number(h.dataset.i), moved:false, at};
    } else {
      // Tapping the line itself adds a corner where you tapped, on the nearest leg.
      const id = Number(h.dataset.leg);   // dataset is text; path ids are numbers
      const p = currentPaths().find(x => x.id === id);
      if(!p) return;
      const pts = [p.from, ...(p.via || []), p.to];
      let best = 0, bestD = Infinity;
      for(let i = 0; i < pts.length - 1; i++){
        const m = [(pts[i][0]+pts[i+1][0])/2, (pts[i][1]+pts[i+1][1])/2];
        const d = Math.hypot(m[0]-at[0], m[1]-at[1]);
        if(d < bestD){ bestD = d; best = i; }
      }
      const via = [...(p.via || [])];
      via.splice(best, 0, at);
      setVia(id, via);
      drag = {kind:"via", id, i:best, moved:true, at};
      paintField();
    }
    if(h.setPointerCapture) h.setPointerCapture(ev.pointerId);
  });
  document.addEventListener("pointermove", ev => {
    if(!drag) return;
    const svg = document.querySelector(".field-wrap[data-live] svg.field");
    if(!svg) return;
    const at = fieldFeet(svg, ev);
    if(drag.kind === "via"){
      const p = currentPaths().find(x => x.id === drag.id);
      if(!p) return;
      if(Math.hypot(at[0]-drag.at[0], at[1]-drag.at[1]) > 1.2) drag.moved = true;
      const via = [...(p.via || [])];
      via[drag.i] = at;
      setVia(drag.id, via);
    } else {
      const p = currentPaths().find(x => x.id === drag.id);
      if(!p) return;
      const now = posAt(p, S.t);
      const deg = Math.round(Math.atan2(at[1]-now[1], at[0]-now[0]) * 180 / Math.PI);
      if(Math.abs(deg - (directOf(drag.id).face ?? 999)) < 1) return;
      const all = {...(S.direct || {})};
      all[directKey(drag.id)] = {...(all[directKey(drag.id)] || {}), face: deg};
      S.direct = all; save(S); drag.moved = true;
    }
    paintField();
  });
  document.addEventListener("pointerup", () => {
    if(!drag) return;
    // A tap on a corner, with no drag, takes that corner out.
    if(drag.kind === "via" && !drag.moved){
      const p = currentPaths().find(x => x.id === drag.id);
      if(p){
        const via = [...(p.via || [])];
        via.splice(drag.i, 1);
        setVia(drag.id, via);
      }
    }
    drag = null;
    render();
  });
})();

// The eight the spec asks for. Degrees are screen space: 0 points downfield,
// -90 toward the dorito tape, +90 toward the snake.
const FACE_PAD = [
  ["\u2196", -135], ["\u2191", -90], ["\u2197", -45],
  ["\u2190",  180], ["off",   null], ["\u2192",   0],
  ["\u2199",  135], ["\u2193",  90], ["\u2198",  45]
];
const FACE_GLYPH = Object.fromEntries(FACE_PAD.filter(f => f[1] !== null).map(f => [f[1], f[0]]));
// What each of the eight is called on a field, so the picker reads like a
// coach talks rather than like a compass.
const LANE_NAME = {"-135":"back toward the dorito tape", "-90":"the dorito tape",
  "-45":"up-field, dorito side", "180":"back down the field", "0":"straight up the field",
  "135":"back toward the snake", "90":"the snake tape", "45":"up-field, snake side"};
// A shot is either a bunker on this field or a lane the coach pointed. A lane
// is stored as "@<degrees>" so one field holds both and nothing else changes.
function shotLane(v){
  return (typeof v === "string" && v[0] === "@") ? Number(v.slice(1)) : null;
}

function bunkerTraffic(keep){
  // Bunker ids belong to a layout, so traffic logged on one field must not
  // leak onto another. Anything the current layout does not have is dropped.
  // `keep` narrows it further — one opponent, one side — for the layers on Scout.
  const here = new Set(curLayout().bunkers.map(b => b.id));
  const ok = keep || (() => true);
  const t = {};
  const bump = (id, key) => {
    if(!id || !here.has(id)) return;
    t[id] = t[id] || {outs:0, visits:0};
    t[id][key]++;
  };
  (S.tally || []).forEach(o => {
    if(typeof o !== 'object' || !ok(o)) return;
    bump(o.shotAt, 'outs');
    bump(o.movedTo, 'visits');
  });
  (S.moves || []).forEach(m => { if(ok(m)) bump(m.to, 'visits'); });
  return t;
}
