      layout anywhere else already knows it.</p>
      <div class="tblwrap"><table class="tbl">
        <thead><tr><th>Code</th><th>Bunker</th><th>On this field</th></tr></thead>
        <tbody>${BUNKER_CODE.map(([c,full])=>{
          const n = codeCount(c);
          return `<tr><td class="num" style="color:var(--accent-lit);font-weight:700">${esc(c)}</td>
            <td>${esc(full)}</td>
            <td class="num">${n ? n : `<span class="note">not on this field</span>`}</td></tr>`;
        }).join("")}</tbody>
      </table></div>
      <p class="note">Give any of them your own call under Team → Bunker calls. The call replaces the
        code everywhere in the app; the code is still what the map says.</p>`,
      `${BUNKER_CODE.filter(([c])=>codeCount(c)).length} of ${BUNKER_CODE.length} here`);
  }
  if(k==="messages") return sec("Messages",
    ((S.messages||[]).length?`<div class="assigns">${S.messages.map(m=>`<div class="assign">
      <span class="assign__body"><span class="assign__job">${esc(m)}</span></span></div>`).join("")}</div>`
      :`<div class="empty">No messages yet.</div>`)
    + `<div class="btnrow"><input id="md" placeholder="Message the squad" class="grow"/>
       <button class="btn" onclick="sendMsg()">Send</button></div>`, (S.messages||[]).length+" notes");
  if(k==="classes") return classesPage();
  if(k==="league") return leaguePage();
  if(k==="nexus") return sec("Nexus", `<div class="panel">
      <div class="kv">
        <div class="kv__row"><span class="kv__k">Signed in as</span><span class="kv__v">${esc(S.email||"guest")} · ${esc(S.role)}</span></div>
        <div class="kv__row"><span class="kv__k">Event</span><span class="kv__v">${esc(layoutName)}</span></div>
        <div class="kv__row"><span class="kv__k">Where your data lives</span><span class="kv__v">On this device only. Nothing is sent to a server, and your password is stored salted and hashed, never in the clear.</span></div>
        <div class="kv__row"><span class="kv__k">Kept safe</span><span class="kv__v">${
          window.gridlockDurable
            ? `The app keeps a second copy in the phone's own storage, which the system does not clear to reclaim space and which rides along in your device backup. It is a safety net on this phone, not a backup you own — Save a copy below is that.`
            : `In a browser there is only one copy, in this site's storage, and clearing your browsing data clears it. On the phone app there is a second copy the system does not touch. Either way, Save a copy below is the one you own.`
          }${S.savedAt?` Last saved ${esc(new Date(S.savedAt).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}))}.`:""}</span></div>
      </div>
    </div>
    ${window.gridlockCanAwake?`<div class="toggles">
      <button class="tgl ${S.awake===false?"":"on"}" onclick="setAwake(${S.awake===false})"><i></i>Keep the screen awake</button>
    </div>
    <p class="note">Held only while the app is on screen — the phone drops it the moment you switch away
      or the screen goes off, so it does not run your battery down in a pocket.</p>`:""}
    <button class="btn btn--ghost btn--block" onclick="set({showTutorial:true,tab:'playbook',more:null})">Show the tutorial again</button>
    <button class="btn btn--ghost btn--block" onclick="set({entered:false,role:'guest',email:''})">Staff sign out</button>
    <p class="note">GRIDLOCK System · powered by UPRA</p>`)
  + sec("Events", `<p class="lede">Every field this app carries, and where its map came from. Changing the
      event changes the layout on every tab — the break, the tally, the sightlines and the bunker stats
      all follow it.</p>
    <div class="assigns">${Object.values(LAYOUTS).map(L=>`
      <div class="assign" style="flex-wrap:wrap">
        <span class="assign__body"><span class="assign__job">${esc(L.name)}</span>
        <span class="assign__who">${L.bunkers.length} bunkers</span></span>
        ${L.key===S.layoutKey?`<span class="tag tag--paid">ON</span>`
          :`<button class="btn btn--quiet" onclick="pickEvent('${esc(L.key)}')">Use this field</button>`}
        <p class="note" style="flex:1 0 100%;margin-top:6px">${esc(L.source||"")}</p>
      </div>`).join("")}</div>
    <p class="note">There is no event feed. Nothing in this app makes a network request, so a schedule
      cannot arrive on its own — a field ships with a release, measured off that event's own official 2D
      map. That is also why nobody can change what your app says from the outside.</p>`,
    Object.keys(LAYOUTS).length+" fields")
  + sec("Save a copy", `<p class="lede">There is no server behind this app, so there is no automatic backup. A copy
      is a file you own — keep one before a tournament, move to a new phone, or hand the squad to an
      assistant coach.</p>
    <div class="toggles">
      <button class="btn" onclick="saveCopy('all')">Save everything</button>
      <button class="btn btn--quiet" onclick="saveCopy('squad')">Just the squad</button>
    </div>
    <p class="note">Everything is your roster, scouting, tally, rotations, grades, walk notes, codes,
      sessions and league groups. The squad is your players, what you know about other teams, your
      bunker calls and your code words.</p>
    <div class="toggles">
      <button class="btn btn--quiet" onclick="showCopy('all')">Show it as text</button>
      ${S.copyText?`<button class="btn btn--quiet" onclick="set({copyText:''})">Hide</button>`:""}
    </div>
    ${S.copyText?`<div class="fld"><label>Copy this and keep it somewhere safe</label>
      <textarea readonly style="min-height:150px;font-family:ui-monospace,monospace;font-size:11px"
        onclick="this.select()">${esc(S.copyText)}</textarea></div>`:""}
    ${S.copyStatus?`<p class="note" style="color:var(--accent-lit)">${esc(S.copyStatus)}</p>`:""}`,
    copySummary(S))
  + sec("Load a copy", `<p class="lede">Open a copy you saved, or paste one in. <b>Merge</b> keeps what is
      on this phone and adds what is missing. <b>Replace</b> throws away what is here.</p>
    <div class="fld"><label>From a file</label>
      <input type="file" accept="application/json,.json,text/plain" onchange="readCopyFile(this)"/></div>
    <div class="fld"><label>Or paste it</label>
      <textarea id="copyIn" placeholder='{"format":"gridlock.coach.copy", …}'
        style="min-height:110px;font-family:ui-monospace,monospace;font-size:11px"></textarea></div>
    <div class="toggles">
      <button class="btn" onclick="loadCopy('merge')">Merge it in</button>
      <button class="btn btn--danger" onclick="loadCopy('replace')">Replace everything</button>
    </div>
    <p class="note">A copy never carries your staff password. Sign in again on the new phone.</p>`);
  return "";
}
window.sendMsg = () => {
  const el=document.getElementById("md"); const v=(el.value||"").trim();
  if(!v) return;
  S.messages=[...(S.messages||[]),clean(v)]; save(S); render();
};

/* ============================================================
   Shell
   ============================================================ */
function shell(){
  const tabs=[["playbook","Playbook"],["tally","Tally"],["scout","Scout"],["sightlines","Sightlines"],["more","More"]];
  const page={playbook,tally,scout,sightlines,more:morePage}[S.tab]();
  const tut = S.showTutorial?`<div class="panel">
    <h3 class="panel__title">How it works</h3>
    <div class="kv">
      <div class="kv__row"><span class="kv__k">Playbook</span><span class="kv__v">The call. Pick the break, play it, read the five jobs.</span></div>
      <div class="kv__row"><span class="kv__k">Tally</span><span class="kv__v">Tap a player the moment he goes out.</span></div>
      <div class="kv__row"><span class="kv__k">Scout</span><span class="kv__v">The other pit — tendency, threat and your counter.</span></div>
      <div class="kv__row"><span class="kv__k">More</span><span class="kv__v">The walk, the team, clinics and league ops.</span></div>
    </div>
    <button class="btn btn--block" onclick="set({showTutorial:false})">Start coaching</button>
  </div>`:"";

  const crumb = S.tab==="more" && S.more ? ` <span class="ctx__sep">·</span> <b>${MORE_TITLES[S.more]||""}</b>` : "";
  // The drill is over the moment the header names the break it is showing.
  const drilling = S.pbView === "rep" && repState().running;

  return `<div class="app">
    <header class="hdr">
      <div class="hdr__top">
        <div class="brand">GRIDLOCK<small>SYSTEM · COACH</small></div>
        <span class="grow"></span>
        <span class="who-chip ${staffed()?"staff":""}">${staffed()?"Staff":"Guest"}</span>
      </div>
      ${Object.keys(LAYOUTS).length>1
        ? `<button class="ctx" onclick="cycleEvent()">
        <span class="ctx__line"><b>${esc(curLayout().name)}</b> <span class="ctx__sep">·</span> ${drilling?"NAME THE CALL":esc(BREAKS[S.script].name)}${crumb}</span>
        <span class="ctx__caret">CHANGE ▾</span>
      </button>`
        : `<div class="ctx">
        <span class="ctx__line"><b>${esc(curLayout().name)}</b> <span class="ctx__sep">·</span> ${drilling?"NAME THE CALL":esc(BREAKS[S.script].name)}${crumb}</span>
      </div>`}
    </header>
    <main class="main">${storeWarning()}${tut}${page}
      <p class="note">GRIDLOCK System · powered by UPRA · officials govern the live call</p>
    </main>
    <nav class="tabs">${tabs.map(([k,n])=>`<button class="${S.tab===k?"on":""}" onclick="set({tab:'${k}',more:null})"><i></i>${n}</button>`).join("")}</nav>
  </div>`;
}
window.cycleEvent = () => {
  const keys=Object.keys(LAYOUTS);
  set({layoutKey:keys[(keys.indexOf(S.layoutKey)+1)%keys.length]});
};
window.pickEvent = key => { if(LAYOUTS[key]) set({layoutKey:key}); };
window.setSmooth = on => set({smoothOn:!!on});
/* The screen goes to sleep between points otherwise: a coach makes the call,
 * puts the phone down, and picks up a locked screen on the buzzer. The lock is
 * only held while the app is actually on screen — the browser drops it the
 * moment you background it — so it costs nothing in a pocket. His call either
 * way, because it is his battery. */
window.setAwake = on => {
  S.awake = !!on; save(S);
  if(window.gridlockAwake) window.gridlockAwake(S.awake);
  render();
};

// Every tap rebuilds the whole screen, and the browser puts a rebuilt scroller
// back at the top. So grading a man at the bottom of a long card, or dropping a
// row off a pasted roster, threw the coach back to the head of the tab. Between
// points on a sideline that is the difference between using this and putting it
// down. Hold the place unless the screen itself changed — a new tab does belong
// at the top.
let _where = "";
function render(){
  const main = document.querySelector(".main");
  const at = main ? main.scrollTop : 0;
  const screen = [S.entered, S.tab, S.more, S.scoutTab].join("|");
  document.getElementById("root").innerHTML = S.entered ? shell() : promo();
  const next = document.querySelector(".main");
  if(next && screen === _where) next.scrollTop = at;
  _where = screen;
}
render();
</script>
<script src="native.js"></script>
</body>
</html>
